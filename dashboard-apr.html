<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENSOMETRIKA | Dashboard APR & Control B2B</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #060b13;
      --card-bg: #0b1320;
      --card-border: #1a2638;
      --accent-green: #10b981;
      --accent-cyan: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .brand-logo-card {
      background: rgba(11, 19, 36, 0.9);
      border: 1px solid #1e293b;
      padding: 8px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: inline-block;
    }

    .brand-logo-card img {
      width: 170px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));
    }

    .panel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .form-group input {
      background: #080d17;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    .btn-generate {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 6px;
      transition: background 0.2s;
    }

    .btn-generate:hover {
      background: #0369a1;
    }

    .link-out-box {
      display: none;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent-cyan);
      border-radius: 10px;
      padding: 12px;
      flex-direction: column;
      gap: 8px;
    }

    .link-out-input {
      background: #050a12;
      border: 1px solid var(--card-border);
      color: var(--accent-cyan);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-family: monospace;
    }

    .btn-copy {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.80rem;
      cursor: pointer;
      text-transform: uppercase;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    th, td {
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background: #070d17;
      color: var(--accent-cyan);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.65rem;
    }

    .badge-status {
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.62rem;
      text-transform: uppercase;
    }

    .badge-ok { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 16px;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 20px 30px rgba(0,0,0,0.7);
      color: #f8fafc;
    }

    .modal-card h3 { font-size: 1.15rem; font-weight: 800; color: #38bdf8; margin-bottom: 6px; }
    .modal-card p { font-size: 0.82rem; color: #94a3b8; line-height: 1.4; margin-bottom: 18px; }
    .modal-btn { width: 100%; background: #0284c7; color: #fff; border: none; border-radius: 10px; padding: 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="main-container">
    <header class="brand-header">
      <div class="brand-logo-card">
        <img src="sensometrica.jpg" alt="SENSOMETRIKA Calibration Technology">
      </div>
      <span style="color: var(--accent-cyan); font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px;">
        PANEL DE CONTROL APR • REGISTRO & TELEMETRÍA B2B
      </span>
    </header>

    <!-- Formulario de Asignación -->
    <div class="panel-card">
      <div class="card-title">➕ Registrar Trabajador & Generar Link de Acreditación</div>
      <form id="formRegistrar" onsubmit="generarAcreditacion(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>RUT del Trabajador</label>
            <input type="text" id="inputRut" placeholder="Ej: 77.654.234-1" required>
          </div>
          <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="inputNombre" placeholder="Ej: Juan Silva Morales" required>
          </div>
          <div class="form-group">
            <label>Cargo / Función</label>
            <input type="text" id="inputCargo" placeholder="Ej: Operador Harvester / Conductor" required>
          </div>
          <div class="form-group">
            <label>Empresa Mandante</label>
            <input type="text" id="inputEmpresa" placeholder="Ej: Minera Cabterias / Socadep" required>
          </div>
        </div>
        <button type="submit" class="btn-generate">GENERAR ENLACE DE EVALUACIÓN 🔗</button>
      </form>

      <!-- Caja con el Link Generado -->
      <div id="boxLinkResultado" class="link-out-box">
        <span style="font-size: 0.70rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase;">
          Enlace Individual Generado (Listo para enviar al trabajador):
        </span>
        <input type="text" id="txtLinkGenerado" class="link-out-input" readonly>
        <button type="button" class="btn-copy" onclick="copiarLinkGenerado()">
          📋 COPIAR LINK AL PORTAPAPELES
        </button>
      </div>
    </div>

    <!-- Tabla Nómina APR -->
    <div class="panel-card">
      <div class="card-title">📋 Nómina de Trabajadores Acreditados en Faena</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Trabajador / RUT</th>
              <th>Cargo & Empresa</th>
              <th>Estado Acreditación</th>
              <th>Acción Link</th>
              <th>Certificado APR</th>
            </tr>
          </thead>
          <tbody id="tablaNominaAPR">
            <!-- Filas Dinámicas -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="modalContainer"></div>

  <script>
    let trabajadores = JSON.parse(localStorage.getItem('sensometrika_apr_nomina')) || [];

    document.addEventListener('DOMContentLoaded', () => {
      renderizarNomina();
    });

    function mostrarModal(titulo, mensaje, callback) {
      document.getElementById('modalContainer').innerHTML = `
        <div class="modal-overlay">
          <div class="modal-card">
            <h3>${titulo}</h3>
            <p>${mensaje}</p>
            <button type="button" class="modal-btn" id="btnCerrarModal">Entendido</button>
          </div>
        </div>
      `;
      document.getElementById('btnCerrarModal').onclick = () => {
        document.getElementById('modalContainer').innerHTML = '';
        if (callback) callback();
      };
    }

    function generarAcreditacion(e) {
      e.preventDefault();
      
      const rut = document.getElementById('inputRut').value.trim();
      const nombre = document.getElementById('inputNombre').value.trim();
      const cargo = document.getElementById('inputCargo').value.trim();
      const empresa = document.getElementById('inputEmpresa').value.trim();

      if (!rut || !nombre || !cargo || !empresa) {
        mostrarModal("Datos Incompletos", "Por favor, complete todos los campos requeridos.");
        return;
      }

      const tokenB2B = 'B2B-SMK-' + Math.floor(1000 + Math.random() * 9000);
      const baseUrl = window.location.origin + window.location.pathname.replace('dashboard_apr.html', '');
      
      // Apunta a verificacion_trabajador.html con token y rut
      const urlCompleta = `${baseUrl}verificacion_trabajador.html?token=${tokenB2B}&rut=${encodeURIComponent(rut)}`;

      // Guardar sesión previa limpia
      localStorage.removeItem('sensometrika_modulos_rendidos');
      localStorage.removeItem('sensometrika_session_burned');

      localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
        nombre: nombre,
        rut: rut,
        cargo: cargo,
        correo: 'supervision@faena.cl'
      }));
      localStorage.setItem('sensometrika_b2b_empresa', empresa);
      localStorage.setItem('sensometrika_b2b_token', tokenB2B);
      localStorage.setItem('sensometrika_b2b_rut', rut);

      // Mostrar link
      const inputLink = document.getElementById('txtLinkGenerado');
      inputLink.value = urlCompleta;
      document.getElementById('boxLinkResultado').style.display = 'flex';

      // Agregar a nómina local
      const nuevoTrabajador = {
        rut: rut,
        nombre: nombre,
        cargo: cargo,
        empresa: empresa,
        token: tokenB2B,
        url: urlCompleta,
        fecha: new Date().toLocaleDateString('es-CL')
      };

      trabajadores.unshift(nuevoTrabajador);
      localStorage.setItem('sensometrika_apr_nomina', JSON.stringify(trabajadores));
      renderizarNomina();

      mostrarModal("Enlace Generado", "✓ Se ha emitido el enlace de acreditación individual. Ya puedes copiarlo y enviárselo al trabajador.");
    }

    function copiarLinkGenerado() {
      const inputLink = document.getElementById('txtLinkGenerado');
      inputLink.select();
      navigator.clipboard.writeText(inputLink.value).then(() => {
        mostrarModal("¡Enlace Copiado!", "El enlace ha sido copiado al portapapeles con éxito.");
      });
    }

    function copiarLinkFila(url) {
      navigator.clipboard.writeText(url).then(() => {
        mostrarModal("Enlace Copiado", "El enlace individual ha sido copiado al portapapeles.");
      });
    }

    function renderizarNomina() {
      const tbody = document.getElementById('tablaNominaAPR');
      tbody.innerHTML = '';

      if (trabajadores.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">Sin trabajadores registrados aún.</td></tr>`;
        return;
      }

      trabajadores.forEach((t) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <strong style="color:#fff; display:block;">${t.nombre}</strong>
            <span style="font-size:0.68rem; color:var(--text-muted);">RUT: ${t.rut}</span>
          </td>
          <td>
            <span style="display:block; font-weight:700;">${t.cargo}</span>
            <span style="font-size:0.68rem; color:var(--text-muted);">${t.empresa}</span>
          </td>
          <td>
            <span class="badge-status badge-ok">APROBADO D.S. N° 170</span>
          </td>
          <td>
            <button onclick="copiarLinkFila('${t.url}')" style="background:#0284c7; color:#fff; border:none; padding:6px 10px; border-radius:4px; font-weight:700; cursor:pointer;">
              🔗 Copiar
            </button>
          </td>
          <td>
            <a href="informe-b2b.html?token=${t.token}&rut=${encodeURIComponent(t.rut)}" target="_blank" style="color:var(--accent-cyan); font-weight:800; text-decoration:underline;">
              📄 Ver Informe
            </a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
