<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Reactímetro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .semaforo-caja {
      background-color: #020617;
      padding: 16px;
      border-radius: 40px;
      display: flex;
      gap: 20px;
      border: 3px solid #334155;
    }
    .luz {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      transition: opacity 0.1s ease, box-shadow 0.1s ease;
    }
    .verde { background-color: #22c55e; }
    .roja { background-color: #ef4444; }
    .apagada { opacity: 0.15; box-shadow: none; }
    .verde.encendida { opacity: 1; box-shadow: 0 0 25px #22c55e; }
    .roja.encendida { opacity: 1; box-shadow: 0 0 30px #ef4444; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Sensometrika</h1>
      <p>Entrenamiento de Tiempo de Reacción (Reactímetro)</p>
    </header>

    <section class="semaforo-caja">
      <div id="luz-verde" class="luz verde apagada"></div>
      <div id="luz-roja" class="luz roja apagada"></div>
    </section>

    <div id="panel-estado" class="estado">Presiona "Iniciar Prueba" para comenzar</div>

    <button id="btn-accion" class="btn-principal">Iniciar Prueba</button>

    <section class="panel-resultados">
      <div class="tarjeta-metrica">
        <span>Último Tiempo</span>
        <strong id="metrica-tiempo">-- ms</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Promedio</span>
        <strong id="metrica-promedio">-- ms</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Anticipaciones</span>
        <strong id="metrica-anticipaciones">0</strong>
      </div>
    </section>

    <a href="menu.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem;">← Volver al Menú Principal</a>
  </main>

  <script src="reactimetro.js"></script>
</body>
</html>
