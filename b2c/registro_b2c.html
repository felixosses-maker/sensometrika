<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Adquisición Particular (B2C)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-logo-img {
            width: 190px;
            height: auto;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .form-group input {
            background: #080d17;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            user-select: text;
            -webkit-user-select: text;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.90rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .plan-badge-bar {
            background: #080d17;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.78rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="../sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">
            <span style="color: var(--accent-cyan); font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;">
                REGISTRO USUARIO PARTICULAR (B2C)
            </span>
        </header>

        <!-- Formulario de 3 Datos Obligatorios + Redirección a checkout.html -->
        <div class="card-box" id="boxFormulario">
            <div class="card-title">👤 Datos de Identificación y Despacho</div>
            <form id="formB2C" onsubmit="redirigirACheckoutB2C(event)">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    
                    <div class="form-group">
                        <label>Nombre Completo *</label>
                        <input type="text" id="inputNombreParticular" placeholder="Ej: Félix Osses" required>
                    </div>

                    <div class="form-group">
                        <label>RUT / Cédula de Identidad *</label>
                        <input type="text" id="inputRutParticular" placeholder="Ej: 15.344.221-K" required>
                    </div>

                    <div class="form-group">
                        <label>Correo Electrónico (Para envío del link de acceso) *</label>
                        <input type="email" id="inputCorreoParticular" placeholder="Ej: felix@correo.com" required>
                    </div>

                    <div class="plan-badge-bar">
                        <span style="color: var(--text-muted); font-weight: 700;">PLAN A PAGAR:</span>
                        <strong id="lblPlanNombre" style="color: var(--accent-cyan);">PASE BÁSICO (B2C) — $4.990</strong>
                    </div>

                    <button type="submit" id="btnSubmitB2C" class="btn-submit">
                        💳 PROCEDER AL PAGO EN MERCADO PAGO →
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let planActual = 'BASICO';

        const DETALLE_PLANES_B2C = {
            BASICO: {
                planId: 'part_basico',
                nombrePlan: 'Pase Básico Particular (3 Simulaciones)',
                etiqueta: 'PASE BÁSICO (B2C) — $4.990',
                precio: 4990,
                vigencia: '48 horas',
                horas: 48,
                modulosPermitidos: ['reactimetro', 'palancas', 'punteo']
            },
            PLUS: {
                planId: 'part_plus',
                nombrePlan: 'Pase Plus Particular (5 Simulaciones + Visual)',
                etiqueta: 'PASE PLUS (B2C) — $8.990',
                precio: 8990,
                vigencia: '5 días',
                horas: 120,
                modulosPermitidos: ['reactimetro', 'palancas', 'punteo', 'visual']
            },
            FULL: {
                planId: 'part_full',
                nombrePlan: 'Pase Full Particular (8 Simulaciones + Sensorial)',
                etiqueta: 'PASE FULL (B2C) — $12.990',
                precio: 12990,
                vigencia: '10 días',
                horas: 240,
                modulosPermitidos: ['reactimetro', 'palancas', 'punteo', 'audicion', 'visual', 'anticipacion', 'estereopsis', 'fatiga']
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            localStorage.setItem('sensometrika_b2c_mode', 'true');
            localStorage.removeItem('sensometrika_b2b_token');

            const urlParams = new URLSearchParams(window.location.search);
            let rawPlan = (urlParams.get('plan') || localStorage.getItem('sensometrika_plan_contratado') || 'BASICO').toUpperCase().trim();
            if (rawPlan.includes('FULL')) planActual = 'FULL';
            else if (rawPlan.includes('PLUS')) planActual = 'PLUS';
            else planActual = 'BASICO';

            const infoPlan = DETALLE_PLANES_B2C[planActual] || DETALLE_PLANES_B2C.BASICO;
            document.getElementById('lblPlanNombre').textContent = infoPlan.etiqueta;
        });

        function redirigirACheckoutB2C(e) {
            e.preventDefault();

            const btnSubmit = document.getElementById('btnSubmitB2C');
            btnSubmit.disabled = true;
            btnSubmit.textContent = '⏳ REDIRIGIENDO A PASARELA DE PAGO...';

            const nombre = document.getElementById('inputNombreParticular').value.trim();
            const rut = document.getElementById('inputRutParticular').value.trim();
            const correo = document.getElementById('inputCorreoParticular').value.trim();
            const infoPlan = DETALLE_PLANES_B2C[planActual] || DETALLE_PLANES_B2C.BASICO;
            const ordenId = `SMK-B2C-${Date.now()}`;

            // 1. Guardar datos del usuario B2C para pago-resultado.html y menu_b2c.html
            localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
                nombre: nombre,
                rut: rut,
                correo: correo,
                cargo: 'Evaluación Particular B2C'
            }));
            localStorage.setItem('sensometrika_b2c_mode', 'true');
            localStorage.setItem('sensometrika_rut', rut);
            localStorage.setItem('sensometrika_nombre', nombre);
            localStorage.setItem('sensometrika_b2b_empresa', 'USUARIO PARTICULAR B2C');
            localStorage.setItem('sensometrika_plan_contratado', planActual);
            localStorage.setItem('sensometrika_plan_seleccionado', planActual);

            // 2. Guardar la sesión pendiente en el formato exacto que consume checkout.html y pago-resultado.html
            const sesionPendiente = {
                rol: 'particular',
                segmento: 'b2c',
                planId: infoPlan.planId,
                planCorto: planActual,
                nombrePlan: infoPlan.nombrePlan,
                precio: infoPlan.precio,
                monto: infoPlan.precio,
                cantidad: 1,
                nombre: nombre,
                rut: rut,
                correo: correo,
                email: correo,
                ordenId: ordenId,
                tipoDocumento: 'BOLETA',
                modulosPermitidos: infoPlan.modulosPermitidos,
                horasVigencia: infoPlan.horas
            };
            localStorage.setItem('sensometrika_sesion_pendiente', JSON.stringify(sesionPendiente));

            // 3. Redirigir a checkout.html en la raíz
            const paramsCheckout = new URLSearchParams({
                seg: 'b2c',
                rol: 'particular',
                plan: infoPlan.planId,
                planCorto: planActual,
                nombrePlan: infoPlan.nombrePlan,
                monto: String(infoPlan.precio),
                precio: String(infoPlan.precio),
                nombre: nombre,
                rut: rut,
                correo: correo,
                orden: ordenId
            });

            window.location.href = `../checkout.html?${paramsCheckout.toString()}`;
        }
    </script>
</body>
</html>
