<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Registro Usuario Particular (B2C)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-logo-img {
            width: 190px;
            height: auto;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .form-group input, .form-group select {
            background: #080d17;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            user-select: text;
            -webkit-user-select: text;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.90rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .plan-badge-bar {
            background: #080d17;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.78rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .link-volver {
            display: block;
            text-align: center;
            font-size: 0.74rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-top: 4px;
        }

        .link-volver:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="../sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">
            <span style="color: var(--accent-cyan); font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;">
                REGISTRO USUARIO PARTICULAR (B2C)
            </span>
        </header>

        <!-- Formulario Exclusivo Usuario Particular -->
        <div class="card-box">
            <div class="card-title">👤 Datos de Identificación y Despacho</div>
            <form id="formB2C" onsubmit="continuarACheckoutB2C(event)">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    
                    <div class="form-group">
                        <label>Nombre Completo *</label>
                        <input type="text" id="inputNombreParticular" placeholder="Ej: Juan Emilio Sáez" required>
                    </div>

                    <div class="form-group">
                        <label>RUT / Cédula de Identidad *</label>
                        <input type="text" id="inputRutParticular" placeholder="Ej: 15.344.221-K" required>
                    </div>

                    <div class="form-group">
                        <label>Correo Electrónico (Para envío del link de acceso) *</label>
                        <input type="email" id="inputCorreoParticular" placeholder="Ej: juan@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label>Pase Particular Seleccionado *</label>
                        <select id="selectPlanB2C" onchange="actualizarResumenPlanB2C()">
                            <option value="BASICO">Pase Básico (B2C) — $4.990 CLP (3 Simulaciones / 48h)</option>
                            <option value="PLUS">Pase Plus (B2C) — $8.990 CLP (5 Simulaciones + Visual / 5 días)</option>
                            <option value="FULL">Pase Full (B2C) — $14.990 CLP (8 Simulaciones + Sensorial / 10 días)</option>
                        </select>
                    </div>

                    <div class="plan-badge-bar">
                        <span style="color: var(--text-muted); font-weight: 700;">TOTAL (IVA INCLUIDO):</span>
                        <strong id="lblPlanNombre" style="color: var(--accent-cyan);">$4.990 CLP</strong>
                    </div>

                    <button type="submit" id="btnSubmitB2C" class="btn-submit">
                        CONTINUAR AL CHECKOUT B2C →
                    </button>

                    <a href="../index.html" class="link-volver">← Volver al Inicio</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DETALLE_PLANES_B2C = {
            BASICO: {
                planId: 'b2c_basico',
                nombrePlan: 'Pase Básico Particular (3 Simulaciones)',
                precio: 4990,
                simulaciones: 3,
                vigencia: '48 horas',
                horas: 48,
                modulosPermitidos: ['reactimetro', 'palancas', 'punteo']
            },
            PLUS: {
                planId: 'b2c_plus',
                nombrePlan: 'Pase Plus Particular (5 Simulaciones + Visual)',
                precio: 8990,
                simulaciones: 5,
                vigencia: '5 días',
                horas: 120,
                modulosPermitidos: ['reactimetro', 'palancas', 'punteo', 'visual']
            },
            FULL: {
                planId: 'b2c_full',
                nombrePlan: 'Pase Full Particular (8 Simulaciones + Sensorial)',
                precio: 14990,
                simulaciones: 8,
                vigencia: '10 días',
                horas: 240,
                modulosPermitidos: ['reactimetro', 'palancas', 'punteo', 'visual', 'auditivo']
            }
        };

        function actualizarResumenPlanB2C() {
            const planSel = document.getElementById('selectPlanB2C').value;
            const info = DETALLE_PLANES_B2C[planSel] || DETALLE_PLANES_B2C.BASICO;
            document.getElementById('lblPlanNombre').textContent = `$${info.precio.toLocaleString('es-CL')} CLP`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Limpiar cualquier bandera B2B residual
            localStorage.setItem('sensometrika_b2c_mode', 'true');
            localStorage.removeItem('sensometrika_b2b_token');
            localStorage.removeItem('sensometrika_plan_pedido');

            const urlParams = new URLSearchParams(window.location.search);
            let rawPlan = (urlParams.get('plan') || localStorage.getItem('sensometrika_plan_contratado') || 'BASICO').toUpperCase().trim();
            let planDetectado = 'BASICO';
            if (rawPlan.includes('FULL')) planDetectado = 'FULL';
            else if (rawPlan.includes('PLUS')) planDetectado = 'PLUS';

            document.getElementById('selectPlanB2C').value = planDetectado;
            actualizarResumenPlanB2C();

            // Precargar datos si el usuario ya los había escrito
            const userPrev = JSON.parse(localStorage.getItem('sensometrika_datos_usuario') || '{}');
            if (userPrev.nombre) document.getElementById('inputNombreParticular').value = userPrev.nombre;
            if (userPrev.rut) document.getElementById('inputRutParticular').value = userPrev.rut;
            if (userPrev.correo) document.getElementById('inputCorreoParticular').value = userPrev.correo;
        });

        function continuarACheckoutB2C(e) {
            e.preventDefault();

            const btn = document.getElementById('btnSubmitB2C');
            btn.disabled = true;
            btn.textContent = '⏳ CARGANDO CHECKOUT B2C...';

            const nombre = document.getElementById('inputNombreParticular').value.trim();
            const rut = document.getElementById('inputRutParticular').value.trim();
            const correo = document.getElementById('inputCorreoParticular').value.trim();
            const planCorto = document.getElementById('selectPlanB2C').value;
            const infoPlan = DETALLE_PLANES_B2C[planCorto] || DETALLE_PLANES_B2C.BASICO;

            // Guardar datos del particular en localStorage
            localStorage.setItem('sensometrika_b2c_mode', 'true');
            localStorage.setItem('sensometrika_rut', rut);
            localStorage.setItem('sensometrika_nombre', nombre);
            localStorage.setItem('sensometrika_plan_contratado', planCorto);
            localStorage.setItem('sensometrika_plan_seleccionado', planCorto);

            localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
                tipo: 'particular',
                nombre: nombre,
                rut: rut,
                correo: correo,
                empresa: 'Particular',
                cargo: 'Evaluación Particular B2C'
            }));

            const pedidoB2C = {
                rol: 'particular',
                tipo: 'b2c',
                planId: infoPlan.planId,
                planCorto: planCorto,
                nombrePlan: infoPlan.nombrePlan,
                precioTotal: infoPlan.precio,
                limiteSimulaciones: infoPlan.simulaciones,
                horasVigencia: infoPlan.horas,
                vigenciaTexto: infoPlan.vigencia,
                modulosPermitidos: infoPlan.modulosPermitidos,
                nombre: nombre,
                rut: rut,
                correo: correo
            };
            localStorage.setItem('sensometrika_pedido_b2c', JSON.stringify(pedidoB2C));

            // Redirigir al checkout exclusivo B2C en la misma carpeta /b2c/
            const params = new URLSearchParams({
                plan: planCorto,
                nombre: nombre,
                rut: rut,
                correo: correo
            });

            window.location.href = `checkout_b2c.html?${params.toString()}`;
        }
    </script>
</body>
</html>
