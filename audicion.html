<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Tamizaje Auditivo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .barra-superior {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .barra-superior a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .barra-conteo-b2c {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .caja-gatekeeper {
      background: #0f172a;
      border: 1.5px solid #f59e0b;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      width: 100%;
      box-sizing: border-box;
    }
    .grilla-oidos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin: 14px 0;
    }
    .btn-oido {
      background: #0f172a;
      border: 2px solid #38bdf8;
      color: #fff;
      padding: 16px 8px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-oido:active {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="barra-superior">
      <a href="menu.html">← Menú Principal</a>
      <span style="font-size: 0.8rem; color: #38bdf8; font-weight: 700;">MÓDULO 5: AUDITIVO</span>
    </header>

    <!-- Indicador dinámico de simulación -->
    <div id="caja-contador-simulacion" class="barra-conteo-b2c"></div>

    <!-- Verificación obligatoria de audífonos -->
    <section class="caja-gatekeeper" id="caja-aviso-audifonos">
      <h3 style="color: #f59e0b; margin: 0 0 6px 0; font-size: 0.95rem;">🎧 Exigencia Técnica de Audífonos</h3>
      <p style="color: #94a3b8; font-size: 0.8rem; margin: 0 0 10px 0; line-height: 1.35;">
        Para evaluar la separación binaural (oído izquierdo y derecho independientemente), es obligatorio el uso de audífonos.
      </p>
      <label style="display: flex; align-items: center; gap: 8px; color: #fff; font-size: 0.82rem; cursor: pointer;">
        <input type="checkbox" id="chk-audifonos" style="width: 18px; height: 18px;">
        Tengo audífonos estéreo colocados
      </label>
    </section>

    <div id="panel-estado" class="estado">Confirma tus audífonos para iniciar</div>

    <button id="btn-iniciar-audio" class="btn-principal" disabled style="opacity: 0.5; margin-bottom: 12px;">
      Iniciar Calibración Sonora
    </button>

    <!-- Mandos de respuesta binaural -->
    <section class="grilla-oidos" id="zona-botones-oidos" style="display: none;">
      <button class="btn-oido" id="btn-oido-izq">👂 Oído Izquierdo</button>
      <button class="btn-oido" id="btn-oido-der">Oído Derecho 👂</button>
    </section>

    <div id="zona-coordinacion-audio" style="width: 100%;"></div>
  </main>

  <script src="credit-manager.js"></script>
  <script src="audicion.js"></script>
</body>
</html>
