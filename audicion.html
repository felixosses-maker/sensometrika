<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Módulo: Tamizaje Auditivo Ocupacional Avanzado</title>
  <style>
    :root {
      --bg-principal: #070d18;
      --bg-card: #0b1324;
      --border-color: #1e293b;
      --verde-destacado: #10b981;
      --azul-destacado: #38bdf8;
      --azul-btn: #0284c7;
      --azul-btn-hover: #0369a1;
      --texto-blanco: #ffffff;
      --texto-gris: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
    body { background-color: var(--bg-principal); color: var(--texto-blanco); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px 12px 28px; -webkit-tap-highlight-color: transparent; }
    .app-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }

    /* LOGOTIPO OFICIAL UNIFICADO SENSOMETRIKA */
    .brand-header { text-align: center; margin-bottom: 2px; }
    .brand-logo-icon { width: 56px; height: 56px; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; position: relative; filter: drop-shadow(0 0 8px var(--azul-destacado)); }
    .brand-logo-icon .cursor-flecha { position: absolute; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 16px solid var(--azul-destacado); transform: rotate(-30deg); filter: drop-shadow(0 0 6px var(--azul-destacado)); z-index: 3; }
    .brand-logo-icon .ring-inner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--azul-destacado); border-radius: 50%; z-index: 2; }
    .brand-logo-icon .arco-izq { position: absolute; width: 32px; height: 32px; border: 2px solid transparent; border-bottom-color: rgba(255, 255, 255, 0.75); border-left-color: rgba(255, 255, 255, 0.75); border-radius: 50%; transform: rotate(35deg); }
    .brand-logo-icon .onda-1 { position: absolute; width: 32px; height: 32px; border: 2px solid transparent; border-top-color: #ffffff; border-right-color: #ffffff; border-radius: 50%; transform: rotate(15deg); }
    .brand-logo-icon .onda-2 { position: absolute; width: 44px; height: 44px; border: 2px solid transparent; border-top-color: rgba(255, 255, 255, 0.75); border-right-color: rgba(255, 255, 255, 0.75); border-radius: 50%; transform: rotate(15deg); }
    .brand-logo-icon .onda-3 { position: absolute; width: 56px; height: 56px; border: 2px solid transparent; border-top-color: rgba(255, 255, 255, 0.4); border-right-color: rgba(255, 255, 255, 0.4); border-radius: 50%; transform: rotate(15deg); }
    .brand-header h1 { font-size: 1.35rem; font-weight: 900; letter-spacing: 2px; color: var(--texto-blanco); margin: 0; text-transform: uppercase; }
    .brand-header span { font-size: 0.62rem; letter-spacing: 3px; color: var(--texto-gris); text-transform: uppercase; font-weight: 700; display: block; margin-top: 2px; }

    /* TARJETA PRINCIPAL */
    .modulo-card-container { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); }
    .nav-top-row { display: flex; justify-content: space-between; align-items: center; }
    .link-volver { color: var(--texto-gris); text-decoration: none; font-size: 0.82rem; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .link-volver:hover { color: var(--azul-destacado); }

    .btn-como-funciona { background: #0c182e; border: 1px solid #1e3a6d; color: var(--azul-destacado); font-size: 0.75rem; font-weight: 700; padding: 5px 11px; border-radius: 6px; cursor: pointer; }
    .btn-como-funciona:hover { background: #132342; }

    .badge-fase { display: inline-block; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35); color: var(--azul-destacado); font-size: 0.75rem; font-weight: 700; padding: 5px 14px; border-radius: 20px; margin: 0 auto; text-align: center; }

    /* CAJA DE VERIFICACIÓN DE AUDÍFONOS (OBLIGATORIA) */
    .check-audifonos-box { background: #070b14; border: 1.5px dashed #1e3a6d; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: border-color 0.2s; }
    .check-audifonos-box.activo { border-color: var(--verde-destacado); background: rgba(16, 185, 129, 0.05); }
    .check-audifonos-box input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--verde-destacado); cursor: pointer; }
    .check-audifonos-box span { font-size: 0.78rem; color: #cbd5e1; font-weight: 600; cursor: pointer; line-height: 1.3; }

    /* VISOR AUDIOMÉTRICO */
    .contenedor-audiometro { background-color: #172133; border: 2px solid #283548; border-radius: 14px; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 14px; position: relative; overflow: hidden; }
    
    .txt-freq-display { font-size: 1.5rem; font-weight: 900; color: var(--azul-destacado); letter-spacing: 1px; margin-bottom: 2px; }
    .txt-oído-display { font-size: 0.8rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1.5px; }

    /* SELECCIÓN DE OÍDOS (IZQ / DER) */
    .panel-seleccion-oidos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; display: none; }
    .btn-oido-opcion { background: #111a2e; border: 2px solid #1e3a6d; border-radius: 10px; color: #ffffff; padding: 14px; font-weight: 800; font-size: 0.88rem; cursor: pointer; transition: all 0.15s; }
    .btn-oido-opcion:active { background: var(--azul-btn); border-color: var(--azul-destacado); transform: scale(0.98); }

    .instruccion-sub { text-align: center; font-size: 0.78rem; color: var(--texto-gris); line-height: 1.4; min-height: 2.2rem; display: flex; align-items: center; justify-content: center; }

    /* BOTONES DE ACCIÓN */
    .btn-audio-accion { width: 100%; background-color: var(--azul-btn); color: var(--texto-blanco); border: none; border-radius: 10px; padding: 14px; font-size: 0.95rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); text-transform: uppercase; transition: all 0.2s; }
    .btn-audio-accion:hover { background-color: var(--azul-btn-hover); }
    .btn-audio-accion:disabled { background-color: #1e293b; color: #475569; cursor: not-allowed; box-shadow: none; opacity: 0.6; }

    .btn-emitir-tono { background-color: var(--verde-destacado); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
    .btn-emitir-tono:hover { background-color: #059669; }

    /* TABLERO DE MÉTRICAS */
    .metricas-inferiores-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background-color: #070b14; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 8px; text-align: center; }
    .col-metrica span { display: block; font-size: 0.60rem; color: var(--texto-gris); text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
    .col-metrica strong { display: block; font-size: 0.95rem; color: var(--texto-blanco); font-weight: 800; }
    .col-metrica .badge-verde { display: inline-block; background-color: var(--verde-destacado); color: #000000 !important; padding: 3px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 900; }
  </style>
</head>
<body>
  <main class="app-container">
    
    <header class="brand-header" style="text-align: center; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="background: rgba(11, 19, 36, 0.9); border: 1px solid #1e293b; padding: 8px 16px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6);">
        <img src="sensometrica.jpg" alt="SENSOMETRIKA Calibration Technology" style="width: 170px; height: auto; display: block; border-radius: 4px; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));">
      </div>
      <span class="brand-subtitle" style="margin-top: 4px; color: var(--texto-gris); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Tamizaje Auditivo</span>
    </header>

    <section class="modulo-card-container">
      <div class="nav-top-row">
        <a href="menu_B2B.html" class="link-volver" id="linkRegreso">← Menú Principal</a>
        <button type="button" class="btn-como-funciona" onclick="mostrarModalAyudaAudio()">? ¿Cómo funciona?</button>
      </div>

      <div style="text-align: center;">
        <span class="badge-fase" id="badgeFase">🎧 Evaluación Auditiva Estéreo</span>
      </div>

      <label class="check-audifonos-box" id="cajaCheckAudifonos">
        <input type="checkbox" id="checkAudifonos" onchange="actualizarEstadoAudifonos()">
        <span>Es obligatorio utilizar audífonos estéreo para rendir este módulo.</span>
      </label>

      <div class="contenedor-audiometro" id="visorAudio">
        <div class="txt-oído-display" id="lblOido">Bloqueado · Requiere Audífonos</div>
        <div class="txt-freq-display" id="lblFrecuencia">-- Hz</div>
        <p style="font-size: 0.75rem; color: var(--texto-gris); margin-top: 6px;" id="lblUmbral">Marque la casilla superior para habilitar</p>
      </div>

      <div class="panel-seleccion-oidos" id="panelOidos">
        <button type="button" class="btn-oido-opcion" onclick="responderOido('IZQUIERDO')">🎧 Oído Izquierdo</button>
        <button type="button" class="btn-oido-opcion" onclick="responderOido('DERECHO')">🎧 Oído Derecho</button>
      </div>

      <p class="instruccion-sub" id="statusText">Debe confirmar el uso de auriculares antes de iniciar el test de 8 tonos.</p>

      <button type="button" class="btn-audio-accion" id="btnIniciarAudio" disabled onclick="iniciarTamizajeAuditivo()">
        Iniciar Tamizaje Auditivo
      </button>

      <button type="button" class="btn-audio-accion btn-emitir-tono" id="btnEmitirTono" style="display: none;" onclick="reproducirSiguienteTono()">
        🔊 REPRODUCIR TONO ACÚSTICO
      </button>

      <div class="metricas-inferiores-grid">
        <div class="col-metrica"><span>Progreso</span><strong id="mProgreso">0 / 8</strong></div>
        <div class="col-metrica"><span>Aciertos</span><strong id="mAciertos" class="badge-verde">0</strong></div>
        <div class="col-metrica"><span>Estado</span><strong id="mEstado" style="color: var(--azul-destacado);">Bloqueado</strong></div>
      </div>
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const esB2C = urlParams.get('mode') === 'b2c';

    // Ajustar enlace de retorno según el entorno
    document.addEventListener('DOMContentLoaded', () => {
      const linkRegreso = document.getElementById('linkRegreso');
      if (esB2C) {
        linkRegreso.href = 'menu_B2C.html';
        linkRegreso.textContent = '← Menú B2C (Particular)';
      } else {
        linkRegreso.href = 'menu_B2B.html';
        linkRegreso.textContent = '← Menú B2B (Empresa)';
      }
    });

    let audioCtx = null;
    let oscilador = null;
    let gainNode = null;

    const frecuenciasBase = [250, 500, 1000, 1500, 2000, 3000, 4000, 6000];
    let secuenciaTest = [];
    let pasoActual = 0;
    let aciertosTotales = 0;
    let testActivo = false;

    const checkAudifonos = document.getElementById('checkAudifonos');
    const cajaCheck = document.getElementById('cajaCheckAudifonos');
    const badgeFase = document.getElementById('badgeFase');
    const statusText = document.getElementById('statusText');
    const btnIniciar = document.getElementById('btnIniciarAudio');
    const btnEmitirTono = document.getElementById('btnEmitirTono');
    const panelOidos = document.getElementById('panelOidos');
    const lblOido = document.getElementById('lblOido');
    const lblFrecuencia = document.getElementById('lblFrecuencia');
    const lblUmbral = document.getElementById('lblUmbral');
    const mProgreso = document.getElementById('mProgreso');
    const mAciertos = document.getElementById('mAciertos');
    const mEstado = document.getElementById('mEstado');

    function actualizarEstadoAudifonos() {
      if (checkAudifonos.checked) {
        cajaCheck.classList.add('activo');
        btnIniciar.disabled = false;
        lblOido.innerText = 'Listo para Iniciar';
        lblUmbral.innerText = 'Secuencia de 8 Tonos Aleatorios';
        statusText.innerText = 'Audífonos confirmados. Pulse el botón para comenzar.';
        mEstado.innerText = 'Habilitado';
      } else {
        cajaCheck.classList.remove('activo');
        btnIniciar.disabled = true;
        lblOido.innerText = 'Bloqueado · Requiere Audífonos';
        lblUmbral.innerText = 'Marque la casilla superior para habilitar';
        statusText.innerText = 'Debe confirmar el uso de auriculares antes de iniciar el test de 8 tonos.';
        mEstado.innerText = 'Bloqueado';
      }
    }

    function mostrarModalAyudaAudio() {
      const modalHtml = `
        <div id="modalAyudaAudio" style="position: fixed; inset: 0; background: rgba(5, 8, 18, 0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 16px;">
          <div style="background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; width: 100%; max-width: 380px; padding: 24px 20px; text-align: left; color: #f8fafc;">
            <h3 style="color: #ffffff; margin-bottom: 6px; font-size: 1.15rem; font-weight: 800; text-align: center;">Tamizaje Auditivo Avanzado</h3>
            <p style="color: #38bdf8; margin-bottom: 14px; font-size: 0.8rem; font-weight: 600; text-align: center;">Audiometría de 8 Tonos Aleatorios</p>
            <div style="font-size: 0.82rem; color: #94a3b8; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
              <p>1. <strong>Recuadro Obligatorio:</strong> Debe marcar la confirmación de audífonos estéreo para desbloquear el sistema.</p>
              <p>2. <strong>Estímulos Aleatorios:</strong> El sistema emitirá 8 tonos desordenados (250 Hz a 6000 Hz) en el oído izquierdo o derecho.</p>
            </div>
            <button onclick="document.getElementById('modalAyudaAudio').remove()" style="width: 100%; background: #0284c7; color: #ffffff; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer;">
              Entendido · Volver al Test
            </button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function generarSecuenciaAleatoria() {
      let secuencia = [];
      for (let i = 0; i < 8; i++) {
        const freq = frecuenciasBase[Math.floor(Math.random() * frecuenciasBase.length)];
        const oido = Math.random() < 0.5 ? 'IZQUIERDO' : 'DERECHO';
        secuencia.push({ freq, oido });
      }
      return secuencia;
    }

    function iniciarTamizajeAuditivo() {
      if (!checkAudifonos.checked) {
        alert("⚠️ Debe marcar la casilla de confirmación de audífonos para continuar.");
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      secuenciaTest = generarSecuenciaAleatoria();
      pasoActual = 0;
      aciertosTotales = 0;
      testActivo = true;

      btnIniciar.style.display = 'none';
      cajaCheck.style.display = 'none';
      btnEmitirTono.style.display = 'block';
      badgeFase.innerText = esB2C ? '🔴 Tamizaje Auditivo B2C' : '🔴 Tamizaje Auditivo Oficial (1/1)';
      mEstado.innerText = 'En Curso';
      statusText.innerText = 'Pulse "Reproducir Tono Acústico" y seleccione el oído donde lo perciba.';

      lblOido.innerText = 'Listo para emitir tono';
      lblFrecuencia.innerText = 'Tono 1 / 8';
    }

    function reproducirSiguienteTono() {
      if (!testActivo) return;
      if (pasoActual >= secuenciaTest.length) {
        finalizarPruebaAuditiva();
        return;
      }

      btnEmitirTono.style.display = 'none';
      panelOidos.style.display = 'grid';

      const item = secuenciaTest[pasoActual];
      mProgreso.innerText = `${pasoActual + 1} / 8`;
      lblOido.innerText = 'Emitiendo sonido en audífonos...';
      lblFrecuencia.innerText = `${item.freq} Hz`;
      lblUmbral.innerText = 'Escuche atentamente';

      try {
        if (oscilador) oscilador.stop();
        oscilador = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();

        oscilador.type = 'sine';
        oscilador.frequency.setValueAtTime(item.freq, audioCtx.currentTime);

        const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
        if (panner) {
          panner.pan.setValueAtTime(item.oido === 'IZQUIERDO' ? -1 : 1, audioCtx.currentTime);
          oscilador.connect(panner);
          panner.connect(gainNode);
        } else {
          oscilador.connect(gainNode);
        }

        gainNode.connect(audioCtx.destination);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

        oscilador.start();

        setTimeout(() => {
          if (oscilador && testActivo) {
            try { oscilador.stop(); } catch(e){}
          }
        }, 1500);

      } catch (e) {
        console.error("Error reproduciendo audio:", e);
      }
    }

    function responderOido(oidoElegido) {
      if (!testActivo) return;
      const itemReal = secuenciaTest[pasoActual];

      if (oidoElegido === itemReal.oido) {
        aciertosTotales++;
        mAciertos.innerText = aciertosTotales;
        if ('vibrate' in navigator) navigator.vibrate(30);
      }

      panelOidos.style.display = 'none';
      btnEmitirTono.style.display = 'block';
      pasoActual++;

      if (pasoActual >= secuenciaTest.length) {
        finalizarPruebaAuditiva();
      } else {
        lblOido.innerText = 'Respuesta registrada';
        lblFrecuencia.innerText = `Paso ${pasoActual + 1} de 8`;
        lblUmbral.innerText = 'Pulse para siguiente tono';
      }
    }

    function finalizarPruebaAuditiva() {
      testActivo = false;
      if (oscilador) { try { oscilador.stop(); } catch(e){} }
      btnEmitirTono.style.display = 'none';
      panelOidos.style.display = 'none';
      mEstado.innerText = 'Completado';

      const aprobado = aciertosTotales >= 6;
      const resultadoAudio = {
        aciertos: aciertosTotales,
        total: 8,
        aprobado: aprobado,
        modo: esB2C ? 'B2C PARTICULAR' : 'B2B OFICIAL 1/1',
        fecha: new Date().toISOString()
      };

      const claveStorage = esB2C ? 'sensometrika_b2c_auditivo' : 'sensometrika_auditivo';
      localStorage.setItem(claveStorage, JSON.stringify(resultadoAudio));

      mostrarModalResultadoAudio(aciertosTotales, aprobado);
    }

    function mostrarModalResultadoAudio(aciertos, aprobado) {
      const modalExistente = document.getElementById('modalResultadoAudio');
      if (modalExistente) modalExistente.remove();

      const modalHtml = `
        <div id="modalResultadoAudio" style="position: fixed; inset: 0; background: rgba(5, 8, 18, 0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 16px;">
          <div style="background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; width: 100%; max-width: 380px; padding: 24px 20px; text-align: center; box-shadow: 0 20px 30px rgba(0,0,0,0.7); color: #f8fafc;">
            <h3 style="color: #ffffff; margin-bottom: 4px; font-size: 1.25rem; font-weight: 800;">${esB2C ? 'Práctica B2C Registrada' : 'Simulación Oficial Registrada (1/1)'}</h3>
            <p style="color: #38bdf8; margin-bottom: 16px; font-size: 0.85rem; font-weight: 600;">Módulo: Tamizaje Auditivo Ocupacional</p>

            <div style="margin-bottom: 18px;">
              <span style="display: inline-block; padding: 4px 18px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em; background: ${aprobado ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)'}; border: 1px solid ${aprobado ? '#10b981' : '#ef4444'}; color: ${aprobado ? '#34d399' : '#f87171'};">
                ${aprobado ? 'APROBADO' : 'OBSERVADO'}
              </span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #070b14; border: 1px solid #1e293b; border-radius: 12px; padding: 14px 10px; margin-bottom: 20px; text-align: left;">
              <div>
                <span style="display: block; font-size: 0.68rem; color: #94a3b8; font-weight: 600;">Aciertos Correctos</span>
                <strong style="color: #ffffff; font-size: 1rem; font-weight: 800;">${aciertos} / 8</strong>
              </div>
              <div>
                <span style="display: block; font-size: 0.68rem; color: #94a3b8; font-weight: 600;">Umbral Acústico</span>
                <strong style="color: #38bdf8; font-size: 1rem; font-weight: 800;">Vía Estéreo</strong>
              </div>
            </div>

            <button onclick="window.location.href='${esB2C ? 'menu_B2C.html' : 'menu_B2B.html'}'" style="width: 100%; background: #0284c7; color: #ffffff; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);">
              ${esB2C ? '← Volver al Menú B2C' : '← Volver a Consola de Faena (B2B)'}
            </button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }
  </script>
</body>
</html>
