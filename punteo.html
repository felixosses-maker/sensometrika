<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Test de Punteo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .canvas-punteo-caja {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: center;
      margin: 6px 0;
    }
    #lienzo-punteo {
      background-color: #020617;
      border: 3px solid #334155;
      border-radius: 12px;
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Sensometrika</h1>
      <p>Ritmo y Precisión Visomotriz (Lahy)</p>
    </header>

    <section class="panel-resultados">
      <div class="tarjeta-metrica">
        <span>Aciertos</span>
        <strong id="metrica-aciertos" style="color: #4ade80;">0</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Fallos</span>
        <strong id="metrica-fallos" style="color: #ef4444;">0</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Efectividad</span>
        <strong id="metrica-efectividad">-- %</strong>
      </div>
    </section>

    <div class="canvas-punteo-caja">
      <canvas id="lienzo-punteo" width="340" height="260"></canvas>
    </div>

    <div id="panel-estado" class="estado">Toca los círculos verdes en la zona de paso</div>

    <button id="btn-iniciar-punteo" class="btn-principal">Iniciar Prueba (30 s)</button>

    <a href="menu.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem;">← Volver al Menú Principal</a>
  </main>

  <script src="punteo.js"></script>
</body>
</html>
