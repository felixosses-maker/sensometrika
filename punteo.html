<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Punteo (Ritmo Viso-Motriz)</title>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-gold: #e5b324;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brand-logo-img {
            width: 180px;
            height: auto;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .card-punteo {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .badge-sim-status {
            background: rgba(229, 179, 36, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
            text-align: center;
        }

        /* LIENZO DE SIMULACIÓN INTERACTIVO */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn-iniciar {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-puntear-accion {
            background: var(--blue-btn);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            touch-action: manipulation;
        }

        .btn-puntear-accion:active {
            transform: scale(0.98);
            background: #0369a1;
        }

        /* TELEMETRÍA EN TIEMPO REAL */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: #070d17;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            text-align: center;
        }

        .lbl-m { color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .val-m { color: #fff; font-size: 0.95rem; font-weight: 800; }
        .val-m-cyan { color: var(--accent-cyan); font-size: 0.95rem; font-weight: 800; }
        .val-m-green { color: var(--accent-green); font-size: 0.95rem; font-weight: 800; }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span class="brand-subtitle">MÓDULO PUNTEO • RITMO VISO-MOTRIZ</span>
        </header>

        <div class="card-punteo">
            <div class="header-top-row">
                <a href="menu_B2C.html" style="color: var(--text-muted); text-decoration: none; font-weight: 700;">← Menú Pruebas</a>
                <span id="badgeSimulacion" class="badge-sim-status">Simulación Oficial 1 de 3</span>
            </div>

            <div class="canvas-wrapper" id="wrapperCanvas">
                <canvas id="canvasPunteo"></canvas>
            </div>

            <p id="lblInstruccion" style="font-size: 0.75rem; text-align: center; color: var(--text-muted); line-height: 1.3;">
                Toca la <b>franja dorada directamente</b> o presiona el botón inferior para impactar las esferas.
            </p>

            <button id="btnIniciar" class="btn-iniciar" onclick="iniciarSimulacion()">Iniciar Simulación Oficial</button>
            <button id="btnPuntear" class="btn-puntear-accion" style="display: none;">¡PUNTEAR AQUÍ / ESPACIO!</button>

            <div class="metrics-grid">
                <div>
                    <span class="lbl-m">Tiempo</span>
                    <div id="mTiempo" class="val-m-cyan">30 s</div>
                </div>
                <div>
                    <span class="lbl-m">Aciertos</span>
                    <div id="mAciertos" class="val-m-green">0</div>
                </div>
                <div>
                    <span class="lbl-m">Efectividad</span>
                    <div id="mEfectividad" class="val-m">-- %</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvasPunteo');
        const ctx = canvas.getContext('2d');
        const wrapperCanvas = document.getElementById('wrapperCanvas');
        const btnPuntear = document.getElementById('btnPuntear');

        let animFrameId = null;
        let juegoActivo = false;
        let tiempoRestante = 30;
        let timerInterval = null;

        let aciertos = 0;
        let intentosTotales = 0;

        let esferas = [];
        const VELOCIDAD_ESFERAS = 3.5;
        const RANGO_SPAWN_MS = 850;
        let ultimoSpawn = 0;

        // Zona Dorada Rectangular Larga
        let zonaImpacto = { y: 0, altura: 40 };
        let destelloImpactoMs = 0; // Control de cambio de estado visual

        function redimensionarCanvas() {
            canvas.width = wrapperCanvas.clientWidth;
            canvas.height = wrapperCanvas.clientHeight;
            zonaImpacto.y = canvas.height - 70;
        }

        window.addEventListener('resize', redimensionarCanvas);

        document.addEventListener('DOMContentLoaded', () => {
            redimensionarCanvas();
            actualizarHeaderSimulaciones();
            dibujarEscena();

            // EVENTOS DE CONTACTO DIRECTO TÁCTIL Y MOUSE
            wrapperCanvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                registrarPunteo();
            }, { passive: false });

            wrapperCanvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                registrarPunteo();
            });

            btnPuntear.addEventListener('touchstart', (e) => {
                e.preventDefault();
                registrarPunteo();
            }, { passive: false });

            btnPuntear.addEventListener('mousedown', (e) => {
                e.preventDefault();
                registrarPunteo();
            });

            // Teclado
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && juegoActivo) {
                    e.preventDefault();
                    registrarPunteo();
                }
            });
        });

        function actualizarHeaderSimulaciones() {
            const historial = JSON.parse(localStorage.getItem('sensometrika_historial_punteo')) || [];
            const numSim = Math.min(historial.length + 1, 3);
            document.getElementById('badgeSimulacion').textContent = `Simulación Oficial ${numSim} de 3 (D.S. N° 170)`;
            document.getElementById('btnIniciar').textContent = `Iniciar Simulación Oficial (${numSim}/3)`;
        }

        function iniciarSimulacion() {
            juegoActivo = true;
            aciertos = 0;
            intentosTotales = 0;
            tiempoRestante = 30;
            esferas = [];
            destelloImpactoMs = 0;

            document.getElementById('mAciertos').textContent = '0';
            document.getElementById('mEfectividad').textContent = '0 %';
            document.getElementById('mTiempo').textContent = '30 s';

            document.getElementById('btnIniciar').style.display = 'none';
            btnPuntear.style.display = 'block';

            timerInterval = setInterval(() => {
                tiempoRestante--;
                document.getElementById('mTiempo').textContent = `${tiempoRestante} s`;
                if (tiempoRestante <= 0) {
                    finalizarSimulacion();
                }
            }, 1000);

            ultimoSpawn = performance.now();
            bucleJuego(performance.now());
        }

        function bucleJuego(timestamp) {
            if (!juegoActivo) return;

            if (timestamp - ultimoSpawn > RANGO_SPAWN_MS) {
                const radio = 16;
                const x = Math.random() * (canvas.width - 60) + 30;
                esferas.push({ x: x, y: -radio, radio: radio, impactada: false });
                ultimoSpawn = timestamp;
            }

            for (let i = esferas.length - 1; i >= 0; i--) {
                esferas[i].y += VELOCIDAD_ESFERAS;
                if (esferas[i].y - esferas[i].radio > canvas.height) {
                    esferas.splice(i, 1);
                }
            }

            dibujarEscena();
            animFrameId = requestAnimationFrame(bucleJuego);
        }

        function dibujarEscena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const ahora = performance.now();
            const hayDestello = (ahora - destelloImpactoMs) < 180;

            // 1. DIBUJAR LA ZONA DE IMPACTO (CAMBIO DE ESTADO VERDE AL COINCIDIR)
            if (hayDestello) {
                ctx.fillStyle = 'rgba(16, 185, 129, 0.45)';
                ctx.fillRect(10, zonaImpacto.y, canvas.width - 20, zonaImpacto.altura);
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                ctx.strokeRect(10, zonaImpacto.y, canvas.width - 20, zonaImpacto.altura);
            } else {
                ctx.fillStyle = 'rgba(229, 179, 36, 0.15)';
                ctx.fillRect(10, zonaImpacto.y, canvas.width - 20, zonaImpacto.altura);
                ctx.strokeStyle = '#e5b324';
                ctx.lineWidth = 2;
                ctx.strokeRect(10, zonaImpacto.y, canvas.width - 20, zonaImpacto.altura);
            }

            ctx.fillStyle = hayDestello ? '#10b981' : 'rgba(229, 179, 36, 0.8)';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText(hayDestello ? '✓ IMPACTO REGISTRADO' : 'ZONA DE IMPACTO RÍTMICO', 18, zonaImpacto.y + 24);

            // 2. DIBUJAR ESFERAS
            esferas.forEach(esf => {
                if (!esf.impactada) {
                    ctx.beginPath();
                    ctx.arc(esf.x, esf.y, esf.radio, 0, Math.PI * 2);
                    ctx.fillStyle = '#ef4444';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });
        }

        function registrarPunteo() {
            if (!juegoActivo) return;

            intentosTotales++;
            let aciertoLogrado = false;

            for (let i = 0; i < esferas.length; i++) {
                const esf = esferas[i];
                if (!esf.impactada) {
                    const centroY = esf.y;
                    // Detecta si la esfera está sobre o entrando a la franja dorada
                    if (centroY >= (zonaImpacto.y - esf.radio) && centroY <= (zonaImpacto.y + zonaImpacto.altura + esf.radio)) {
                        esf.impactada = true;
                        aciertos++;
                        aciertoLogrado = true;
                        destelloImpactoMs = performance.now();
                        break;
                    }
                }
            }

            const efectividadCalculada = intentosTotales > 0 ? Math.round((aciertos / intentosTotales) * 100) : 0;
            document.getElementById('mAciertos').textContent = aciertos;
            document.getElementById('mEfectividad').textContent = `${efectividadCalculada} %`;
        }

        function finalizarSimulacion() {
            juegoActivo = false;
            clearInterval(timerInterval);
            if (animFrameId) cancelAnimationFrame(animFrameId);

            btnPuntear.style.display = 'none';

            const efectividadCalculada = intentosTotales > 0 ? Math.round((aciertos / intentosTotales) * 100) : 100;

            let historial = JSON.parse(localStorage.getItem('sensometrika_historial_punteo')) || [];
            historial.push({
                fecha: new Date().toISOString(),
                aciertos: aciertos,
                efectividad: efectividadCalculada
            });

            localStorage.setItem('sensometrika_historial_punteo', JSON.stringify(historial));
            localStorage.setItem('punteo_historial', JSON.stringify(historial));

            if (historial.length >= 3) {
                window.location.href = 'informe.html';
            } else {
                actualizarHeaderSimulaciones();
                document.getElementById('btnIniciar').style.display = 'block';
            }
        }
    </script>
</body>
</html>
