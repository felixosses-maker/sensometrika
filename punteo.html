<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Test de Punteo (Tambor de Lahy)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #060b16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .contenedor-punteo {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }
    .enlace-volver {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .titulo-modulo {
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .tarjeta-modo {
      background: #0b1329;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.80rem;
    }
    .panel-metricas {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .caja-metrica {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
    }
    .caja-metrica span {
      display: block;
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }
    .caja-metrica strong {
      display: block;
      font-size: 1.05rem;
      color: #ffffff;
      margin-top: 2px;
    }

    /* CONTENEDOR DEL TAMBOR ELECTROMECÁNICO */
    .caja-canvas {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9), 0 4px 16px rgba(2, 132, 199, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #lienzo-punteo {
      display: block;
      background: #020617;
      touch-action: none;
      cursor: crosshair;
    }

    #panel-estado {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      font-size: 0.80rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .btn-principal {
      width: 100%;
      height: 46px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: all 0.2s;
    }
    .btn-principal:hover { background: #0369a1; }

    .aviso-guia {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.72rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.35;
    }

    #zona-final-punteo { width: 100%; }
  </style>
</head>
<body>

  <main class="contenedor-punteo">
    <header class="barra-superior">
      <a href="menu.html" class="enlace-volver">← Menú Principal</a>
      <span class="titulo-modulo">MÓDULO 3: PUNTEO</span>
    </header>

    <div class="tarjeta-modo">
      <span id="badge-modo" style="color: #facc15; font-weight: 700;">🟡 Demo Calibración (15 s)</span>
      <span id="txt-tiempo-cabecera" style="color: #94a3b8;">Tiempo: <strong id="lbl-tiempo" style="color: #fff;">15 s</strong></span>
    </div>

    <section class="panel-metricas">
      <div class="caja-metrica">
        <span>Aciertos</span>
        <strong id="metrica-aciertos" style="color: #4ade80;">0</strong>
      </div>
      <div class="caja-metrica">
        <span>Fallos</span>
        <strong id="metrica-fallos" style="color: #ef4444;">0</strong>
      </div>
      <div class="caja-metrica">
        <span>Efectividad</span>
        <strong id="metrica-efectividad" style="color: #38bdf8;">-- %</strong>
      </div>
    </section>

    <!-- LIENZO CANVAS SINCRONIZADO -->
    <div class="caja-canvas">
      <canvas id="lienzo-punteo" width="414" height="260"></canvas>
    </div>

    <div id="panel-estado">CALIBRACIÓN RÍTMICA (Demo 15s): Pulsa los círculos dorados</div>

    <button type="button" id="btn-iniciar-punteo" class="btn-principal">
      Iniciar Calibración (15 s)
    </button>

    <div id="zona-final-punteo"></div>

    <div class="aviso-guia">
      💡 <span>No persigas los orificios hacia atrás. Mantén la cadencia rítmica en la franja central.</span>
    </div>
  </main>

  <script src="punteo.js"></script>
</body>
</html>
