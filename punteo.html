<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Punteo Viso-Motriz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-green: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
            --accent-cyan: #38bdf8;
            --accent-gold: #e5b324;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-logo-img {
            width: 185px;
            height: auto;
            display: block;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .eval-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .nav-btn-blue {
            color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.12) !important;
            padding: 6px 12px !important;
            border-radius: 8px !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            font-weight: 600 !important;
        }

        .status-badge-container { display: flex; justify-content: center; }

        .status-badge {
            background-color: #0f233d;
            border: 1px solid #1d4ed8;
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot-status { width: 8px; height: 8px; border-radius: 50%; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #050a12;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            touch-action: none;
        }

        canvas { width: 100%; height: 100%; display: block; touch-action: none; }

        .instruction-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .btn-start {
            background-color: var(--blue-btn);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-next {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            display: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            background-color: #070d17;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 8px;
        }

        .metric-item { display: flex; flex-direction: column; gap: 4px; }
        .metric-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; }
        .metric-value { font-size: 1.1rem; font-weight: 800; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(6, 11, 19, 0.88);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid #1e3a5f;
            border-radius: 14px;
            padding: 22px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .modal-title { color: #38bdf8; font-size: 1.1rem; font-weight: 800; }
        .modal-body { font-size: 0.9rem; color: var(--text-main); line-height: 1.5; }
        .modal-btn {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span class="brand-subtitle">MÓDULO PUNTEO VISO-MOTRIZ • RITMO Y PRECISIÓN</span>
        </header>

        <div class="eval-card">
            <div class="top-nav">
                <button class="nav-btn" onclick="ejecutarRetornoMenu()">← Menú Pruebas</button>
                <button id="btnInfo" class="nav-btn nav-btn-blue">? ¿Cómo funciona?</button>
            </div>

            <div class="status-badge-container">
                <div class="status-badge">
                    <span id="badgeDot" class="dot-status"></span>
                    <span id="badgeText">Cargando estado...</span>
                </div>
            </div>

            <div class="canvas-wrapper" id="canvasContainer">
                <canvas id="punteoCanvas" width="400" height="300"></canvas>
            </div>

            <div class="instruction-text" id="instructionText">
                Toca la pantalla o haz clic cuando el círculo cruce la zona inferior de impacto.
            </div>

            <div>
                <button id="btnStart" class="btn-start">INICIAR CALIBRACIÓN DEMO</button>
                <button id="btnNext" class="btn-next" onclick="ejecutarRetornoMenu()">VOLVER AL MENÚ DE PRUEBAS →</button>
            </div>

            <div class="metrics-grid">
                <div class="metric-item">
                    <span class="metric-label">ACIERTOS</span>
                    <span id="metricAciertos" class="metric-value" style="color:#38bdf8;">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">ERRORES</span>
                    <span id="metricErrores" class="metric-value" style="color:#ef4444;">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">PRECISIÓN</span>
                    <span id="metricPrecision" class="metric-value" style="color:#10b981;">100%</span>
                </div>
            </div>
        </div>

        <div id="modalSistema" class="modal-overlay">
            <div class="modal-content">
                <div id="modalTitle" class="modal-title">PRUEBA FINALIZADA</div>
                <div id="modalBody" class="modal-body">Resultados registrados.</div>
                <button id="modalBtnClose" class="modal-btn">Continuar</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('punteoCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const btnStart = document.getElementById('btnStart');
        const btnNext = document.getElementById('btnNext');
        const badgeDot = document.getElementById('badgeDot');
        const badgeText = document.getElementById('badgeText');
        const instructionText = document.getElementById('instructionText');

        const metricAciertos = document.getElementById('metricAciertos');
        const metricErrores = document.getElementById('metricErrores');
        const metricPrecision = document.getElementById('metricPrecision');

        const modal = document.getElementById('modalSistema');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalBtnClose = document.getElementById('modalBtnClose');

        const urlParams = new URLSearchParams(window.location.search);
        const modeParam = urlParams.get('mode') || (localStorage.getItem('sensometrika_b2c_mode') === 'true' ? 'b2c' : 'b2b');
        const esB2B = (modeParam === 'b2b');

        let isDemoURL = urlParams.get('demo') === 'true' || urlParams.get('fase') === 'demo';
        let modoActual = isDemoURL ? 'DEMO' : 'OFICIAL';

        let evaluacionActiva = false;
        let aciertos = 0;
        let errores = 0;
        let tiempoRestante = 15;
        let timerInterval = null;
        let animFrameId = null;

        let ultimoToqueMs = 0;

        let bola = { x: 200, y: -20, r: 18, vy: 3.2 };
        const targetZone = { yMin: 200, yMax: 270 };

        function ejecutarRetornoMenu() {
            window.location.href = `menu_B2C.html?${urlParams.toString()}`;
        }

        function actualizarEstadoUI() {
            const historial = JSON.parse(localStorage.getItem('sensometrika_historial_punteo')) || [];
            const numEnsayosRealizados = historial.length;

            // DETERMINAR LÍMITE SEGÚN EL PLAN CONTRATADO
            const planStorage = (localStorage.getItem('sensometrika_plan_contratado') || urlParams.get('plan') || 'BASICO').toUpperCase();
            let maxIntentosPlan = 3;
            if (planStorage.includes('PLUS')) maxIntentosPlan = 5;
            if (planStorage.includes('FULL') || planStorage.includes('ALTO')) maxIntentosPlan = 8;

            if (isDemoURL) {
                modoActual = 'DEMO';
            } else if (numEnsayosRealizados >= maxIntentosPlan) {
                modoActual = 'BLOQUEADO';
            } else {
                modoActual = 'OFICIAL';
            }

            if (modoActual === 'BLOQUEADO') {
                badgeText.textContent = `PLAN ${planStorage} COMPLETADO (${numEnsayosRealizados}/${maxIntentosPlan})`;
                badgeDot.style.backgroundColor = "#10b981"; 
                btnStart.style.display = 'none';
                btnNext.style.display = 'block';
                instructionText.textContent = `Has alcanzado el límite de ${maxIntentosPlan} simulaciones de tu Plan ${planStorage}. Retorna al menú.`;
            } else if (modoActual === 'DEMO') {
                badgeText.textContent = "Paso 1: Calibración Demo (1/1)";
                badgeDot.style.backgroundColor = "#e5b324"; 
                btnStart.textContent = "INICIAR CALIBRACIÓN DEMO";
                btnStart.style.backgroundColor = "#e5b324";
                btnStart.style.display = 'block';
                btnNext.style.display = 'none';
                instructionText.textContent = "Modo Demo: Toca la pantalla cuando el círculo cruce la zona inferior de ensayo.";
            } else {
                const siguienteSimu = numEnsayosRealizados + 1;
                badgeText.textContent = esB2B ? `Simulación Oficial B2B (S${siguienteSimu})` : `Simulación Oficial S${siguienteSimu} de ${maxIntentosPlan}`;
                badgeDot.style.backgroundColor = "#0284c7"; 
                btnStart.textContent = `INICIAR SIMULACIÓN OFICIAL (S${siguienteSimu} DE ${maxIntentosPlan})`;
                btnStart.style.backgroundColor = "#0284c7";
                btnStart.style.display = 'block';
                btnNext.style.display = 'none';
                instructionText.textContent = `Simulación S${siguienteSimu}: Mantén el ritmo constante presionando sobre el área indicada.`;
            }
        }

        function renderLoop() {
            ctx.fillStyle = '#050a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar Zona de Impacto
            ctx.strokeStyle = evaluacionActiva ? '#f59e0b' : '#e5b324';
            ctx.lineWidth = 2;
            ctx.strokeRect(15, targetZone.yMin, 370, targetZone.yMax - targetZone.yMin);

            ctx.fillStyle = '#e5b324';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText('ZONA DE IMPACTO RÍTMICO', 25, targetZone.yMin + 18);

            if (evaluacionActiva) {
                bola.y += bola.vy;

                if (bola.y > canvas.height + bola.r) {
                    errores++;
                    resetearBola();
                    actualizarMetricas();
                }

                ctx.beginPath();
                ctx.arc(bola.x, bola.y, bola.r, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(200, 130, 22, 0, Math.PI * 2);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            animFrameId = requestAnimationFrame(renderLoop);
        }

        function resetearBola() {
            bola.x = 50 + Math.random() * 300;
            bola.y = -20;
            bola.vy = 2.8 + Math.random() * 1.4;
        }

        function evaluarImpacto(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (!evaluacionActiva) return;

            const ahora = Date.now();
            if (ahora - ultimoToqueMs < 200) return;
            ultimoToqueMs = ahora;

            const yBolaInf = bola.y + bola.r;
            const yBolaSup = bola.y - bola.r;

            if ((yBolaInf >= targetZone.yMin && bola.y <= targetZone.yMax) || 
                (yBolaSup <= targetZone.yMax && bola.y >= targetZone.yMin)) {
                aciertos++;
            } else {
                errores++;
            }

            resetearBola();
            actualizarMetricas();
        }

        function actualizarMetricas() {
            metricAciertos.textContent = aciertos;
            metricErrores.textContent = errores;
            const total = aciertos + errores;
            const prec = total > 0 ? Math.round((aciertos / total) * 100) : 100;
            metricPrecision.textContent = `${prec}%`;
        }

        function iniciarPrueba() {
            if (modoActual === 'BLOQUEADO') return;

            aciertos = 0;
            errores = 0;
            tiempoRestante = 15;
            evaluacionActiva = true;
            ultimoToqueMs = 0;

            actualizarMetricas();
            resetearBola();

            btnStart.style.display = 'none';

            timerInterval = setInterval(() => {
                tiempoRestante--;
                if (tiempoRestante <= 0) {
                    finalizarPrueba();
                }
            }, 1000);
        }

        function finalizarPrueba() {
            evaluacionActiva = false;
            clearInterval(timerInterval);

            const total = aciertos + errores;
            const precisionVal = total > 0 ? Math.round((aciertos / total) * 100) : 100;

            if (modoActual === 'DEMO') {
                localStorage.setItem('punteo_demo_completada', 'true');

                isDemoURL = false;
                modoActual = 'OFICIAL';

                urlParams.set('demo', 'false');
                urlParams.set('fase', 'oficial');
                window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);

                mostrarModal(
                    "CALIBRACIÓN DEMO COMPLETADA",
                    `Aciertos: <b>${aciertos}</b><br>Errores: <b>${errores}</b><br>Precisión: <b>${precisionVal}%</b><br><br>Has finalizado el ensayo. Ya puedes rendir tu Simulación Oficial.`,
                    () => {
                        actualizarEstadoUI();
                    }
                );
            } else if (modoActual === 'OFICIAL') {
                let historial = JSON.parse(localStorage.getItem('sensometrika_historial_punteo')) || [];
                historial.push({ aciertos: aciertos, errores: errores, precision: precisionVal, fecha: new Date().toISOString() });
                localStorage.setItem('sensometrika_historial_punteo', JSON.stringify(historial));

                const planStorage = (localStorage.getItem('sensometrika_plan_contratado') || 'BASICO').toUpperCase();
                let maxIntentosPlan = 3;
                if (planStorage.includes('PLUS')) maxIntentosPlan = 5;
                if (planStorage.includes('FULL') || planStorage.includes('ALTO')) maxIntentosPlan = 8;

                if (historial.length >= maxIntentosPlan) {
                    let rendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || {};
                    rendidos.punteo = true;
                    localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(rendidos));
                }

                const numSimu = historial.length;

                mostrarModal(
                    `SIMULACIÓN S${numSimu} REGISTRADA`,
                    `Aciertos: <b>${aciertos}</b><br>Errores: <b>${errores}</b><br>Precisión: <b>${precisionVal}%</b><br><br><b>Simulación S${numSimu} de ${maxIntentosPlan} guardada con éxito.</b>`,
                    () => { ejecutarRetornoMenu(); }
                );
            }
        }

        function mostrarModal(titulo, cuerpo, callback) {
            modalTitle.textContent = titulo;
            modalBody.innerHTML = cuerpo;
            modal.style.display = 'flex';
            modalBtnClose.onclick = () => {
                modal.style.display = 'none';
                if (callback) callback();
            };
        }

        canvasContainer.addEventListener('pointerdown', evaluarImpacto, { passive: false });
        btnStart.addEventListener('click', iniciarPrueba);

        document.getElementById('btnInfo').addEventListener('click', () => {
            mostrarModal("¿CÓMO FUNCIONA?", "Toca la pantalla o haz clic cuando la bola cruce dentro de la <b>ZONA DE IMPACTO RÍTMICO</b> para registrar aciertos.");
        });

        actualizarEstadoUI();
        renderLoop();
    </script>
</body>
</html>
