<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Punteo Viso-Motriz</title>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-gold: #e5b324;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
            --blue-btn-border: #0369a1;
            --accent-cyan: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            width: 100%;
        }

        .brand-logo-card {
            background: rgba(11, 19, 36, 0.9);
            border: 1px solid #1e293b;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: inline-block;
        }

        .brand-logo-card img {
            width: 170px;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .eval-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .nav-btn-blue {
            color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.12) !important;
            padding: 6px 12px !important;
            border-radius: 8px !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            font-weight: 600 !important;
            cursor: pointer;
        }

        .status-badge-container { display: flex; justify-content: center; }

        .status-badge {
            background-color: #0f233d;
            border: 1px solid #1d4ed8;
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot-status {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #050a12;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            touch-action: manipulation;
        }

        canvas { width: 100%; height: 100%; display: block; }

        .instruction-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.4;
            padding: 0 8px;
        }

        .action-container { display: flex; flex-direction: column; gap: 10px; }

        .btn-start {
            background-color: var(--blue-btn);
            border: 1px solid var(--blue-btn-border);
            color: #ffffff;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-next {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-align: center;
            display: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            background-color: #070d17;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 8px;
        }

        .metric-item { display: flex; flex-direction: column; gap: 4px; }
        .metric-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; }
        .metric-value { font-size: 1.1rem; font-weight: 800; color: #ffffff; }
        .metric-value-cyan { color: #38bdf8; }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(6, 11, 19, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 16px;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 24px;
            width: 85%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-title { color: #38bdf8; font-size: 1.1rem; font-weight: 800; }
        .modal-body { font-size: 0.9rem; color: var(--text-main); line-height: 1.5; }
        .modal-btn {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <div class="brand-logo-card">
                <img src="sensometrica.jpg" alt="SENSOMETRIKA Calibration Technology">
            </div>
            <span class="brand-subtitle">MÓDULO PUNTEO VISO-MOTRIZ • RITMO Y PRECISIÓN</span>
        </header>

        <div class="eval-card">
            <div class="top-nav">
                <button id="btnVolverNav" class="nav-btn" onclick="ejecutarRetornoMenu()">← Menú Pruebas</button>
                <button id="btnInfo" class="nav-btn nav-btn-blue">? ¿Cómo funciona?</button>
            </div>

            <div class="status-badge-container">
                <div class="status-badge">
                    <span id="badgeDot" class="dot-status"></span>
                    <span id="badgeText">Cargando estado...</span>
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="punteoCanvas" width="400" height="300"></canvas>
            </div>

            <div class="instruction-text" id="instructionText">
                Evaluación Oficial: Toca o haz clic sobre los objetivos antes de que desaparezcan.
            </div>

            <div class="action-container">
                <button id="btnStart" class="btn-start">INICIAR SIMULACIÓN OFICIAL</button>
                <button id="btnNext" class="btn-next" onclick="ejecutarRetornoMenu()">VOLVER AL MENÚ DE PRUEBAS →</button>
            </div>

            <div class="metrics-grid">
                <div class="metric-item">
                    <span class="metric-label">ACIERTOS</span>
                    <span id="metricAciertos" class="metric-value metric-value-cyan">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">ERRORES</span>
                    <span id="metricErrores" class="metric-value" style="color:#ef4444;">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">PRECISIÓN</span>
                    <span id="metricPrecision" class="metric-value" style="color:#10b981;">100%</span>
                </div>
            </div>
        </div>

        <div id="modalSistema" class="modal-overlay">
            <div class="modal-content">
                <div id="modalTitle" class="modal-title">PRUEBA FINALIZADA</div>
                <div id="modalBody" class="modal-body">Resultados registrados correctamente.</div>
                <button id="modalBtnClose" class="modal-btn">Continuar</button>
            </div>
        </div>
    </div>

    <script src="punteo.js"></script>
    <script>
        const canvas = document.getElementById('punteoCanvas');
        const btnStart = document.getElementById('btnStart');
        const btnNext = document.getElementById('btnNext');
        const btnInfo = document.getElementById('btnInfo');
        const btnVolverNav = document.getElementById('btnVolverNav');

        const badgeDot = document.getElementById('badgeDot');
        const badgeText = document.getElementById('badgeText');
        const instructionText = document.getElementById('instructionText');

        const metricAciertos = document.getElementById('metricAciertos');
        const metricErrores = document.getElementById('metricErrores');
        const metricPrecision = document.getElementById('metricPrecision');

        const modal = document.getElementById('modalSistema');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalBtnClose = document.getElementById('modalBtnClose');

        const urlParams = new URLSearchParams(window.location.search);
        const tokenUrl = urlParams.get('token') || localStorage.getItem('sensometrika_b2b_token');
        const rutUrl = urlParams.get('rut') || localStorage.getItem('sensometrika_b2b_rut');

        let sesion = {};
        try { sesion = JSON.parse(localStorage.getItem('sensometrika_sesion')) || {}; } catch(e){}

        const plan = localStorage.getItem('sensometrika_plan') || sesion.planId || 'B2C'; 
        const esB2B = (tokenUrl || rutUrl || plan === 'B2B' || sesion.rol === 'empresa' || localStorage.getItem('sensometrika_b2b_mode') === 'true' || localStorage.getItem('sensometrika_b2b_contratacion'));

        let simulacionesTotales = esB2B ? 1 : (parseInt(localStorage.getItem('sensometrika_simulaciones_compradas')) || 3);
        let simulacionesUsadas = parseInt(localStorage.getItem('punteo_simulaciones_usadas')) || 0;

        let modoActual = 'DEMO';

        function ejecutarRetornoMenu() {
            const token = tokenUrl || localStorage.getItem('sensometrika_b2b_token') || '';
            const rut = rutUrl || localStorage.getItem('sensometrika_b2b_rut') || '';

            if (esB2B) {
                window.location.href = `menu_B2C.html?token=${token}&rut=${rut}&verified=true`;
            } else {
                window.location.href = 'menu_B2C.html';
            }
        }

        btnVolverNav.addEventListener('click', ejecutarRetornoMenu);
        btnNext.addEventListener('click', ejecutarRetornoMenu);

        function actualizarEstadoPlanUI() {
            const demoRealizada = localStorage.getItem('punteo_demo_completada') === 'true';
            simulacionesUsadas = parseInt(localStorage.getItem('punteo_simulaciones_usadas')) || 0;

            if (!demoRealizada) {
                modoActual = 'DEMO';
                badgeText.textContent = "Paso 1: Calibración Demo (1/1)";
                badgeDot.style.backgroundColor = "#e5b324"; 
                btnStart.textContent = "INICIAR CALIBRACIÓN DEMO";
                btnStart.style.display = 'block';
                btnNext.style.display = 'none';
                instructionText.textContent = "Modo Demo: Toca los objetivos circulares para calibrar la coordinación viso-motriz.";
            } else if (simulacionesUsadas < simulacionesTotales) {
                modoActual = 'OFICIAL';
                const numSimulacion = simulacionesUsadas + 1;
                badgeText.textContent = esB2B ? "Simulación Oficial (1/1) (D.S. N° 170)" : `Simulación Oficial ${numSimulacion} de ${simulacionesTotales} (D.S. N° 170)`;
                badgeDot.style.backgroundColor = "#ef4444"; 
                btnStart.textContent = esB2B ? "INICIAR SIMULACIÓN OFICIAL" : `INICIAR SIMULACIÓN OFICIAL (${numSimulacion}/${simulacionesTotales})`;
                btnStart.style.display = 'block';
                btnNext.style.display = 'none';
                instructionText.textContent = "Evaluación Oficial: Mantén la atención y presiona con precisión los estímulos estocásticos.";
            } else {
                modoActual = 'BLOQUEADO';
                badgeText.textContent = "EVALUACIÓN REGISTRADA EN SISTEMA";
                badgeDot.style.backgroundColor = "#10b981"; 
                btnStart.style.display = 'none';
                btnNext.style.display = 'block';
                instructionText.textContent = "Has completado la evaluación de Punteo Viso-Motriz. Retorna al menú para continuar.";
            }
        }

        function mostrarAlertaSistema(titulo, mensaje, callback) {
            modalTitle.textContent = titulo;
            modalBody.innerHTML = mensaje;
            modal.style.display = 'flex';
            modalBtnClose.onclick = () => {
                modal.style.display = 'none';
                if (callback) callback();
            };
        }

        const moduloPunteo = new ModuloPunteo(canvas, { width: 400, height: 300 }, (res) => {
            if (modoActual === 'DEMO') {
                localStorage.setItem('punteo_demo_completada', 'true');
                actualizarEstadoPlanUI();
                mostrarAlertaSistema(
                    "CALIBRACIÓN DEMO COMPLETADA",
                    `Aciertos: <b>${res.aciertos}</b><br>Errores: <b>${res.errores}</b><br>Precisión: <b>${res.precision}%</b><br><br>Has finalizado el ensayo. Ya puedes rendir tu Simulación Oficial.`
                );
            } else if (modoActual === 'OFICIAL') {
                simulacionesUsadas++;
                localStorage.setItem('punteo_simulaciones_usadas', simulacionesUsadas.toString());
                
                let rendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || [];
                if (!rendidos.includes(3)) rendidos.push(3);
                localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(rendidos));

                let historial = JSON.parse(localStorage.getItem('sensometrika_historial_punteo')) || [];
                historial.push({
                    aciertos: res.aciertos,
                    errores: res.errores,
                    precision: res.precision
                });
                localStorage.setItem('sensometrika_historial_punteo', JSON.stringify(historial));

                actualizarEstadoPlanUI();

                mostrarAlertaSistema(
                    "SIMULACIÓN REGISTRADA",
                    `Aciertos: <b>${res.aciertos}</b><br>Errores: <b>${res.errores}</b><br>Precisión: <b>${res.precision}%</b><br><br>` +
                    "<b>¡Has completado la evaluación oficial de este módulo!</b>",
                    () => {
                        ejecutarRetornoMenu();
                    }
                );
            }
        });

        btnStart.addEventListener('click', () => {
            if (modoActual === 'BLOQUEADO') return;
            btnStart.style.display = 'none';
            moduloPunteo.iniciar();
        });

        btnInfo.addEventListener('click', () => {
            mostrarAlertaSistema(
                "¿CÓMO FUNCIONA?",
                "<b>Evaluación Viso-Motriz:</b> Aparecerán objetivos en pantalla durante un tiempo delimitado.<br><br>• Haz clic o toca rápido cada objetivo antes de que desaparezca.<br>• Tocas fuera del objetivo sumará error.<br>• El sistema evaluará tu tasa de aciertos y ritmo constante."
            );
        });

        actualizarEstadoPlanUI();
    </script>
</body>
</html>
