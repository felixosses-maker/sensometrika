<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Test de Punteo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .barra-superior {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .barra-superior a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .barra-calibracion {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #94a3b8;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .canvas-punteo-caja {
      position: relative;
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
      margin: 6px 0;
    }
    #lienzo-punteo {
      background-color: #020617;
      border: 3px solid #334155;
      border-radius: 12px;
      touch-action: none;
      cursor: crosshair;
    }
    .instruccion-caja {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.35;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="barra-superior">
      <a href="menu.html">← Menú Principal</a>
      <span style="font-size: 0.8rem; color: #38bdf8; font-weight: 700;">MÓDULO 3: PUNTEO</span>
    </header>

    <div class="barra-calibracion">
      <span id="badge-modo-punteo">🟢 Demo Calibración (Ensayo Libre)</span>
      <span id="txt-tiempo-punteo">Tiempo: <strong>15 s</strong></span>
    </div>

    <section class="panel-resultados" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-bottom: 8px;">
      <div class="tarjeta-metrica" style="background: #0f172a; border: 1px solid #334155; padding: 8px 4px; border-radius: 8px; text-align: center;">
        <span style="font-size: 0.68rem; color: #94a3b8;">Aciertos</span>
        <strong id="metrica-aciertos" style="color: #4ade80;">0</strong>
      </div>
      <div class="tarjeta-metrica" style="background: #0f172a; border: 1px solid #334155; padding: 8px 4px; border-radius: 8px; text-align: center;">
        <span style="font-size: 0.68rem; color: #94a3b8;">Fallos</span>
        <strong id="metrica-fallos" style="color: #ef4444;">0</strong>
      </div>
      <div class="tarjeta-metrica" style="background: #0f172a; border: 1px solid #334155; padding: 8px 4px; border-radius: 8px; text-align: center;">
        <span style="font-size: 0.68rem; color: #94a3b8;">Efectividad</span>
        <strong id="metrica-efectividad" style="color: #38bdf8;">-- %</strong>
      </div>
    </section>

    <div class="canvas-punteo-caja">
      <canvas id="lienzo-punteo" width="330" height="240"></canvas>
    </div>

    <div id="panel-estado" class="estado">Toca los círculos verdes en la franja dorada</div>

    <button id="btn-iniciar-punteo" class="btn-principal">Iniciar Demo (15 s)</button>

    <div class="instruccion-caja" id="caja-instrucciones">
      💡 No persigas los orificios hacia atrás. Concéntrate en la franja central dorada.
    </div>

    <div id="zona-coordinacion-punteo" style="width: 100%;"></div>
  </main>

  <script src="punteo.js"></script>
</body>
</html>
