<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Consola de Evaluaciones B2B por Planes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #040810;
            --card-bg: #091120;
            --border-color: #132238;
            --accent-cyan: #00bfff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-gold: #e5b324;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 16px 12px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .brand-logo-img {
            width: 170px;
            height: auto;
            mix-blend-mode: lighten;
            margin-top: 4px;
        }

        .card-ficha {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .avatar-box {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-cyan);
            background: #020617;
        }

        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        .badge-plan-active {
            background: rgba(0, 191, 255, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 0.65rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .module-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .module-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .module-card.completed {
            border-color: rgba(16, 185, 129, 0.4);
            background-color: #061512;
        }

        .module-card.locked {
            opacity: 0.55;
            background-color: #050a14;
        }

        .module-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .module-title { font-size: 0.82rem; font-weight: 800; color: #fff; }
        .module-desc { font-size: 0.63rem; color: var(--text-muted); }

        .btn-status {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.70rem;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-start {
            background-color: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
        }

        .btn-done {
            background-color: var(--accent-green);
            color: #000;
            cursor: default;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .btn-lock {
            background-color: #1e293b;
            color: #64748b;
            cursor: not-allowed;
            border: 1px solid #334155;
        }

        .btn-informe {
            background-color: var(--accent-green);
            color: #000;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            text-align: center;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">

        <!-- FICHA DEL EVALUADO -->
        <div class="card-ficha">
            <div class="avatar-box">
                <img id="imgAvatar" src="sensometrica.jpg" alt="Foto Evaluado">
            </div>
            <div class="badge-plan-active" id="lblPlanActivo">
                EVALUACIÓN B2B • PLAN BÁSICO (3 MÓDULOS)
            </div>
            <div style="text-align: center;">
                <h3 id="lblNombreEvaluado" style="font-size: 0.95rem; font-weight: 900; color: #fff;">CARGANDO...</h3>
                <p id="lblSubInfo" style="font-size: 0.65rem; color: var(--text-muted); margin-top: 2px;">RUT: -- | Cargo: --</p>
            </div>
        </div>

        <div style="width: 100%; text-align: left; margin-top: 4px;">
            <span style="font-size: 0.68rem; font-weight: 800; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.5px;">
                📋 PARRILLA DE MÓDULOS DEL PLAN (8 EVALUACIONES BASE)
            </span>
        </div>

        <!-- LISTA DE MÓDULOS -->
        <div class="module-list" id="contenedorModulosParrilla">
            <!-- Se inyectan dinámicamente -->
        </div>

        <!-- BOTÓN DE GENERACIÓN DE INFORME -->
        <button id="btnVerInformeFinal" onclick="irAlInformeFinal()" class="btn-informe">
            📊 VER INFORME PERICIAL B2B →
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let datosUsuario = {};
        try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch(e){}

        const rawNombre = urlParams.get('nombre') || datosUsuario.nombre || localStorage.getItem('sensometrika_nombre') || 'PEDRO MORALES SANTANDER';
        const rawRut = urlParams.get('rut') || datosUsuario.rut || localStorage.getItem('sensometrika_rut') || '7.345.877-K';
        const rawCargo = urlParams.get('cargo') || datosUsuario.cargo || localStorage.getItem('sensometrika_cargo') || 'Operador Harvester';
        const rawEmpresa = urlParams.get('empresa') || datosUsuario.empresa || localStorage.getItem('sensometrika_b2b_empresa') || 'SOCADEP CHILLAN';
        const planActivo = (urlParams.get('plan') || localStorage.getItem('sensometrika_b2b_plan') || 'BASICO').toUpperCase();
        const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_B2B_${rawRut.replace(/[^0-9Kk]/g, '')}_${Date.now()}`;
        const cleanRut = rawRut.replace(/[^0-9Kk]/g, '');

        const MATRIZ_8_MODULOS = [
            { id: 1, key: 'reactimetro', title: '1. Reactímetro Simple ⚡', desc: 'Tiempo de respuesta lumínica y acústica en frenado.', url: 'reactimetro.html', minPlan: 'BASICO' },
            { id: 2, key: 'palancas', title: '2. Test de Palancas Bimanual 🕹️', desc: 'Control psicomotor bilateral e independiente.', url: 'palancas.html', minPlan: 'BASICO' },
            { id: 3, key: 'punteo', title: '3. Punteo Viso-Motriz 🎯', desc: 'Coordinación óculo-manual y ritmo de trayectoria.', url: 'punteo.html', minPlan: 'BASICO' },
            { id: 4, key: 'auditivo', title: '4. Tamizaje Auditivo Ocupacional 🔊', desc: 'Audiometría tonal en frecuencias conversacionales.', url: 'audicion.html', minPlan: 'PLUS' },
            { id: 5, key: 'visual', title: '5. Tamizaje Visual Integral 👁️', desc: 'Agudeza visual lejana/cercana y Test Ishihara.', url: 'visual.html', minPlan: 'PLUS' },
            { id: 6, key: 'anticipacion', title: '6. Velocidad de Anticipación ⏱️', desc: 'Cálculo de trayectorias en zonas ciegas.', url: 'anticipacion.html', minPlan: 'FULL' },
            { id: 7, key: 'estereopsis', title: '7. Estereopsis & Profundidad 3D 📐', desc: 'Percepción espacial binocular.', url: 'estereopsis.html', minPlan: 'FULL' },
            { id: 8, key: 'fatiga', title: '8. Control Fatiga & Vigilancia (PVT) 😴', desc: 'Detección de somnolencia y micro-sueños.', url: 'fatiga.html', minPlan: 'FULL' }
        ];

        function esPermitidoEnPlan(minPlan) {
            if (planActivo === 'FULL' || planActivo.includes('ALTO')) return true;
            if (planActivo === 'PLUS' && (minPlan === 'BASICO' || minPlan === 'PLUS')) return true;
            if (planActivo === 'BASICO' && minPlan === 'BASICO') return true;
            return false;
        }

        function verificarModuloEjecutado(key) {
            const dataStr = localStorage.getItem(`sensometrika_${key}_${cleanRut}_${sessionId}`) ||
                            localStorage.getItem(`sensometrika_last_${key}_${cleanRut}_${sessionId}`) ||
                            localStorage.getItem(`sensometrika_historial_${key}_${cleanRut}_${sessionId}`) ||
                            localStorage.getItem(`sensometrika_${key}`);
            return dataStr !== null;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lblNombreEvaluado').textContent = decodeURIComponent(rawNombre).toUpperCase();
            document.getElementById('lblSubInfo').textContent = `RUT: ${rawRut} | Cargo: ${decodeURIComponent(rawCargo)}`;
            document.getElementById('lblPlanActivo').textContent = `EVALUACIÓN B2B • PLAN ${planActivo}`;

            // Cargar Foto Biométrica
            const fotoGuardada = localStorage.getItem(`sensometrika_foto_${cleanRut}_${sessionId}`) || 
                                 localStorage.getItem('sensometrika_foto_identidad');
            if (fotoGuardada) {
                document.getElementById('imgAvatar').src = fotoGuardada;
            }

            renderizarModulos();
        });

        function renderizarModulos() {
            const contenedor = document.getElementById('contenedorModulosParrilla');
            contenedor.innerHTML = '';

            MATRIZ_8_MODULOS.forEach(m => {
                const permitido = esPermitidoEnPlan(m.minPlan);
                const completado = verificarModuloEjecutado(m.key);

                const divCard = document.createElement('div');
                
                if (!permitido) {
                    divCard.className = 'module-card locked';
                    divCard.innerHTML = `
                        <div class="module-info">
                            <span class="module-title" style="color: #64748b;">${m.title}</span>
                            <span class="module-desc">${m.desc}</span>
                        </div>
                        <button class="btn-status btn-lock" disabled>🔒 NO INCLUIDO EN PLAN</button>
                    `;
                } else if (completado) {
                    divCard.className = 'module-card completed';
                    divCard.innerHTML = `
                        <div class="module-info">
                            <span class="module-title">${m.title}</span>
                            <span class="module-desc">Evaluación B2B finalizada correctamente.</span>
                        </div>
                        <button class="btn-status btn-done">✓ EJECUTADO (1/1)</button>
                    `;
                } else {
                    divCard.className = 'module-card';
                    const targetUrl = `${m.url}?rut=${encodeURIComponent(rawRut)}&nombre=${encodeURIComponent(rawNombre)}&cargo=${encodeURIComponent(rawCargo)}&plan=${planActivo}&session=${sessionId}&mode=b2b`;
                    divCard.innerHTML = `
                        <div class="module-info">
                            <span class="module-title">${m.title}</span>
                            <span class="module-desc">${m.desc}</span>
                        </div>
                        <a href="${targetUrl}" class="btn-status btn-start">INICIAR →</a>
                    `;
                }

                contenedor.appendChild(divCard);
            });
        }

        function irAlInformeFinal() {
            const paramsInforme = new URLSearchParams({
                rut: rawRut,
                nombre: rawNombre,
                cargo: rawCargo,
                empresa: rawEmpresa,
                plan: planActivo,
                session: sessionId,
                mode: 'b2b'
            });
            window.location.href = `informe_b2b_planes.html?${paramsInforme.toString()}`;
        }
    </script>
</body>
</html>
