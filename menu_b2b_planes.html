<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Menú de Evaluaciones B2B (8 Módulos)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #040810;
      --card-bg: #091120;
      --card-border: #132238;
      --inner-bg: #050a14;
      --accent-cyan: #00bfff;
      --accent-cyan-glow: rgba(0, 191, 255, 0.35);
      --accent-green: #10b981;
      --accent-gold: #e5b324;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 16px 12px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-img {
      width: 170px;
      height: auto;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 10px var(--accent-cyan-glow));
      margin-top: 6px;
    }

    .header-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .user-avatar-small {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      margin: 0 auto;
    }

    .badge-plan-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-plan-basico { background: rgba(0, 191, 255, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
    .badge-plan-plus { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-plan-full { background: rgba(229, 179, 36, 0.15); color: var(--accent-gold); border: 1px solid var(--accent-gold); }

    .section-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .module-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.2s;
    }

    .module-card.locked {
      opacity: 0.6;
      background-color: #060a14;
      border-color: #1e293b;
    }

    .module-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 68%;
    }

    .module-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .module-desc {
      font-size: 0.62rem;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .btn-module {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.7rem;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 2px 10px var(--accent-cyan-glow);
    }

    .btn-module.completed {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
      box-shadow: none;
    }

    .badge-locked-label {
      background: rgba(100, 116, 139, 0.2);
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.60rem;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .btn-action-main {
      background: var(--accent-green);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.78rem;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      display: block;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">

    <!-- ENCABEZADO DEL TRABAJADOR Y PLAN VIGENTE -->
    <div class="header-card">
      <img id="imgAvatar" src="sensometrica.jpg" alt="Evaluado" class="user-avatar-small" onerror="this.src='sensometrica.jpg'">
      <div>
        <div id="badgePlanContratado" class="badge-plan-status badge-plan-basico">EVALUACIÓN B2B • PLAN BÁSICO</div>
        <h3 id="lblNombreEvaluado" style="font-size: 0.95rem; font-weight: 900; color: #fff; margin-top: 4px;">CARGANDO TRABAJADOR...</h3>
        <p id="lblRutCargo" style="font-size: 0.70rem; color: var(--text-muted); margin-top: 2px;">RUT: -- | Cargo: --</p>
      </div>
    </div>

    <div style="width: 100%; border-bottom: 1px solid var(--card-border); padding-bottom: 4px;">
      <span style="font-size: 0.72rem; color: var(--accent-cyan); font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;">
        📋 PARRILLA DE MÓDULOS DEL PLAN (8 EVALUACIONES BASE)
      </span>
    </div>

    <!-- CONTENEDOR UNIFICADO DE LOS 8 MÓDULOS -->
    <div id="grupoModulos8" class="section-group">
      <!-- Inyección dinámica vía JavaScript -->
    </div>

    <!-- BOTÓN FINAL DE GENERACIÓN DE INFORME -->
    <a href="informe_b2b.html" id="btnInformeFinal" class="btn-action-main">
      VER INFORME PERICIAL B2B (D.S. 170) →
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let datosUsuario = {};
    try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch(e){}

    const rawNombre = urlParams.get('nombre') || datosUsuario.nombre || localStorage.getItem('sensometrika_nombre') || 'OPERARIO EN FAENA';
    const rawRut = urlParams.get('rut') || datosUsuario.rut || localStorage.getItem('sensometrika_rut') || '12.345.678-9';
    const rawCargo = urlParams.get('cargo') || datosUsuario.cargo || localStorage.getItem('sensometrika_cargo') || 'Operador de Maquinaria';
    const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_B2B_${rawRut.replace(/[^0-9Kk]/g, '')}_${Date.now()}`;
    const cleanRut = rawRut.replace(/[^0-9Kk]/g, '');

    // Determinación del Plan Contratado
    let planActivo = (urlParams.get('plan') || localStorage.getItem('sensometrika_b2b_plan') || 'BASICO').toUpperCase();
    if (planActivo.includes('ALTO') || planActivo.includes('FULL') || planActivo.includes('COMPLEJIDAD')) {
      planActivo = 'FULL';
    } else if (planActivo.includes('PLUS')) {
      planActivo = 'PLUS';
    } else {
      planActivo = 'BASICO';
    }

    // Actualizar UI del Encabezado
    document.getElementById('lblNombreEvaluado').textContent = decodeURIComponent(rawNombre).toUpperCase();
    document.getElementById('lblRutCargo').textContent = `RUT: ${rawRut} | Cargo: ${decodeURIComponent(rawCargo)}`;
    
    const badgePlan = document.getElementById('badgePlanContratado');
    if (planActivo === 'FULL') {
      badgePlan.className = 'badge-plan-status badge-plan-full';
      badgePlan.textContent = 'EVALUACIÓN B2B • PLAN FULL (8 MÓDULOS)';
    } else if (planActivo === 'PLUS') {
      badgePlan.className = 'badge-plan-status badge-plan-plus';
      badgePlan.textContent = 'EVALUACIÓN B2B • PLAN PLUS (5 MÓDULOS)';
    } else {
      badgePlan.className = 'badge-plan-status badge-plan-basico';
      badgePlan.textContent = 'EVALUACIÓN B2B • PLAN BÁSICO (3 MÓDULOS)';
    }

    // Avatar Fotográfico
    const fotoGuardada = localStorage.getItem('sensometrika_foto_identidad') || localStorage.getItem(`sensometrika_foto_${cleanRut}_${sessionId}`);
    if (fotoGuardada && fotoGuardada.length > 50) {
      document.getElementById('imgAvatar').src = fotoGuardada;
    }

    // PARRILLA OFICIAL DE LOS 8 MÓDULOS B2B
    const modulosB2B = [
      { id: 1, key: 'reactimetro', title: '1. Reactímetro Simple ⚡', desc: 'Tiempo de respuesta lumínica y acústica en frenado.', archivo: 'reactimetro.html', minPlan: 'BASICO' },
      { id: 2, key: 'palancas', title: '2. Test de Palancas Bimanual 🕹️', desc: 'Control psicomotor bilateral e independiente.', archivo: 'palancas.html', minPlan: 'BASICO' },
      { id: 3, key: 'punteo', title: '3. Punteo Viso-Motriz 🎯', desc: 'Coordinación óculo-manual y ritmo de trayectoria.', archivo: 'punteo.html', minPlan: 'BASICO' },
      { id: 4, key: 'auditivo', title: '4. Tamizaje Auditivo Ocupacional 🔊', desc: 'Audiometría tonal en frecuencias conversacionales.', archivo: 'audicion.html', minPlan: 'PLUS' },
      { id: 5, key: 'visual', title: '5. Tamizaje Visual Integral 👁️', desc: 'Agudeza visual lejana/cercana y Test Ishihara.', archivo: 'visual.html', minPlan: 'PLUS' },
      { id: 6, key: 'anticipacion', title: '6. Velocidad de Anticipación ⏱️', desc: 'Cálculo de velocidad y tiempo de cruce en zona ciega.', archivo: 'anticipacion.html', minPlan: 'FULL' },
      { id: 7, key: 'estereopsis', title: '7. Estereopsis & Profundidad 3D 📐', desc: 'Percepción espacial binocular y cálculo de distancias.', archivo: 'estereopsis.html', minPlan: 'FULL' },
      { id: 8, key: 'fatiga', title: '8. Control de Fatiga & Vigilancia (PVT) 😴', desc: 'Test de atención sostenida y alerta ante microsueños.', archivo: 'fatiga.html', minPlan: 'FULL' }
    ];

    function esModuloPermitido(mPlan) {
      if (planActivo === 'FULL') return true;
      if (planActivo === 'PLUS' && (mPlan === 'BASICO' || mPlan === 'PLUS')) return true;
      if (planActivo === 'BASICO' && mPlan === 'BASICO') return true;
      return false;
    }

    function renderizarModulos() {
      const cont = document.getElementById('grupoModulos8');
      cont.innerHTML = '';

      modulosB2B.forEach(m => {
        const permitido = esModuloPermitido(m.minPlan);
        const rendido = localStorage.getItem(`medico_${m.key}_${cleanRut}_${sessionId}`) === 'true' ||
                        localStorage.getItem(`sensometrika_${m.key}_${cleanRut}_${sessionId}`) === 'true' ||
                        localStorage.getItem(`sensometrika_${m.key}_${sessionId}`) === 'true';

        const card = document.createElement('div');
        card.className = `module-card ${permitido ? '' : 'locked'}`;

        let accionHTML = '';
        if (permitido) {
          accionHTML = `
            <a href="${m.archivo}?${urlParams.toString()}" class="btn-module ${rendido ? 'completed' : ''}">
              ${rendido ? '✓ COMPLETADO' : 'INICIAR →'}
            </a>
          `;
        } else {
          accionHTML = `<span class="badge-locked-label">🔒 NO INCLUIDO EN PLAN</span>`;
        }

        card.innerHTML = `
          <div class="module-info">
            <span class="module-title">${m.title}</span>
            <span class="module-desc">${m.desc}</span>
          </div>
          ${accionHTML}
        `;
        cont.appendChild(card);
      });

      // Enlace para el botón del informe pericial final
      document.getElementById('btnInformeFinal').href = `informe_b2b.html?${urlParams.toString()}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderizarModulos();
    });
  </script>
</body>
</html>
