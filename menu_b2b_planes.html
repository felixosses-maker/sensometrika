<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Consola Central B2B por Planes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-principal: #060b13;
            --bg-card: #0b1320;
            --border-color: #1a2638;
            --verde-destacado: #10b981;
            --azul-destacado: #38bdf8;
            --azul-btn: #0284c7;
            --texto-blanco: #f1f5f9;
            --texto-gris: #94a3b8;
            --accent-gold: #e5b324;
            --accent-red: #ef4444;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        body { 
            background-color: var(--bg-principal); 
            color: var(--texto-blanco); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 16px 12px 32px; 
        }

        .main-container { 
            width: 100%; 
            max-width: 480px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
        }

        .brand-header { 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
        }

        .brand-logo-img { 
            width: 185px; 
            height: auto; 
            display: block; 
            mix-blend-mode: lighten; 
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45)); 
        }

        .profile-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .avatar-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--azul-destacado);
            overflow: hidden;
            background: #030712;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .plan-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--azul-destacado);
            color: var(--azul-destacado);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .parrilla-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .parrilla-header {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--texto-gris);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modulo-item {
            background-color: #070d18;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .modulo-item.lock {
            opacity: 0.45;
            filter: grayscale(0.6);
            border-color: #1e293b;
        }

        .modulo-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .modulo-titulo {
            font-size: 0.92rem;
            font-weight: 800;
            color: #ffffff;
        }

        .modulo-desc {
            font-size: 0.72rem;
            color: var(--texto-gris);
        }

        .btn-status-iniciar {
            background-color: var(--azul-btn);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }

        .btn-status-iniciar:hover {
            background-color: #0369a1;
        }

        .btn-status-ejecutado {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--verde-destacado);
            color: #34d399;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 800;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-status-lock {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            color: #64748b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-informe-main {
            background-color: var(--verde-destacado);
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
            transition: transform 0.1s;
        }

        .btn-informe-main:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
        </header>

        <!-- TARJETA DE PERFIL DE TRABAJADOR EVALUADO -->
        <section class="profile-card">
            <div class="avatar-frame">
                <img id="imgAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%230b1320'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='10' fill='%2338bdf8'>BIOMETRIA</text></svg>" alt="Validación Facial">
            </div>

            <div class="plan-badge" id="lblPlanBadge">EVALUACIÓN B2B • CARGANDO...</div>

            <div>
                <h2 id="lblNombreTrabajador" style="font-size: 1.15rem; font-weight: 900; color: #ffffff;">CARGANDO TRABAJADOR...</h2>
                <p id="lblRutCargo" style="font-size: 0.78rem; color: var(--texto-gris); font-weight: 600; margin-top: 2px;">RUT: -- | Cargo: --</p>
            </div>
        </section>

        <!-- PARRILLA DE MÓDULOS DE EVALUACIÓN (RENDERIZADA DINÁMICAMENTE SEGÚN PLAN) -->
        <section class="parrilla-card">
            <div class="parrilla-header">
                📋 PARRILLA DE MÓDULOS DEL PLAN (8 EVALUACIONES BASE)
            </div>

            <div id="contenedorParrillaModulos" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Inyección dinámica de tarjetas de módulo -->
            </div>
        </section>

        <!-- BOTÓN PRINCIPAL PARA VER INFORME PERICIAL -->
        <button class="btn-informe-main" onclick="navegarAInforme()">
            📊 VER INFORME PERICIAL B2B →
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);

        // 1. CARGA Y AISLAMIENTO DE DATOS DEL TRABAJADOR
        let datosUsuario = {};
        try {
            datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {};
        } catch(e){}

        const rawNombre = urlParams.get('nombre') || datosUsuario.nombre || localStorage.getItem('sensometrika_nombre') || 'NUEVO TRABAJADOR';
        const rawCargo = urlParams.get('cargo') || datosUsuario.cargo || localStorage.getItem('sensometrika_cargo') || 'OPERADOR';
        const rawEmpresa = urlParams.get('empresa') || datosUsuario.empresa || localStorage.getItem('sensometrika_b2b_empresa') || 'EMPRESA MANDANTE';
        
        // NORMALIZACIÓN ESTRICTA DEL PLAN (BASICO, PLUS, FULL)
        let planActivo = (urlParams.get('plan') || localStorage.getItem('sensometrika_b2b_plan') || 'BASICO').toUpperCase();
        if (planActivo.includes('ALTO') || planActivo.includes('FULL') || planActivo.includes('COMPLEJIDAD')) {
            planActivo = 'FULL';
        } else if (planActivo.includes('PLUS')) {
            planActivo = 'PLUS';
        } else {
            planActivo = 'BASICO';
        }

        const rutEvaluado = urlParams.get('rut') || datosUsuario.rut || localStorage.getItem('sensometrika_rut') || '12345678-K';
        const cleanRut = rutEvaluado.replace(/[^0-9Kk]/g, '');

        // Generación / Persistencia del ID de Sesión Único por RUT
        let sessionId = urlParams.get('session') || localStorage.getItem(`sensometrika_active_session_${cleanRut}`);
        if (!sessionId || sessionId.trim() === '') {
            sessionId = `SESION_B2B_${cleanRut}_${Date.now()}`;
            localStorage.setItem(`sensometrika_active_session_${cleanRut}`, sessionId);
        }
        localStorage.setItem('sensometrika_session_activa', sessionId);

        // Guardar estado unificado
        const usuarioActualizado = {
            rut: rutEvaluado,
            nombre: rawNombre,
            cargo: rawCargo,
            empresa: rawEmpresa,
            plan: planActivo,
            session: sessionId
        };
        localStorage.setItem('sensometrika_datos_usuario', JSON.stringify(usuarioActualizado));
        localStorage.setItem('sensometrika_rut', rutEvaluado);
        localStorage.setItem('sensometrika_b2b_plan', planActivo);

        // 2. ACTUALIZAR INTERFAZ DE PERFIL
        document.getElementById('lblNombreTrabajador').textContent = decodeURIComponent(rawNombre).toUpperCase();
        document.getElementById('lblRutCargo').textContent = `RUT: ${rutEvaluado} | Cargo: ${decodeURIComponent(rawCargo)}`;
        document.getElementById('lblPlanBadge').textContent = `EVALUACIÓN B2B • PLAN ${planActivo}`;

        // Foto Biométrica si existe
        const fotoGuardada = localStorage.getItem(`sensometrika_foto_${cleanRut}_${sessionId}`) || 
                             localStorage.getItem(`sensometrika_foto_${cleanRut}`) || 
                             localStorage.getItem('sensometrika_foto_identidad');
        if (fotoGuardada && fotoGuardada.length > 50) {
            document.getElementById('imgAvatar').src = fotoGuardada;
        }

        // 3. MATRIZ DEFINITIVA DE LOS 8 MÓDULOS Y SUS NIVELES DE ACCESO
        const matrizModulos = [
            { key: 'reactimetro', title: '1. Reactímetro Simple ⚡', desc: 'Tiempo de respuesta lumínica y acústica en frenado.', archivo: 'reactimetro.html', minPlan: 'BASICO' },
            { key: 'palancas', title: '2. Test de Palancas Bimanual 🕹️', desc: 'Coordinación visomotora bimanual y seguimiento de traza.', archivo: 'palancas.html', minPlan: 'BASICO' },
            { key: 'punteo', title: '3. Punteo Viso-Motriz 🎯', desc: 'Punteo rítmico y precisión de impacto temporal.', archivo: 'punteo.html', minPlan: 'BASICO' },
            { key: 'audicion', title: '4. Tamizaje Auditivo Ocupacional 📢', desc: 'Audiometría tonal en frecuencias conversacionales.', archivo: 'audicion.html', minPlan: 'PLUS' },
            { key: 'visual', title: '5. Tamizaje Visual Integral 👁️', desc: 'Agudeza visual lejana/cercana y Test Ishihara.', archivo: 'visual.html', minPlan: 'PLUS' },
            { key: 'anticipacion', title: '6. Velocidad de Anticipación ⏱️', desc: 'Cálculo de trayectorias en zonas ciegas.', archivo: 'anticipacion.html', minPlan: 'FULL' },
            { key: 'estereopsis', title: '7. Estereopsis & Profundidad 3D 📐', desc: 'Percepción espacial binocular.', archivo: 'estereopsis.html', minPlan: 'FULL' },
            { key: 'fatiga', title: '8. Control Fatiga & Vigilancia (PVT) 🥱', desc: 'Detección de somnolencia y micro-sueños.', archivo: 'fatiga.html', minPlan: 'FULL' }
        ];

        // Función para validar si el plan actual otorga permiso al módulo
        function tieneAccesoPlan(minPlanRequerido) {
            if (planActivo === 'FULL') return true;
            if (planActivo === 'PLUS' && (minPlanRequerido === 'BASICO' || minPlanRequerido === 'PLUS')) return true;
            if (planActivo === 'BASICO' && minPlanRequerido === 'BASICO') return true;
            return false;
        }

        // Función para verificar ejecución en localStorage
        function moduloFueEjecutado(nombreModulo) {
            if (!cleanRut || !sessionId) return false;
            return (
                localStorage.getItem(`sensometrika_${nombreModulo}_${cleanRut}_${sessionId}`) !== null ||
                localStorage.getItem(`sensometrika_${nombreModulo}_${cleanRut}`) !== null ||
                localStorage.getItem(`sensometrika_last_${nombreModulo}_${cleanRut}_${sessionId}`) !== null
            );
        }

        // 4. RENDERS DE LA PARRILLA DE MÓDULOS SEGÚN PERMISOS
        function renderizarParrillaDinamica() {
            const contenedor = document.getElementById('contenedorParrillaModulos');
            contenedor.innerHTML = '';

            matrizModulos.forEach(mod => {
                const permitido = tieneAccesoPlan(mod.minPlan);
                const ejecutado = moduloFueEjecutado(mod.key);

                const itemDiv = document.createElement('div');
                itemDiv.className = `modulo-item ${permitido ? '' : 'lock'}`;

                let slotHtml = '';

                if (!permitido) {
                    slotHtml = `<div><span class="btn-status-lock">🔒 NO INCLUIDO EN PLAN ${planActivo}</span></div>`;
                } else if (ejecutado) {
                    slotHtml = `<div><div class="btn-status-ejecutado">✓ EJECUTADO (1/1)</div></div>`;
                } else {
                    slotHtml = `<div><button class="btn-status-iniciar" onclick="navegarAModulo('${mod.archivo}')">INICIAR →</button></div>`;
                }

                itemDiv.innerHTML = `
                    <div class="modulo-info">
                        <span class="modulo-titulo">${mod.title}</span>
                        <span class="modulo-desc">${ejecutado ? 'Evaluación B2B finalizada correctamente.' : mod.desc}</span>
                    </div>
                    ${slotHtml}
                `;

                contenedor.appendChild(itemDiv);
            });
        }

        // 5. NAVEGACIÓN SEGURA DE MÓDULOS PROPAGANDO PARÁMETROS
        function navegarAModulo(archivoModulo) {
            const params = new URLSearchParams({
                rut: rutEvaluado,
                nombre: rawNombre,
                cargo: rawCargo,
                empresa: rawEmpresa,
                plan: planActivo,
                session: sessionId,
                mode: 'b2b'
            });
            window.location.href = `${archivoModulo}?${params.toString()}`;
        }

        // 6. NAVEGACIÓN AL INFORME PERICIAL B2B
        function navegarAInforme() {
            const params = new URLSearchParams({
                rut: rutEvaluado,
                nombre: rawNombre,
                cargo: rawCargo,
                empresa: rawEmpresa,
                plan: planActivo,
                session: sessionId,
                mode: 'b2b'
            });
            window.location.href = `informe_b2b_planes.html?${params.toString()}`;
        }

        // Inicialización al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            renderizarParrillaDinamica();
        });
    </script>
</body>
</html>
