<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Test de Palancas Bimanual (DS 170)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #040810;
      --card-bg: #091120;
      --border-color: #132238;
      --accent-cyan: #00bfff;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 12px 10px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-nav-back {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--accent-cyan);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .badge-fase {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      background: rgba(0, 191, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .canvas-card {
      background: #020617;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    canvas {
      background: #050b14;
      border: 1px solid #1e293b;
      border-radius: 10px;
      width: 100%;
      height: 200px;
      touch-action: none;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .btn-palanca {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.75rem;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-palanca:active {
      background: var(--accent-cyan);
      color: #000;
    }

    .telemetry-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      background: #050a14;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      font-size: 0.62rem;
    }

    .tel-val { font-size: 0.85rem; font-weight: 900; color: #fff; }

    .btn-action-main {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 0.80rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 191, 255, 0.35);
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="header-bar">
      <button class="btn-nav-back" onclick="volverAlMenu()">← MENÚ PRUEBAS</button>
      <span class="badge-fase" id="lblBadgeFase">🟡 DEMO: INDUCCIÓN (20 s)</span>
    </div>

    <!-- CANVAS DEL LABERINTO -->
    <div class="canvas-card">
      <canvas id="canvasPalancas" width="360" height="200"></canvas>
    </div>

    <!-- BOTONES MULTITÁCTILES BIMANUALES -->
    <div class="controls-grid">
      <button class="btn-palanca" id="btnIzq">◀ MANO IZQ (X)</button>
      <button class="btn-palanca" id="btnDer">MANO DER (Y) ▶</button>
    </div>

    <!-- PANEL DE TELEMETRÍA -->
    <div class="telemetry-row">
      <div>
        <span style="color: var(--text-muted);">TIEMPO</span>
        <div class="tel-val" id="txtTiempo">20 s</div>
      </div>
      <div>
        <span style="color: var(--text-muted);">CONTACTOS</span>
        <div class="tel-val" style="color: var(--accent-red);" id="txtToques">0</div>
      </div>
      <div>
        <span style="color: var(--text-muted);">EFECTIVIDAD</span>
        <div class="tel-val" style="color: var(--accent-green);" id="txtEfectividad">100%</div>
      </div>
    </div>

    <button type="button" id="btnIniciarAccion" onclick="iniciarFase()" class="btn-action-main">
      INICIAR ENSAYO DEMO (20 s)
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let datosUsuario = {};
    try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch(e){}

    const rawRut = urlParams.get('rut') || datosUsuario.rut || localStorage.getItem('sensometrika_rut') || '12345678-K';
    const rawNombre = urlParams.get('nombre') || datosUsuario.nombre || localStorage.getItem('sensometrika_nombre') || '';
    const rawCargo = urlParams.get('cargo') || datosUsuario.cargo || localStorage.getItem('sensometrika_cargo') || '';
    const rawEmpresa = urlParams.get('empresa') || datosUsuario.empresa || localStorage.getItem('sensometrika_b2b_empresa') || '';
    const planActivo = (urlParams.get('plan') || localStorage.getItem('sensometrika_b2b_plan') || 'BASICO').toUpperCase();
    const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_B2B_${Date.now()}`;
    const cleanRut = rawRut.replace(/[^0-9Kk]/g, '');

    const canvas = document.getElementById('canvasPalancas');
    const ctx = canvas.getContext('2d');

    let faseActual = 'DEMO'; // 'DEMO', 'ESPERA_OFICIAL', 'OFICIAL', 'FINALIZADO'
    let enEjecucion = false;
    let tiempoRestante = 20;
    let timerInterval = null;

    let toques = 0;
    let tiempoErrorMs = 0;
    let enContacto = false;
    let ultimoMuestreo = 0;

    let puntero = { x: 35, y: 35, radio: 6.5, vel: 2.2 };
    let teclas = { izq: false, der: false };

    const CIRCUITO_DEMO = {
      tramos: [
        { x: 20, y: 20, w: 90, h: 30 },
        { x: 80, y: 20, w: 30, h: 100 },
        { x: 80, y: 90, w: 160, h: 30 },
        { x: 210, y: 90, w: 30, h: 90 },
        { x: 210, y: 150, w: 120, h: 30 }
      ],
      meta: { x: 300, y: 150, w: 25, h: 30 }
    };

    const CIRCUITO_OFICIAL = {
      tramos: [
        { x: 20, y: 20, w: 300, h: 28 },
        { x: 290, y: 20, w: 30, h: 90 },
        { x: 130, y: 82, w: 190, h: 28 },
        { x: 130, y: 82, w: 30, h: 90 },
        { x: 20, y: 144, w: 140, h: 28 },
        { x: 20, y: 144, w: 30, h: 46 }
      ],
      meta: { x: 20, y: 165, w: 30, h: 25 }
    };

    let circuito = CIRCUITO_DEMO;

    document.addEventListener('DOMContentLoaded', () => {
      dibujar();
      configurarControlesTactiLes();
    });

    function iniciarFase() {
      if (faseActual === 'DEMO') {
        comenzarEvaluacion(20);
      } else if (faseActual === 'ESPERA_OFICIAL') {
        faseActual = 'OFICIAL';
        circuito = CIRCUITO_OFICIAL;
        puntero.x = 35; puntero.y = 35;
        document.getElementById('lblBadgeFase').textContent = "🔴 SIMULACIÓN OFICIAL B2B (1/1)";
        document.getElementById('lblBadgeFase').style.color = "#10b981";
        document.getElementById('lblBadgeFase').style.borderColor = "#10b981";
        comenzarEvaluacion(60);
      }
    }

    function comenzarEvaluacion(duracion) {
      enEjecucion = true;
      tiempoRestante = duracion;
      toques = 0;
      tiempoErrorMs = 0;
      enContacto = false;
      ultimoMuestreo = performance.now();

      document.getElementById('btnIniciarAccion').style.display = 'none';
      document.getElementById('txtTiempo').textContent = `${tiempoRestante} s`;
      document.getElementById('txtToques').textContent = '0';
      document.getElementById('txtEfectividad').textContent = '100%';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        tiempoRestante--;
        document.getElementById('txtTiempo').textContent = `${tiempoRestante} s`;
        if (tiempoRestante <= 0) {
          finalizarFase(false);
        }
      }, 1000);

      requestAnimationFrame(bucleJuego);
    }

    function bucleJuego() {
      if (!enEjecucion) return;

      const ahora = performance.now();
      
      // Movimiento bimanual
      if (teclas.izq) puntero.x -= puntero.vel;
      if (teclas.der) puntero.y += puntero.vel;

      // Limites del Canvas
      puntero.x = Math.max(puntero.radio, Math.min(canvas.width - puntero.radio, puntero.x));
      puntero.y = Math.max(puntero.radio, Math.min(canvas.height - puntero.radio, puntero.y));

      // Colisión con la pista
      const dentro = estaDentroDePista(puntero.x, puntero.y);
      if (!dentro) {
        if (!enContacto) {
          enContacto = true;
          toques++;
          document.getElementById('txtToques').textContent = toques;
          if ('vibrate' in navigator) navigator.vibrate(30);
        }
        tiempoErrorMs += (ahora - ultimoMuestreo);
      } else {
        enContacto = false;
      }
      ultimoMuestreo = ahora;

      const penalizacion = (toques * 4) + Math.round((tiempoErrorMs / 1000) * 3);
      const efectividad = Math.max(10, Math.min(100, 100 - penalizacion));
      document.getElementById('txtEfectividad').textContent = `${efectividad}%`;

      // Llegada a la meta
      const m = circuito.meta;
      if (puntero.x >= m.x && puntero.x <= m.x + m.w && puntero.y >= m.y && puntero.y <= m.y + m.h) {
        finalizarFase(true);
        return;
      }

      dibujar();
      requestAnimationFrame(bucleJuego);
    }

    function estaDentroDePista(x, y) {
      return circuito.tramos.some(t => (
        x - puntero.radio >= t.x &&
        x + puntero.radio <= t.x + t.w &&
        y - puntero.radio >= t.y &&
        y + puntero.radio <= t.y + t.h
      ));
    }

    function finalizarFase(alcanzoMeta) {
      enEjecucion = false;
      clearInterval(timerInterval);

      const penalizacion = (toques * 4) + Math.round((tiempoErrorMs / 1000) * 3);
      const efectividadFinal = Math.max(10, Math.min(100, 100 - penalizacion));

      if (faseActual === 'DEMO') {
        faseActual = 'ESPERA_OFICIAL';
        const btn = document.getElementById('btnIniciarAccion');
        btn.style.display = 'block';
        btn.style.background = '#10b981';
        btn.textContent = 'INICIAR SIMULACIÓN OFICIAL B2B (1/1) →';
        alert(`Inducción finalizada (${toques} contactos). Presione el botón verde para rendir la simulación oficial.`);
      } else {
        faseActual = 'FINALIZADO';
        
        // Guardar resultado oficial en localStorage
        const resultadoMod = {
          efectividad: efectividadFinal,
          score: efectividadFinal,
          toques: toques,
          precision: efectividadFinal,
          aprobado: efectividadFinal >= 75,
          fecha: new Date().toISOString()
        };

        localStorage.setItem(`sensometrika_palancas_${cleanRut}_${sessionId}`, JSON.stringify(resultadoMod));
        localStorage.setItem(`sensometrika_last_palancas_${cleanRut}_${sessionId}`, JSON.stringify(resultadoMod));
        localStorage.setItem('sensometrika_palancas', JSON.stringify(resultadoMod));

        volverAlMenu();
      }
    }

    function dibujar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Pista
      ctx.fillStyle = '#0f172a';
      circuito.tramos.forEach(t => ctx.fillRect(t.x, t.y, t.w, t.h));

      // Meta
      ctx.fillStyle = '#10b981';
      ctx.fillRect(circuito.meta.x, circuito.meta.y, circuito.meta.w, circuito.meta.h);

      // Puntero
      ctx.beginPath();
      ctx.arc(puntero.x, puntero.y, puntero.radio, 0, Math.PI * 2);
      ctx.fillStyle = enContacto ? '#ef4444' : '#00bfff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }

    function configurarControlesTactiLes() {
      const btnIzq = document.getElementById('btnIzq');
      const btnDer = document.getElementById('btnDer');

      const vincular = (btn, prop) => {
        const on = (e) => { e.preventDefault(); teclas[prop] = true; };
        const off = (e) => { e.preventDefault(); teclas[prop] = false; };
        btn.addEventListener('touchstart', on, { passive: false });
        btn.addEventListener('touchend', off);
        btn.addEventListener('mousedown', on);
        btn.addEventListener('mouseup', off);
      };

      vincular(btnIzq, 'izq');
      vincular(btnDer, 'der');
    }

    function volverAlMenu() {
      const paramsRetorno = new URLSearchParams({
        rut: rawRut,
        nombre: rawNombre,
        cargo: rawCargo,
        empresa: rawEmpresa,
        plan: planActivo,
        session: sessionId,
        mode: 'b2b'
      });
      window.location.href = `menu_b2b_planes.html?${paramsRetorno.toString()}`;
    }
  </script>
</body>
</html>
