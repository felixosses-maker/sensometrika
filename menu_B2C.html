<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Menú de Evaluaciones Adaptativo</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111625;
      --card-border: #1e2638;
      --accent-blue: #00a8e8;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-white: #ffffff;
      --text-muted: #9aa0a6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 540px; margin: 0 auto; }

    .brand-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .brand-logo-img {
      width: 210px;
      max-width: 80%;
      height: auto;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
    }

    .b2b-header-banner {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent-green);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      text-align: center;
    }

    .b2b-banner-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .b2b-banner-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .locked-session-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--accent-red);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      text-align: center;
      color: var(--accent-red);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .modules-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .module-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .module-card.completed-card {
      border-color: var(--accent-green);
      background: rgba(16, 185, 129, 0.05);
    }

    .module-details { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .module-title { font-size: 0.88rem; font-weight: 700; color: #ffffff; }
    .module-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; }

    .btn-start {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-start.done {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .btn-report {
      width: 100%;
      background: var(--accent-green);
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
    }

    .btn-report:disabled {
      background: #1e2638;
      color: #6b7280;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="brand-header">
      <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
      <span style="color:var(--accent-cyan); font-size:0.75rem; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;">
        MENÚ DE EVALUACIONES MULTI-PLAN
      </span>
    </header>

    <div class="b2b-header-banner">
      <div id="b2bPlanTitle" class="b2b-banner-title">🏢 EVALUACIÓN B2B EN CURSO</div>
      <div id="b2bSubInfo" class="b2b-banner-sub">Acreditación D.S. N° 170</div>
    </div>

    <div id="bannerBurned" class="locked-session-banner">
      🔒 EVALUACIÓN FINALIZADA Y TRANSMITIDA AL APR. SESIÓN BLOQUEADA.
    </div>

    <!-- Lista Dinámica de Módulos según Plan -->
    <div class="modules-container" id="listaModulosContainer">
      <!-- Carga vía JavaScript -->
    </div>

    <button id="btnReport" class="btn-report" disabled onclick="finalizarYVerInforme()">
      📊 FINALIZAR Y ENVIAR INFORME AL APR
    </button>
  </div>

  <script>
    let isBurnedSession = false;
    let planActual = 'BASICO'; // 'BASICO', 'PLUS', 'FULL', 'ALTO_RIESGO'

    // Catálogo Máster de Módulos Sensometrika estandarizado con la tarifa B2B
    const catalogoModulos = [
      { id: 1, titulo: '1. Reactímetro (Tiempo Frenado)', desc: 'Medición de velocidad de respuesta en frenado.', url: 'reactimetro.html', planes: ['BASICO', 'PLUS', 'FULL', 'ALTO_RIESGO'] },
      { id: 2, titulo: '2. Palancas (Coordinación Bimanual)', desc: 'Coordinación motriz fina con ambas manos en ruta.', url: 'palancas.html', planes: ['BASICO', 'PLUS', 'FULL', 'ALTO_RIESGO'] },
      { id: 3, titulo: '3. Punteo (Ritmo Viso-Motriz)', desc: 'Estabilidad de ritmo y precisión de impacto.', url: 'punteo.html', planes: ['BASICO', 'PLUS', 'FULL', 'ALTO_RIESGO'] },
      { id: 4, titulo: '4. Tamizaje Auditivo Ocupacional', desc: 'Detección de umbrales auditivos en frecuencias críticas.', url: 'auditivo.html', planes: ['PLUS', 'FULL', 'ALTO_RIESGO'] },
      { id: 5, titulo: '5. Tamizaje Visual Integral', desc: 'Agudeza visual, visión nocturna y encandilamiento.', url: 'visual.html', planes: ['FULL', 'ALTO_RIESGO'] },
      { id: 6, titulo: '6. Estereopsis 3D', desc: 'Percepción espacial y profundidad binocular.', url: 'estereopsis.html', planes: ['ALTO_RIESGO'] },
      { id: 7, titulo: '7. Velocidad de Anticipación', desc: 'Cálculo espacio-temporal de trayectorias.', url: 'anticipacion.html', planes: ['ALTO_RIESGO'] },
      { id: 8, titulo: '8. Resistencia a la Fatiga (PVT)', desc: 'Control de vigilancia y lapsos atencionales.', url: 'fatiga.html', planes: ['ALTO_RIESGO'] }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rut = urlParams.get('rut') || localStorage.getItem('sensometrika_b2b_rut');
      
      // Mapeo exacto del plan contratado
      const planUrl = (urlParams.get('plan') || localStorage.getItem('sensometrika_plan_contratado') || 'BASICO').toUpperCase();
      
      if (planUrl.includes('RIESGO') || planUrl.includes('ALTO')) {
        planActual = 'ALTO_RIESGO';
        document.getElementById('b2bPlanTitle').innerText = '🏢 EVALUACIÓN B2B • BATERÍA INTEGRAL DE ALTO RIESGO';
      } else if (planUrl.includes('FULL')) {
        planActual = 'FULL';
        document.getElementById('b2bPlanTitle').innerText = '🏢 EVALUACIÓN B2B • PLAN FULL INTEGRAL';
      } else if (planUrl.includes('PLUS')) {
        planActual = 'PLUS';
        document.getElementById('b2bPlanTitle').innerText = '🏢 EVALUACIÓN B2B • PLAN PLUS';
      } else {
        planActual = 'BASICO';
        document.getElementById('b2bPlanTitle').innerText = '🏢 EVALUACIÓN B2B • PLAN BÁSICO LABORAL';
      }

      if (rut) {
        document.getElementById('b2bSubInfo').innerText = `Evaluado: ${decodeURIComponent(rut)} · Acreditación Aprobada`;
      }

      isBurnedSession = (urlParams.get('burned') === 'true' || localStorage.getItem('sensometrika_session_burned') === 'true');

      renderizarModulosAdaptativos();
    });

    function renderizarModulosAdaptativos() {
      if (isBurnedSession) {
        document.getElementById('bannerBurned').style.display = 'block';
      }

      const container = document.getElementById('listaModulosContainer');
      container.innerHTML = '';

      const rendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || [];

      // Filtrar catálogo por el plan contratado
      const modulosHabilitados = catalogoModulos.filter(m => m.planes.includes(planActual));

      modulosHabilitados.forEach(mod => {
        const estaRendido = rendidos.includes(mod.id);

        const card = document.createElement('div');
        card.className = `module-card ${estaRendido ? 'completed-card' : ''}`;

        card.innerHTML = `
          <div class="module-details">
            <span class="module-title">${mod.titulo}</span>
            <span class="module-desc">${mod.desc}</span>
          </div>
          <button class="btn-start ${estaRendido ? 'done' : ''}" 
                  ${(estaRendido || isBurnedSession) ? 'disabled' : ''} 
                  onclick="iniciarModulo('${mod.url}')">
            ${estaRendido ? 'RENDIDO ✓' : 'INICIAR →'}
          </button>
        `;

        container.appendChild(card);
      });

      // Validar término
      const btnReport = document.getElementById('btnReport');
      const todosCompletados = modulosHabilitados.every(m => rendidos.includes(m.id));

      if (todosCompletados && !isBurnedSession) {
        btnReport.disabled = false;
      } else {
        btnReport.disabled = true;
      }
    }

    function iniciarModulo(urlHtml) {
      if (isBurnedSession) return;
      const token = localStorage.getItem('sensometrika_b2b_token') || '';
      const rut = localStorage.getItem('sensometrika_b2b_rut') || '';
      window.location.href = `${urlHtml}?token=${token}&rut=${rut}&plan=${planActual}`;
    }

    function finalizarYVerInforme() {
      const token = localStorage.getItem('sensometrika_b2b_token') || '';
      const rut = localStorage.getItem('sensometrika_b2b_rut') || '';
      window.location.href = `informe-b2b.html?token=${token}&rut=${rut}&plan=${planActual}&autoSend=true`;
    }
  </script>
</body>
</html>
