<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Calibración de Latencia Hardware</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
        .brand-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .brand-logo-img { width: 180px; height: auto; mix-blend-mode: lighten; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45)); }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }

        .tap-zone {
            background: #070d17;
            border: 2px dashed var(--accent-cyan);
            border-radius: 12px;
            padding: 30px 15px;
            cursor: pointer;
            transition: all 0.15s ease;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tap-zone:active {
            background: rgba(56, 189, 248, 0.15);
            transform: scale(0.98);
        }

        .grid-toques {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .toque-pill {
            background: #070d17;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 2px;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .toque-active {
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
            background: rgba(16, 185, 129, 0.1) !important;
        }

        .btn-confirm {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 900;
            font-size: 0.85rem;
            width: 100%;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            display: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
        </header>

        <div class="card-box">
            <div class="text-sm font-bold text-white uppercase flex items-center justify-center gap-2">
                ⚙ CALIBRACIÓN DE HARDWARE (5 TOQUES)
            </div>
            
            <p class="text-xs text-slate-400">
                Presiona la zona central 5 veces de forma seguida. Se promediarán los toques 2, 3 y 4 para descontar la latencia de tu pantalla.
            </p>

            <div id="tapZone" class="tap-zone" onclick="registrarToque()">
                <div id="lblInstruccion" class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-2">
                    PRESIONA AQUÍ O ESPACIO (TOQUE 1/5)
                </div>
                <div id="lblValorCentral" class="text-3xl font-black text-white">-- ms</div>
            </div>

            <div class="grid-toques">
                <div id="pill1" class="toque-pill"><span class="text-[9px] text-slate-500">T1 (DESC)</span><strong id="valT1">--</strong></div>
                <div id="pill2" class="toque-pill"><span class="text-[9px] text-slate-500">T2 (OK)</span><strong id="valT2">--</strong></div>
                <div id="pill3" class="toque-pill"><span class="text-[9px] text-slate-500">T3 (OK)</span><strong id="valT3">--</strong></div>
                <div id="pill4" class="toque-pill"><span class="text-[9px] text-slate-500">T4 (OK)</span><strong id="valT4">--</strong></div>
                <div id="pill5" class="toque-pill"><span class="text-[9px] text-slate-500">T5 (DESC)</span><strong id="valT5">--</strong></div>
            </div>

            <button id="btnConfirmar" class="btn-confirm" onclick="guardarYVolver()">
                INGRESAR AL MENÚ DE MÓDULOS →
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let toques = [];
        let inicioToque = 0;
        let promedioFinalMs = 0;

        // Iniciar la marca de tiempo al cargar
        window.addEventListener('DOMContentLoaded', () => {
            inicioToque = performance.now();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                registrarToque();
            }
        });

        function registrarToque() {
            if (toques.length >= 5) return;

            const ahora = performance.now();
            const diff = Math.round(ahora - inicioToque);
            inicioToque = ahora;

            // Si es el primer toque, asignamos un valor base de calibración de hardware estándar (ej. 25ms)
            let latenciaMedida = (toques.length === 0) ? 25 : Math.min(60, Math.max(15, diff));
            toques.push(latenciaMedida);

            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            const idx = toques.length;
            
            if (idx > 0) {
                document.getElementById(`valT${idx}`).textContent = `${toques[idx-1]}ms`;
                document.getElementById(`pill${idx}`).classList.add('toque-active');
            }

            if (idx < 5) {
                document.getElementById('lblInstruccion').textContent = `PRESIONA AQUÍ O ESPACIO (TOQUE ${idx + 1}/5)`;
                document.getElementById('lblValorCentral').textContent = `${toques[idx-1]} ms`;
            } else {
                // Promedio estricto de los toques centrales T2, T3 y T4
                promedioFinalMs = Math.round((toques[1] + toques[2] + toques[3]) / 3);
                
                document.getElementById('lblInstruccion').textContent = `✓ CALIBRACIÓN COMPLETADA`;
                document.getElementById('lblValorCentral').textContent = `${promedioFinalMs} ms`;
                document.getElementById('lblValorCentral').classList.add('text-sky-400');
                
                document.getElementById('tapZone').style.pointerEvents = 'none';
                document.getElementById('btnConfirmar').style.display = 'block';
            }
        }

        function guardarYVolver() {
            if (promedioFinalMs <= 0) promedioFinalMs = 25;

            // Guardar en localStorage para trazabilidad del informe pericial
            localStorage.setItem('sensometrika_latencia_ms', promedioFinalMs);
            localStorage.setItem('latencia_ms', promedioFinalMs);
            localStorage.setItem('sensometrika_latencia_promedio', promedioFinalMs);

            // Retornar al menú B2B conservando todos los parámetros de la URL
            const menuDestino = 'menu_B2B.html';
            const targetUrl = new URL(menuDestino, window.location.origin);
            urlParams.forEach((val, key) => {
                targetUrl.searchParams.set(key, val);
            });

            window.location.href = targetUrl.toString();
        }
    </script>
</body>
</html>
