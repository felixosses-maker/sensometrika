<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Menú Psicosensométrico</title>
  <style>
    :root {
      --bg-main: #040810;
      --bg-card: #091120;
      --bg-surface: #0f172a;
      --border-subtle: #1e293b;
      --border-active: #38bdf8;
      --accent-cyan: #00e5ff;
      --accent-sky: #38bdf8;
      --accent-green: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px 36px;
    }

    .app-shell {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-bottom: 10px;
      border-bottom: 1px solid #152238;
      text-align: center;
    }

    .logo-frame {
      width: 100%;
      max-width: 240px;
      background: #060d1d;
      border: 1px solid #15263d;
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
      overflow: hidden;
    }

    .brand-logo-img {
      width: 100%;
      max-height: 76px;
      object-fit: contain;
      display: block;
      mix-blend-mode: lighten;
    }

    .brand-sub {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.1px;
      color: var(--accent-sky);
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .pill-env {
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: var(--accent-cyan);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .btn-mini {
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid #293952;
      border-radius: 9px;
      padding: 7px 11px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-mini:hover {
      border-color: var(--border-active);
      color: var(--text-primary);
    }

    .profile-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-box {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid var(--accent-cyan);
      background: var(--bg-surface);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.9rem;
      color: var(--accent-cyan);
      flex-shrink: 0;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .profile-empresa {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--accent-sky);
      text-transform: uppercase;
    }

    .profile-nombre {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .mod-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mod-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.08s ease;
      text-decoration: none;
      color: inherit;
    }

    .mod-card:hover {
      border-color: var(--accent-cyan);
    }

    .mod-card:active {
      transform: scale(0.99);
    }

    .mod-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mod-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .mod-desc {
      font-size: 0.76rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .mod-badge {
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .mod-badge.go {
      background: rgba(0, 229, 255, 0.14);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 229, 255, 0.4);
    }

    .mod-badge.done {
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }

    .btn-informe {
      width: 100%;
      min-height: 50px;
      background: var(--accent-green);
      color: #ffffff;
      border: none;
      border-radius: 13px;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-informe:hover {
      filter: brightness(1.06);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="brand-header">
      <div class="logo-frame">
        <img id="logoSensometrikaImg" src="../sensometrika.jpg" alt="SENSOMETRIKA Calibration Technology" class="brand-logo-img">
      </div>
      <span class="brand-sub">Batería Psicosensométrica · Entorno Cerrado</span>
    </header>

    <div class="top-actions">
      <a href="psico_verificacion_trabajador.html" id="linkVolverVerif" class="btn-mini">← Volver</a>
      <span class="pill-env">PSICOSENSOMÉTRICO</span>
      <button type="button" id="btnReiniciarSesion" class="btn-mini">↻ Reiniciar</button>
    </div>

    <section class="profile-card">
      <div class="avatar-box" id="avatarBox">SMK</div>
      <div class="profile-meta">
        <span class="profile-empresa" id="lblEmpresa">EMPRESA MANDANTE</span>
        <strong class="profile-nombre" id="lblNombre">EVALUADO</strong>
        <span class="profile-sub" id="lblRutCargo">RUT: -- | Cargo: --</span>
      </div>
    </section>

    <section class="mod-list" id="listaModulos"></section>

    <button type="button" id="btnVerInforme" class="btn-informe">📊 Ver Informe Pericial →</button>
  </div>

  <script>
    (function () {
      const logoImg = document.getElementById("logoSensometrikaImg");
      const candidatosLogo = ["../sensometrika.jpg", "sensometrika.jpg", "../sensometrica.jpg", "sensometrica.jpg"];
      let idxLogo = 0;
      logoImg.addEventListener("error", () => {
        idxLogo++;
        if (idxLogo < candidatosLogo.length) logoImg.src = candidatosLogo[idxLogo];
        else logoImg.style.display = "none";
      });

      function parseJsonSafe(raw) {
        if (!raw) return null;
        try { return JSON.parse(raw); } catch (e) { return null; }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const datosUsuario = parseJsonSafe(localStorage.getItem("sensometrika_datos_usuario")) || {};

      const nombre = decodeURIComponent(urlParams.get("nombre") || datosUsuario.nombre || localStorage.getItem("sensometrika_nombre") || "Evaluado");
      const rut = decodeURIComponent(urlParams.get("rut") || datosUsuario.rut || localStorage.getItem("sensometrika_rut") || "--");
      const cargo = decodeURIComponent(urlParams.get("cargo") || datosUsuario.cargo || localStorage.getItem("sensometrika_cargo") || "Operador");
      const empresa = decodeURIComponent(urlParams.get("empresa") || datosUsuario.empresa || localStorage.getItem("sensometrika_b2b_empresa") || "Empresa Mandante");
      const cleanRut = rut.replace(/[^0-9Kk]/g, "");

      let sessionId = urlParams.get("session") || datosUsuario.session || localStorage.getItem("sensometrika_session_activa") || "";
      if (!sessionId) {
        sessionId = `SESION_PSICO_${cleanRut || "EVAL"}_${Date.now()}`;
        localStorage.setItem("sensometrika_session_activa", sessionId);
      } else if (sessionId.startsWith("SESION_B2B_")) {
        sessionId = sessionId.replace(/^SESION_B2B_/, "SESION_PSICO_");
      }

      const qsBase = `?nombre=${encodeURIComponent(nombre)}&rut=${encodeURIComponent(rut)}&cargo=${encodeURIComponent(cargo)}&empresa=${encodeURIComponent(empresa)}&session=${encodeURIComponent(sessionId)}`;
      document.getElementById("linkVolverVerif").href = `psico_verificacion_trabajador.html${qsBase}`;

      document.getElementById("lblEmpresa").textContent = empresa.toUpperCase();
      document.getElementById("lblNombre").textContent = nombre.toUpperCase();
      document.getElementById("lblRutCargo").textContent = `RUT: ${rut} | Cargo: ${cargo}`;

      const fotoData = datosUsuario.foto || localStorage.getItem(`sensometrika_foto_${cleanRut}`) || localStorage.getItem("sensometrika_foto_trabajador");
      const avatarBox = document.getElementById("avatarBox");
      if (fotoData && fotoData.startsWith("data:image")) {
        avatarBox.innerHTML = `<img src="${fotoData}" alt="${nombre}">`;
      }

      // Leer estado solo si corresponde a este RUT/sesión
      const rendidosKey = cleanRut ? `sensometrika_modulos_rendidos_${cleanRut}_${sessionId}` : "";
      let rendidos = (rendidosKey && parseJsonSafe(localStorage.getItem(rendidosKey))) || parseJsonSafe(localStorage.getItem("sensometrika_modulos_rendidos")) || {};

      function tieneDatoDeSesion(baseKeys) {
        for (const base of baseKeys) {
          if (cleanRut && sessionId) {
            const dSes = parseJsonSafe(localStorage.getItem(`${base}_${cleanRut}_${sessionId}`));
            if (dSes && (dSes.estado === "completado" || dSes.completado === true || dSes.promedioMs || dSes.promedioTiempo || dSes.efectividad !== undefined || dSes.precision !== undefined || dSes.toques !== undefined || dSes.latenciaPromedioMs || dSes.lapsos !== undefined)) {
              return true;
            }
          }
        }
        return false;
      }

      const MODULOS = [
        {
          id: "reactimetro",
          num: "1",
          titulo: "Reactímetro Avanzado",
          desc: "Tiempo de reacción lumínica y frenado ante estímulos aleatorios.",
          archivo: "psico_reactimetro_avanzado.html",
          completado: Boolean(rendidos.reactimetro) || tieneDatoDeSesion(["sensometrika_reactimetro_avanzado", "sensometrika_reactimetro"])
        },
        {
          id: "palancas",
          num: "2",
          titulo: "Palancas (Coordinación Bimanual)",
          desc: "Coordinación motriz fina con disociación de ejes en pista continua.",
          archivo: "palancas.html",
          completado: Boolean(rendidos.palancas) || tieneDatoDeSesion(["sensometrika_palancas", "sensometrika_psico_palancas"])
        },
        {
          id: "punteo",
          num: "3",
          titulo: "Punteo y Ritmo Visomotriz",
          desc: "Sincronía ojo-mano y precisión de impacto en zona dorada.",
          archivo: "psico_punteo.html",
          completado: Boolean(rendidos.punteo) || tieneDatoDeSesion(["sensometrika_punteo", "sensometrika_psico_punteo"])
        },
        {
          id: "vigilancia",
          num: "4",
          titulo: "Vigilancia y Fatiga (PVT)",
          desc: "Atención sostenida, dispersión (σ), lapsos y anticipaciones.",
          archivo: "psico_vigilancia.html",
          completado: Boolean(rendidos.vigilancia) || tieneDatoDeSesion(["sensometrika_vigilancia", "sensometrika_psico_vigilancia", "sensometrika_fatiga_pvt"])
        },
        {
          id: "test_factores",
          num: "5",
          titulo: "Factores Humanos y Conducta (28 Ítems)",
          desc: "Autocontrol, reacción ante errores, fatiga y apego a normas.",
          archivo: "psico_test.html",
          completado: Boolean(parseJsonSafe(localStorage.getItem("sensometrika_psico_test"))?.dimensiones)
        }
      ];

      const listaEl = document.getElementById("listaModulos");
      listaEl.innerHTML = MODULOS.map(m => {
        const sep = m.archivo.includes("?") ? "&" : "?";
        const href = `${m.archivo}${qsBase}${sep}mode=psico`;
        return `
          <a href="${href}" class="mod-card">
            <div class="mod-info">
              <span class="mod-title">${m.num}. ${m.titulo}</span>
              <span class="mod-desc">${m.desc}</span>
            </div>
            <span class="mod-badge ${m.completado ? "done" : "go"}">
              ${m.completado ? "✓ COMPLETADO" : "INICIAR →"}
            </span>
          </a>
        `;
      }).join("");

      document.getElementById("btnVerInforme").addEventListener("click", () => {
        window.location.href = `psico_informe.html${qsBase}`;
      });

      document.getElementById("btnReiniciarSesion").addEventListener("click", () => {
        [
          "sensometrika_reactimetro_avanzado",
          "sensometrika_reactimetro",
          "sensometrika_palancas",
          "sensometrika_punteo",
          "sensometrika_vigilancia",
          "sensometrika_fatiga_pvt",
          "sensometrika_psico_test",
          "sensometrika_modulos_rendidos"
        ].forEach(k => localStorage.removeItem(k));
        if (cleanRut && sessionId) {
          localStorage.removeItem(`sensometrika_modulos_rendidos_${cleanRut}_${sessionId}`);
        }
        const nuevaSes = `SESION_PSICO_${cleanRut || "EVAL"}_${Date.now()}`;
        localStorage.setItem("sensometrika_session_activa", nuevaSes);
        const qsNuevo = `?nombre=${encodeURIComponent(nombre)}&rut=${encodeURIComponent(rut)}&cargo=${encodeURIComponent(cargo)}&empresa=${encodeURIComponent(empresa)}&session=${encodeURIComponent(nuevaSes)}`;
        window.location.href = `psico_menu_b2b.html${qsNuevo}`;
      });
    })();
  </script>
</body>
</html>
