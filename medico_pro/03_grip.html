<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | M3: Dinamometría y Fuerza (Grip Pro Bilateral)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-gold: #e5b324;
            --accent-cyan: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            touch-action: none;
        }

        .main-container {
            width: 100%;
            max-width: 460px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .title-box { text-align: center; }
        .title-main { font-size: 0.95rem; font-weight: 900; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.5px; }
        .title-sub { font-size: 0.68rem; color: var(--text-muted); margin-top: 4px; }

        .timer-display {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            background: #04070d;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 100%;
            text-align: center;
            padding: 10px;
            letter-spacing: 2px;
        }

        .grip-pad-area {
            width: 100%;
            height: 180px;
            background: #04070d;
            border: 2px dashed var(--accent-gold);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .grip-zone {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            transition: background 0.1s;
        }

        .grip-zone:first-child { border-right: 1px dashed var(--card-border); }

        .active-touch {
            background: rgba(229, 179, 36, 0.25) !important;
        }

        .btn-start {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.85rem;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 11, 19, 0.9); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; padding: 24px; width: 90%; max-width: 360px;
            text-align: center; display: flex; flex-direction: column; gap: 14px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="title-box">
            <div class="title-main">M3: DINAMOMETRÍA & FUERZA (GRIP PRO) ✊</div>
            <div class="title-sub">Mantén presionados <strong>AMBOS LADOS</strong> de la pantalla simultáneamente durante los 20 segundos.</div>
        </div>

        <div class="timer-display" id="lblTimer">20s</div>

        <div id="gripPad" class="grip-pad-area">
            <div id="zoneLeft" class="grip-zone">
                <span style="font-size: 1.5rem;">👈</span>
                <span style="font-size: 0.72rem; font-weight: 800; color: var(--accent-gold); margin-top: 4px;">ZONA IZQUIERDA</span>
                <span id="statusLeft" style="font-size: 0.62rem; color: var(--text-muted);">Sin contacto</span>
            </div>
            <div id="zoneRight" class="grip-zone">
                <span style="font-size: 1.5rem;">👉</span>
                <span style="font-size: 0.72rem; font-weight: 800; color: var(--accent-gold); margin-top: 4px;">ZONA DERECHA</span>
                <span id="statusRight" style="font-size: 0.62rem; color: var(--text-muted);">Sin contacto</span>
            </div>
        </div>

        <button id="btnIniciar" onclick="iniciarPruebaGrip()" class="btn-start">INICIAR PRUEBA DE FUERZA (20s) →</button>
    </div>

    <div id="modalResultado" class="modal-overlay">
        <div class="modal-card">
            <div style="font-size: 1.1rem; font-weight: 900; color: #10b981;">PRUEBA COMPLETADA ✊</div>
            <div id="txtResumenGrip" style="font-size: 0.80rem; color: var(--text-main); line-height: 1.4;">Registrando telemetría...</div>
            <button onclick="finalizarYVolver()" style="background:#10b981; color:#000; border:none; padding:10px; border-radius:8px; font-weight:900; cursor:pointer; text-transform:uppercase;">GUARDAR Y VOLVER AL MENÚ</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const rut = urlParams.get('rut') || '12.345.678-K';
        const cleanRut = rut.replace(/[^0-9Kk]/g, '');
        const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || 'SESION_DEFAULT';

        let tiempoRestante = 20;
        let intervalo = null;
        let testActivo = false;
        let totalMuestras = 0;
        let muestrasExitosasDual = 0;

        const gripPad = document.getElementById('gripPad');
        const zoneLeft = document.getElementById('zoneLeft');
        const zoneRight = document.getElementById('zoneRight');
        const statusLeft = document.getElementById('statusLeft');
        const statusRight = document.getElementById('statusRight');

        function iniciarPruebaGrip() {
            document.getElementById('btnIniciar').style.display = 'none';
            tiempoRestante = 20;
            totalMuestras = 0;
            muestrasExitosasDual = 0;
            testActivo = true;

            document.getElementById('lblTimer').textContent = `${tiempoRestante}s`;

            intervalo = setInterval(() => {
                tiempoRestante--;
                document.getElementById('lblTimer').textContent = `${tiempoRestante}s`;

                if (tiempoRestante <= 0) {
                    clearInterval(intervalo);
                    terminarPrueba();
                }
            }, 1000);
        }

        gripPad.addEventListener('touchstart', procesarToques, { passive: false });
        gripPad.addEventListener('touchmove', procesarToques, { passive: false });
        gripPad.addEventListener('touchend', procesarToques, { passive: false });

        gripPad.addEventListener('mousedown', () => { if(testActivo) marcarDual(true, true); });
        gripPad.addEventListener('mouseup', () => { if(testActivo) marcarDual(false, false); });

        function procesarToques(e) {
            if (!testActivo) return;
            e.preventDefault();

            const rect = gripPad.getBoundingClientRect();
            const mitadAncho = rect.width / 2;

            let tocaIzquierda = false;
            let tocaDerecha = false;

            for (let i = 0; i < e.touches.length; i++) {
                const touchX = e.touches[i].clientX - rect.left;
                if (touchX < mitadAncho) tocaIzquierda = true;
                else tocaDerecha = true;
            }

            marcarDual(tocaIzquierda, tocaDerecha);
        }

        function marcarDual(izq, der) {
            totalMuestras++;
            if (izq) {
                zoneLeft.classList.add('active-touch');
                statusLeft.textContent = 'Presionando ✓';
                statusLeft.style.color = '#10b981';
            } else {
                zoneLeft.classList.remove('active-touch');
                statusLeft.textContent = 'Sin contacto';
                statusLeft.style.color = 'var(--text-muted)';
            }

            if (der) {
                zoneRight.classList.add('active-touch');
                statusRight.textContent = 'Presionando ✓';
                statusRight.style.color = '#10b981';
            } else {
                zoneRight.classList.remove('active-touch');
                statusRight.textContent = 'Sin contacto';
                statusRight.style.color = 'var(--text-muted)';
            }

            if (izq && der) {
                muestrasExitosasDual++;
            }
        }

        function terminarPrueba() {
            testActivo = false;
            zoneLeft.classList.remove('active-touch');
            zoneRight.classList.remove('active-touch');

            const porcentajeSimetria = totalMuestras > 0 ? Math.round((muestrasExitosasDual / totalMuestras) * 100) : 100;
            const aprobado = porcentajeSimetria >= 60;

            // GUARDADO OFICIAL ESPECÍFICO PARA M3 (GRIP)
            localStorage.setItem(`medico_grip_${cleanRut}_${sessionId}`, 'true');
            localStorage.setItem(`sensometrika_last_grip_${cleanRut}_${sessionId}`, JSON.stringify({
                aprobado: aprobado,
                porcentajeSimetria: porcentajeSimetria,
                timestamp: Date.now()
            }));

            document.getElementById('txtResumenGrip').innerHTML = `
                Estabilidad Bilateral Sostenida: <strong>${porcentajeSimetria}%</strong><br>
                Resultado Clínico: <strong style="color:${aprobado ? '#10b981':'#ef4444'}">${aprobado ? 'APTO / FUERZA ESTABLE' : 'OBSERVADO'}</strong>
            `;
            document.getElementById('modalResultado').style.display = 'flex';
        }

        function finalizarYVolver() {
            const paramsRedir = new URLSearchParams(window.location.search);
            window.location.href = `../menu_B2B.html?${paramsRedir.toString()}`;
        }
    </script>
</body>
</html>
