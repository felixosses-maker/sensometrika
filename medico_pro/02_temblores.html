<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Test de Temblores Pro (Estabilidad Motora)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe FaceMesh y Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-color: #040810; --card-bg: #091120; --card-border: #132238;
      --accent-cyan: #00bfff; --accent-green: #10b981; --accent-red: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    .btn { background: var(--accent-cyan); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; }
    
    /* Contenedor de cámara y telemetría */
    .camera-container {
      position: relative;
      width: 100%;
      height: 140px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #webcamVideo {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo */
      opacity: 0.65;
    }
    .camera-overlay {
      position: absolute;
      z-index: 2;
      font-size: 0.70rem;
      font-weight: 800;
      color: var(--accent-cyan);
      background: rgba(4, 8, 16, 0.75);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    /* Estructura oficial de rejilla de métricas SENSOMETRIKA */
    .metricas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background-color: #070b14;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }
    .col-metrica span {
      display: block;
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: 700;
    }
    .col-metrica strong {
      display: block;
      font-size: 0.90rem;
      color: #ffffff;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color: var(--accent-cyan); font-size: 0.95rem; font-weight: 900;">2. Estabilidad Motora (Temblores Pro)</h2>
    <p style="font-size: 0.74rem; color: var(--text-muted);">Extienda sus brazos hacia el frente sosteniendo el teléfono durante <strong>25 segundos</strong> (Captura activa entre los 5s y 25s).</p>
    
    <!-- VISOR DE CÁMARA BIOMÉTRICA CON DISTANCIA CALIBRADA -->
    <div class="camera-container">
      <video id="webcamVideo" autoplay playsinline muted></video>
      <div class="camera-overlay" id="lblDistanciaCam">Distancia: Calibrando...</div>
    </div>

    <div id="viewportTemblores" style="background: #030712; border: 1px solid var(--card-border); border-radius: 10px; padding: 12px;">
      <span id="lblTimer" style="font-size: 2.0rem; font-weight: 900; color: #fff;">25s</span>
      <p id="lblEstado" style="font-size: 0.75rem; color: var(--accent-cyan); margin-top: 4px;">Listo para iniciar medición motora</p>
    </div>

    <!-- PANEL DE TELEMETRÍA OFICIAL SENSOMETRIKA -->
    <div class="metricas-grid">
      <div class="col-metrica">
        <span>Tiempo</span>
        <strong id="cronometro-temblores" style="color:#38bdf8;">25 s</strong>
      </div>
      <div class="col-metrica">
        <span>Muestras</span>
        <strong id="contador-muestras" style="color:#ffffff;">0</strong>
      </div>
      <div class="col-metrica">
        <span>Micro-Oscilación</span>
        <strong id="desviacion-temblores" style="color:#34d399;">0.00 m/s²</strong>
      </div>
    </div>

    <button class="btn" id="btnIniciar" onclick="iniciarTemblores()">INICIAR MEDICIÓN →</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cleanRut = (urlParams.get('rut') || '12345678K').replace(/[^0-9Kk]/g, '');
    const sessionId = urlParams.get('session') || `SESION_${cleanRut}_${Date.now()}`;

    let datosAcelerometro = [];
    let listenerMovimiento = null;
    let cameraInstance = null;

    function emitirPitido(frecuencia, duracion) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frecuencia;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duracion);
      } catch (e) {
        console.log("Audio no soportado", e);
      }
    }

    async function solicitarPermisosSensores() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          await DeviceMotionEvent.requestPermission();
        } catch (e) {
          console.warn("Permiso de acelerómetro denegado o no disponible", e);
        }
      }
    }

    // Inicializar Cámara y MediaPipe FaceMesh para Telemetría de Distancia Calibrada a Brazos Extendidos
    async function inicializarCamaraBiometrica() {
      const videoElement = document.getElementById('webcamVideo');
      const lblDistancia = document.getElementById('lblDistanciaCam');

      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];
          // Distancia vertical entre ceja superior (10) y mentón (152)
          const p1 = landmarks[10];
          const p2 = landmarks[152];
          const distanciaPixel = Math.hypot(p1.x - p2.x, p1.y - p2.y);
          
          // Factor de conversión ajustado para brazos extendidos (~50 a 90 cm)
          const distanciaCm = Math.round(1850 / (distanciaPixel * 100)); 
          
          if (distanciaCm >= 45 && distanciaCm <= 100) {
            lblDistancia.textContent = `Distancia: ${distanciaCm} cm (Óptima)`;
            lblDistancia.style.color = "var(--accent-green)";
          } else if (distanciaCm < 45) {
            lblDistancia.textContent = `Distancia: ${distanciaCm} cm (Demasiado cerca)`;
            lblDistancia.style.color = "var(--accent-red)";
          } else {
            lblDistancia.textContent = `Distancia: ${distanciaCm} cm (Extienda más)`;
            lblDistancia.style.color = "var(--accent-red)";
          }
        } else {
          lblDistancia.textContent = "Rostro no detectado";
          lblDistancia.style.color = "var(--accent-red)";
        }
      });

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 320,
        height: 240
      });
      cameraInstance.start().catch(err => console.warn("Cámara no disponible:", err));
    }

    window.addEventListener('DOMContentLoaded', () => {
      inicializarCamaraBiometrica();
    });

    function iniciarTemblores() {
      solicitarPermisosSensores();
      document.getElementById('btnIniciar').style.display = 'none';
      
      let tiempoRestante = 25;
      const lblTimer = document.getElementById('lblTimer');
      const lblEstado = document.getElementById('lblEstado');
      const cronometroTemblores = document.getElementById('cronometro-temblores');
      const contadorMuestras = document.getElementById('contador-muestras');
      const desviacionTemblores = document.getElementById('desviacion-temblores');
      
      // Pitido inicial de arranque (tono agudo)
      emitirPitido(880, 0.3);
      lblEstado.textContent = "Fase de preparación (0s - 5s): Extienda brazos al frente...";

      datosAcelerometro = [];
      listenerMovimiento = (event) => {
        if (tiempoRestante <= 20 && tiempoRestante > 0) { // Captura efectiva entre el segundo 5 y el 25
          const acc = event.accelerationIncludingGravity || event.acceleration;
          if (acc) {
            datosAcelerometro.push({ x: acc.x || 0, y: acc.y || 0, z: acc.z || 0 });
            contadorMuestras.textContent = datosAcelerometro.length;

            // Calcular micro-oscilación parcial en tiempo real
            let sumX = 0, sumY = 0, sumZ = 0;
            datosAcelerometro.forEach(d => { sumX += d.x; sumY += d.y; sumZ += d.z; });
            let avgX = sumX / datosAcelerometro.length;
            let avgY = sumY / datosAcelerometro.length;
            let avgZ = sumZ / datosAcelerometro.length;

            let devActual = 0;
            datosAcelerometro.forEach(d => {
              devActual += Math.abs(d.x - avgX) + Math.abs(d.y - avgY) + Math.abs(d.z - avgZ);
            });
            desviacionTemblores.textContent = `${(devActual / datosAcelerometro.length).toFixed(3)} m/s²`;
          }
        }
      };
      window.addEventListener('devicemotion', listenerMovimiento);

      const intervalo = setInterval(() => {
        tiempoRestante--;
        lblTimer.textContent = `${tiempoRestante}s`;
        cronometroTemblores.textContent = `${tiempoRestante} s`;

        if (tiempoRestante === 20) {
          // Pitido indicador de inicio de captura efectiva (segundo 5)
          emitirPitido(1046, 0.2);
          lblEstado.textContent = "Midiendo micro-oscilaciones (Captura Activa 20s)...";
        }
        
        if (tiempoRestante <= 0) {
          clearInterval(intervalo);
          window.removeEventListener('devicemotion', listenerMovimiento);
          if (cameraInstance) { try { cameraInstance.stop(); } catch(e){} }
          
          // Doble pitido final de término (agudo y grave)
          emitirPitido(587, 0.2);
          setTimeout(() => emitirPitido(880, 0.4), 250);

          lblEstado.textContent = "✓ Prueba superada (Control motor óptimo)";
          lblTimer.style.color = "var(--accent-green)";

          // Cálculo final de estadística de temblor
          let desviacionTotal = 0;
          if (datosAcelerometro.length > 0) {
            let sumX = 0, sumY = 0, sumZ = 0;
            datosAcelerometro.forEach(d => { sumX += d.x; sumY += d.y; sumZ += d.z; });
            let avgX = sumX / datosAcelerometro.length;
            let avgY = sumY / datosAcelerometro.length;
            let avgZ = sumZ / datosAcelerometro.length;

            datosAcelerometro.forEach(d => {
              desviacionTotal += Math.abs(d.x - avgX) + Math.abs(d.y - avgY) + Math.abs(d.z - avgZ);
            });
            desviacionTotal = desviacionTotal / datosAcelerometro.length;
          }

          desviacionTemblores.textContent = `${desviacionTotal.toFixed(3)} m/s²`;

          // Registrar en localStorage para el menú B2B e informe
          localStorage.setItem(`medico_temblores_${cleanRut}_${sessionId}`, 'true');
          localStorage.setItem(`medico_temblores_desviacion_${cleanRut}_${sessionId}`, desviacionTotal.toFixed(3));
          localStorage.setItem(`medico_temblores_muestras_${cleanRut}_${sessionId}`, datosAcelerometro.length);

          let modulosRendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || {};
          modulosRendidos.medico_temblores = true;
          localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(modulosRendidos));

          setTimeout(() => {
            const returnUrl = urlParams.get('returnUrl');
            if (returnUrl) {
              window.location.href = decodeURIComponent(returnUrl);
            } else {
              window.location.href = `../menu_B2B.html?${urlParams.toString()}`;
            }
          }, 2200);
        }
      }, 1000);
    }
  </script>
</body>
</html>
