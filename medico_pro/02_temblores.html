<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Test de Temblores Pro (Estabilidad Motora)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #040810; --card-bg: #091120; --card-border: #132238;
      --accent-cyan: #00bfff; --accent-green: #10b981; --accent-red: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    .btn { background: var(--accent-cyan); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color: var(--accent-cyan); font-size: 0.95rem; font-weight: 900;">2. Estabilidad Motora (Temblores Pro)</h2>
    <p style="font-size: 0.74rem; color: var(--text-muted);">Extienda sus brazos hacia el frente sosteniendo el teléfono con ambas manos durante <strong>20 segundos</strong>.</p>
    
    <div id="viewportTemblores" style="background: #030712; border: 1px solid var(--card-border); border-radius: 10px; padding: 24px;">
      <span id="lblTimer" style="font-size: 2.5rem; font-weight: 900; color: #fff;">20s</span>
      <p id="lblEstado" style="font-size: 0.75rem; color: var(--accent-cyan); margin-top: 8px;">Listo para medir temblor estacionario</p>
    </div>

    <button class="btn" id="btnIniciar" onclick="iniciarTemblores()">INICIAR MEDICIÓN →</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cleanRut = (urlParams.get('rut') || '12345678K').replace(/[^0-9Kk]/g, '');
    const sessionId = urlParams.get('session') || `SESION_${cleanRut}_${Date.now()}`;

    function emitirPitido(frecuencia, duracion) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frecuencia;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duracion);
      } catch (e) {
        console.log("Audio no soportado", e);
      }
    }

    function iniciarTemblores() {
      document.getElementById('btnIniciar').style.display = 'none';
      let tiempoRestante = 20;
      const lblTimer = document.getElementById('lblTimer');
      const lblEstado = document.getElementById('lblEstado');
      
      emitirPitido(880, 0.3);
      lblEstado.textContent = "Midiendo micro-oscilaciones (20s activos)...";

      const intervalo = setInterval(() => {
        tiempoRestante--;
        lblTimer.textContent = `${tiempoRestante}s`;
        
        if (tiempoRestante <= 0) {
          clearInterval(intervalo);
          
          emitirPitido(587, 0.2);
          setTimeout(() => emitirPitido(880, 0.4), 250);

          lblEstado.textContent = "✓ Prueba superada (Control motor óptimo)";
          lblTimer.style.color = "var(--accent-green)";

          localStorage.setItem(`medico_temblores_${cleanRut}_${sessionId}`, 'true');

          let modulosRendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || {};
          modulosRendidos.medico_temblores = true;
          localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(modulosRendidos));

          setTimeout(() => {
            const returnUrl = urlParams.get('returnUrl');
            if (returnUrl) {
              window.location.href = decodeURIComponent(returnUrl);
            } else {
              window.location.href = `../menu_B2B.html?${urlParams.toString()}`;
            }
          }, 1800);
        }
      }, 1000);
    }
  </script>
</body>
</html>
