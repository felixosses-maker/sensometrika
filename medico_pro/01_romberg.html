<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Test de Romberg Pro (Vestibular)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #040810; --card-bg: #091120; --card-border: #132238;
      --accent-cyan: #00bfff; --accent-green: #10b981; --accent-red: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .btn { background: var(--accent-cyan); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    
    .metricas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background-color: #070b14;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }
    .col-metrica span {
      display: block;
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: 700;
    }
    .col-metrica strong {
      display: block;
      font-size: 0.90rem;
      color: #ffffff;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 8px;">
      <a href="#" id="linkMenu" style="font-size: 0.70rem; font-weight: 800; color: var(--accent-cyan); text-decoration: none;">← MENÚ B2B</a>
      <span style="font-size: 0.75rem; font-weight: 900; color: var(--accent-cyan);">M1 - VESTIBULAR</span>
      <button onclick="location.reload()" style="background: none; border: none; color: var(--text-muted); font-size: 0.70rem; cursor: pointer;">🔄 REINICIAR</button>
    </div>

    <h2 style="color: var(--accent-cyan); font-size: 0.95rem; font-weight: 900;">Estabilidad Vestibular (Romberg Pro)</h2>
    <p style="font-size: 0.74rem; color: var(--text-muted);">Sostenga el teléfono contra su pecho, cierre los ojos y mantenga la postura estática durante <strong>25 segundos</strong>.</p>
    
    <div id="viewportRomberg" style="background: #030712; border: 1px solid var(--card-border); border-radius: 10px; padding: 16px;">
      <span id="lblTimer" style="font-size: 2.2rem; font-weight: 900; color: #fff;">25s</span>
      <p id="lblEstado" style="font-size: 0.75rem; color: var(--accent-cyan); margin-top: 6px;">Listo para calibrar acelerómetro</p>
    </div>

    <div class="metricas-grid">
      <div class="col-metrica">
        <span>Tiempo</span>
        <strong id="cronometro-romberg" style="color:#38bdf8;">25 s</strong>
      </div>
      <div class="col-metrica">
        <span>Muestras</span>
        <strong id="contador-muestras" style="color:#ffffff;">0</strong>
      </div>
      <div class="col-metrica">
        <span>Desviación (RMS)</span>
        <strong id="desviacion-romberg" style="color:#34d399;">0.00 m/s²</strong>
      </div>
    </div>

    <button class="btn" id="btnIniciar" onclick="iniciarRomberg()">INICIAR MEDICIÓN OFICIAL →</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cleanRut = (urlParams.get('rut') || localStorage.getItem('sensometrika_rut') || '12345678').replace(/[^0-9Kk]/g, '');
    const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || 'SESION_DEFAULT';
    const isB2C = localStorage.getItem('sensometrika_b2c_mode') === 'true' || urlParams.get('mode') === 'b2c';

    document.getElementById('linkMenu').href = isB2C ? `../menu_B2C.html?${urlParams.toString()}` : `../menu_B2B.html?${urlParams.toString()}`;

    let datosAcelerometro = [];
    let listenerMovimiento = null;
    let intervalo = null;

    function emitirPitido(frecuencia, duracion) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frecuencia;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duracion);
      } catch (e) {
        console.log("Audio no soportado", e);
      }
    }

    async function solicitarPermisosSensores() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const response = await DeviceMotionEvent.requestPermission();
          if (response !== 'granted') {
            alert("⚠️ Se requieren permisos de acelerómetro obligatorios para la prueba formal.");
            return false;
          }
        } catch (e) {
          console.warn("Error al solicitar permisos:", e);
        }
      }
      return true;
    }

    async function iniciarRomberg() {
      const permisoConcedido = await solicitarPermisosSensores();
      if (!permisoConcedido) return;

      document.getElementById('btnIniciar').style.display = 'none';
      
      let tiempoRestante = 25;
      const lblTimer = document.getElementById('lblTimer');
      const lblEstado = document.getElementById('lblEstado');
      const cronometroRomberg = document.getElementById('cronometro-romberg');
      const contadorMuestras = document.getElementById('contador-muestras');
      const desviacionRomberg = document.getElementById('desviacion-romberg');
      
      emitirPitido(880, 0.3);
      lblEstado.textContent = "Fase de preparación (0s - 5s): Mantenga estabilidad...";

      datosAcelerometro = [];
      listenerMovimiento = (event) => {
        if (tiempoRestante <= 20 && tiempoRestante > 0) {
          const acc = event.accelerationIncludingGravity || event.acceleration;
          if (acc) {
            datosAcelerometro.push({ x: acc.x || 0, y: acc.y || 0, z: acc.z || 0 });
            contadorMuestras.textContent = datosAcelerometro.length;

            let sumX = 0, sumY = 0, sumZ = 0;
            datosAcelerometro.forEach(d => { sumX += d.x; sumY += d.y; sumZ += d.z; });
            let avgX = sumX / datosAcelerometro.length;
            let avgY = sumY / datosAcelerometro.length;
            let avgZ = sumZ / datosAcelerometro.length;

            let devActual = 0;
            datosAcelerometro.forEach(d => {
              devActual += Math.abs(d.x - avgX) + Math.abs(d.y - avgY) + Math.abs(d.z - avgZ);
            });
            desviacionRomberg.textContent = `${(devActual / datosAcelerometro.length).toFixed(3)} m/s²`;
          }
        }
      };
      window.addEventListener('devicemotion', listenerMovimiento);

      intervalo = setInterval(() => {
        tiempoRestante--;
        lblTimer.textContent = `${tiempoRestante}s`;
        cronometroRomberg.textContent = `${tiempoRestante} s`;

        if (tiempoRestante === 20) {
          emitirPitido(1046, 0.2);
          lblEstado.textContent = "Midiendo oscilación postural real (Captura Activa 20s)...";
        }
        
        if (tiempoRestante <= 0) {
          finalizarPruebaFormal();
        }
      }, 1000);
    }

    function finalizarPruebaFormal() {
      clearInterval(intervalo);
      if (listenerMovimiento) window.removeEventListener('devicemotion', listenerMovimiento);
      
      emitirPitido(587, 0.2);
      setTimeout(() => emitirPitido(880, 0.4), 250);

      const lblTimer = document.getElementById('lblTimer');
      const lblEstado = document.getElementById('lblEstado');
      const desviacionRomberg = document.getElementById('desviacion-romberg');

      if (datosAcelerometro.length < 10) {
        alert("⚠️ No se registraron suficientes muestras del acelerómetro. Verifique que el dispositivo admita lectura de movimiento en este navegador.");
        location.reload();
        return;
      }

      lblEstado.textContent = "✓ Evaluación vestibular completada y registrada";
      lblTimer.style.color = "var(--accent-green)";

      let sumX = 0, sumY = 0, sumZ = 0;
      datosAcelerometro.forEach(d => { sumX += d.x; sumY += d.y; sumZ += d.z; });
      let avgX = sumX / datosAcelerometro.length;
      let avgY = sumY / datosAcelerometro.length;
      let avgZ = sumZ / datosAcelerometro.length;

      let desviacionTotal = 0;
      datosAcelerometro.forEach(d => {
        desviacionTotal += Math.abs(d.x - avgX) + Math.abs(d.y - avgY) + Math.abs(d.z - avgZ);
      });
      desviacionTotal = desviacionTotal / datosAcelerometro.length;

      desviacionRomberg.textContent = `${desviacionTotal.toFixed(3)} m/s²`;

      // Guardar registro oficial
      localStorage.setItem(`sensometrika_romberg_${cleanRut}_${sessionId}`, 'true');
      localStorage.setItem(`medico_romberg_${cleanRut}_${sessionId}`, 'true');
      localStorage.setItem(`medico_romberg_desviacion_${cleanRut}_${sessionId}`, desviacionTotal.toFixed(3));
      localStorage.setItem(`medico_romberg_muestras_${cleanRut}_${sessionId}`, datosAcelerometro.length);

      let modulosRendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || {};
      modulosRendidos.romberg = true;
      modulosRendidos.medico_romberg = true;
      localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(modulosRendidos));

      setTimeout(() => {
        const returnUrl = urlParams.get('returnUrl');
        if (returnUrl) {
          window.location.href = decodeURIComponent(returnUrl);
        } else {
          window.location.href = isB2C ? `../menu_B2C.html?${urlParams.toString()}` : `../menu_B2B.html?${urlParams.toString()}`;
        }
      }, 1800);
    }
  </script>
</body>
</html>
