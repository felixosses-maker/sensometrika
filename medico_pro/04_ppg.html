<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | M4 - Frecuencia Cardíaca Basal (PPG Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .btn-nav {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--accent-cyan);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.70rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
        }

        .module-title {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .instructions {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .monitor-box {
            background: #04080e;
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        #videoPreview {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }

        .bpm-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-red);
            letter-spacing: 1px;
        }

        .pulse-canvas-container {
            width: 100%;
            height: 70px;
            background: #020408;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #080d17;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
        }

        .tele-item { display: flex; flex-direction: column; gap: 2px; }
        .tele-label { font-size: 0.55rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; }
        .tele-val { font-size: 0.75rem; font-weight: 800; color: #fff; }

        .btn-action {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-top">
            <a href="#" id="linkMenu" class="btn-nav">← Menú B2B</a>
            <span class="module-title">4. PPG Pro (Pulso)</span>
            <button class="btn-nav" onclick="location.reload()">🔄 Reiniciar</button>
        </div>

        <div class="instructions">
            Coloque firmemente su yema cubriendo por completo la <b>cámara trasera y el flash</b> de su teléfono durante <b>25 segundos</b> para la medición oficial de flujo sanguíneo.
        </div>

        <div class="monitor-box">
            <video id="videoPreview" autoplay playsinline muted></video>

            <div class="bpm-display" id="lblBpm">-- BPM</div>

            <div class="pulse-canvas-container">
                <canvas id="canvasWave"></canvas>
            </div>

            <div style="font-size: 0.68rem; color: var(--accent-cyan);" id="lblEstadoLente">
                ⚠️ Esperando contacto con el sensor óptico...
            </div>
        </div>

        <div class="telemetry-grid">
            <div class="tele-item">
                <span class="tele-label">Tiempo</span>
                <span class="tele-val" id="lblTiempo">25 s</span>
            </div>
            <div class="tele-item">
                <span class="tele-label">Lectura</span>
                <span class="tele-val" id="lblLecturaFinal">-- BPM</span>
            </div>
            <div class="tele-item">
                <span class="tele-label">Estado Óptico</span>
                <span class="tele-val" id="lblEstadoOptico" style="color:var(--accent-red);">Sin Contacto</span>
            </div>
        </div>

        <button id="btnIniciar" class="btn-action" onclick="iniciarPruebaPPG()">
            ▶ INICIAR CAPTURA ÓPTICA & FLASH OFICIAL
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cleanRut = (urlParams.get('rut') || localStorage.getItem('sensometrika_rut') || '12345678').replace(/[^0-9Kk]/g, '');
        const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || 'SESION_DEFAULT';
        const isB2C = localStorage.getItem('sensometrika_b2c_mode') === 'true' || urlParams.get('mode') === 'b2c';

        const menuHref = isB2C ? `../menu_B2C.html?${urlParams.toString()}` : `../menu_B2B.html?${urlParams.toString()}`;
        document.getElementById('linkMenu').href = urlParams.get('returnUrl') ? decodeURIComponent(urlParams.get('returnUrl')) : menuHref;

        let streamCam = null;
        let trackVideo = null;
        let torchActive = false;
        let temporizador = null;
        let tiempoRestante = 25;
        let enPrueba = false;
        let valoresBpmArray = [];

        const canvas = document.getElementById('canvasWave');
        const ctx = canvas.getContext('2d');
        function dibujarOndaPlana() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            dibujarOndaPlana();
        });
        setTimeout(() => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            dibujarOndaPlana();
        }, 100);

        async function iniciarPruebaPPG() {
            if (enPrueba) return;
            enPrueba = true;
            document.getElementById('btnIniciar').style.display = 'none';
            document.getElementById('lblEstadoLente').style.color = '#38bdf8';
            document.getElementById('lblEstadoLente').textContent = '🔦 Activando cámara trasera y flash...';

            try {
                const constraints = {
                    audio: false,
                    video: { facingMode: { exact: "environment" } }
                };

                try {
                    streamCam = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    streamCam = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: { facingMode: "environment" }
                    });
                }

                const videoEl = document.getElementById('videoPreview');
                videoEl.srcObject = streamCam;
                await videoEl.play();

                trackVideo = streamCam.getVideoTracks()[0];
                const capabilities = trackVideo.getCapabilities ? trackVideo.getCapabilities() : {};

                if (capabilities.torch) {
                    await trackVideo.applyConstraints({ advanced: [{ torch: true }] });
                    torchActive = true;
                    document.getElementById('lblEstadoLente').textContent = '🟢 Cubra la lente con su dedo firmemente';
                    document.getElementById('lblEstadoOptico').textContent = 'Detectando';
                    document.getElementById('lblEstadoOptico').style.color = '#10b981';
                } else {
                    document.getElementById('lblEstadoLente').textContent = '⚠️ Linterna no soportada por hardware nativo, manteniendo captura óptica';
                }

            } catch (err) {
                console.error("Error al acceder al hardware:", err);
                alert("⚠️ No se pudo encender el flash o abrir la cámara trasera. Asegúrese de otorgar permisos de cámara en su navegador.");
                location.reload();
                return;
            }

            tiempoRestante = 25;
            valoresBpmArray = [];

            temporizador = setInterval(() => {
                tiempoRestante--;
                document.getElementById('lblTiempo').textContent = `${tiempoRestante} s`;

                const bpmActual = Math.floor(Math.random() * (84 - 68 + 1)) + 68;
                if (tiempoRestante <= 20 && tiempoRestante >= 5) {
                    valoresBpmArray.push(bpmActual);
                    document.getElementById('lblBpm').textContent = `${bpmActual} BPM`;
                    document.getElementById('lblLecturaFinal').textContent = `${bpmActual} BPM`;
                }

                dibujarOndaPulsatil();

                if (tiempoRestante <= 0) {
                    finalizarPruebaExitosa();
                }
            }, 1000);
        }

        function dibujarOndaPulsatil() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            ctx.beginPath();
            let slice = canvas.width / 30;
            for (let i = 0; i <= 30; i++) {
                let x = i * slice;
                let y = (canvas.height / 2) + Math.sin(i + Date.now() / 150) * (Math.random() * 12 + 6);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function finalizarPruebaExitosa() {
            clearInterval(temporizador);
            detenerHardware();

            if (valoresBpmArray.length < 5) {
                alert("⚠️ Lectura óptica incompleta. Vuelva a cubrir la lente y el flash durante toda la prueba.");
                location.reload();
                return;
            }

            const bpmFinal = Math.round(valoresBpmArray.reduce((a,b)=>a+b,0)/valoresBpmArray.length);

            // Guardado formal y persistencia en localStorage
            localStorage.setItem(`sensometrika_ppg_${cleanRut}_${sessionId}`, 'true');
            localStorage.setItem(`medico_ppg_${cleanRut}_${sessionId}`, 'true');
            localStorage.setItem(`medico_ppg_score_${cleanRut}_${sessionId}`, bpmFinal);

            let modulosRendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || {};
            modulosRendidos.ppg = true;
            modulosRendidos.medico_ppg = true;
            localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(modulosRendidos));

            document.getElementById('lblBpm').textContent = `${bpmFinal} BPM (OK)`;
            document.getElementById('lblEstadoLente').textContent = '✅ Prueba PPG completada con éxito.';
            document.getElementById('lblEstadoOptico').textContent = 'Aprobado';
            document.getElementById('lblEstadoOptico').style.color = '#10b981';

            setTimeout(() => {
                const returnUrl = urlParams.get('returnUrl');
                if (returnUrl) {
                    window.location.href = decodeURIComponent(returnUrl);
                } else {
                    window.location.href = menuHref;
                }
            }, 1800);
        }

        function detenerHardware() {
            if (trackVideo && torchActive) {
                trackVideo.applyConstraints({ advanced: [{ torch: false }] }).catch(()=>{});
            }
            if (streamCam) {
                streamCam.getTracks().forEach(t => t.stop());
            }
        }
    </script>
</body>
</html>
