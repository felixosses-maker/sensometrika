<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Screening Visual Pericial D.S. 170</title>
    <!-- MediaPipe Face Mesh para detección facial y estimación de distancia real -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-gold: #e5b324;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brand-logo-img {
            width: 180px;
            height: auto;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .nav-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .link-volver {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .link-volver:hover { color: var(--accent-cyan); }

        .card-visual {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* MONITOR DE CÁMARA Y TEST */
        .viewport-test {
            position: relative;
            width: 100%;
            height: 260px;
            background: #000;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cam-preview-pip {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 80px;
            height: 60px;
            border-radius: 6px;
            border: 2px solid var(--accent-cyan);
            object-fit: cover;
            z-index: 10;
            background: #111;
        }

        /* OVERLAY DE BLOQUEO POR DISTANCIA O FALTA DE ROSTRO */
        .overlay-bloqueo {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
            text-align: center;
            z-index: 50;
            border-radius: 10px;
        }

        .overlay-bloqueo h3 { color: var(--accent-red); font-size: 1.1rem; font-weight: 900; }
        .overlay-bloqueo p { color: #cbd5e1; font-size: 0.8rem; line-height: 1.4; }

        /* ESTIMULOS DE PRUEBA */
        .optotipo-display {
            font-size: 4.5rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .ishihara-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: rgba(255,255,255,0.15);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        /* BOTONES DE RESPUESTA */
        .opciones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-opt-visual {
            background: #070d17;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-opt-visual:hover:not(:disabled) {
            border-color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.15);
        }

        .btn-iniciar-examen {
            background: var(--blue-btn);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        /* METRICAS DE ESTADO */
        .status-bar-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: #070d17;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            text-align: center;
            font-size: 0.72rem;
        }

        .lbl-st { color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .val-st { color: #fff; font-weight: 800; }
        .val-st-green { color: var(--accent-green); font-weight: 800; }
        .val-st-red { color: var(--accent-red); font-weight: 800; }

        video { display: none; }
    </style>
</head>
<body>

    <video id="webcamInput" playsinline></video>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span class="brand-subtitle">MÓDULO SCREENING VISUAL PERICIAL</span>
        </header>

        <div class="card-visual">
            <div class="nav-top-row">
                <a onclick="volverMenu()" class="link-volver">← Menú Evaluaciones</a>
                <span style="font-size:0.70rem; color:var(--text-muted); font-weight:700;">D.S. N° 170 MTT</span>
            </div>

            <!-- MONITOR DE PRUEBA -->
            <div class="viewport-test">
                <canvas id="pipCanvas" class="cam-preview-pip"></canvas>

                <!-- Overlay Bloqueo de Distancia -->
                <div id="overlayDistancia" class="overlay-bloqueo">
                    <h3 id="txtBloqueoTitulo">⚠️ DISTANCIA FUERA DE RANGO</h3>
                    <p id="txtBloqueoDesc">Ubícate a 50 cm de la pantalla con rostro despejado para habilitar el test visual.</p>
                    <button onclick="forzarHabilitacionCamara()" style="background: rgba(56, 189, 248, 0.2); border: 1px solid var(--accent-cyan); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.70rem; cursor: pointer; margin-top: 4px;">
                        Modo Manual / Sin Cámara
                    </button>
                </div>

                <!-- Contenedor del Estímulo Visual -->
                <div id="displayVisual" class="optotipo-display">E</div>
            </div>

            <!-- BOTONES Y CONTROLES -->
            <button id="btnStartTest" class="btn-iniciar-examen" onclick="iniciarExamenVisual()" disabled>INICIAR EVALUACIÓN PERICIAL</button>

            <div id="gridRespuestas" class="opciones-grid" style="display: none;">
                <!-- Rellenado dinámicamente -->
            </div>

            <!-- BARRA DE ESTADO Y TELEMETRÍA -->
            <div class="status-bar-bottom">
                <div>
                    <span class="lbl-st">Distancia</span>
                    <span id="stDistancia" class="val-st-red">MALA</span>
                </div>
                <div>
                    <span class="lbl-st">Fase Examen</span>
                    <span id="stFase" class="val-st">1 / 8</span>
                </div>
                <div>
                    <span class="lbl-st">Aciertos</span>
                    <span id="stAciertos" class="val-st-green">0 / 8</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // BANCO BASE DE ELEMENTOS
        const BANCO_SNELLEN = [
            { valor: 'E', opciones: ['E', 'F', 'P', 'T'], correcta: 'E' },
            { valor: 'F', opciones: ['P', 'F', 'T', 'Z'], correcta: 'F' },
            { valor: 'P', opciones: ['E', 'D', 'P', 'L'], correcta: 'P' },
            { valor: 'Z', opciones: ['O', 'Z', 'E', 'D'], correcta: 'Z' },
            { valor: 'L', opciones: ['L', 'T', 'F', 'P'], correcta: 'L' },
            { valor: 'D', opciones: ['O', 'D', 'C', 'Q'], correcta: 'D' }
        ];

        const BANCO_ISHIHARA = [
            { valor: '12', opciones: ['12', '8', '6', 'Nada'], correcta: '12', bg: 'rgba(239, 68, 68, 0.25)' },
            { valor: '74', opciones: ['21', '74', '71', 'Nada'], correcta: '74', bg: 'rgba(16, 185, 129, 0.25)' },
            { valor: '6',  opciones: ['8', '6', '5', 'Nada'],  correcta: '6',  bg: 'rgba(229, 179, 36, 0.25)' },
            { valor: '8',  opciones: ['3', '8', '9', 'Nada'],  correcta: '8',  bg: 'rgba(14, 165, 233, 0.25)' }
        ];

        let bancoPruebasGenerado = [];
        let indexPruebaActual = 0;
        let aciertosTotales = 0;
        let examenEnCurso = false;
        let rostroCorrecto = false;

        const videoElement = document.getElementById('webcamInput');
        const pipCanvas = document.getElementById('pipCanvas');
        const pipCtx = pipCanvas.getContext('2d');
        const overlayDistancia = document.getElementById('overlayDistancia');
        const btnStartTest = document.getElementById('btnStartTest');

        function volverMenu() {
            const params = new URLSearchParams(window.location.search).toString();
            window.location.href = `menu_B2C.html?${params}`;
        }

        // ALGORITMO DE BARADO Y DIVERSIFICACIÓN DINÁMICA
        function construirBancoAleatorio() {
            bancoPruebasGenerado = [];
            const tamanos = ['5.0rem', '3.8rem', '2.6rem', '1.6rem'];

            // 1. Barajar y tomar 4 ítems de Snellen con tamaño decreciente
            const snellenShuffled = [...BANCO_SNELLEN].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 4; i++) {
                const item = { ...snellenShuffled[i] };
                item.tipo = 'snellen';
                item.fontSize = tamanos[i];
                item.opciones = [...item.opciones].sort(() => Math.random() - 0.5);
                bancoPruebasGenerado.push(item);
            }

            // 2. Barajar y tomar 2 ítems de Ishihara
            const ishiharaShuffled = [...BANCO_ISHIHARA].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 2; i++) {
                const item = { ...ishiharaShuffled[i] };
                item.tipo = 'ishihara';
                item.opciones = [...item.opciones].sort(() => Math.random() - 0.5);
                bancoPruebasGenerado.push(item);
            }

            // 3. Ítem de Contraste
            bancoPruebasGenerado.push({
                tipo: 'contraste', valor: 'C', opciones: ['C', 'O', 'G', 'D'].sort(() => Math.random() - 0.5), correcta: 'C', color: '#334155'
            });

            // 4. Ítem de Destello / Recuperación
            bancoPruebasGenerado.push({
                tipo: 'destello', valor: '8', opciones: ['3', '8', '0', '6'].sort(() => Math.random() - 0.5), correcta: '8'
            });
        }

        // INICIALIZAR MEDIAPIPE FACE MESH
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResultsFace);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 320,
            height: 240
        });

        camera.start().catch(() => {
            forzarHabilitacionCamara();
        });

        function onResultsFace(results) {
            pipCtx.save();
            pipCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.drawImage(results.image, 0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.restore();

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                const dx = landmarks[454].x - landmarks[234].x;
                const dy = landmarks[454].y - landmarks[234].y;
                const anchoRostro = Math.sqrt(dx * dx + dy * dy);

                if (anchoRostro > 0.55) {
                    actualizarEstadoCamara(false, '⚠️ MUY CERCA', 'Aléjate a 50 cm de la pantalla para continuar.');
                } else if (anchoRostro < 0.22) {
                    actualizarEstadoCamara(false, '⚠️ MUY LEJOS', 'Acércate a 50 cm de la pantalla para continuar.');
                } else {
                    actualizarEstadoCamara(true, '✓ DISTANCIA OK', '');
                }
            } else {
                actualizarEstadoCamara(false, '⚠️️ ROSTRO NO DETECTADO', 'Ubica tu rostro frente a la cámara sin obstrucciones.');
            }
        }

        function actualizarEstadoCamara(ok, titulo, desc) {
            rostroCorrecto = ok;
            const stDistancia = document.getElementById('stDistancia');

            if (ok) {
                stDistancia.textContent = 'OK (50 cm)';
                stDistancia.className = 'val-st-green';
                overlayDistancia.style.display = 'none';
                if (!examenEnCurso) btnStartTest.disabled = false;
            } else {
                stDistancia.textContent = 'INCORRECTA';
                stDistancia.className = 'val-st-red';
                overlayDistancia.style.display = 'flex';
                document.getElementById('txtBloqueoTitulo').textContent = titulo;
                document.getElementById('txtBloqueoDesc').textContent = desc;
                if (!examenEnCurso) btnStartTest.disabled = true;
            }
        }

        function forzarHabilitacionCamara() {
            rostroCorrecto = true;
            document.getElementById('stDistancia').textContent = 'MANUAL (50 cm)';
            document.getElementById('stDistancia').className = 'val-st-green';
            overlayDistancia.style.display = 'none';
            btnStartTest.disabled = false;
        }

        function iniciarExamenVisual() {
            if (!rostroCorrecto) return;
            construirBancoAleatorio();
            examenEnCurso = true;
            indexPruebaActual = 0;
            aciertosTotales = 0;

            btnStartTest.style.display = 'none';
            document.getElementById('gridRespuestas').style.display = 'grid';
            cargarPruebaActual();
        }

        function cargarPruebaActual() {
            if (indexPruebaActual >= bancoPruebasGenerado.length) {
                finalizarExamenVisual();
                return;
            }

            const item = bancoPruebasGenerado[indexPruebaActual];
            const display = document.getElementById('displayVisual');
            const grid = document.getElementById('gridRespuestas');

            document.getElementById('stFase').textContent = `${indexPruebaActual + 1} / ${bancoPruebasGenerado.length}`;
            document.getElementById('stAciertos').textContent = `${aciertosTotales} / ${bancoPruebasGenerado.length}`;

            display.className = 'optotipo-display';
            display.style.color = item.color || '#fff';
            display.style.fontSize = item.fontSize || '4.5rem';
            display.style.background = item.bg || 'transparent';

            if (item.tipo === 'ishihara') {
                display.className = 'ishihara-circle';
                display.textContent = item.valor;
            } else if (item.tipo === 'destello') {
                display.style.background = '#ffffff';
                display.style.color = '#000000';
                display.textContent = '⚡';
                setTimeout(() => {
                    display.style.background = 'transparent';
                    display.style.color = '#ffffff';
                    display.textContent = item.valor;
                }, 800);
            } else {
                display.textContent = item.valor;
            }

            grid.innerHTML = '';
            item.opciones.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-opt-visual';
                btn.textContent = opt;
                btn.onclick = () => responderPrueba(opt, item.correcta);
                grid.appendChild(btn);
            });
        }

        function responderPrueba(respuesta, correcta) {
            if (!rostroCorrecto) return;

            if (respuesta === correcta) {
                aciertosTotales++;
            }

            indexPruebaActual++;
            cargarPruebaActual();
        }

        function finalizarExamenVisual() {
            examenEnCurso = false;
            document.getElementById('gridRespuestas').style.display = 'none';
            
            const display = document.getElementById('displayVisual');
            display.className = 'optotipo-display';
            display.style.fontSize = '3.5rem';

            let agudezaFinal = '20/20 (1.0)';
            if (aciertosTotales >= 7) agudezaFinal = '20/20 (1.0 - Sobresaliente)';
            else if (aciertosTotales >= 5) agudezaFinal = '20/25 (0.8 - Norma D.S. 170 OK)';
            else if (aciertosTotales >= 3) agudezaFinal = '20/40 (0.5 - Observado)';
            else agudezaFinal = '20/100 (0.2 - Rechazado)';

            display.textContent = '✓';

            // Guardar en historial estandarizado de LocalStorage
            let historial = JSON.parse(localStorage.getItem('sensometrika_historial_visual')) || [];
            historial.push({
                fecha: new Date().toISOString(),
                aciertos: aciertosTotales,
                agudeza: agudezaFinal,
                colores: aciertosTotales >= 5 ? 'NORMAL (8/8)' : 'OBSERVADO'
            });
            localStorage.setItem('sensometrika_historial_visual', JSON.stringify(historial));

            // Marcar módulo 5 como Rendido
            let modulosRendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || {};
            modulosRendidos.visual = true;
            localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(modulosRendidos));

            setTimeout(() => {
                volverMenu();
            }, 1200);
        }
    </script>
</body>
</html>
