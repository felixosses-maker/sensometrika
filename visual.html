<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Screening Visual Pericial D.S. 170</title>
    <!-- MediaPipe Face Mesh para detección facial y estimación de distancia real -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-gold: #e5b324;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brand-logo-img {
            width: 180px;
            height: auto;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .nav-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .link-volver {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .link-volver:hover { color: var(--accent-cyan); }

        .card-visual {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* MONITOR DE CÁMARA Y TEST */
        .viewport-test {
            position: relative;
            width: 100%;
            height: 260px;
            background: #000;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cam-preview-pip {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 80px;
            height: 60px;
            border-radius: 6px;
            border: 2px solid var(--accent-cyan);
            object-fit: cover;
            z-index: 10;
            background: #111;
        }

        /* OVERLAY DE BLOQUEO POR DISTANCIA O FALTA DE ROSTRO */
        .overlay-bloqueo {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
            text-align: center;
            z-index: 50;
            border-radius: 10px;
        }

        .overlay-bloqueo h3 { color: var(--accent-red); font-size: 1.1rem; font-weight: 900; }
        .overlay-bloqueo p { color: #cbd5e1; font-size: 0.8rem; line-height: 1.4; }

        /* ESTIMULOS DE PRUEBA */
        .optotipo-display {
            font-size: 4.5rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            text-align: center;
            line-height: 1;
        }

        .ishihara-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        /* BOTONES DE RESPUESTA */
        .opciones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-opt-visual {
            background: #070d17;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-opt-visual:hover:not(:disabled) {
            border-color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.15);
        }

        .btn-iniciar-examen {
            background: var(--blue-btn);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        /* METRICAS DE ESTADO */
        .status-bar-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: #070d17;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            text-align: center;
            font-size: 0.72rem;
        }

        .lbl-st { color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .val-st { color: #fff; font-weight: 800; }
        .val-st-green { color: var(--accent-green); font-weight: 800; }
        .val-st-red { color: var(--accent-red); font-weight: 800; }

        video { display: none; }
    </style>
</head>
<body>

    <video id="webcamInput" playsinline></video>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span class="brand-subtitle">MÓDULO SCREENING VISUAL PERICIAL</span>
        </header>

        <div class="card-visual">
            <div class="nav-top-row">
                <a onclick="volverMenu()" class="link-volver">← Menú Evaluaciones</a>
                <span id="txtModoEtiqueta" style="font-size:0.70rem; color:var(--accent-cyan); font-weight:700;">D.S. N° 170 MTT</span>
            </div>

            <!-- MONITOR DE PRUEBA -->
            <div class="viewport-test">
                <canvas id="pipCanvas" class="cam-preview-pip"></canvas>

                <!-- Overlay Bloqueo de Distancia -->
                <div id="overlayDistancia" class="overlay-bloqueo">
                    <h3 id="txtBloqueoTitulo">⚠️ DISTANCIA FUERA DE RANGO</h3>
                    <p id="txtBloqueoDesc">Ubícate a 50 cm de la pantalla con rostro despejado para habilitar el test visual.</p>
                    <button onclick="forzarHabilitacionCamara()" style="background: rgba(56, 189, 248, 0.2); border: 1px solid var(--accent-cyan); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.70rem; cursor: pointer; margin-top: 4px;">
                        Modo Manual / Sin Cámara
                    </button>
                </div>

                <!-- Contenedor del Estímulo Visual -->
                <div id="displayVisual" class="optotipo-display">E</div>
            </div>

            <!-- BOTONES Y CONTROLES -->
            <button id="btnStartTest" class="btn-iniciar-examen" onclick="iniciarExamenVisual()" disabled>INICIAR EVALUACIÓN PERICIAL</button>

            <div id="gridRespuestas" class="opciones-grid" style="display: none;">
                <!-- Rellenado dinámicamente -->
            </div>

            <!-- BARRA DE ESTADO Y TELEMETRÍA -->
            <div class="status-bar-bottom">
                <div>
                    <span class="lbl-st">Distancia</span>
                    <span id="stDistancia" class="val-st-red">MALA</span>
                </div>
                <div>
                    <span class="lbl-st">Fase Examen</span>
                    <span id="stFase" class="val-st">0 / 8</span>
                </div>
                <div>
                    <span class="lbl-st">Aciertos</span>
                    <span id="stAciertos" class="val-st-green">0 / 8</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const modeParam = urlParams.get('mode') || (localStorage.getItem('sensometrika_b2c_mode') === 'true' ? 'b2c' : 'b2b');
        const esB2B = (modeParam === 'b2b');

        const isDemoURL = urlParams.get('demo') === 'true' || urlParams.get('fase') === 'demo';
        let modoActual = isDemoURL ? 'DEMO' : 'OFICIAL';

        // BANCO AMPLIO Y VARIABLES DINÁMICAS ANTI-MEMORIZACIÓN
        const BANCO_SNELLEN_BASE = [
            { valor: 'E', distractoras: ['F', 'P', 'T'] },
            { valor: 'F', distractoras: ['P', 'T', 'Z'] },
            { valor: 'P', distractoras: ['E', 'D', 'L'] },
            { valor: 'Z', distractoras: ['O', 'E', 'D'] },
            { valor: 'L', distractoras: ['T', 'F', 'P'] },
            { valor: 'D', distractoras: ['O', 'C', 'Q'] },
            { valor: 'H', distractoras: ['N', 'K', 'X'] },
            { valor: 'N', distractoras: ['H', 'V', 'Z'] }
        ];

        const BANCO_ISHIHARA_BASE = [
            { valor: '12', distractoras: ['8', '6', 'Nada'], bg: 'rgba(239, 68, 68, 0.35)' },
            { valor: '74', distractoras: ['21', '71', 'Nada'], bg: 'rgba(16, 185, 129, 0.35)' },
            { valor: '6',  distractoras: ['8', '5', 'Nada'],  bg: 'rgba(229, 179, 36, 0.35)' },
            { valor: '8',  distractoras: ['3', '9', 'Nada'],  bg: 'rgba(14, 165, 233, 0.35)' },
            { valor: '29', distractoras: ['70', '26', 'Nada'], bg: 'rgba(168, 85, 247, 0.35)' }
        ];

        let bancoPruebasGenerado = [];
        let indexPruebaActual = 0;
        let aciertosTotales = 0;
        let examenEnCurso = false;
        let rostroCorrecto = false;

        const videoElement = document.getElementById('webcamInput');
        const pipCanvas = document.getElementById('pipCanvas');
        const pipCtx = pipCanvas.getContext('2d');
        const overlayDistancia = document.getElementById('overlayDistancia');
        const btnStartTest = document.getElementById('btnStartTest');

        function volverMenu() {
            const menuDestino = esB2B ? 'menu_B2B.html' : 'menu_B2C.html';
            window.location.href = `${menuDestino}?${urlParams.toString()}`;
        }

        // ALGORITMO CONSTRUCCIÓN ALEATORIA DE 8 PASOS
        function construirBancoAleatorio() {
            bancoPruebasGenerado = [];
            const tamanos = ['4.8rem', '3.6rem', '2.5rem', '1.6rem'];

            // 1. Tomar 4 ítems Snellen aleatorios con tamaños decrecientes
            const snellenShuffled = [...BANCO_SNELLEN_BASE].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 4; i++) {
                const base = snellenShuffled[i];
                const opciones = [base.valor, ...base.distractoras].sort(() => Math.random() - 0.5);
                bancoPruebasGenerado.push({
                    tipo: 'snellen',
                    valor: base.valor,
                    correcta: base.valor,
                    opciones: opciones,
                    fontSize: tamanos[i]
                });
            }

            // 2. Tomar 2 ítems de Ishihara (test de color) aleatorios
            const ishiharaShuffled = [...BANCO_ISHIHARA_BASE].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 2; i++) {
                const base = ishiharaShuffled[i];
                const opciones = [base.valor, ...base.distractoras].sort(() => Math.random() - 0.5);
                bancoPruebasGenerado.push({
                    tipo: 'ishihara',
                    valor: base.valor,
                    correcta: base.valor,
                    opciones: opciones,
                    bg: base.bg
                });
            }

            // 3. Ítem de Sensibilidad al Contraste
            const letrasContraste = ['C', 'O', 'G', 'D', 'Q'];
            const letraContrasteOk = letrasContraste[Math.floor(Math.random() * letrasContraste.length)];
            const distContraste = letrasContraste.filter(l => l !== letraContrasteOk).slice(0, 3);
            bancoPruebasGenerado.push({
                tipo: 'contraste',
                valor: letraContrasteOk,
                correcta: letraContrasteOk,
                opciones: [letraContrasteOk, ...distContraste].sort(() => Math.random() - 0.5),
                color: '#334155', // Bajo contraste sobre fondo oscuro
                fontSize: '2.8rem'
            });

            // 4. Ítem de Destello / Recuperación Nocturna
            const letrasDestello = ['8', '3', '0', '6', '9'];
            const letraDestelloOk = letrasDestello[Math.floor(Math.random() * letrasDestello.length)];
            const distDestello = letrasDestello.filter(l => l !== letraDestelloOk).slice(0, 3);
            bancoPruebasGenerado.push({
                tipo: 'destello',
                valor: letraDestelloOk,
                correcta: letraDestelloOk,
                opciones: [letraDestelloOk, ...distDestello].sort(() => Math.random() - 0.5),
                fontSize: '3.2rem'
            });

            // Mezclar el orden final de la batería
            bancoPruebasGenerado.sort(() => Math.random() - 0.5);
        }

        // INICIALIZAR MEDIAPIPE FACE MESH
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResultsFace);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 320,
            height: 240
        });

        camera.start().catch(() => {
            forzarHabilitacionCamara();
        });

        function onResultsFace(results) {
            pipCtx.save();
            pipCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.drawImage(results.image, 0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.restore();

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                const dx = landmarks[454].x - landmarks[234].x;
                const dy = landmarks[454].y - landmarks[234].y;
                const anchoRostro = Math.sqrt(dx * dx + dy * dy);

                if (anchoRostro > 0.55) {
                    actualizarEstadoCamara(false, '⚠️ MUY CERCA', 'Aléjate a 50 cm de la pantalla para continuar.');
                } else if (anchoRostro < 0.22) {
                    actualizarEstadoCamara(false, '⚠️ MUY LEJOS', 'Acércate a 50 cm de la pantalla para continuar.');
                } else {
                    actualizarEstadoCamara(true, '✓ DISTANCIA OK', '');
                }
            } else {
                actualizarEstadoCamara(false, '⚠ ROSTRO NO DETECTADO', 'Ubica tu rostro frente a la cámara sin obstrucciones.');
            }
        }

        function actualizarEstadoCamara(ok, titulo, desc) {
            rostroCorrecto = ok;
            const stDistancia = document.getElementById('stDistancia');

            if (ok) {
                stDistancia.textContent = 'OK (50 cm)';
                stDistancia.className = 'val-st-green';
                overlayDistancia.style.display = 'none';
                if (!examenEnCurso) btnStartTest.disabled = false;
            } else {
                stDistancia.textContent = 'INCORRECTA';
                stDistancia.className = 'val-st-red';
                overlayDistancia.style.display = 'flex';
                document.getElementById('txtBloqueoTitulo').textContent = titulo;
                document.getElementById('txtBloqueoDesc').textContent = desc;
                if (!examenEnCurso) btnStartTest.disabled = true;
            }
        }

        function forzarHabilitacionCamara() {
            rostroCorrecto = true;
            document.getElementById('stDistancia').textContent = 'MANUAL (50 cm)';
            document.getElementById('stDistancia').className = 'val-st-green';
            overlayDistancia.style.display = 'none';
            btnStartTest.disabled = false;
        }

        function iniciarExamenVisual() {
            if (!rostroCorrecto) return;
            construirBancoAleatorio();
            examenEnCurso = true;
            indexPruebaActual = 0;
            aciertosTotales = 0;

            btnStartTest.style.display = 'none';
            document.getElementById('gridRespuestas').style.display = 'grid';
            cargarPruebaActual();
        }

        function cargarPruebaActual() {
            if (indexPruebaActual >= bancoPruebasGenerado.length) {
                finalizarExamenVisual();
                return;
            }

            const item = bancoPruebasGenerado[indexPruebaActual];
            const display = document.getElementById('displayVisual');
            const grid = document.getElementById('gridRespuestas');

            document.getElementById('stFase').textContent = `${indexPruebaActual + 1} / ${bancoPruebasGenerado.length}`;
            document.getElementById('stAciertos').textContent = `${aciertosTotales} / ${bancoPruebasGenerado.length}`;

            display.className = 'optotipo-display';
            display.style.color = item.color || '#fff';
            display.style.fontSize = item.fontSize || '4.5rem';
            display.style.background = item.bg || 'transparent';

            if (item.tipo === 'ishihara') {
                display.className = 'ishihara-circle';
                display.textContent = item.valor;
            } else if (item.tipo === 'destello') {
                display.style.background = '#ffffff';
                display.style.color = '#000000';
                display.textContent = '⚡';
                setTimeout(() => {
                    display.style.background = 'transparent';
                    display.style.color = '#ffffff';
                    display.textContent = item.valor;
                }, 700);
            } else {
                display.textContent = item.valor;
            }

            grid.innerHTML = '';
            item.opciones.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-opt-visual';
                btn.textContent = opt;
                btn.onclick = () => responderPrueba(opt, item.correcta);
                grid.appendChild(btn);
            });
        }

        function responderPrueba(respuesta, correcta) {
            if (!rostroCorrecto) return;

            if (respuesta === correcta) {
                aciertosTotales++;
            }

            indexPruebaActual++;
            cargarPruebaActual();
        }

        function finalizarExamenVisual() {
            examenEnCurso = false;
            document.getElementById('gridRespuestas').style.display = 'none';
            
            const display = document.getElementById('displayVisual');
            display.className = 'optotipo-display';
            display.style.fontSize = '3.5rem';

            // EVALUACIÓN ESTRICTA D.S. N° 170: MÍNIMO 7 DE 8 ACIERTOS (≥ 87.5%) PARA APROBADO (0.8 Binocular Snellen)
            const aprobado = aciertosTotales >= 7;
            const precisionVal = Math.round((aciertosTotales / 8) * 100);

            let agudezaFinal = '20/20 (1.0)';
            if (aciertosTotales === 8) agudezaFinal = '20/20 (1.0 - Sobresaliente)';
            else if (aciertosTotales === 7) agudezaFinal = '20/25 (0.8 - Norma D.S. 170 OK)';
            else if (aciertosTotales >= 5) agudezaFinal = '20/40 (0.5 - Observado)';
            else agudezaFinal = '20/100 (0.2 - Rechazado)';

            display.textContent = aprobado ? '✓' : '⚠️';
            display.style.color = aprobado ? '#10b981' : '#ef4444';

            if (modoActual === 'DEMO') {
                localStorage.setItem('visual_demo_completada', 'true');

                urlParams.set('demo', 'false');
                urlParams.set('fase', 'oficial');
                window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);

                mostrarModalResultadoVisual(aciertosTotales, agudezaFinal, aprobado, true);
            } else if (modoActual === 'OFICIAL') {
                let modulosRendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || {};
                modulosRendidos.visual = true;
                localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(modulosRendidos));

                let historial = JSON.parse(localStorage.getItem('sensometrika_historial_visual')) || [];
                let intentoNumero = parseInt(localStorage.getItem('sensometrika_intento_actual') || '1');

                historial.push({
                    simulacion: intentoNumero,
                    fecha: new Date().toISOString(),
                    aciertos: aciertosTotales,
                    total: 8,
                    precision: precisionVal,
                    agudeza: agudezaFinal,
                    colores: aciertosTotales >= 7 ? 'NORMAL (8/8)' : 'OBSERVADO',
                    aprobado: aprobado,
                    dictamen: aprobado ? 'APROBADO' : 'OBSERVADO'
                });
                localStorage.setItem('sensometrika_historial_visual', JSON.stringify(historial));

                mostrarModalResultadoVisual(aciertosTotales, agudezaFinal, aprobado, false);
            }
        }

        function mostrarModalResultadoVisual(aciertos, agudeza, aprobado, esDemo) {
            const modalExistente = document.getElementById('modalResultadoVisual');
            if (modalExistente) modalExistente.remove();

            const tituloModal = esDemo ? 'CALIBRACIÓN DEMO COMPLETADA' : (esB2B ? 'Simulación Oficial B2B Registrada' : 'Simulación Oficial Registrada');
            const mensajeModal = esDemo ? 'Has finalizado tu ensayo visual. Ya puedes realizar tu Simulación Oficial.' : '<b>¡Evaluación registrada correctamente!</b>';

            const modalHtml = `
                <div id="modalResultadoVisual" style="position: fixed; inset: 0; background: rgba(5, 8, 18, 0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 16px;">
                    <div style="background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; width: 100%; max-width: 380px; padding: 24px 20px; text-align: center; box-shadow: 0 20px 30px rgba(0,0,0,0.7); color: #f8fafc;">
                        <h3 style="color: #ffffff; margin-bottom: 4px; font-size: 1.15rem; font-weight: 800;">${tituloModal}</h3>
                        <p style="color: #38bdf8; margin-bottom: 16px; font-size: 0.85rem; font-weight: 600;">Módulo: Tamizaje Visual Integral</p>

                        <div style="margin-bottom: 18px;">
                            <span style="display: inline-block; padding: 4px 18px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em; background: ${aprobado ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)'}; border: 1px solid ${aprobado ? '#10b981' : '#ef4444'}; color: ${aprobado ? '#34d399' : '#f87171'};">
                                ${aprobado ? 'APROBADO' : 'OBSERVADO (FUERA DE NORMA D.S. N° 170)'}
                            </span>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #070b14; border: 1px solid #1e293b; border-radius: 12px; padding: 14px 10px; margin-bottom: 20px; text-align: left;">
                            <div>
                                <span style="display: block; font-size: 0.68rem; color: #94a3b8; font-weight: 600;">Aciertos Correctos</span>
                                <strong style="color: #ffffff; font-size: 1rem; font-weight: 800;">${aciertos} / 8</strong>
                            </div>
                            <div>
                                <span style="display: block; font-size: 0.68rem; color: #94a3b8; font-weight: 600;">Agudeza Estimada</span>
                                <strong style="color: ${aprobado ? '#10b981' : '#ef4444'}; font-size: 0.85rem; font-weight: 800;">${agudeza}</strong>
                            </div>
                        </div>

                        <p style="font-size: 0.8rem; color: #cbd5e1; margin-bottom: 16px;">${mensajeModal}</p>

                        <button onclick="${esDemo ? "document.getElementById('modalResultadoVisual').remove(); location.reload();" : "volverMenu()"}" style="width: 100%; background: #0284c7; color: #ffffff; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);">
                            ${esDemo ? 'CONTINUAR A SIMULACIÓN OFICIAL →' : '← VOLVER AL MENÚ DE EVALUACIONES'}
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }
    </script>
</body>
</html>
