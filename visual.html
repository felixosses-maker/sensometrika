<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Tamizaje Visual y Agudeza</title>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-gold: #e5b324;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
            --blue-btn-border: #0369a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 4px 0 8px 0;
            width: 100%;
        }

        .brand-logo-img {
            width: 220px;
            height: auto;
            display: block;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .eval-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-badge-container { display: flex; justify-content: center; }

        .status-badge {
            background-color: #0f233d;
            border: 1px solid #1d4ed8;
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot-status {
            width: 8px;
            height: 8px;
            background-color: var(--accent-gold);
            border-radius: 50%;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #050a12;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        video {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 75px;
            height: 55px;
            border-radius: 6px;
            border: 1px solid var(--accent-cyan);
            object-fit: cover;
            background: #000;
            z-index: 10;
        }

        .optotipo-display {
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            line-height: 1;
            transition: all 0.2s;
        }

        .timer-bar-container {
            width: 100%;
            height: 4px;
            background: #1e293b;
            position: absolute;
            bottom: 0; left: 0;
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background: var(--accent-cyan);
            transition: width 0.1s linear;
        }

        .instruction-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.4;
            padding: 0 8px;
        }

        .action-container { display: flex; flex-direction: column; gap: 10px; }

        .btn-start {
            background-color: var(--blue-btn);
            border: 1px solid var(--blue-btn-border);
            color: #ffffff;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        .controls-grid {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 240px;
            margin: 0 auto;
            width: 100%;
        }

        .btn-arrow {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--accent-cyan);
            font-size: 1.4rem;
            font-weight: 800;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .btn-arrow:active { background: var(--blue-btn); color: #ffffff; }

        .salida-buttons-wrapper {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .btn-informe {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-menu-volver {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            background-color: #070d17;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 8px;
        }

        .metric-item { display: flex; flex-direction: column; gap: 4px; }
        .metric-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; }
        .metric-value { font-size: 1.1rem; font-weight: 800; color: #ffffff; }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span class="brand-subtitle">MÓDULO SCREENING VISUAL AVANZADO</span>
        </header>

        <div class="eval-card">
            <div class="top-nav">
                <button id="btnVolverNav" class="nav-btn">← Menú Evaluaciones</button>
            </div>

            <div class="status-badge-container">
                <div class="status-badge">
                    <span id="badgeDot" class="dot-status"></span>
                    <span id="badgeText">Cargando estado...</span>
                </div>
            </div>

            <div class="canvas-wrapper">
                <video id="webcamPreview" autoplay playsinline muted></video>
                <div id="optotipoText" class="optotipo-display" style="font-size: 4rem;">📷</div>
                <div class="timer-bar-container"><div id="timerBar" class="timer-bar"></div></div>
            </div>

            <div class="instruction-text" id="instructionText">
                Active su cámara web para calibrar la distancia reglamentaria antes de comenzar el examen pericial.
            </div>

            <div class="action-container">
                <button id="btnActivarCamara" class="btn-start" style="background-color: var(--accent-gold); color: #000;">
                    📷 ACTIVAR Y CALIBRAR CÁMARA WEB
                </button>
                <button id="btnStart" class="btn-start" style="display: none;">INICIAR EXAMEN VISUAL PERICIAL</button>

                <!-- Controles de respuesta táctil / pantalla -->
                <div id="controlsGrid" class="controls-grid">
                    <div></div>
                    <button class="btn-arrow" onclick="responder('ARRIBA')">▲</button>
                    <div></div>
                    <button class="btn-arrow" onclick="responder('IZQUIERDA')">◄</button>
                    <div></div>
                    <button class="btn-arrow" onclick="responder('DERECHA')">►</button>
                    <div></div>
                    <button class="btn-arrow" onclick="responder('ABAJO')">▼</button>
                    <div></div>
                </div>
                
                <div id="salidaWrapper" class="salida-buttons-wrapper">
                    <button id="btnVerInforme" class="btn-informe">📊 VER INFORME DIAGNÓSTICO</button>
                    <button id="btnVolverMenuExamen" class="btn-menu-volver">← VOLVER AL MENÚ DE EVALUACIONES</button>
                </div>
            </div>

            <div class="metrics-grid">
                <div class="metric-item">
                    <span class="metric-label">DISTANCIA</span>
                    <span id="metricDistancia" class="metric-value" style="color: #e5b324;">PENDIENTE</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">ACIERTOS</span>
                    <span id="metricAciertos" class="metric-value" style="color: #ffffff;">0 / 8</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">AGUDEZA EST.</span>
                    <span id="metricAgudeza" class="metric-value" style="color: #10b981;">--/--</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const btnActivarCamara = document.getElementById('btnActivarCamara');
        const btnStart = document.getElementById('btnStart');
        const webcamPreview = document.getElementById('webcamPreview');
        const optotipoText = document.getElementById('optotipoText');
        const metricDistancia = document.getElementById('metricDistancia');
        const metricAciertos = document.getElementById('metricAciertos');
        const metricAgudeza = document.getElementById('metricAgudeza');
        const controlsGrid = document.getElementById('controlsGrid');
        const timerBar = document.getElementById('timerBar');

        const salidaWrapper = document.getElementById('salidaWrapper');
        const btnVerInforme = document.getElementById('btnVerInforme');
        const btnVolverMenuExamen = document.getElementById('btnVolverMenuExamen');
        const btnVolverNav = document.getElementById('btnVolverNav');

        const badgeDot = document.getElementById('badgeDot');
        const badgeText = document.getElementById('badgeText');
        const instructionText = document.getElementById('instructionText');

        const plan = localStorage.getItem('sensometrika_plan') || 'B2C';
        const esB2B = (plan === 'B2B' || localStorage.getItem('sensometrika_b2b_mode') === 'true');

        const rutaMenuOrigen = esB2B ? 'menu_B2B.html' : 'menu_B2C.html';
        const rutaInformeOrigen = esB2B ? 'informe-b2b.html' : 'informe.html';

        btnVolverNav.addEventListener('click', () => { window.location.href = rutaMenuOrigen; });
        btnVolverMenuExamen.addEventListener('click', () => { window.location.href = rutaMenuOrigen; });
        btnVerInforme.addEventListener('click', () => { window.location.href = rutaInformeOrigen; });

        // Batería de 8 preguntas con tamaños reducidos progresivos
        const bateria = [
            { dir: 'DERECHA', size: '5rem', desc: 'Agudeza 20/100' },
            { dir: 'ARRIBA', size: '4rem', desc: 'Agudeza 20/70' },
            { dir: 'IZQUIERDA', size: '3rem', desc: 'Agudeza 20/50' },
            { dir: 'ABAJO', size: '2.2rem', desc: 'Agudeza 20/40' },
            { dir: 'DERECHA', size: '1.6rem', desc: 'Agudeza 20/30' },
            { dir: 'ARRIBA', size: '1.2rem', desc: 'Agudeza 20/20' },
            { dir: 'IZQUIERDA', size: '0.9rem', desc: 'Agudeza 20/15' },
            { dir: 'ABAJO', size: '0.7rem', desc: 'Examen de Límite' }
        ];

        const rotaciones = { 'DERECHA': '0deg', 'ABAJO': '90deg', 'IZQUIERDA': '180deg', 'ARRIBA': '270deg' };
        
        let pasoActual = 0;
        let aciertos = 0;
        let timerInterval = null;

        btnActivarCamara.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                webcamPreview.srcObject = stream;
                
                metricDistancia.textContent = 'DISTANCIA OK';
                metricDistancia.style.color = '#10b981';

                badgeText.textContent = 'Cámara Calibrada (Distancia OK)';
                badgeDot.style.backgroundColor = '#10b981';

                instructionText.textContent = 'Posición confirmada. Tienes 4 segundos por cada optotipo para responder.';

                btnActivarCamara.style.display = 'none';
                btnStart.style.display = 'block';
                optotipoText.textContent = 'E';
            } catch (err) {
                alert('No se pudo acceder a la cámara web. Otorgue permisos para continuar.');
            }
        });

        btnStart.addEventListener('click', () => {
            btnStart.style.display = 'none';
            controlsGrid.style.display = 'grid';
            pasoActual = 0;
            aciertos = 0;
            siguienteOptotipo();
        });

        function iniciarTemporizador() {
            clearInterval(timerInterval);
            timerBar.style.width = '100%';
            let tiempo = 40; // 4 segundos en decimas
            
            timerInterval = setInterval(() => {
                tiempo--;
                timerBar.style.width = `${(tiempo / 40) * 100}%`;

                if (tiempo <= 0) {
                    clearInterval(timerInterval);
                    responder('TIEMPO_EXPIRED');
                }
            }, 100);
        }

        function siguienteOptotipo() {
            if (pasoActual >= bateria.length) {
                finalizarExamen();
                return;
            }

            const item = bateria[pasoActual];
            optotipoText.textContent = 'E';
            optotipoText.style.fontSize = item.size;
            optotipoText.style.transform = `rotate(${rotaciones[item.dir]})`;
            
            instructionText.textContent = `Pregunta ${pasoActual + 1}/8 [${item.desc}]: Responda la orientación de la 'E'.`;
            badgeText.textContent = `Nivel ${pasoActual + 1} de 8`;

            iniciarTemporizador();
        }

        function responder(direccionRespuesta) {
            clearInterval(timerInterval);
            const itemActual = bateria[pasoActual];

            if (direccionRespuesta === itemActual.dir) {
                aciertos++;
            }

            pasoActual++;
            metricAciertos.textContent = `${aciertos} / 8`;
            siguienteOptotipo();
        }

        function finalizarExamen() {
            clearInterval(timerInterval);
            timerBar.style.width = '0%';
            controlsGrid.style.display = 'none';
            
            optotipoText.textContent = '✓';
            optotipoText.style.fontSize = '4rem';
            optotipoText.style.transform = 'rotate(0deg)';
            
            let agudezaResult = '20/100';
            if (aciertos >= 7) agudezaResult = '20/15 (Sobresaliente)';
            else if (aciertos >= 6) agudezaResult = '20/20 (Óptimo DS 170)';
            else if (aciertos >= 4) agudezaResult = '20/40 (Aceptable)';
            else agudezaResult = 'Deficiente';

            metricAgudeza.textContent = agudezaResult;
            instructionText.textContent = `Examen completado. Aciertos: ${aciertos}/8. Agudeza calculada: ${agudezaResult}.`;
            badgeText.textContent = 'Módulo Finalizado';
            salidaWrapper.style.display = 'flex';

            let historial = JSON.parse(localStorage.getItem('sensometrika_historial_visual')) || [];
            historial.push({ aciertos: aciertos, agudeza: agudezaResult, fecha: new Date().toISOString() });
            localStorage.setItem('sensometrika_historial_visual', JSON.stringify(historial));
        }

        document.addEventListener('keydown', (e) => {
            if (controlsGrid.style.display !== 'grid') return;
            if (e.key === 'ArrowUp') responder('ARRIBA');
            if (e.key === 'ArrowDown') responder('ABAJO');
            if (e.key === 'ArrowLeft') responder('IZQUIERDA');
            if (e.key === 'ArrowRight') responder('DERECHA');
        });
    </script>
</body>
</html>
