<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Tamizaje Visual</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .barra-superior {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .barra-superior a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .barra-conteo-b2c {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .caja-camara-estatus {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .visor-camara-oculto {
      width: 60px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
      transform: scaleX(-1);
      border: 2px solid #38bdf8;
    }
    .distancia-correcta { border-color: #22c55e !important; }
    .distancia-incorrecta { border-color: #ef4444 !important; }
    .area-estimulo-visual {
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 16px;
      width: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .grilla-opciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn-opcion-vis {
      background: #0f172a;
      border: 1.5px solid #38bdf8;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-opcion-vis:disabled {
      opacity: 0.35;
      border-color: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="barra-superior">
      <a href="menu.html">← Menú Principal</a>
      <span style="font-size: 0.8rem; color: #38bdf8; font-weight: 700;">MÓDULO 4: TAMIZAJE VISUAL</span>
    </header>

    <!-- Indicador dinámico de simulación (1 de 3, 2 de 3, etc.) -->
    <div id="caja-contador-simulacion" class="barra-conteo-b2c"></div>

    <!-- Auditoría de distancia por cámara frontal -->
    <section class="caja-camara-estatus" id="caja-camara">
      <video id="video-camara" class="visor-camara-oculto" autoplay playsinline muted></video>
      <div style="text-align: right;">
        <span id="etiqueta-distancia" style="display:block; font-size: 0.75rem; color: #94a3b8;">Iniciando cámara...</span>
        <strong id="estado-distancia" style="font-size: 0.85rem; color: #facc15;">Calibrando</strong>
      </div>
    </section>

    <div class="area-estimulo-visual">
      <canvas id="canvas-ishihara" width="200" height="200" style="display: none;"></canvas>
      <div id="simbolo-optotipo" style="display: none; font-weight: 900; color: #ffffff; line-height: 1; user-select: none;">E</div>
      <div id="panel-estado" style="color: #94a3b8; font-size: 0.85rem; text-align: center; margin-top: 6px;">
        Sostén el dispositivo con el brazo extendido (~50 cm)[cite: 2, 6]
      </div>
    </div>

    <!-- Botón inicial para Demo o Examen -->
    <button id="btn-iniciar-visual" class="btn-principal" style="margin-bottom: 12px;">Iniciar Calibración Visual</button>

    <!-- Contenedor dinámico de opciones de respuesta -->
    <div id="contenedor-opciones" class="grilla-opciones" style="display: none;"></div>

    <div id="zona-coordinacion-visual" style="width: 100%;"></div>
  </main>

  <script src="credit-manager.js"></script>
  <script src="visual.js"></script>
</body>
</html>
