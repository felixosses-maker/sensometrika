<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Screening Visual Pericial D.S. 170</title>
    <!-- MediaPipe Face Mesh para detección facial y estimación de distancia real -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-gold: #e5b324;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brand-logo-img {
            width: 180px;
            height: auto;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .card-visual {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* MONITOR DE CÁMARA Y TEST */
        .viewport-test {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cam-preview-pip {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 80px;
            height: 60px;
            border-radius: 6px;
            border: 2px solid var(--accent-cyan);
            object-fit: cover;
            z-index: 10;
            background: #111;
        }

        /* OVERLAY DE BLOQUEO POR DISTANCIA O FALTA DE ROSTRO */
        .overlay-bloqueo {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
            text-align: center;
            z-index: 50;
            border-radius: 10px;
        }

        .overlay-bloqueo h3 { color: var(--accent-red); font-size: 1.1rem; font-weight: 900; }
        .overlay-bloqueo p { color: #cbd5e1; font-size: 0.8rem; line-height: 1.4; }

        /* ESTIMULOS DE PRUEBA */
        .optotipo-display {
            font-size: 4.5rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .ishihara-circle {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: rgba(255,255,255,0.1);
        }

        /* BOTONES DE RESPUESTA */
        .opciones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-opt-visual {
            background: #070d17;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-opt-visual:hover:not(:disabled) {
            border-color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.15);
        }

        .btn-iniciar-examen {
            background: var(--blue-btn);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        /* METRICAS DE ESTADO */
        .status-bar-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: #070d17;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            text-align: center;
            font-size: 0.72rem;
        }

        .lbl-st { color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .val-st { color: #fff; font-weight: 800; }
        .val-st-green { color: var(--accent-green); font-weight: 800; }
        .val-st-red { color: var(--accent-red); font-weight: 800; }

        video { display: none; }
    </style>
</head>
<body>

    <video id="webcamInput" playsinline></video>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span class="brand-subtitle">MÓDULO SCREENING VISUAL PERICIAL</span>
        </header>

        <div class="card-visual">
            <!-- MONITOR DE PRUEBA -->
            <div class="viewport-test">
                <!-- Miniatura de Cámara Pip -->
                <canvas id="pipCanvas" class="cam-preview-pip"></canvas>

                <!-- Overlay Bloqueo de Distancia -->
                <div id="overlayDistancia" class="overlay-bloqueo">
                    <h3 id="txtBloqueoTitulo">⚠️ DISTANCIA FUERA DE RANGO</h3>
                    <p id="txtBloqueoDesc">Ubícate a 50 cm de la pantalla con rostro despejado para habilitar el test visual.</p>
                </div>

                <!-- Contenedor del Estímulo Visual -->
                <div id="displayVisual" class="optotipo-display">E</div>
            </div>

            <!-- BOTONES Y CONTROLES -->
            <button id="btnStartTest" class="btn-iniciar-examen" onclick="iniciarExamenVisual()" disabled>INICIAR EVALUACIÓN PERICIAL</button>

            <div id="gridRespuestas" class="opciones-grid" style="display: none;">
                <!-- Rellenado dinámicamente -->
            </div>

            <!-- BARRA DE ESTADO Y TELEMETRÍA -->
            <div class="status-bar-bottom">
                <div>
                    <span class="lbl-st">Distancia</span>
                    <span id="stDistancia" class="val-st-red">MALA</span>
                </div>
                <div>
                    <span class="lbl-st">Fase Examen</span>
                    <span id="stFase" class="val-st">1 / 4</span>
                </div>
                <div>
                    <span class="lbl-st">Aciertos</span>
                    <span id="stAciertos" class="val-st-green">0 / 8</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE FASES Y BANCO DE PRUEBAS PERICIALES
        const BANCO_PRUEBAS = [
            // Fase 1: Agudeza Lejana (Optotipos de Snellen)
            { fase: 'Agudeza Visual', tipo: 'snellen', valor: 'E', opciones: ['E', 'F', 'P', 'T'], correcta: 'E', fontSize: '5rem' },
            { fase: 'Agudeza Visual', tipo: 'snellen', valor: 'F', opciones: ['P', 'F', 'T', 'Z'], correcta: 'F', fontSize: '3.5rem' },
            { fase: 'Agudeza Visual', tipo: 'snellen', valor: 'P', opciones: ['E', 'D', 'P', 'L'], correcta: 'P', fontSize: '2.2rem' },
            { fase: 'Agudeza Visual', tipo: 'snellen', valor: 'Z', opciones: ['O', 'Z', 'E', 'D'], correcta: 'Z', fontSize: '1.2rem' },
            
            // Fase 2: Percepción Cromática (Ishihara Pseudoisocromático)
            { fase: 'Test Ishihara', tipo: 'ishihara', valor: '12', opciones: ['12', '8', '6', 'Nada'], correcta: '12', bg: 'rgba(239, 68, 68, 0.2)' },
            { fase: 'Test Ishihara', tipo: 'ishihara', valor: '74', opciones: ['21', '74', '71', 'Nada'], correcta: '74', bg: 'rgba(16, 185, 129, 0.2)' },

            // Fase 3: Visión Nocturna / Contrastes
            { fase: 'Visión Nocturna', tipo: 'contraste', valor: 'C', opciones: ['C', 'O', 'G', 'D'], correcta: 'C', color: '#334155' },

            // Fase 4: Encurandilamiento y Readecuación
            { fase: 'Recuperación Encarandilado', tipo: 'destello', valor: '8', opciones: ['3', '8', '0', '6'], correcta: '8' }
        ];

        let indexPruebaActual = 0;
        let aciertosTotales = 0;
        let examenEnCurso = false;
        let rostroCorrecto = false;

        const videoElement = document.getElementById('webcamInput');
        const pipCanvas = document.getElementById('pipCanvas');
        const pipCtx = pipCanvas.getContext('2d');
        const overlayDistancia = document.getElementById('overlayDistancia');
        const btnStartTest = document.getElementById('btnStartTest');

        // INICIALIZAR MEDIAPIPE FACE MESH PARA DISTANCIA
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults(onResultsFace);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 320,
            height: 240
        });
        camera.start();

        function onResultsFace(results) {
            // Dibujar miniatura en Pip
            pipCtx.save();
            pipCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.drawImage(results.image, 0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.restore();

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // Ancho del rostro entre pómulos (Landmarks 234 y 454)
                const dx = landmarks[454].x - landmarks[234].x;
                const dy = landmarks[454].y - landmarks[234].y;
                const anchoRostro = Math.sqrt(dx * dx + dy * dy);

                // Rango pericial de distancia ideal (~50 cm de la pantalla): 0.28 a 0.50
                if (anchoRostro > 0.55) {
                    // Demasiado cerca
                    actualizarEstadoCamara(false, '⚠️ MUY CERCA', 'Aléjate a 50 cm de la pantalla para continuar.');
                } else if (anchoRostro < 0.22) {
                    // Demasiado lejos
                    actualizarEstadoCamara(false, '⚠️ MUY LEJOS', 'Acércate a 50 cm de la pantalla para continuar.');
                } else {
                    // Distancia Perfecta
                    actualizarEstadoCamara(true, '✓ DISTANCIA OK', '');
                }
            } else {
                // Rostro tapado o ausente
                actualizarEstadoCamara(false, '⚠️ ROSTRO NO DETECTADO', 'Ubica tu rostro frente a la cámara sin obstrucciones.');
            }
        }

        function actualizarEstadoCamara(ok, titulo, desc) {
            rostroCorrecto = ok;
            const stDistancia = document.getElementById('stDistancia');

            if (ok) {
                stDistancia.textContent = 'OK (50 cm)';
                stDistancia.className = 'val-st-green';
                overlayDistancia.style.display = 'none';
                if (!examenEnCurso) btnStartTest.disabled = false;
            } else {
                stDistancia.textContent = 'INCORRECTA';
                stDistancia.className = 'val-st-red';
                overlayDistancia.style.display = 'flex';
                document.getElementById('txtBloqueoTitulo').textContent = titulo;
                document.getElementById('txtBloqueoDesc').textContent = desc;
                if (!examenEnCurso) btnStartTest.disabled = true;
            }
        }

        function iniciarExamenVisual() {
            if (!rostroCorrecto) return;
            examenEnCurso = true;
            indexPruebaActual = 0;
            aciertosTotales = 0;

            btnStartTest.style.display = 'none';
            document.getElementById('gridRespuestas').style.display = 'grid';
            cargarPruebaActual();
        }

        function cargarPruebaActual() {
            if (indexPruebaActual >= BANCO_PRUEBAS.length) {
                finalizarExamenVisual();
                return;
            }

            const item = BANCO_PRUEBAS[indexPruebaActual];
            const display = document.getElementById('displayVisual');
            const grid = document.getElementById('gridRespuestas');

            document.getElementById('stFase').textContent = `${indexPruebaActual + 1} / ${BANCO_PRUEBAS.length}`;
            document.getElementById('stAciertos').textContent = `${aciertosTotales} / ${BANCO_PRUEBAS.length}`;

            // Resetear estilos del viewport
            display.className = 'optotipo-display';
            display.style.color = item.color || '#fff';
            display.style.fontSize = item.fontSize || '4.5rem';
            display.style.background = item.bg || 'transparent';

            if (item.tipo === 'ishihara') {
                display.className = 'ishihara-circle';
                display.textContent = item.valor;
            } else if (item.tipo === 'destello') {
                // Simulación de encarandilamiento: Flash blanco breve
                display.style.background = '#ffffff';
                display.style.color = '#000000';
                display.textContent = '⚡';
                setTimeout(() => {
                    display.style.background = 'transparent';
                    display.style.color = '#ffffff';
                    display.textContent = item.valor;
                }, 800);
            } else {
                display.textContent = item.valor;
            }

            // Generar botones de respuesta
            grid.innerHTML = '';
            item.opciones.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-opt-visual';
                btn.textContent = opt;
                btn.onclick = () => responderPrueba(opt, item.correcta);
                grid.appendChild(btn);
            });
        }

        function responderPrueba(respuesta, correcta) {
            if (!rostroCorrecto) return;

            if (respuesta === correcta) {
                aciertosTotales++;
            }

            indexPruebaActual++;
            cargarPruebaActual();
        }

        function finalizarExamenVisual() {
            examenEnCurso = false;
            document.getElementById('gridRespuestas').style.display = 'none';
            
            const display = document.getElementById('displayVisual');
            display.className = 'optotipo-display';
            display.style.fontSize = '3.5rem';

            let agudezaFinal = '20/20';
            if (aciertosTotales >= 7) agudezaFinal = '20/15 (Sobresaliente)';
            else if (aciertosTotales >= 5) agudezaFinal = '20/20 (Norma D.S. 170 OK)';
            else if (aciertosTotales >= 3) agudezaFinal = '20/40 (Observado)';
            else agudezaFinal = '20/100 (Rechazado)';

            display.textContent = '✓';

            // Guardar en historial de LocalStorage
            let historial = JSON.parse(localStorage.getItem('sensometrika_historial_visual')) || [];
            historial.push({
                fecha: new Date().toISOString(),
                aciertos: aciertosTotales,
                agudeza: agudezaFinal
            });
            localStorage.setItem('sensometrika_historial_visual', JSON.stringify(historial));

            setTimeout(() => {
                window.location.href = 'informe.html';
            }, 1500);
        }
    </script>
</body>
</html>
