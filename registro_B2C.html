<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Registro de Postulante</title>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-gold: #e5b324;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-cyan: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* ENCABEZADO INTEGRADO CON MIX-BLEND-MODE */
        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 4px 0 8px 0;
            width: 100%;
        }

        .brand-logo-img {
            width: 220px;
            height: auto;
            display: block;
            mix-blend-mode: lighten; /* Elimina el recuadro negro y funde la imagen */
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45)); /* Resplandor cian fluido */
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 22px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-title {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge-plan-selected {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-cyan);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 800;
            text-align: center;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-label {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-input {
            background-color: #f1f5f9;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            width: 100%;
        }

        .field-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .btn-submit {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-submit:hover {
            background-color: var(--accent-green-hover);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Encabezado Armónico -->
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
        </header>

        <div class="form-card">
            <div class="form-title">REGISTRO DE POSTULANTE</div>

            <div id="badgePlan" class="badge-plan-selected">
                PLAN SELECCIONADO: PASE BÁSICO ($4.990 IVA Inc.)
            </div>

            <form id="formRegistro" onsubmit="guardarRegistro(event)">
                <div class="field-group">
                    <label class="field-label">NOMBRE COMPLETO</label>
                    <input type="text" id="txtNombre" class="field-input" placeholder="Ej: Juan Pérez Silva" required>
                </div>

                <div class="field-group" style="margin-top: 10px;">
                    <label class="field-label">RUT / CÉDULA DE IDENTIDAD</label>
                    <input type="text" id="txtRut" class="field-input" placeholder="Ej: 12.345.678-9" required>
                </div>

                <div class="field-group" style="margin-top: 10px;">
                    <label class="field-label">CORREO ELECTRÓNICO (RECEPCIÓN DE ENLACE E INFORME)</label>
                    <input type="email" id="txtEmail" class="field-input" placeholder="Ej: juan@ejemplo.cl" required>
                </div>

                <div class="field-group" style="margin-top: 10px;">
                    <label class="field-label">TELÉFONO DE CONTACTO</label>
                    <input type="tel" id="txtTelefono" class="field-input" placeholder="Ej: +56912345678" required>
                </div>

                <button type="submit" class="btn-submit">PROCEDER AL PAGO Y ACTIVAR EVALUACIÓN →</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const plan = (localStorage.getItem('sensometrika_plan') || 'BASICO').toUpperCase();
            const badgePlan = document.getElementById('badgePlan');

            if (plan === 'PLUS') {
                badgePlan.textContent = 'PLAN SELECCIONADO: PASE PLUS ($8.990 IVA Inc.)';
            } else if (plan === 'FULL') {
                badgePlan.textContent = 'PLAN SELECCIONADO: PASE FULL ($12.990 IVA Inc.)';
            } else {
                badgePlan.textContent = 'PLAN SELECCIONADO: PASE BÁSICO ($4.990 IVA Inc.)';
            }
        });

        function guardarRegistro(event) {
            event.preventDefault();
            
            const usuario = {
                nombre: document.getElementById('txtNombre').value.trim(),
                rut: document.getElementById('txtRut').value.trim(),
                email: document.getElementById('txtEmail').value.trim(),
                telefono: document.getElementById('txtTelefono').value.trim()
            };

            localStorage.setItem('sensometrika_usuario_b2c', JSON.stringify(usuario));
            window.location.href = 'latencia.html';
        }
    </script>
</body>
</html>
