<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Checkout Seguro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .contenedor-checkout {
      width: 100%;
      max-width: 520px;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 14px;
      padding: 24px 20px;
      box-sizing: border-box;
    }
    .cabecera-checkout {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .cabecera-checkout h1 {
      font-size: 1.25rem;
      margin: 0 0 6px 0;
      color: #38bdf8;
    }
    .caja-resumen {
      background: #1e293b;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 18px;
      border-left: 4px solid #0284c7;
    }
    .caja-resumen h3 {
      margin: 0 0 4px 0;
      font-size: 0.95rem;
      color: #ffffff;
    }
    .monto-total {
      font-size: 1.3rem;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 4px;
    }
    .badge-modo-pruebas {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid #d97706;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .grupo-campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    input[type="text"], input[type="email"] {
      background: #0b1120;
      border: 1.5px solid #334155;
      border-radius: 6px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
      width: 100%;
    }
    input[type="text"]:focus, input[type="email"]:focus {
      border-color: #38bdf8;
    }
    .caja-terminos {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed #334155;
      border-radius: 6px;
      padding: 12px;
      margin: 18px 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .caja-terminos input[type="checkbox"] {
      margin-top: 3px;
      accent-color: #0284c7;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .caja-terminos label {
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.4;
      cursor: pointer;
    }
    .caja-terminos a {
      color: #38bdf8;
      text-decoration: underline;
    }
    .btn-pagar {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
    }
    .btn-pagar:hover {
      background: #0369a1;
    }
    .btn-pagar:disabled {
      background: #334155;
      cursor: not-allowed;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="contenedor-checkout">
    <header class="cabecera-checkout">
      <h1>Sensometrika • Checkout</h1>
      <span style="font-size: 0.75rem; color: #94a3b8;">Plataforma de Control Psicomotor y Sensorial</span>
    </header>

    <section class="caja-resumen">
      <div style="font-size: 0.72rem; color: #94a3b8; text-transform: uppercase;">Plan a Contratar:</div>
      <h3 id="txt-nombre-plan">Cargando Plan...</h3>
      <div class="monto-total" id="txt-monto-total">$0 CLP</div>
      <div id="txt-desglose" style="font-size: 0.74rem; color: #64748b; margin-top: 2px;"></div>
      <div><span class="badge-modo-pruebas">⚡ MODO PRUEBAS ACTIVO: ACCESO DIRECTO SIN TARJETAS</span></div>
    </section>

    <form id="form-pago" onsubmit="procesarPagoDirecto(event)">
      
      <!-- Campos de Filiación -->
      <div id="bloque-filiacion">
        <div class="grupo-campo">
          <label for="pago-nombre" id="lbl-nombre">Nombre Completo del Postulante *</label>
          <input type="text" id="pago-nombre" placeholder="Ej: Felix Osses Martinez" required>
        </div>

        <div class="grupo-campo">
          <label for="pago-rut" id="lbl-rut">RUT del Postulante *</label>
          <input type="text" id="pago-rut" placeholder="Ej: 13.741.882-7" required>
        </div>

        <div class="grupo-campo">
          <label for="pago-correo">Correo Electrónico para Resultados *</label>
          <input type="email" id="pago-correo" placeholder="Ej: contacto@correo.cl" required>
        </div>
      </div>

      <!-- Campos Corporativos B2B -->
      <div id="bloque-b2b" style="display: none; border-top: 1px dashed #334155; padding-top: 14px; margin-top: 14px;">
        <div style="font-size: 0.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 10px;">🏢 DATOS DE FACTURACIÓN Y CONTROL EMPRESA</div>
        
        <div class="grupo-campo">
          <label for="pago-razon-social">Razón Social Empresa (Factura) *</label>
          <input type="text" id="pago-razon-social" placeholder="Ej: Socadep Ltda">
        </div>

        <div class="grupo-campo">
          <label for="pago-rut-empresa">RUT Empresa *</label>
          <input type="text" id="pago-rut-empresa" placeholder="Ej: 77.111.111-1">
        </div>

        <div class="grupo-campo">
          <label for="pago-cargo">Cargo del Responsable (APR / Jefatura) *</label>
          <input type="text" id="pago-cargo" placeholder="Ej: Supervisor Prevención de Riesgos">
        </div>
      </div>

      <!-- Términos Legales -->
      <div class="caja-terminos">
        <input type="checkbox" id="chk-terminos" required>
        <label for="chk-terminos">
          Declaro conocer y aceptar los <a href="terminos.html" target="_blank">Términos de Servicio y Aspectos Legales</a>. Autorizo el tratamiento de mis datos de rendimiento psicomotor y confirmo entender la <strong>Cláusula de Alcance Técnico (Ley N° 18.290 / D.S. N° 170)</strong>.
        </label>
      </div>

      <button type="submit" class="btn-pagar" id="btn-submit-pago">
        ⚡ Iniciar Evaluación Inmediata (Modo Pruebas) →
      </button>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let pedido = JSON.parse(localStorage.getItem('sensometrika_plan_pedido'));
      
      // Respaldo inteligente si no venía en memoria
      if (!pedido) {
        pedido = {
          rol: 'particular',
          planId: 'part_basico',
          nombrePlan: 'Pase Básico Psicomotriz',
          precioTotal: 4990,
          modulosPermitidos: ['reactimetro', 'palancas', 'punteo'],
          simulacionesPermitidas: 3
        };
      }

      const bloqueB2B = document.getElementById('bloque-b2b');
      const txtNombre = document.getElementById('txt-nombre-plan');
      const txtMonto = document.getElementById('txt-monto-total');
      const txtDesglose = document.getElementById('txt-desglose');
      const inRazon = document.getElementById('pago-razon-social');
      const inRutEmp = document.getElementById('pago-rut-empresa');
      const inCargo = document.getElementById('pago-cargo');
      const lblNombre = document.getElementById('lbl-nombre');
      const lblRut = document.getElementById('lbl-rut');

      txtNombre.innerText = pedido.nombrePlan || 'Plan Sensometrika';
      txtMonto.innerText = `$${(pedido.precioTotal || pedido.precio || 4990).toLocaleString('es-CL')} CLP`;

      const esB2B = pedido.rol === 'empresa' || (pedido.planId && String(pedido.planId).toLowerCase().includes('b2b'));

      if (esB2B) {
        bloqueB2B.style.display = 'block';
        inRazon.required = true;
        inRutEmp.required = true;
        inCargo.required = true;
        lblNombre.innerText = 'Nombre Completo del Responsable (APR / Jefatura) *';
        lblRut.innerText = 'RUT del Responsable *';
        txtDesglose.innerText = `Neto: $${(pedido.precioNeto || pedido.precio || 79900).toLocaleString('es-CL')} + IVA (Factura DTE 33)`;
      } else {
        bloqueB2B.style.display = 'none';
        inRazon.required = false;
        inRutEmp.required = false;
        inCargo.required = false;
        lblNombre.innerText = 'Nombre Completo del Postulante *';
        lblRut.innerText = 'RUT del Postulante *';
        txtDesglose.innerText = 'Boleta Electrónica IVA Incluido';
      }
    });

    function procesarPagoDirecto(e) {
      e.preventDefault();

      const btn = document.getElementById('btn-submit-pago');
      btn.disabled = true;
      btn.innerText = 'Liberando Plan...';

      let pedido = JSON.parse(localStorage.getItem('sensometrika_plan_pedido')) || {};
      const esB2B = pedido.rol === 'empresa' || (pedido.planId && String(pedido.planId).toLowerCase().includes('b2b'));
      const planId = String(pedido.planId || '').toLowerCase();

      // Resolver con precisión matemática los módulos según el plan adquirido
      let modulosFinales = ['reactimetro', 'palancas', 'punteo'];
      let limiteSimulaciones = 3;

      if (esB2B) {
        limiteSimulaciones = 1; // En B2B es 1 evaluación oficial por trabajador
        if (planId.includes('full') || planId.includes('integral')) {
          modulosFinales = ['reactimetro', 'palancas', 'punteo', 'visual', 'auditivo'];
        } else if (planId.includes('semi1') || planId.includes('visual')) {
          modulosFinales = ['reactimetro', 'palancas', 'punteo', 'visual'];
        } else if (planId.includes('semi2') || planId.includes('auditivo')) {
          modulosFinales = ['reactimetro', 'palancas', 'punteo', 'auditivo'];
        } else {
          modulosFinales = ['reactimetro', 'palancas', 'punteo']; // B2B Básico
        }
      } else {
        // Reglas B2C
        if (planId.includes('full') || planId.includes('integral')) {
          modulosFinales = ['reactimetro', 'palancas', 'punteo', 'visual', 'auditivo'];
          limiteSimulaciones = 8;
        } else if (planId.includes('plus') || planId.includes('visual')) {
          modulosFinales = ['reactimetro', 'palancas', 'punteo', 'visual'];
          limiteSimulaciones = 5;
        } else {
          modulosFinales = ['reactimetro', 'palancas', 'punteo']; // B2C Básico
          limiteSimulaciones = 3;
        }
      }

      const nombre = document.getElementById('pago-nombre').value.trim();
      const rut = document.getElementById('pago-rut').value.trim();
      const correo = document.getElementById('pago-correo').value.trim();

      if (!esB2B) {
        // B2C: Postulante directo
        localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
          nombre: nombre,
          rut: rut,
          correo: correo,
          empresa: 'Particular'
        }));

        localStorage.setItem('sensometrika_sesion', JSON.stringify({
          rol: 'particular',
          planId: pedido.planId || 'part_basico',
          nombrePlan: pedido.nombrePlan || 'Pase Básico Psicomotriz',
          modulosPermitidos: modulosFinales,
          limiteSimulaciones: limiteSimulaciones,
          simulacionesConsumidas: { reactimetro: 0, palancas: 0, punteo: 0, visual: 0, auditivo: 0 },
          pagoAprobado: true,
          correoInforme: correo
        }));
      } else {
        // B2B: Datos de la empresa compradora
        const razonSocial = document.getElementById('pago-razon-social').value.trim() || 'Socadep Ltda';
        localStorage.setItem('sensometrika_plan_empresa', JSON.stringify({
          razonSocial: razonSocial,
          rutEmpresa: document.getElementById('pago-rut-empresa').value.trim(),
          responsable: nombre,
          rutResponsable: rut,
          cargo: document.getElementById('pago-cargo').value.trim(),
          correoInformes: correo
        }));

        localStorage.setItem('sensometrika_sesion', JSON.stringify({
          rol: 'empresa',
          planId: pedido.planId || 'b2b_basico',
          nombrePlan: pedido.nombrePlan || 'Plan Empresa Básico',
          modulosPermitidos: modulosFinales,
          limiteSimulaciones: 1,
          simulacionesConsumidas: { reactimetro: 0, palancas: 0, punteo: 0, visual: 0, auditivo: 0 },
          pagoAprobado: true,
          correoInformes: correo,
          razonSocial: razonSocial
        }));

        // Limpiar para que el trabajador evaluado ingrese en faena
        localStorage.removeItem('sensometrika_datos_usuario');
      }

      // Limpiar marcas previas
      localStorage.removeItem('sensometrika_reactimetro');
      localStorage.removeItem('sensometrika_palancas');
      localStorage.removeItem('sensometrika_punteo');
      localStorage.removeItem('sensometrika_visual');
      localStorage.removeItem('sensometrika_auditivo');
      localStorage.removeItem('sensometrika_firma_trabajador');
      localStorage.removeItem('sensometrika_folio_activo');

      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
