<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika SpA • Finalización de Compra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --input-bg: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --cyan-accent: #38bdf8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 14px;
    }
    .tarjeta-checkout {
      width: 100%;
      max-width: 440px;
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 22px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .encabezado-checkout {
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }
    .encabezado-checkout h2 { font-size: 1.25rem; font-weight: 800; color: #fff; }
    .encabezado-checkout p { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

    .resumen-cobro {
      background-color: #070d17;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fila-resumen {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .fila-resumen strong { color: #fff; }
    .fila-precio {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1px dashed #334155;
    }
    .fila-precio span { font-size: 0.88rem; font-weight: 700; color: #fff; }
    .fila-precio .monto { font-size: 1.35rem; font-weight: 900; color: var(--cyan-accent); }

    .banner-mock {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.72rem;
      color: #fbbf24;
      font-weight: 600;
      text-align: center;
    }

    .formulario-pago {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .campo-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .campo-form label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .campo-form input {
      height: 42px;
      background-color: var(--input-bg);
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #fff;
      padding: 0 12px;
      font-size: 0.88rem;
      outline: none;
    }
    .campo-form input:focus { border-color: var(--primary); }

    .seccion-b2b {
      display: none;
      flex-direction: column;
      gap: 10px;
      border-top: 1px dashed #334155;
      padding-top: 12px;
      margin-top: 4px;
    }

    .bloque-legal {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 4px;
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .bloque-legal input { margin-top: 2px; }
    .bloque-legal a { color: var(--cyan-accent); text-decoration: underline; }

    .btn-pagar {
      height: 48px;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      transition: background-color 0.2s;
    }
    .btn-pagar:hover { background-color: #0369a1; }
    .btn-pagar:active { transform: scale(0.98); }

    .link-volver {
      display: block;
      text-align: center;
      color: #64748b;
      font-size: 0.78rem;
      text-decoration: none;
      margin-top: 4px;
    }
    .link-volver:hover { color: var(--cyan-accent); }
  </style>
</head>
<body>

  <main class="tarjeta-checkout">
    <header class="encabezado-checkout">
      <h2>SENSOMETRIKA SpA</h2>
      <p>Plataforma de Control Psicomotor y Sensorial</p>
    </header>

    <!-- Resumen Comercial -->
    <section class="resumen-cobro">
      <div class="fila-resumen">
        <span>Plan a Contratar:</span>
        <strong id="txt-servicio">Cargando...</strong>
      </div>
      <div class="fila-resumen">
        <span>Régimen:</span>
        <strong id="txt-regimen">--</strong>
      </div>
      <div class="fila-resumen" id="fila-cant-evals" style="display: none;">
        <span>Evaluaciones Contratadas:</span>
        <strong id="txt-cantidad-evals">--</strong>
      </div>
      <div class="fila-resumen" id="fila-desglose-iva" style="display: none;">
        <span>Neto + IVA (19%):</span>
        <strong id="txt-desglose">--</strong>
      </div>
      <div class="fila-precio">
        <span id="txt-label-total">Total a Pagar:</span>
        <div class="monto" id="txt-total">$0 CLP</div>
      </div>
      <div style="font-size: 0.72rem; color: #64748b; text-align: right;" id="txt-pie-iva">
        Boleta Electrónica IVA Incluido
      </div>
    </section>

    <div class="banner-mock">
      ⚡ MODO PRUEBAS ACTIVO: ACCESO DIRECTO SIN TARJETAS
    </div>

    <!-- Formulario de Checkout -->
    <form class="formulario-pago" onsubmit="procesarPagoSeguro(event)">
      <!-- Datos Titular (B2C Particular o Supervisor B2B) -->
      <div class="campo-form">
        <label id="lbl-nombre">Nombre Completo *</label>
        <input type="text" id="in-nombre" required placeholder="Ej: Alejandro Pérez">
      </div>

      <div class="campo-form">
        <label id="lbl-rut">RUT *</label>
        <input type="text" id="in-rut" required placeholder="Ej: 13.334.455-7">
      </div>

      <div class="campo-form">
        <label id="lbl-email">Correo Electrónico para Resultados *</label>
        <input type="email" id="in-email" required placeholder="Ej: contacto@correo.cl">
      </div>

      <!-- Campos Corporativos Exclusivos B2B -->
      <div class="seccion-b2b" id="bloque-empresa">
        <div class="campo-form">
          <label style="color: #38bdf8;">Razón Social Empresa (Para Factura) *</label>
          <input type="text" id="in-empresa-nombre" placeholder="Ej: Transportes del Norte SpA">
        </div>
        <div class="campo-form">
          <label style="color: #38bdf8;">RUT Empresa (DTE 33) *</label>
          <input type="text" id="in-empresa-rut" placeholder="Ej: 76.123.456-7">
        </div>
        <div class="campo-form">
          <label style="color: #38bdf8;">Cargo en la Empresa *</label>
          <input type="text" id="in-empresa-cargo" placeholder="Ej: Supervisión Técnica / APR">
        </div>
      </div>

      <!-- Términos y Consentimiento Legal -->
      <div class="bloque-legal">
        <input type="checkbox" id="check-terminos" required checked>
        <label for="check-terminos">
          Declaro conocer y aceptar los Términos de Servicio y Aspectos Legales. Autorizo el tratamiento de datos de rendimiento psicomotor y confirmo entender la Cláusula de Alcance Técnico (Ley N° 18.290 / D.S. N° 170).
        </label>
      </div>

      <button type="submit" class="btn-pagar" id="btn-submit-pago">
        ⚡ Iniciar Evaluación Inmediata (Modo Pruebas) →
      </button>

      <a href="planes.html" class="link-volver">← Cambiar de Plan</a>
    </form>
  </main>

  <script>
    let pedido = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Leer pedido desde catálogo o cargar Pase Básico B2C por defecto
      pedido = JSON.parse(localStorage.getItem('sensometrika_plan_pedido')) || {
        rol: 'particular',
        planId: 'part_basico',
        nombrePlan: 'Pase Básico Psicomotriz',
        precioTotal: 4990,
        modulosPermitidos: ['reactimetro', 'palancas', 'punteo']
      };

      document.getElementById('txt-servicio').innerText = pedido.nombrePlan;
      document.getElementById('txt-total').innerText = `$${(pedido.precioTotal || 4990).toLocaleString('es-CL')} CLP`;

      const esB2B = (pedido.rol === 'empresa' || (pedido.planId && String(pedido.planId).startsWith('b2b')));

      if (esB2B) {
        // Interfaz Corporativa B2B
        document.getElementById('txt-regimen').innerText = 'Convenio Corporativo (B2B)';
        document.getElementById('fila-cant-evals').style.display = 'flex';
        document.getElementById('txt-cantidad-evals').innerText = `${pedido.cantidad || 10} trabajadores`;
        document.getElementById('fila-desglose-iva').style.display = 'flex';
        
        const neto = pedido.precioNeto || Math.round((pedido.precioTotal || 79900) / 1.19);
        const iva = (pedido.precioTotal || 79900) - neto;
        document.getElementById('txt-desglose').innerText = `Neto: $${neto.toLocaleString('es-CL')} | IVA: $${iva.toLocaleString('es-CL')}`;
        document.getElementById('txt-pie-iva').innerText = 'Factura Electrónica DTE 33 (+19% IVA)';

        // Habilitar campos de empresa
        document.getElementById('bloque-empresa').style.display = 'flex';
        document.getElementById('lbl-nombre').innerText = 'Nombre del Supervisor APR / Responsable *';
        document.getElementById('lbl-rut').innerText = 'RUT del Responsable *';
        document.getElementById('in-empresa-nombre').required = true;
        document.getElementById('in-empresa-rut').required = true;
        document.getElementById('in-empresa-cargo').required = true;
      } else {
        // Interfaz Particular B2C
        document.getElementById('txt-regimen').innerText = 'Evaluación Individual (B2C)';
        document.getElementById('bloque-empresa').style.display = 'none';
        document.getElementById('lbl-nombre').innerText = 'Nombre Completo *';
        document.getElementById('lbl-rut').innerText = 'RUT *';
        document.getElementById('txt-pie-iva').innerText = 'Boleta Electrónica IVA Incluido';
        document.getElementById('in-empresa-nombre').required = false;
        document.getElementById('in-empresa-rut').required = false;
        document.getElementById('in-empresa-cargo').required = false;
      }
    });

    function procesarPagoSeguro(e) {
      e.preventDefault();

      const check = document.getElementById('check-terminos');
      if (!check.checked) {
        alert('Debe aceptar los términos de servicio para continuar.');
        return;
      }

      const nombre = document.getElementById('in-nombre').value.trim();
      const rut = document.getElementById('in-rut').value.trim();
      const email = document.getElementById('in-email').value.trim();
      const esB2B = (pedido.rol === 'empresa' || (pedido.planId && String(pedido.planId).startsWith('b2b')));

      // Limpiar mediciones anteriores
      localStorage.removeItem('sensometrika_reactimetro');
      localStorage.removeItem('sensometrika_palancas');
      localStorage.removeItem('sensometrika_punteo');
      localStorage.removeItem('sensometrika_visual');
      localStorage.removeItem('sensometrika_auditivo');

      if (esB2B) {
        // ENRUTAMIENTO B2B: Guarda supervisor y empresa, limpia usuario previo
        const razonSocial = document.getElementById('in-empresa-nombre').value.trim() || 'Empresa Faena';
        const rutEmpresa = document.getElementById('in-empresa-rut').value.trim();
        const cargo = document.getElementById('in-empresa-cargo').value.trim() || 'Supervisión APR';

        localStorage.setItem('sensometrika_plan_empresa', JSON.stringify({
          responsable: nombre,
          rutResponsable: rut,
          cargo: cargo,
          razonSocial: razonSocial,
          rutEmpresa: rutEmpresa,
          correoInformes: email
        }));

        localStorage.setItem('sensometrika_sesion', JSON.stringify({
          rol: 'empresa',
          planId: pedido.planId || 'b2b_basico',
          nombrePlan: pedido.nombrePlan || 'Plan Empresa Básico',
          modulosPermitidos: pedido.modulosPermitidos || ['reactimetro', 'palancas', 'punteo'],
          creditosRestantes: pedido.cantidad || 10,
          razonSocial: razonSocial,
          correoInformes: email,
          pagoAprobado: true
        }));

        // Limpiar usuario para que el chofer/trabajador se registre en menu-b2b.html
        localStorage.removeItem('sensometrika_datos_usuario');

        // Redirige al Menú B2B blindado
        window.location.href = 'menu-b2b.html';
      } else {
        // ENRUTAMIENTO B2C: El comprador es quien rinde las pruebas
        localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
          tipo: 'particular',
          nombre: nombre,
          rut: rut,
          correo: email,
          empresa: 'Particular'
        }));

        localStorage.setItem('sensometrika_sesion', JSON.stringify({
          rol: 'particular',
          planId: pedido.planId || 'part_basico',
          nombrePlan: pedido.nombrePlan || 'Pase Básico Psicomotriz',
          modulosPermitidos: pedido.modulosPermitidos || ['reactimetro', 'palancas', 'punteo'],
          correoInforme: email,
          pagoAprobado: true,
          simulacionesConsumidas: { reactimetro: 0, palancas: 0, punteo: 0 }
        }));

        // Redirige al Menú B2C particular
        window.location.href = 'menu.html';
      }
    }
  </script>
</body>
</html>
