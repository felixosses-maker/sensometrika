<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Confirmación de Pago y Activación</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .contenedor {
      width: 100%;
      max-width: 480px;
    }
    .encabezado {
      text-align: center;
      margin-bottom: 16px;
    }
    .encabezado h1 {
      font-size: 1.35rem;
      margin: 0;
      color: #fff;
    }
    .encabezado p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .caja-resumen {
      background: #0f172a;
      border: 1.5px solid #0284c7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    .caja-resumen h2 {
      margin: 4px 0;
      font-size: 1.15rem;
      color: #ffffff;
    }
    .monto-total {
      font-size: 1.45rem;
      font-weight: 900;
      color: #38bdf8;
      margin-top: 4px;
    }
    .form-cobro {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
    }
    .titulo-bloque {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-cobro label {
      font-size: 0.76rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .form-cobro input[type="text"],
    .form-cobro input[type="email"] {
      height: 42px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      padding: 0 12px;
      font-size: 0.88rem;
      box-sizing: border-box;
      width: 100%;
    }
    .form-cobro input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .seccion-empresa {
      display: none;
      flex-direction: column;
      gap: 10px;
      border-top: 1px dashed #334155;
      padding-top: 14px;
      margin-top: 4px;
    }
    /* Caja de Términos y Condiciones */
    .caja-consentimiento-pago {
      background-color: #0b1120;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-sizing: border-box;
      margin-top: 6px;
    }
    .caja-consentimiento-pago input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .caja-consentimiento-pago label {
      font-size: 0.75rem;
      color: #cbd5e1;
      line-height: 1.4;
      cursor: pointer;
      margin: 0;
    }
    .caja-consentimiento-pago a {
      color: #38bdf8;
      text-decoration: underline;
    }
    .btn-pagar-ahora {
      height: 48px;
      background: #16a34a;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-pagar-ahora:active {
      transform: scale(0.98);
      background: #15803d;
    }
    .btn-volver {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.82rem;
      text-align: center;
      margin-top: 14px;
      display: block;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Sensometrika</h1>
      <p id="subtitulo-checkout">Confirmación y Activación de Evaluaciones</p>
    </header>

    <!-- Resumen del Plan -->
    <section class="caja-resumen">
      <div style="font-size: 0.75rem; color: #94a3b8;">Plan Seleccionado:</div>
      <h2 id="txt-nombre-plan">Cargando...</h2>
      <div class="monto-total" id="txt-monto-total">$0 CLP</div>
      <div id="txt-desglose-iva" style="font-size: 0.75rem; color: #64748b; margin-top: 4px;"></div>
    </section>

    <!-- Formulario Dinámico B2C / B2B -->
    <form class="form-cobro" onsubmit="procesarActivacion(event)">
      
      <!-- 1. IDENTIFICACIÓN (B2C SOLO PIDE ESTO) -->
      <div id="bloque-titular">
        <div class="titulo-bloque" id="lbl-titulo-bloque">👤 DATOS PERSONALES DEL EVALUADO</div>
        
        <label for="pago-nombre" id="lbl-nombre">Nombre Completo *</label>
        <input type="text" id="pago-nombre" placeholder="Ej: Mariela Cárcamo Fernández" required>

        <label for="pago-rut" id="lbl-rut" style="margin-top: 6px;">RUT *</label>
        <input type="text" id="pago-rut" placeholder="Ej: 12.345.678-9" required>

        <label for="pago-correo" id="lbl-correo" style="margin-top: 6px;">Correo Electrónico (Para envío de resultados y boleta) *</label>
        <input type="email" id="pago-correo" placeholder="Ej: contacto@correo.cl" required>
      </div>

      <!-- 2. EXCLUSIVO PARA EMPRESAS (B2B) -->
      <div class="seccion-empresa" id="bloque-b2b">
        <div class="titulo-bloque" style="color: #38bdf8;">🏢 DATOS DE FACTURACIÓN Y EMPRESA</div>
        
        <label for="pago-cargo">Cargo / Rol en la Empresa *</label>
        <input type="text" id="pago-cargo" placeholder="Ej: Supervisión Técnica / APR">

        <label for="pago-razon-social" style="margin-top: 6px;">Razón Social Empresa (Para Factura) *</label>
        <input type="text" id="pago-razon-social" placeholder="Ej: Transportes del Norte SpA">

        <label for="pago-rut-empresa" style="margin-top: 6px;">RUT Empresa *</label>
        <input type="text" id="pago-rut-empresa" placeholder="Ej: 76.123.456-7">
      </div>

      <!-- CHECKBOX OBLIGATORIO DE TÉRMINOS Y CONDICIONES -->
      <div class="caja-consentimiento-pago">
        <input type="checkbox" id="chk-terminos-checkout" required>
        <label for="chk-terminos-checkout">
          He leído y acepto los <a href="terminos.html" target="_blank">Términos y Condiciones</a> y la <strong>Política de Protección de Datos Personales (Ley N° 21.719)</strong>. Consiento el tratamiento de mis antecedentes y resultados técnicos.
        </label>
      </div>

      <button type="submit" class="btn-pagar-ahora" id="btn-activar">🔒 Confirmar y Activar Plan</button>
      
      <div style="font-size: 0.7rem; color: #64748b; text-align: center;">
        Transacción oficial y segura mediante plataforma Sensometrika SpA.
      </div>
    </form>

    <a href="planes.html" class="btn-volver">← Volver al Catálogo de Planes</a>
  </main>

  <script>
    const pedido = JSON.parse(localStorage.getItem('sensometrika_plan_pedido')) || {
      planId: 'b2c_basico',
      nombrePlan: 'Pase Básico Psicomotriz',
      precioTotal: 4990,
      rol: 'particular',
      modulosPermitidos: ['reactimetro', 'palancas', 'punteo']
    };

    const esB2B = pedido.rol === 'empresa' || (pedido.planId && pedido.planId.startsWith('b2b'));

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('txt-nombre-plan').innerText = pedido.nombrePlan;
      document.getElementById('txt-monto-total').innerText = `$${(pedido.precioTotal || 4990).toLocaleString('es-CL')} CLP`;

      const bloqueB2B = document.getElementById('bloque-b2b');
      const inCargo = document.getElementById('pago-cargo');
      const inRazon = document.getElementById('pago-razon-social');
      const inRutEmp = document.getElementById('pago-rut-empresa');
      const txtIva = document.getElementById('txt-desglose-iva');

      if (esB2B) {
        bloqueB2B.style.display = 'flex';
        inCargo.required = true;
        inRazon.required = true;
        inRutEmp.required = true;
        document.getElementById('lbl-titulo-bloque').innerText = '👤 DATOS DEL SOLICITANTE / ENCARGADO';
        txtIva.innerText = `Neto: $${(pedido.precioNeto || 0).toLocaleString('es-CL')} | IVA: $${(pedido.iva || 0).toLocaleString('es-CL')} (19% Factura DTE)`;
      } else {
        bloqueB2B.style.display = 'none';
        inCargo.required = false;
        inRazon.required = false;
        inRutEmp.required = false;
        document.getElementById('lbl-titulo-bloque').innerText = '👤 DATOS DEL TITULAR';
        txtIva.innerText = 'Boleta Electrónica IVA incluido';
      }
    });

    function procesarActivacion(e) {
      e.preventDefault();

      const chk = document.getElementById('chk-terminos-checkout');
      if (!chk || !chk.checked) {
        alert('Debe aceptar los Términos y Condiciones para activar su plan.');
        return;
      }

      const nombre = document.getElementById('pago-nombre').value.trim();
      const rut = document.getElementById('pago-rut').value.trim();
      const correo = document.getElementById('pago-correo').value.trim();

      if (!esB2B) {
        // Flujo B2C
        localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
          tipo: 'particular',
          nombre: nombre,
          rut: rut,
          correo: correo,
          empresa: 'Particular',
          consentimiento: true,
          fechaConsentimiento: new Date().toISOString()
        }));

        localStorage.setItem('sensometrika_sesion', JSON.stringify({
          rol: 'particular',
          planId: pedido.planId || 'b2c_basico',
          nombrePlan: pedido.nombrePlan,
          modulosPermitidos: pedido.modulosPermitidos || ['reactimetro', 'palancas', 'punteo'],
          correoInforme: correo,
          pagoAprobado: true,
          fechaPago: new Date().toISOString()
        }));
      } else {
        // Flujo B2B
        const cargo = document.getElementById('pago-cargo').value.trim();
        const razonSocial = document.getElementById('pago-razon-social').value.trim();
        const rutEmpresa = document.getElementById('pago-rut-empresa').value.trim();

        localStorage.setItem('sensometrika_plan_empresa', JSON.stringify({
          responsable: nombre,
          rutResponsable: rut,
          cargo: cargo,
          razonSocial: razonSocial,
          rutEmpresa: rutEmpresa,
          correoInformes: correo
        }));

        localStorage.setItem('sensometrika_sesion', JSON.stringify({
          rol: 'empresa',
          planId: pedido.planId,
          nombrePlan: pedido.nombrePlan,
          modulosPermitidos: pedido.modulosPermitidos,
          razonSocial: razonSocial,
          correoInformes: correo,
          pagoAprobado: true,
          fechaPago: new Date().toISOString()
        }));

        localStorage.removeItem('sensometrika_datos_usuario');
      }

      // Limpiar mediciones previas
      localStorage.removeItem('sensometrika_reactimetro');
      localStorage.removeItem('sensometrika_palancas');
      localStorage.removeItem('sensometrika_punteo');
      localStorage.removeItem('sensometrika_visual');
      localStorage.removeItem('sensometrika_auditivo');

      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
