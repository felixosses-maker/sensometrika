<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensometrika • Checkout Seguro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --cyan-brand: #0284c7;
      --blue-accent: #38bdf8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 16px;
    }
    .checkout-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header-logo { text-align: center; }
    .header-logo h1 { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .header-logo span { color: var(--blue-accent); }
    .header-logo p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    
    .caja-resumen {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: var(--radius);
      padding: 18px;
    }
    .caja-resumen .badge-plan {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--blue-accent);
      margin-bottom: 4px;
      display: block;
    }
    .caja-resumen h2 { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .monto-total { font-size: 1.6rem; font-weight: 800; color: #38bdf8; }
    .txt-desglose { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    .badge-testmode {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #f59e0b;
      color: #fbbf24;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    form.form-cobro {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .seccion-titulo {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--blue-accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 6px;
    }
    label { font-size: 0.82rem; font-weight: 600; color: #e2e8f0; display: block; margin-bottom: 4px; }
    input[type="text"], input[type="email"] {
      width: 100%;
      background: #0b1120;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--blue-accent); }
    
    .terminos-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 6px;
    }
    .terminos-box input[type="checkbox"] {
      margin-top: 3px;
      accent-color: var(--cyan-brand);
      width: 16px;
      height: 16px;
    }
    .terminos-box label {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.35;
      font-weight: 400;
    }
    .terminos-box a { color: var(--blue-accent); text-decoration: underline; }
    
    .btn-pagar-ahora {
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-pagar-ahora:hover { background: #0369a1; }
    .btn-pagar-ahora:active { transform: scale(0.99); }
  </style>
</head>
<body>

<div class="checkout-wrapper">
  <div class="header-logo">
    <h1>Sensometrika <span>•</span> Checkout</h1>
    <p>Plataforma de Control Psicomotor y Sensorial</p>
  </div>

  <!-- RESUMEN DEL PLAN -->
  <section class="caja-resumen">
    <span class="badge-plan">Plan a Contratar:</span>
    <h2 id="txt-nombre-plan">Pase Básico Particular</h2>
    <div class="monto-total" id="txt-monto-total">$4.990 CLP</div>
    <div class="txt-desglose" id="txt-desglose">Boleta Electrónica IVA Incluido</div>
    <div class="badge-testmode">
      ⚡ MODO PRUEBAS ACTIVO: ACCESO DIRECTO SIN TARJETAS
    </div>
  </section>

  <!-- FORMULARIO -->
  <form class="form-cobro" onsubmit="procesarConfirmacionPago(event)">
    
    <!-- BLOQUE B2C: Particular -->
    <div id="bloque-b2c-fields" style="display: flex; flex-direction: column; gap: 12px;">
      <div class="seccion-titulo">👤 Datos del Evaluado (Particular)</div>
      <div>
        <label for="pago-b2c-nombre">Nombre Completo *</label>
        <input type="text" id="pago-b2c-nombre" placeholder="Ej: Felix Osses Martínez" required>
      </div>
      <div>
        <label for="pago-b2c-rut">RUT *</label>
        <input type="text" id="pago-b2c-rut" placeholder="Ej: 13.741.882-7" required>
      </div>
      <div>
        <label for="pago-b2c-correo">Correo Electrónico para Resultados *</label>
        <input type="email" id="pago-b2c-correo" placeholder="Ej: contacto@correo.cl" required>
      </div>
    </div>

    <!-- BLOQUE B2B: Corporativo -->
    <div id="bloque-b2b-fields" style="display: none; flex-direction: column; gap: 12px;">
      <div>
        <label for="pago-b2b-resp-nombre">Nombre Completo del Responsable (APR / Jefatura) *</label>
        <input type="text" id="pago-b2b-resp-nombre" placeholder="Ej: Mariela Cárcamo Fernández">
      </div>
      <div>
        <label for="pago-b2b-resp-rut">RUT del Responsable *</label>
        <input type="text" id="pago-b2b-resp-rut" placeholder="Ej: 13.333.333-3">
      </div>
      <div>
        <label for="pago-b2b-correo">Correo Electrónico para Resultados *</label>
        <input type="email" id="pago-b2b-correo" placeholder="Ej: contacto@correo.cl">
      </div>

      <div class="seccion-titulo">🏢 Datos de Facturación y Control Empresa</div>
      <div>
        <label for="pago-b2b-razon">Razón Social Empresa (Factura) *</label>
        <input type="text" id="pago-b2b-razon" placeholder="Ej: Socadep Ltda">
      </div>
      <div>
        <label for="pago-b2b-rut-empresa">RUT Empresa *</label>
        <input type="text" id="pago-b2b-rut-empresa" placeholder="Ej: 77.111.111-1">
      </div>
      <div>
        <label for="pago-b2b-cargo">Cargo del Responsable (APR / Jefatura) *</label>
        <input type="text" id="pago-b2b-cargo" placeholder="Ej: Supervisor Prevención de Riesgos">
      </div>
    </div>

    <!-- TÉRMINOS LEGALES -->
    <div class="terminos-box">
      <input type="checkbox" id="check-terminos" required>
      <label for="check-terminos">
        Declaro conocer y aceptar los <a href="#" target="_blank">Términos de Servicio y Aspectos Legales</a>. Autorizo el tratamiento de datos de rendimiento psicomotor y confirmo entender la <strong>Cláusula de Alcance Técnico (Ley N° 18.290 / D.S. N° 170)</strong>.
      </label>
    </div>

    <button type="submit" class="btn-pagar-ahora" id="btn-submit-pago">
      ⚡ Iniciar Evaluación Inmediata (Modo Pruebas) →
    </button>
  </form>
</div>

<script>
  let planActual = {
    id: 'b2c_basico',
    nombre: 'Pase Básico Particular',
    monto: 4990,
    neto: 4990,
    rol: 'particular',
    modulos: ['reactimetro', 'palancas', 'punteo']
  };

  document.addEventListener('DOMContentLoaded', () => {
    // 1. Intentar leer plan seleccionado desde el catálogo
    const pedido = JSON.parse(localStorage.getItem('sensometrika_plan_pedido')) || null;
    
    if (pedido) {
      planActual = {
        id: pedido.id || pedido.planId || 'b2c_basico',
        nombre: pedido.nombre || pedido.nombrePlan || 'Pase Básico Particular',
        monto: Number(pedido.monto || pedido.precio || pedido.precioTotal || 4990),
        neto: Number(pedido.neto || pedido.precioNeto || pedido.monto || 4990),
        rol: pedido.rol || (String(pedido.id || '').includes('b2b') ? 'empresa' : 'particular'),
        modulos: pedido.modulos || pedido.modulosPermitidos || ['reactimetro', 'palancas', 'punteo']
      };
    } else {
      // 2. Si no hay plan en memoria, verificar si la URL indica B2B o B2C
      const urlParams = new URLSearchParams(window.location.search);
      const urlRol = urlParams.get('rol');
      if (urlRol === 'empresa' || urlRol === 'b2b') {
        planActual = {
          id: 'b2b_basico',
          nombre: 'Plan Empresa Básico',
          monto: 95081,
          neto: 79900,
          rol: 'empresa',
          modulos: ['reactimetro', 'palancas', 'punteo']
        };
      }
    }

    renderizarVistaCheckout();
    precargarDatosPrevios();
  });

  function renderizarVistaCheckout() {
    const elNombre = document.getElementById('txt-nombre-plan');
    const elTotal = document.getElementById('txt-monto-total');
    const elDesglose = document.getElementById('txt-desglose');
    const b2cBox = document.getElementById('bloque-b2c-fields');
    const b2bBox = document.getElementById('bloque-b2b-fields');

    elNombre.innerText = planActual.nombre;
    elTotal.innerText = '$' + Number(planActual.monto).toLocaleString('es-CL') + ' CLP';

    if (planActual.rol === 'empresa') {
      b2bBox.style.display = 'flex';
      b2cBox.style.display = 'none';
      elDesglose.innerText = `Neto: $${Number(planActual.neto).toLocaleString('es-CL')} + IVA (Factura DTE 33)`;

      document.getElementById('pago-b2b-resp-nombre').required = true;
      document.getElementById('pago-b2b-resp-rut').required = true;
      document.getElementById('pago-b2b-correo').required = true;
      document.getElementById('pago-b2b-razon').required = true;
      document.getElementById('pago-b2b-rut-empresa').required = true;

      document.getElementById('pago-b2c-nombre').required = false;
      document.getElementById('pago-b2c-rut').required = false;
      document.getElementById('pago-b2c-correo').required = false;
    } else {
      b2bBox.style.display = 'none';
      b2cBox.style.display = 'flex';
      elDesglose.innerText = 'Boleta Electrónica IVA Incluido';

      document.getElementById('pago-b2c-nombre').required = true;
      document.getElementById('pago-b2c-rut').required = true;
      document.getElementById('pago-b2c-correo').required = true;

      document.getElementById('pago-b2b-resp-nombre').required = false;
      document.getElementById('pago-b2b-resp-rut').required = false;
      document.getElementById('pago-b2b-correo').required = false;
      document.getElementById('pago-b2b-razon').required = false;
      document.getElementById('pago-b2b-rut-empresa').required = false;
    }
  }

  function precargarDatosPrevios() {
    const prevUser = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || null;
    if (prevUser && planActual.rol === 'particular') {
      if (prevUser.nombre) document.getElementById('pago-b2c-nombre').value = prevUser.nombre;
      if (prevUser.rut) document.getElementById('pago-b2c-rut').value = prevUser.rut;
      if (prevUser.correo) document.getElementById('pago-b2c-correo').value = prevUser.correo;
    }
  }

  function procesarConfirmacionPago(e) {
    e.preventDefault();

    if (planActual.rol === 'empresa') {
      const respNombre = document.getElementById('pago-b2b-resp-nombre').value.trim();
      const respRut = document.getElementById('pago-b2b-resp-rut').value.trim();
      const correo = document.getElementById('pago-b2b-correo').value.trim();
      const razonSocial = document.getElementById('pago-b2b-razon').value.trim();
      const rutEmpresa = document.getElementById('pago-b2b-rut-empresa').value.trim();
      const cargo = document.getElementById('pago-b2b-cargo').value.trim() || 'Supervisor APR';

      localStorage.setItem('sensometrika_plan_empresa', JSON.stringify({
        empresa: { razonSocial, rutEmpresa },
        responsable: { nombre: respNombre, rut: respRut, cargo, email: correo },
        planId: planActual.id,
        planNombre: planActual.nombre
      }));

      localStorage.setItem('sensometrika_sesion', JSON.stringify({
        rol: 'empresa',
        planId: planActual.id,
        planNombre: planActual.nombre,
        razonSocial: razonSocial,
        supervisorNombre: respNombre,
        supervisorRut: respRut,
        supervisorCargo: cargo,
        correoInformes: correo,
        modulosPermitidos: planActual.modulos
      }));

      // B2B entra con trabajador limpio para inscribirlo en el menú
      localStorage.removeItem('sensometrika_datos_usuario');
    } else {
      // B2C: El evaluado es quien compra
      const b2cNombre = document.getElementById('pago-b2c-nombre').value.trim();
      const b2cRut = document.getElementById('pago-b2c-rut').value.trim();
      const b2cCorreo = document.getElementById('pago-b2c-correo').value.trim();

      localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
        nombre: b2cNombre,
        rut: b2cRut,
        correo: b2cCorreo,
        tipo: 'particular'
      }));

      localStorage.setItem('sensometrika_sesion', JSON.stringify({
        rol: 'particular',
        planId: planActual.id,
        planNombre: planActual.nombre,
        modulosPermitidos: planActual.modulos
      }));

      localStorage.removeItem('sensometrika_plan_empresa');
    }

    // Redirección directa al panel de módulos
    window.location.href = 'menu.html';
  }
</script>
</body>
</html>
