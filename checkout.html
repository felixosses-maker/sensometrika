<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Confirmación y Activación</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .contenedor-checkout {
      width: 100%;
      max-width: 440px;
    }
    .caja-resumen {
      background: #0f172a;
      border: 1.5px solid #0284c7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      text-align: left;
    }
    .monto-total {
      font-size: 1.6rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 4px 0;
    }
    .tarjeta-formulario {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
    }
    .grupo-campo {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .grupo-campo label {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .grupo-campo input {
      height: 42px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      padding: 0 12px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .grupo-campo input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .check-terminos {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 16px 0;
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.4;
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .check-terminos input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #22c55e;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-pagar-ahora {
      width: 100%;
      height: 50px;
      background: #22c55e;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-pagar-ahora:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #475569;
    }
    .pie-seguridad {
      font-size: 0.72rem;
      color: #64748b;
      text-align: center;
      margin-top: 14px;
    }
    .desglose-impuestos {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.4;
      border-top: 1px solid #1e293b;
      padding-top: 6px;
    }
  </style>
</head>
<body>
  <main class="contenedor-checkout">
    <header style="text-align: center; margin-bottom: 16px;">
      <h1 style="font-size: 1.35rem; margin: 0; color: #fff;">Sensometrika</h1>
      <p style="font-size: 0.8rem; color: #94a3b8; margin: 4px 0 0;">Confirmación y Activación de Evaluaciones</p>
    </header>

    <!-- Resumen del Plan Dinámico -->
    <section class="caja-resumen">
      <div style="font-size: 0.75rem; color: #94a3b8;">Plan Seleccionado:</div>
      <h2 id="txt-nombre-plan" style="font-size: 1.2rem; margin: 4px 0; color: #fff;">--</h2>
      <div class="monto-total" id="txt-monto-total">--</div>
      <div id="txt-desglose-iva" class="desglose-impuestos">Cargando condiciones...</div>
    </section>

    <!-- Formulario de Activación -->
    <form class="tarjeta-formulario" onsubmit="procesarActivacion(event)">
      
      <!-- Bloque Exclusivo B2B (Empresa Mandante) -->
      <div id="bloque-b2b" style="display: none; margin-bottom: 14px;">
        <label style="color: #38bdf8; font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 10px;">
          🏢 DATOS DE EMPRESA Y FACTURACIÓN (DTE)
        </label>

        <div class="grupo-campo">
          <label for="pago-empresa">Razón Social Empresa Mandante / Faena *</label>
          <input type="text" id="pago-empresa" placeholder="Ej: SOCADEP SpA">
        </div>

        <div class="grupo-campo">
          <label for="pago-rut-empresa">RUT Empresa (Para Factura Electrónica) *</label>
          <input type="text" id="pago-rut-empresa" placeholder="Ej: 76.543.210-K">
        </div>
      </div>

      <!-- Datos del Solicitante / Titular -->
      <div id="bloque-titular">
        <label id="lbl-titulo-titular" style="color: #38bdf8; font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 10px;">
          👤 DATOS DEL TITULAR
        </label>
        
        <div class="grupo-campo">
          <label for="pago-nombre" id="lbl-nombre">Nombre Completo *</label>
          <input type="text" id="pago-nombre" placeholder="Ej: Mariela Cárcamo Fernández" required>
        </div>

        <div class="grupo-campo">
          <label for="pago-rut" id="lbl-rut">RUT *</label>
          <input type="text" id="pago-rut" placeholder="Ej: 12.666.787-9" required>
        </div>

        <div class="grupo-campo" id="box-cargo-b2b" style="display: none;">
          <label for="pago-cargo">Cargo en la Empresa / Prevención de Riesgos *</label>
          <input type="text" id="pago-cargo" placeholder="Ej: Encargado de Prevención / APR">
        </div>

        <div class="grupo-campo">
          <label for="pago-correo" id="lbl-correo">Correo Electrónico (Para envío de boleta y resultados) *</label>
          <input type="email" id="pago-correo" placeholder="Ej: contacto@empresa.cl" required>
        </div>
      </div>

      <!-- Checkbox de Consentimiento -->
      <label class="check-terminos">
        <input type="checkbox" id="chk-terminos" required onchange="validarBotonCobro()">
        <span>He leído y acepto los <strong>Términos y Condiciones</strong> y la <strong>Política de Protección de Datos Personales (Ley N° 21.719)</strong>. Consiento el tratamiento de mis antecedentes y resultados técnicos.</span>
      </label>

      <button type="submit" id="btn-submit-pago" class="btn-pagar-ahora" disabled>
        🔒 Confirmar y Activar Plan
      </button>

      <div class="pie-seguridad">
        Transacción oficial y segura mediante plataforma Sensometrika SpA.
      </div>
    </form>

    <div style="text-align: center; margin-top: 12px;">
      <a href="planes.html" style="color: #94a3b8; text-decoration: none; font-size: 0.82rem;">← Volver al Catálogo de Planes</a>
    </div>
  </main>

  <script>
    let planData = {};

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Prioriza el plan seleccionado desde el catálogo
      planData = JSON.parse(localStorage.getItem('sensometrika_plan_pedido')) || 
                 JSON.parse(localStorage.getItem('sensometrika_sesion')) || {
                   rol: 'particular',
                   planId: 'b2c_full',
                   nombrePlan: 'Pase Full Integral',
                   precioTotal: 9990,
                   modulosPermitidos: ['reactimetro', 'palancas', 'punteo', 'visual', 'auditivo']
                 };

      const esB2B = (planData.rol === 'empresa' || (planData.planId && String(planData.planId).startsWith('b2b')));

      const txtPlan = document.getElementById('txt-nombre-plan');
      const txtMonto = document.getElementById('txt-monto-total');
      const txtDesglose = document.getElementById('txt-desglose-iva');
      const bloqueB2B = document.getElementById('bloque-b2b');
      const boxCargo = document.getElementById('box-cargo-b2b');
      const lblTitular = document.getElementById('lbl-titulo-titular');
      const inEmpresa = document.getElementById('pago-empresa');
      const inRutEmpresa = document.getElementById('pago-rut-empresa');
      const inCargo = document.getElementById('pago-cargo');
      const lblCorreo = document.getElementById('lbl-correo');

      if (esB2B) {
        // Modo B2B (Corporativo)
        const cantidad = planData.cantidad || 10;
        const total = planData.precioTotal || (cantidad * 7990 * 1.19);
        const neto = planData.precioNeto || Math.round(total / 1.19);
        const iva = planData.iva || (total - neto);

        txtPlan.innerText = planData.nombrePlan || 'Plan Empresa Full B2B';
        txtMonto.innerText = '$' + Number(total).toLocaleString('es-CL') + ' CLP';
        txtDesglose.innerHTML = `Pack de <strong>${cantidad} trabajadores</strong><br>Neto: $${Number(neto).toLocaleString('es-CL')} CLP • IVA (19%): $${Number(iva).toLocaleString('es-CL')} CLP<br>Factura Electrónica DTE`;

        bloqueB2B.style.display = 'block';
        boxCargo.style.display = 'flex';
        lblTitular.innerText = '👤 DATOS DEL ENCARGADO / SOLICITANTE EMPRESA';
        lblCorreo.innerText = 'Correo de Supervisión (Recepción de Certificados Formales) *';

        inEmpresa.required = true;
        inRutEmpresa.required = true;
        inCargo.required = true;
      } else {
        // Modo B2C (Particular)
        const total = planData.precioTotal || planData.precio || 9990;
        txtPlan.innerText = planData.nombrePlan || 'Pase Full Integral';
        txtMonto.innerText = '$' + Number(total).toLocaleString('es-CL') + ' CLP';
        txtDesglose.innerText = 'Boleta Electrónica IVA incluido';

        bloqueB2B.style.display = 'none';
        boxCargo.style.display = 'none';
        lblTitular.innerText = '👤 DATOS DEL POSTULANTE / TITULAR';
        lblCorreo.innerText = 'Correo Electrónico (Para envío de resultados y boleta) *';

        inEmpresa.required = false;
        inRutEmpresa.required = false;
        inCargo.required = false;
      }
    });

    function validarBotonCobro() {
      const chk = document.getElementById('chk-terminos');
      document.getElementById('btn-submit-pago').disabled = !chk.checked;
    }

    function procesarActivacion(e) {
      e.preventDefault();

      const nombre = document.getElementById('pago-nombre').value.trim();
      const rut = document.getElementById('pago-rut').value.trim();
      const correo = document.getElementById('pago-correo').value.trim();
      const esB2B = (planData.rol === 'empresa' || (planData.planId && String(planData.planId).startsWith('b2b')));

      if (esB2B) {
        const razonSocial = document.getElementById('pago-empresa').value.trim();
        const rutEmpresa = document.getElementById('pago-rut-empresa').value.trim();
        const cargo = document.getElementById('pago-cargo').value.trim();

        // 1. Guardar la empresa y su supervisor comprador
        const planEmpresa = {
          razonSocial: razonSocial,
          rutEmpresa: rutEmpresa,
          responsable: {
            nombre: nombre,
            rut: rut,
            cargo: cargo,
            correo: correo
          },
          cantidad: planData.cantidad || 10
        };
        localStorage.setItem('sensometrika_plan_empresa', JSON.stringify(planEmpresa));

        // 2. Sesión activa B2B
        const sesionActual = {
          rol: 'empresa',
          planId: planData.planId || 'b2b_full',
          nombrePlan: planData.nombrePlan || 'Plan Empresa Full',
          razonSocial: razonSocial,
          responsableNombre: nombre,
          responsableRut: rut,
          responsableCargo: cargo,
          correoInformes: correo,
          modulosPermitidos: planData.modulosPermitidos || ['reactimetro', 'palancas', 'punteo', 'visual', 'auditivo']
        };
        localStorage.setItem('sensometrika_sesion', JSON.stringify(sesionActual));

        // 3. Limpiar datos del trabajador para que en menu.html ingrese el operador que dará el examen
        localStorage.removeItem('sensometrika_datos_usuario');
        localStorage.removeItem('sensometrika_firma_trabajador');
      } else {
        // En B2C el comprador es el evaluado
        const datosUsuario = {
          nombre: nombre,
          rut: rut,
          correo: correo,
          empresa: 'Particular',
          tipo: 'particular'
        };
        localStorage.setItem('sensometrika_datos_usuario', JSON.stringify(datosUsuario));
        localStorage.removeItem('sensometrika_plan_empresa');

        const sesionActual = {
          rol: 'particular',
          planId: planData.planId || 'b2c_full',
          nombrePlan: planData.nombrePlan || 'Pase Full Integral',
          modulosPermitidos: planData.modulosPermitidos || ['reactimetro', 'palancas', 'punteo', 'visual', 'auditivo']
        };
        localStorage.setItem('sensometrika_sesion', JSON.stringify(sesionActual));
      }

      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
