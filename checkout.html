<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Checkout Seguro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .formulario-checkout {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .formulario-checkout label {
      font-size: 0.76rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .formulario-checkout input, .formulario-checkout select {
      width: 100%;
      height: 42px;
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #ffffff;
      padding: 0 12px;
      font-size: 0.88rem;
      box-sizing: border-box;
    }
    .resumen-cobro {
      width: 100%;
      background-color: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .fila-resumen {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
    }
    .fila-resumen span { color: #94a3b8; }
    .fila-resumen strong { color: #f8fafc; }
    .fila-total {
      border-top: 1px solid #334155;
      padding-top: 8px;
      font-size: 1.05rem;
    }
    .fila-total strong { color: #38bdf8; }
  </style>
</head>
<body>
  <main class="contenedor" style="max-width: 480px; margin: 0 auto; padding: 16px;">
    <header style="text-align: center; margin-bottom: 14px;">
      <h1 style="color: #fff; font-size: 1.3rem; margin: 0;">SENSOMETRIKA SpA</h1>
      <p style="color: #94a3b8; font-size: 0.78rem; margin: 2px 0 0 0;">Finalización de Compra y Acreditación de Sesión</p>
    </header>

    <!-- Resumen del Plan -->
    <section class="resumen-cobro">
      <div class="fila-resumen">
        <span>Servicio:</span>
        <strong id="chk-plan-nombre">Plan Psicomotriz DS 170</strong>
      </div>
      <div class="fila-resumen">
        <span>Evaluados autorizados:</span>
        <strong id="chk-plan-cupos">1 persona</strong>
      </div>
      <div class="fila-resumen fila-total">
        <span>Total a Pagar:</span>
        <strong id="chk-plan-total">$4.990 CLP</strong>
      </div>
    </section>

    <!-- Formulario de Facturación / Contacto -->
    <form class="formulario-checkout" onsubmit="event.preventDefault(); procesarPagoFlow();">
      <label for="inp-email">CORREO ELECTRÓNICO (Para comprobante y acceso):</label>
      <input type="email" id="inp-email" placeholder="ejemplo@correo.cl" required>

      <label for="inp-nombre">NOMBRE COMPLETO DEL RESPONSABLE:</label>
      <input type="text" id="inp-nombre" placeholder="Nombre y Apellidos" required>

      <label for="inp-rut">RUT DEL RESPONSABLE O EMPRESA:</label>
      <input type="text" id="inp-rut" placeholder="12.345.678-9" required>

      <div id="bloque-empresa" style="display: none; flex-direction: column; gap: 8px;">
        <label for="inp-razon">RAZÓN SOCIAL (Facturación):</label>
        <input type="text" id="inp-razon" placeholder="Nombre Empresa SpA / Ltda">
      </div>

      <button type="submit" id="btn-pagar" class="btn-principal" style="height: 48px; background-color: #0284c7; margin-top: 8px;">
        💳 Pagar con Webpay / Redcompra
      </button>
    </form>

    <a href="index.html" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem; text-align: center; display: block;">
      ← Volver al Catálogo de Planes
    </a>
  </main>

  <script>
    let sesionActiva = {};

    document.addEventListener('DOMContentLoaded', () => {
      sesionActiva = JSON.parse(localStorage.getItem('sensometrika_sesion')) || {
        rol: 'particular',
        planId: 'part_unico',
        nombrePlan: 'Evaluación Psicomotriz DS 170',
        monto: 4990,
        cupos: 1,
        modulosPermitidos: ['reactimetro', 'palancas', 'punteo'],
        intentosRestantes: 1
      };

      document.getElementById('chk-plan-nombre').innerText = sesionActiva.nombrePlan || 'Plan Sensometrika';
      document.getElementById('chk-plan-cupos').innerText = `${sesionActiva.cupos || 1} persona(s)`;
      document.getElementById('chk-plan-total').innerText = `$${(sesionActiva.monto || 4990).toLocaleString('es-CL')} CLP`;

      if (sesionActiva.rol === 'empresa') {
        document.getElementById('bloque-empresa').style.display = 'flex';
      }
    });

    async function procesarPagoFlow() {
      const btnPagar = document.getElementById('btn-pagar');
      btnPagar.disabled = true;
      btnPagar.innerText = 'Conectando con Webpay...';

      const email = document.getElementById('inp-email').value.trim();
      const nombre = document.getElementById('inp-nombre').value.trim();
      const rut = document.getElementById('inp-rut').value.trim();
      const razon = document.getElementById('inp-razon').value.trim();

      // Guardar datos en local para persistencia en el informe
      localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
        nombre: nombre,
        rut: rut,
        email: email,
        empresa: razon || 'Particular',
        tipo: sesionActiva.rol
      }));

      // Respaldar sesión pendiente
      localStorage.setItem('sensometrika_sesion_pendiente', JSON.stringify(sesionActiva));

      const payload = {
        planId: sesionActiva.planId,
        nombrePlan: sesionActiva.nombrePlan,
        monto: sesionActiva.monto,
        email: email,
        rut: rut,
        nombre: nombre,
        empresa: razon || 'Particular',
        rol: sesionActiva.rol,
        modulosPermitidos: sesionActiva.modulosPermitidos,
        intentos: sesionActiva.intentosRestantes
      };

      try {
        const res = await fetch('/api/crear-orden', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.url) {
          // Redirigir a la interfaz oficial de Flow Sandbox (Webpay)
          window.location.href = data.url;
        } else {
          alert('Error al generar la orden: ' + (data.error || 'Respuesta inválida'));
          btnPagar.disabled = false;
          btnPagar.innerText = '💳 Pagar con Webpay / Redcompra';
        }
      } catch (err) {
        console.error('Error de comunicación:', err);
        alert('No se pudo establecer conexión con el servidor de pagos. Si estás en localhost, sube los cambios a Vercel para ejecutar la función de Flow.');
        btnPagar.disabled = false;
        btnPagar.innerText = '💳 Pagar con Webpay / Redcompra';
      }
    }
  </script>
</body>
</html>
