<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Checkout Seguro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .tarjeta-checkout {
      width: 100%;
      max-width: 440px;
      background-color: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 14px;
      padding: 24px 20px;
      box-sizing: border-box;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .encabezado-checkout {
      text-align: center;
      margin-bottom: 18px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .encabezado-checkout h2 { margin: 0; font-size: 1.25rem; color: #ffffff; }
    .encabezado-checkout p { margin: 4px 0 0 0; font-size: 0.76rem; color: #94a3b8; }

    .resumen-cobro {
      background-color: #070d17;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
    }
    .fila-resumen {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .fila-resumen strong { color: #ffffff; }
    .fila-precio {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #334155;
    }
    .fila-precio span { font-size: 0.9rem; font-weight: bold; color: #ffffff; }
    .fila-precio .monto { font-size: 1.35rem; font-weight: 900; color: #38bdf8; }

    .formulario-pago {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .campo-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .campo-form label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .campo-form input {
      height: 42px;
      background-color: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      padding: 0 12px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }
    .campo-form input:focus { border-color: #0284c7; }

    .seccion-b2b {
      display: none;
      flex-direction: column;
      gap: 10px;
      border-top: 1px dashed #334155;
      padding-top: 12px;
      margin-top: 4px;
    }

    .btn-webpay {
      height: 48px;
      background-color: #0284c7;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-webpay:active { transform: scale(0.98); }
    .link-volver {
      display: block;
      text-align: center;
      color: #64748b;
      font-size: 0.78rem;
      text-decoration: none;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <main class="tarjeta-checkout">
    <div class="encabezado-checkout">
      <h2>SENSOMETRIKA SpA</h2>
      <p>Finalización de Compra y Pasarela de Pago</p>
    </div>

    <div class="resumen-cobro">
      <div class="fila-resumen">
        <span>Servicio:</span>
        <strong id="txt-servicio">Cargando...</strong>
      </div>
      <div class="fila-resumen">
        <span>Régimen:</span>
        <strong id="txt-regimen">--</strong>
      </div>
      <div class="fila-resumen" id="fila-cant-evals" style="display: none;">
        <span>Evaluaciones Contratadas:</span>
        <strong id="txt-cantidad-evals">10 trabajadores</strong>
      </div>
      <div class="fila-resumen" id="fila-desglose-iva" style="display: none;">
        <span>Neto + IVA (19%):</span>
        <strong id="txt-desglose">--</strong>
      </div>
      <div class="fila-precio">
        <span>Total a Pagar:</span>
        <div class="monto" id="txt-total">$0 CLP</div>
      </div>
    </div>

    <form class="formulario-pago" onsubmit="procesarPagoFinal(event)">
      <!-- Datos según B2C o B2B -->
      <div class="campo-form">
        <label id="lbl-nombre">NOMBRE COMPLETO DEL POSTULANTE:</label>
        <input type="text" id="in-nombre" required placeholder="Nombre y Apellido">
      </div>

      <div class="campo-form">
        <label id="lbl-rut">RUT DEL POSTULANTE:</label>
        <input type="text" id="in-rut" required placeholder="12.345.678-9">
      </div>

      <div class="campo-form">
        <label id="lbl-email">CORREO ELECTRÓNICO (Envío de Comprobante e Informes):</label>
        <input type="email" id="in-email" required placeholder="correo@ejemplo.cl">
      </div>

      <!-- Bloque Corporativo Exclusivo para Empresas (B2B) -->
      <div class="seccion-b2b" id="bloque-empresa">
        <div class="campo-form">
          <label style="color: #38bdf8;">RAZÓN SOCIAL DE LA EMPRESA / MANDANTE:</label>
          <input type="text" id="in-empresa-nombre" placeholder="Ej: Transportes Faena SpA">
        </div>
        <div class="campo-form">
          <label style="color: #38bdf8;">RUT EMPRESA (Para Facturación Electrónica):</label>
          <input type="text" id="in-empresa-rut" placeholder="77.123.456-7">
        </div>
      </div>

      <button type="submit" class="btn-webpay">
        💳 Pagar con Webpay / Redcompra
      </button>

      <a href="planes.html" class="link-volver">← Volver al Catálogo de Planes</a>
    </form>
  </main>

  <script>
    let pedido = null;

    document.addEventListener('DOMContentLoaded', () => {
      pedido = JSON.parse(localStorage.getItem('sensometrika_plan_pedido'));

      // Si entra a checkout sin pedido previo, redirigir al catálogo
      if (!pedido) {
        window.location.href = 'planes.html';
        return;
      }

      document.getElementById('txt-servicio').innerText = pedido.nombrePlan;
      document.getElementById('txt-total').innerText = `$${pedido.precioTotal.toLocaleString('es-CL')} CLP`;

      const esB2B = (pedido.rol === 'empresa');

      if (esB2B) {
        document.getElementById('txt-regimen').innerText = 'Convenio Corporativo (B2B)';
        document.getElementById('fila-cant-evals').style.display = 'flex';
        document.getElementById('txt-cantidad-evals').innerText = `${pedido.cantidad} trabajadores`;
        document.getElementById('fila-desglose-iva').style.display = 'flex';
        document.getElementById('txt-desglose').innerText = `Neto: $${pedido.precioNeto.toLocaleString('es-CL')} | IVA: $${pedido.iva.toLocaleString('es-CL')}`;

        // Etiquetas B2B: Datos del APR/Supervisor
        document.getElementById('bloque-empresa').style.display = 'flex';
        document.getElementById('lbl-nombre').innerText = 'NOMBRE DEL RESPONSABLE TÉCNICO / SUPERVISOR APR:';
        document.getElementById('lbl-rut').innerText = 'RUT DEL RESPONSABLE:';
        document.getElementById('in-empresa-nombre').required = true;
        document.getElementById('in-empresa-rut').required = true;
      } else {
        document.getElementById('txt-regimen').innerText = 'Evaluación Individual (B2C)';
        document.getElementById('bloque-empresa').style.display = 'none';
        document.getElementById('lbl-nombre').innerText = 'NOMBRE COMPLETO DEL POSTULANTE:';
        document.getElementById('lbl-rut').innerText = 'RUT DEL POSTULANTE:';
        document.getElementById('in-empresa-nombre').required = false;
        document.getElementById('in-empresa-rut').required = false;
      }
    });

    function procesarPagoFinal(e) {
      e.preventDefault();

      const nombre = document.getElementById('in-nombre').value.trim();
      const rut = document.getElementById('in-rut').value.trim();
      const email = document.getElementById('in-email').value.trim();
      const esB2B = (pedido.rol === 'empresa');

      if (esB2B) {
        const razonSocial = document.getElementById('in-empresa-nombre').value.trim() || 'Empresa Faena';
        const rutEmpresa = document.getElementById('in-empresa-rut').value.trim();

        // 1. Guardar la licencia corporativa activa
        localStorage.setItem('sensometrika_sesion', JSON.stringify({
          rol: 'empresa',
          planId: pedido.planId,
          nombrePlan: pedido.nombrePlan,
          modulosPermitidos: pedido.modulosPermitidos,
          creditosRestantes: pedido.cantidad,
          razonSocial: razonSocial,
          correoInformes: email
        }));

        // 2. Guardar datos del supervisor que estampa la firma del informe
        localStorage.setItem('sensometrika_plan_empresa', JSON.stringify({
          responsable: nombre,
          rutResponsable: rut,
          cargo: 'Supervisión Técnica / APR',
          razonSocial: razonSocial,
          rutEmpresa: rutEmpresa,
          correoInformes: email
        }));

        // En B2B borramos usuario previo para que el trabajador ingrese Nombre y RUT en menu.html
        localStorage.removeItem('sensometrika_datos_usuario');
      } else {
        // En B2C el comprador es quien rinde la prueba
        localStorage.setItem('sensometrika_sesion', JSON.stringify({
          rol: 'particular',
          planId: pedido.planId,
          nombrePlan: pedido.nombrePlan,
          modulosPermitidos: pedido.modulosPermitidos
        }));

        localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
          tipo: 'particular',
          nombre: nombre,
          rut: rut,
          correo: email,
          empresa: 'Particular'
        }));
      }

      // Limpiar mediciones antiguas
      localStorage.removeItem('sensometrika_reactimetro');
      localStorage.removeItem('sensometrika_palancas');
      localStorage.removeItem('sensometrika_punteo');
      localStorage.removeItem('sensometrika_visual');
      localStorage.removeItem('sensometrika_auditivo');

      alert('¡Pago procesado con éxito! Se ha activado la sesión de evaluación.');
      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
