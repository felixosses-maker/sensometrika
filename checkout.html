<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Checkout Seguro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .caja-resumen {
      background: #0f172a;
      border: 1.5px solid #38bdf8;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    .caja-resumen h2 { margin: 0; font-size: 1.05rem; color: #fff; }
    .monto-total { font-size: 1.4rem; font-weight: 900; color: #38bdf8; margin-top: 4px; }
    
    .form-cobro {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .form-cobro label { font-size: 0.76rem; color: #94a3b8; font-weight: 600; }
    .form-cobro input {
      height: 42px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      padding: 0 10px;
      font-size: 0.88rem;
    }
    .form-cobro input:focus { outline: none; border-color: #38bdf8; }

    .btn-pagar-ahora {
      height: 48px;
      background: #16a34a;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-pagar-ahora:active { transform: scale(0.98); }
    .seccion-empresa { display: none; flex-direction: column; gap: 10px; border-top: 1px dashed #334155; padding-top: 10px; margin-top: 4px; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Sensometrika</h1>
      <p>Paso 2: Registro de Titular y Pasarela de Pago</p>
    </header>

    <section class="caja-resumen">
      <div style="font-size: 0.75rem; color: #94a3b8;">Plan Seleccionado:</div>
      <h2 id="txt-nombre-plan">Cargando...</h2>
      <div class="monto-total" id="txt-monto-total">$0 CLP</div>
      <div id="txt-desglose-iva" style="font-size: 0.75rem; color: #64748b;"></div>
    </section>

    <form class="form-cobro" onsubmit="confirmarPago(event)">
      <label id="lbl-datos-titular">Datos del Evaluado / Postulante:</label>
      <input type="text" id="pago-nombre" placeholder="Nombre Completo *" required>
      <input type="text" id="pago-rut" placeholder="RUT (Ej: 12.345.678-9) *" required>
      <input type="email" id="pago-correo" placeholder="Correo Electrónico (para informes y boleta) *" required>

      <!-- Bloque Corporativo B2B -->
      <div class="seccion-empresa" id="bloque-b2b">
        <label style="color: #38bdf8;">Datos de Facturación Empresa (DTE):</label>
        <input type="text" id="pago-razon-social" placeholder="Razón Social Empresa / Faena">
        <input type="text" id="pago-rut-empresa" placeholder="RUT Empresa (Para Factura)">
        <input type="email" id="pago-correo-informes" placeholder="Correo de Notificación de Informes PDF *">
      </div>

      <button type="submit" class="btn-pagar-ahora">🔒 Pagar con Webpay / Redcompra</button>
      <div style="font-size: 0.7rem; color: #64748b; text-align: center; margin-top: 4px;">
        Transacción protegida por protocolo SSL de 256 bits.
      </div>
    </form>

    <a href="planes.html" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem; text-align: center; margin-top: 14px; display: block;">
      ← Cambiar de Plan
    </a>
  </main>

  <script>
    const pedido = JSON.parse(localStorage.getItem('sensometrika_plan_pedido'));

    if (!pedido) {
      window.location.href = 'planes.html';
    }

    document.getElementById('txt-nombre-plan').innerText = pedido.nombrePlan;
    document.getElementById('txt-monto-total').innerText = `$${pedido.precioTotal.toLocaleString('es-CL')} CLP`;

    if (pedido.rol === 'empresa') {
      document.getElementById('bloque-b2b').style.display = 'flex';
      document.getElementById('lbl-datos-titular').innerText = 'Datos del Responsable Técnico / APR (Firma Supervisor):';
      document.getElementById('pago-razon-social').required = true;
      document.getElementById('pago-rut-empresa').required = true;
      document.getElementById('pago-correo-informes').required = true;
      document.getElementById('txt-desglose-iva').innerText = `Neto: $${pedido.precioNeto.toLocaleString('es-CL')} | IVA: $${pedido.iva.toLocaleString('es-CL')} (Factura)`;
    } else {
      document.getElementById('txt-desglose-iva').innerText = 'Boleta Electrónica IVA incluido';
    }

    function confirmarPago(e) {
      e.preventDefault();

      const nombre = document.getElementById('pago-nombre').value.trim();
      const rut = document.getElementById('pago-rut').value.trim();
      const correo = document.getElementById('pago-correo').value.trim();

      let empresa = 'Particular';
      let rutEmpresa = '';
      let correoInformes = correo;

      if (pedido.rol === 'empresa') {
        empresa = document.getElementById('pago-razon-social').value.trim();
        rutEmpresa = document.getElementById('pago-rut-empresa').value.trim();
        correoInformes = document.getElementById('pago-correo-informes').value.trim();

        // Guardar Responsable de la empresa
        localStorage.setItem('sensometrika_plan_empresa', JSON.stringify({
          responsable: nombre,
          rutResponsable: rut,
          cargo: 'Supervisión Técnica / APR',
          razonSocial: empresa,
          rutEmpresa: rutEmpresa,
          correoInformes: correoInformes
        }));

        // En B2B borramos el usuario activo para exigir el ingreso del trabajador
        localStorage.removeItem('sensometrika_datos_usuario');
      } else {
        // En B2C el comprador es el evaluado
        localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({
          tipo: 'particular',
          nombre: nombre,
          rut: rut,
          correo: correo,
          empresa: 'Particular'
        }));
      }

      // Guardar licencia
      localStorage.setItem('sensometrika_sesion', JSON.stringify({
        rol: pedido.rol,
        planId: pedido.planId,
        nombrePlan: pedido.nombrePlan,
        modulosPermitidos: pedido.modulosPermitidos,
        intentosRestantes: pedido.cantidad,
        razonSocial: empresa,
        correoInformes: correoInformes,
        pagoAprobado: true,
        fechaPago: new Date().toISOString()
      }));

      // Limpiar evaluaciones previas
      localStorage.removeItem('sensometrika_reactimetro');
      localStorage.removeItem('sensometrika_palancas');
      localStorage.removeItem('sensometrika_punteo');
      localStorage.removeItem('sensometrika_visual');
      localStorage.removeItem('sensometrika_auditivo');

      alert('¡Pago procesado con éxito! Se ha activado tu plan corporativo.');
      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
