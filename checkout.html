<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Confirmación y Activación</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .contenedor-checkout {
      width: 100%;
      max-width: 440px;
    }
    .caja-resumen {
      background: #0f172a;
      border: 1.5px solid #0284c7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      text-align: left;
    }
    .monto-total {
      font-size: 1.6rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 6px 0;
    }
    .tarjeta-formulario {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
    }
    .grupo-campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .grupo-campo label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .grupo-campo input {
      height: 42px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      padding: 0 12px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .grupo-campo input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .check-terminos {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 16px 0;
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.4;
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .check-terminos input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #22c55e;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-pagar-ahora {
      width: 100%;
      height: 50px;
      background: #22c55e;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-pagar-ahora:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #475569;
    }
    .pie-seguridad {
      font-size: 0.72rem;
      color: #64748b;
      text-align: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <main class="contenedor-checkout">
    <header style="text-align: center; margin-bottom: 16px;">
      <h1 style="font-size: 1.35rem; margin: 0; color: #fff;">Sensometrika</h1>
      <p style="font-size: 0.8rem; color: #94a3b8; margin: 4px 0 0;">Confirmación y Activación de Evaluaciones</p>
    </header>

    <!-- Resumen del Plan -->
    <section class="caja-resumen">
      <div style="font-size: 0.75rem; color: #94a3b8;">Plan Seleccionado:</div>
      <h2 id="txt-nombre-plan" style="font-size: 1.2rem; margin: 4px 0; color: #fff;">Pase Full Integral</h2>
      <div class="monto-total" id="txt-monto-total">$9.990 CLP</div>
      <div id="txt-desglose-iva" style="font-size: 0.75rem; color: #94a3b8;">Boleta Electrónica IVA incluido</div>
    </section>

    <!-- Formulario de Activación -->
    <form class="tarjeta-formulario" onsubmit="procesarActivacionPlan(event)">
      
      <!-- Campos Titular (B2C y Contacto B2B) -->
      <div id="bloque-titular">
        <label id="lbl-titulo-titular" style="color: #38bdf8; font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 12px;">
          👤 DATOS DEL TITULAR
        </label>
        
        <div class="grupo-campo">
          <label for="pago-nombre">Nombre Completo *</label>
          <input type="text" id="pago-nombre" placeholder="Ej: Mariela Cárcamo Fernández" required>
        </div>

        <div class="grupo-campo">
          <label for="pago-rut">RUT *</label>
          <input type="text" id="pago-rut" placeholder="Ej: 12.345.678-9" required>
        </div>

        <div class="grupo-campo">
          <label for="pago-correo">Correo Electrónico (Para envío de resultados y boleta) *</label>
          <input type="email" id="pago-correo" placeholder="Ej: contacto@correo.cl" required>
        </div>
      </div>

      <!-- Campos Corporativos (Solo en B2B) -->
      <div id="bloque-b2b" style="display: none; margin-top: 14px; border-top: 1px dashed #334155; padding-top: 14px;">
        <label style="color: #38bdf8; font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 12px;">
          🏢 DATOS DE EMPRESA Y FACTURACIÓN
        </label>

        <div class="grupo-campo">
          <label for="pago-cargo">Cargo del Responsable / APR *</label>
          <input type="text" id="pago-cargo" placeholder="Ej: Encargado de Prevención de Riesgos">
        </div>

        <div class="grupo-campo">
          <label for="pago-empresa">Razón Social Empresa Mandante / Faena *</label>
          <input type="text" id="pago-empresa" placeholder="Ej: SOCADEP SpA">
        </div>

        <div class="grupo-campo">
          <label for="pago-rut-empresa">RUT Empresa (Para Factura DTE) *</label>
          <input type="text" id="pago-rut-empresa" placeholder="Ej: 76.543.210-K">
        </div>
      </div>

      <!-- Consentimiento y Términos -->
      <label class="check-terminos">
        <input type="checkbox" id="chk-terminos" required onchange="validarBotonCobro()">
        <span>He leído y acepto los <strong>Términos y Condiciones</strong> y la <strong>Política de Protección de Datos Personales (Ley N° 21.719)</strong>. Consiento el tratamiento de mis antecedentes y resultados técnicos.</span>
      </label>

      <button type="submit" id="btn-submit-pago" class="btn-pagar-ahora" disabled>
        🔒 Confirmar y Activar Plan
      </button>

      <div class="pie-seguridad">
        Transacción oficial y segura mediante plataforma Sensometrika SpA.
      </div>
    </form>

    <div style="text-align: center; margin-top: 12px;">
      <a href="planes.html" style="color: #94a3b8; text-decoration: none; font-size: 0.82rem;">← Volver al Catálogo de Planes</a>
    </div>
  </main>

  <script>
    let sesionActual = {};

    document.addEventListener('DOMContentLoaded', () => {
      // Recuperar datos del plan seleccionado
      sesionActual = JSON.parse(localStorage.getItem('sensometrika_sesion')) || {
        rol: 'particular',
        planId: 'part_full',
        nombrePlan: 'Pase Full Integral',
        precio: 9990,
        modulosPermitidos: ['reactimetro', 'palancas', 'punteo', 'visual', 'auditivo']
      };

      document.getElementById('txt-nombre-plan').innerText = sesionActual.nombrePlan || 'Pase Full Integral';
      document.getElementById('txt-monto-total').innerText = '$' + (sesionActual.precio ? Number(sesionActual.precio).toLocaleString('es-CL') : '9.990') + ' CLP';

      const bloqueB2B = document.getElementById('bloque-b2b');
      const inEmpresa = document.getElementById('pago-empresa');
      const inCargo = document.getElementById('pago-cargo');
      const inRutEmpresa = document.getElementById('pago-rut-empresa');
      const lblTitular = document.getElementById('lbl-titulo-titular');

      if (sesionActual.rol === 'empresa') {
        bloqueB2B.style.display = 'block';
        lblTitular.innerText = '👤 DATOS DEL ENCARGADO / SOLICITANTE EMPRESA';
        document.getElementById('txt-desglose-iva').innerText = 'Factura Electrónica (+ IVA)';
        inEmpresa.required = true;
        inCargo.required = true;
        inRutEmpresa.required = true;
      } else {
        bloqueB2B.style.display = 'none';
        lblTitular.innerText = '👤 DATOS DEL TITULAR';
        document.getElementById('txt-desglose-iva').innerText = 'Boleta Electrónica IVA incluido';
        inEmpresa.required = false;
        inCargo.required = false;
        inRutEmpresa.required = false;
      }
    });

    function validarBotonCobro() {
      const chk = document.getElementById('chk-terminos');
      const btn = document.getElementById('btn-submit-pago');
      btn.disabled = !chk.checked;
    }

    function procesarActivacionPlan(e) {
      e.preventDefault();

      const nombre = document.getElementById('pago-nombre').value.trim();
      const rut = document.getElementById('pago-rut').value.trim();
      const correo = document.getElementById('pago-correo').value.trim();

      if (sesionActual.rol === 'empresa') {
        const razonSocial = document.getElementById('pago-empresa').value.trim();
        const rutEmpresa = document.getElementById('pago-rut-empresa').value.trim();
        const cargo = document.getElementById('pago-cargo').value.trim();

        // Datos del encargado corporativo que validará y recibirá los certificados
        const planEmpresa = {
          razonSocial: razonSocial,
          rutEmpresa: rutEmpresa,
          responsable: {
            nombre: nombre,
            rut: rut,
            cargo: cargo,
            correo: correo
          }
        };
        localStorage.setItem('sensometrika_plan_empresa', JSON.stringify(planEmpresa));

        sesionActual.razonSocial = razonSocial;
        sesionActual.responsableNombre = nombre;
        sesionActual.responsableRut = rut;
        sesionActual.responsableCargo = cargo;
        sesionActual.correoInformes = correo;

        // Limpiar para que el trabajador se identifique en menu.html
        localStorage.removeItem('sensometrika_datos_usuario');
        localStorage.removeItem('sensometrika_firma_trabajador');
      } else {
        // En B2C, quien compra es quien se evalúa
        sesionActual.rol = 'particular';
        const datosUsuario = {
          nombre: nombre,
          rut: rut,
          correo: correo,
          empresa: 'Particular',
          tipo: 'particular'
        };
        localStorage.setItem('sensometrika_datos_usuario', JSON.stringify(datosUsuario));
        localStorage.removeItem('sensometrika_plan_empresa');
      }

      localStorage.setItem('sensometrika_sesion', JSON.stringify(sesionActual));
      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
