<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Checkout de Pago Seguro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .caja-resumen {
      width: 100%;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 1.5px solid #38bdf8;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    .caja-resumen h2 {
      font-size: 1.1rem;
      color: #38bdf8;
      margin: 0;
    }
    .fila-precio {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: #94a3b8;
    }
    .fila-precio.total {
      border-top: 1px dashed #334155;
      padding-top: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
    }
    .form-pago {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .grupo-campo {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .grupo-campo label {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 600;
    }
    .grupo-campo input {
      height: 42px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #ffffff;
      padding: 0 12px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .grupo-campo input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .seccion-b2b-extra {
      border-top: 1px solid #334155;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .caja-consentimiento-pago {
      background-color: #0b1120;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-sizing: border-box;
      margin-top: 6px;
    }
    .caja-consentimiento-pago input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .caja-consentimiento-pago label {
      font-size: 0.74rem;
      color: #cbd5e1;
      line-height: 1.35;
      cursor: pointer;
    }
    .caja-consentimiento-pago a {
      color: #38bdf8;
      text-decoration: underline;
    }
    .btn-pagar {
      width: 100%;
      height: 50px;
      background-color: #16a34a;
      border: none;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 6px;
      touch-action: manipulation;
      transition: background 0.2s;
    }
    .btn-pagar:active {
      background-color: #15803d;
      transform: scale(0.98);
    }
    .aviso-seguridad {
      font-size: 0.72rem;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Sensometrika</h1>
      <p id="subtitulo-checkout">Confirmación de Pago Seguro</p>
    </header>

    <!-- Resumen del Pedido -->
    <section class="caja-resumen">
      <h2 id="txt-plan-nombre">Cargando pedido...</h2>
      <div class="fila-precio" id="fila-cant">
        <span>Evaluaciones contratadas:</span>
        <strong id="txt-plan-cant" style="color: #fff;">1</strong>
      </div>
      <div class="fila-precio" id="fila-neto" style="display: none;">
        <span>Subtotal Neto:</span>
        <strong id="txt-plan-neto" style="color: #fff;">$0 CLP</strong>
      </div>
      <div class="fila-precio" id="fila-iva" style="display: none;">
        <span>IVA (19% Factura):</span>
        <strong id="txt-plan-iva" style="color: #fff;">$0 CLP</strong>
      </div>
      <div class="fila-precio total">
        <span>Total a Pagar:</span>
        <strong id="txt-plan-total" style="color: #38bdf8;">$0 CLP</strong>
      </div>
    </section>

    <!-- Formulario de Cobro -->
    <form class="form-pago" id="formulario-checkout" onsubmit="procesarPago(event)">
      <div class="grupo-campo">
        <label for="inp-nombre">Nombre y Apellido *</label>
        <input type="text" id="inp-nombre" placeholder="Ej: Carlos Silva" required>
      </div>

      <div class="grupo-campo">
        <label for="inp-rut">RUT Postulante / Encargado *</label>
        <input type="text" id="inp-rut" placeholder="Ej: 12.345.678-9" required>
      </div>

      <!-- Campos Exclusivos B2B -->
      <div class="seccion-b2b-extra" id="bloque-empresa" style="display: none;">
        <div class="grupo-campo">
          <label for="inp-razon-social">Razón Social Empresa *</label>
          <input type="text" id="inp-razon-social" placeholder="Ej: Transportes del Norte SpA">
        </div>
        <div class="grupo-campo">
          <label for="inp-rut-empresa">RUT Empresa (Para Factura) *</label>
          <input type="text" id="inp-rut-empresa" placeholder="Ej: 76.123.456-7">
        </div>
        <div class="grupo-campo">
          <label for="inp-correo-informes">Correo para Notificación de Informes *</label>
          <input type="email" id="inp-correo-informes" placeholder="prevencion@empresa.cl">
        </div>
      </div>

      <div class="grupo-campo" id="bloque-correo-b2c">
        <label for="inp-correo-b2c">Correo Electrónico *</label>
        <input type="email" id="inp-correo-b2c" placeholder="nombre@correo.cl">
      </div>

      <!-- Checkbox de Consentimiento Ley N° 21.719 -->
      <div class="caja-consentimiento-pago">
        <input type="checkbox" id="chk-pago-consent" required>
        <label for="chk-pago-consent">
          He leído y acepto los <a href="terminos.html" target="_blank">Términos y Condiciones</a> y la <strong>Política de Protección de Datos Personales</strong>. Consiento el tratamiento de mi correo para envío del comprobante y habilitación del servicio.
        </label>
      </div>

      <button type="submit" class="btn-pagar" id="btn-submit-pago">
        🔒 Confirmar y Activar Plan
      </button>

      <div class="aviso-seguridad">
        Transacción cifrada SSL de 256 bits. Emisión automática de documento tributario.
      </div>
    </form>

    <a href="planes.html" style="color: #94a3b8; font-size: 0.8rem; text-align: center; margin-top: 12px; text-decoration: none;">
      ← Cambiar Plan
    </a>
  </main>

  <script>
    const pedido = JSON.parse(localStorage.getItem('sensometrika_plan_pedido')) || {
      planId: 'part_basico',
      nombrePlan: 'Plan Básico Psicomotriz',
      precioUnitario: 4990,
      cantidad: 1,
      precioNeto: 4990,
      precioTotal: 4990,
      rol: 'particular',
      modulosPermitidos: ['reactimetro', 'palancas', 'punteo']
    };

    document.getElementById('txt-plan-nombre').innerText = pedido.nombrePlan;
    document.getElementById('txt-plan-cant').innerText = pedido.cantidad;

    if (pedido.rol === 'empresa') {
      document.getElementById('bloque-empresa').style.display = 'flex';
      document.getElementById('bloque-correo-b2c').style.display = 'none';
      document.getElementById('fila-neto').style.display = 'flex';
      document.getElementById('fila-iva').style.display = 'flex';

      document.getElementById('inp-razon-social').setAttribute('required', 'true');
      document.getElementById('inp-rut-empresa').setAttribute('required', 'true');
      document.getElementById('inp-correo-informes').setAttribute('required', 'true');

      document.getElementById('txt-plan-neto').innerText = `$${pedido.precioNeto.toLocaleString('es-CL')} CLP`;
      document.getElementById('txt-plan-iva').innerText = `$${pedido.iva.toLocaleString('es-CL')} CLP`;
      document.getElementById('txt-plan-total').innerText = `$${pedido.precioTotal.toLocaleString('es-CL')} CLP`;
    } else {
      document.getElementById('inp-correo-b2c').setAttribute('required', 'true');
      document.getElementById('txt-plan-total').innerText = `$${pedido.precioTotal.toLocaleString('es-CL')} CLP`;
    }

    function procesarPago(event) {
      event.preventDefault();

      const consent = document.getElementById('chk-pago-consent');
      if (!consent || !consent.checked) {
        alert('Debe aceptar los Términos y la Política de Privacidad para continuar.');
        return;
      }

      const nombre = document.getElementById('inp-nombre').value.trim();
      const rut = document.getElementById('inp-rut').value.trim();
      let razonSocial = '';
      let correoInformes = '';

      if (pedido.rol === 'empresa') {
        razonSocial = document.getElementById('inp-razon-social').value.trim();
        correoInformes = document.getElementById('inp-correo-informes').value.trim();
      } else {
        correoInformes = document.getElementById('inp-correo-b2c').value.trim();
      }

      // Guardar licencia
      const sesionActiva = {
        rol: pedido.rol,
        planId: pedido.planId,
        nombrePlan: pedido.nombrePlan,
        modulosPermitidos: pedido.modulosPermitidos,
        intentosRestantes: pedido.cantidad,
        razonSocial: razonSocial,
        correoInformes: correoInformes,
        fechaActivacion: new Date().toISOString()
      };
      localStorage.setItem('sensometrika_sesion', JSON.stringify(sesionActiva));

      // Precargar identidad
      const datosUsuario = {
        tipo: pedido.rol,
        nombre: nombre,
        rut: rut,
        empresa: pedido.rol === 'empresa' ? razonSocial : 'Particular',
        consentimientoCompra: true,
        fechaConsentimientoCompra: new Date().toISOString()
      };
      localStorage.setItem('sensometrika_datos_usuario', JSON.stringify(datosUsuario));

      alert('¡Pago y activación completados con éxito! Redirigiendo al portal de evaluaciones...');
      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
