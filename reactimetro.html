<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Reactímetro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .barra-superior {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .barra-superior a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .barra-calibracion {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #94a3b8;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .semaforo-caja {
      background-color: #020617;
      padding: 16px;
      border-radius: 40px;
      display: flex;
      gap: 20px;
      border: 3px solid #334155;
      margin: 10px auto;
      justify-content: center;
      width: fit-content;
    }
    .luz {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      transition: opacity 0.1s ease, box-shadow 0.1s ease;
    }
    .verde { background-color: #22c55e; }
    .roja { background-color: #ef4444; }
    .apagada { opacity: 0.15; box-shadow: none; }
    .verde.encendida { opacity: 1; box-shadow: 0 0 25px #22c55e; }
    .roja.encendida { opacity: 1; box-shadow: 0 0 30px #ef4444; }
    .panel-resultados {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 14px 0;
      width: 100%;
    }
    .tarjeta-metrica {
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 10px 6px;
      border-radius: 8px;
      text-align: center;
    }
    .tarjeta-metrica span { display: block; font-size: 0.7rem; color: #94a3b8; }
    .tarjeta-metrica strong { font-size: 0.95rem; color: #38bdf8; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="barra-superior">
      <a href="menu.html">← Menú Principal</a>
      <span style="font-size: 0.8rem; color: #38bdf8; font-weight: 700;">MÓDULO 1: REACTÍMETRO</span>
    </header>

    <div class="barra-calibracion">
      <span id="badge-modo">🟢 Demo Calibración (Ensayo Libre)</span>
      <span id="txt-tiempo-cabecera">Fase de Práctica</span>
    </div>

    <section class="semaforo-caja">
      <div id="luz-verde" class="luz verde apagada"></div>
      <div id="luz-roja" class="luz roja apagada"></div>
    </section>

    <div id="panel-estado" class="estado">Presiona "Iniciar Calibración" para comenzar</div>

    <button id="btn-accion" class="btn-principal">Iniciar Calibración</button>

    <section class="panel-resultados">
      <div class="tarjeta-metrica">
        <span>Último Tiempo</span>
        <strong id="metrica-tiempo">-- ms</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Promedio</span>
        <strong id="metrica-promedio">-- ms</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Anticipaciones</span>
        <strong id="metrica-anticipaciones">0</strong>
      </div>
    </section>

    <div id="zona-coordinacion-test" style="width: 100%;"></div>
  </main>

  <script src="reactimetro.js"></script>
</body>
</html>
