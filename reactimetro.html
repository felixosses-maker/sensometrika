<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Reactímetro</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .semaforo-caja {
      background-color: #020617;
      padding: 16px;
      border-radius: 40px;
      display: flex;
      gap: 20px;
      border: 3px solid #334155;
      margin: 15px auto;
      justify-content: center;
      width: fit-content;
    }
    .luz {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      transition: opacity 0.1s ease, box-shadow 0.1s ease;
    }
    .verde { background-color: #22c55e; }
    .roja { background-color: #ef4444; }
    .apagada { opacity: 0.15; box-shadow: none; }
    .verde.encendida { opacity: 1; box-shadow: 0 0 25px #22c55e; }
    .roja.encendida { opacity: 1; box-shadow: 0 0 30px #ef4444; }

    .panel-resultados {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 15px 0;
    }
    .tarjeta-metrica {
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 10px 6px;
      border-radius: 8px;
      text-align: center;
    }
    .tarjeta-metrica span {
      display: block;
      font-size: 0.7rem;
      color: #94a3b8;
    }
    .tarjeta-metrica strong {
      font-size: 0.95rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado" style="text-align: center; margin-bottom: 12px;">
      <h1 style="color: #ffffff; margin: 0; font-size: 1.3rem;">Sensometrika</h1>
      <p style="color: #94a3b8; font-size: 0.8rem; margin: 2px 0 0 0;">Entrenamiento de Tiempo de Reacción (Reactímetro)</p>
    </header>

    <section class="semaforo-caja">
      <div id="luz-verde" class="luz verde apagada"></div>
      <div id="luz-roja" class="luz roja apagada"></div>
    </section>

    <div id="panel-estado" class="estado" style="text-align: center; margin: 12px 0; font-size: 0.88rem; min-height: 24px; color: #94a3b8;">
      Presiona "Iniciar Prueba" para comenzar
    </div>

    <button id="btn-accion" class="btn-principal" style="width: 100%; height: 46px; background-color: #0284c7; border: none; border-radius: 8px; color: #ffffff; font-weight: 700; font-size: 1rem; cursor: pointer;">
      Iniciar Prueba
    </button>

    <section class="panel-resultados">
      <div class="tarjeta-metrica">
        <span>Último Tiempo</span>
        <strong id="metrica-tiempo">-- ms</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Promedio</span>
        <strong id="metrica-promedio">-- ms</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Anticipaciones</span>
        <strong id="metrica-anticipaciones">0</strong>
      </div>
    </section>

    <a href="menu.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem; display: block; text-align: center; margin-top: 15px;">
      ← Volver al Menú Principal
    </a>
  </main>

  <script src="reactimetro.js"></script>
</body>
</html>
