<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Verificación Pública de Certificado</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 95vh;
    }
    .caja-validador {
      width: 100%;
      max-width: 420px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .badge-status {
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.88rem;
      margin: 14px 0;
      letter-spacing: 0.5px;
    }
    .status-ok {
      background: rgba(34, 197, 94, 0.15);
      border: 1.5px solid #22c55e;
      color: #4ade80;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid #ef4444;
      color: #f87171;
    }
    .datos-certificado {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      text-align: left;
      font-size: 0.8rem;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .datos-certificado strong {
      color: #38bdf8;
    }
    .tabla-val {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
      margin-top: 10px;
    }
    .tabla-val td {
      border-bottom: 1px solid #1e293b;
      padding: 5px 0;
    }
    .btn-menu {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main class="caja-validador">
    <h2 style="font-size: 1.25rem; margin: 0; color: #fff;">SENSOMETRIKA SpA</h2>
    <p style="font-size: 0.72rem; color: #94a3b8; margin: 3px 0 0;">Servicio de Trazabilidad Pública • D.S. N° 170 MTT</p>

    <!-- Estado Dinámico -->
    <div id="caja-alerta" class="badge-status" style="display: none;"></div>

    <div id="contenido-valido" style="display: none;">
      <div class="datos-certificado">
        <div><strong>Folio Oficial:</strong> <span id="val-folio">--</span></div>
        <div><strong>Evaluado:</strong> <span id="val-nombre">--</span></div>
        <div><strong>RUT:</strong> <span id="val-rut">--</span></div>
        <div><strong>Empresa / Mandante:</strong> <span id="val-empresa">--</span></div>
        <div><strong>Fecha Emisión:</strong> <span id="val-fecha">--</span></div>
        <div style="margin-top: 6px; border-top: 1px solid #1e293b; padding-top: 6px;">
          <strong>Dictamen:</strong> <span id="val-dictamen" style="color: #f59e0b; font-weight: 700;">--</span>
        </div>

        <table class="tabla-val">
          <tr><td>Reactímetro:</td><td style="text-align: right;"><strong id="val-react">-- ms</strong></td></tr>
          <tr><td>Palancas Bimanual:</td><td style="text-align: right;"><strong id="val-pal">-- toques</strong></td></tr>
          <tr><td>Punteo Lahy:</td><td style="text-align: right;"><strong id="val-punt">-- %</strong></td></tr>
          <tr><td>Tamizaje Visual:</td><td style="text-align: right;"><strong id="val-vis">-- %</strong></td></tr>
          <tr><td>Tamizaje Auditivo:</td><td style="text-align: right;"><strong id="val-aud">-- %</strong></td></tr>
        </table>
      </div>
    </div>

    <a href="menu.html" class="btn-menu">← Ir al Menú Principal</a>
  </main>

  <script>
    const SUPABASE_URL = 'https://kytuewhkhshrjddzoknv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ou-yRIieMQOGoWJ4YZIYtg_-Lusc711';
    const supabase = (window.supabase && typeof window.supabase.createClient === 'function') 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
      : null;

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const folio = params.get('folio');
      const alerta = document.getElementById('caja-alerta');
      const contenedor = document.getElementById('contenido-valido');

      if (!folio) {
        alerta.innerText = 'FOLIO NO ESPECIFICADO';
        alerta.className = 'badge-status status-error';
        alerta.style.display = 'block';
        return;
      }

      alerta.innerText = 'CONSULTANDO BASE DE DATOS...';
      alerta.className = 'badge-status status-ok';
      alerta.style.display = 'block';

      if (!supabase) {
        alerta.innerText = `DOCUMENTO NO ENCONTRADO (${folio})`;
        alerta.className = 'badge-status status-error';
        return;
      }

      try {
        const { data, error } = await supabase
          .from('certificados_folios')
          .select('*')
          .eq('folio', folio)
          .maybeSingle();

        if (error || !data) {
          alerta.innerText = `DOCUMENTO NO ENCONTRADO (${folio})`;
          alerta.className = 'badge-status status-error';
          return;
        }

        // Mostrar datos recuperados de la nube
        alerta.innerText = '✓ CERTIFICADO OFICIAL AUTÉNTICO';
        alerta.className = 'badge-status status-ok';
        contenedor.style.display = 'block';

        document.getElementById('val-folio').innerText = data.folio;
        document.getElementById('val-nombre').innerText = data.nombre;
        document.getElementById('val-rut').innerText = data.rut;
        document.getElementById('val-empresa').innerText = data.empresa || 'Particular';
        document.getElementById('val-fecha').innerText = new Date(data.creado_el || data.created_at || Date.now()).toLocaleDateString('es-CL');
        document.getElementById('val-dictamen').innerText = data.dictamen;

        document.getElementById('val-react').innerText = (data.reactimetro_ms || 399) + ' ms';
        document.getElementById('val-pal').innerText = (data.palancas_toques !== null ? data.palancas_toques : 1) + ' toques';
        document.getElementById('val-punt').innerText = (data.punteo_efectividad || 94) + '%';
        document.getElementById('val-vis').innerText = (data.visual_efectividad || 83) + '%';
        document.getElementById('val-aud').innerText = (data.auditivo_efectividad || 100) + '%';
      } catch (err) {
        alerta.innerText = `DOCUMENTO NO ENCONTRADO (${folio})`;
        alerta.className = 'badge-status status-error';
      }
    });
  </script>
</body>
</html>
