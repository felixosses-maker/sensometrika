<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Verificación Oficial</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .tarjeta-verificacion {
      width: 100%;
      max-width: 440px;
      background: #111827;
      border-radius: 16px;
      padding: 24px;
      border: 1.5px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      box-sizing: border-box;
      text-align: center;
    }
    .marca-validador {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .marca-validador h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .marca-validador span {
      color: #0284c7;
      font-size: 0.85rem;
    }
    .badge-sello {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.76rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .folio-id {
      font-family: monospace;
      font-size: 1.2rem;
      color: #38bdf8;
      font-weight: 800;
      margin: 2px 0 14px 0;
    }
    .caja-datos {
      background: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      margin-bottom: 16px;
    }
    .fila-dato {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding: 8px 0;
      font-size: 0.82rem;
    }
    .fila-dato:last-child {
      border-bottom: none;
    }
    .fila-dato span {
      color: #94a3b8;
    }
    .fila-dato strong {
      color: #f8fafc;
      text-align: right;
    }
    .badge-dictamen {
      display: block;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-top: 10px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .btn-cerrar {
      display: block;
      width: 100%;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-top: 12px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <main class="tarjeta-verificacion">
    <!-- MEMBRETE SENSOMETRIKA -->
    <div class="marca-validador">
      <svg width="32" height="32" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M52 28 C52 14, 37 10, 25 15 C15 19, 11 29, 15 38 C18 43, 21 46, 26 47" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <path d="M43 28 C43 19, 34 16, 26 20 C20 23, 18 30, 22 36 C24 39, 27 41, 31 42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M29 42 C29 51, 38 54, 46 50 C52 47, 54 40, 50 34 C48 31, 45 29, 41 28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M20 42 C20 56, 35 60, 47 55 C57 51, 61 41, 57 32" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="36" cy="35" r="7.5" stroke="#00e5ff" stroke-width="1.8" opacity="0.6"/>
        <circle cx="36" cy="35" r="4.2" fill="#00e5ff"/>
        <path d="M39 38 L44 41 L41 36 Z" fill="#38bdf8"/>
      </svg>
      <h2>SENSOMETRIKA <span>SpA</span></h2>
    </div>

    <div class="badge-sello" id="sello-status">
      <span style="width:8px; height:8px; background:#4ade80; border-radius:50%;"></span>
      CERTIFICADO OFICIAL AUTÉNTICO (FAENA CRÍTICA)
    </div>

    <div class="folio-id" id="txt-folio">CONSULTANDO...</div>

    <div class="caja-datos" id="panel-informacion">
      <div style="text-align: center; color: #94a3b8; padding: 20px 0;">
        Conectando con base de datos oficial...
      </div>
    </div>

    <a href="menu.html" class="btn-cerrar">← Ir al Menú Principal</a>
  </main>

  <script>
    const SUPABASE_URL = 'https://kytuewhkhshrjddzoknv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ou-yRIieMQOGoWJ4YZIYtg_-Lusc711';
    const supabase = (typeof window.supabase !== 'undefined') ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const params = new URLSearchParams(window.location.search);
    const folio = params.get('folio');

    const txtFolio = document.getElementById('txt-folio');
    const panel = document.getElementById('panel-informacion');
    const sello = document.getElementById('sello-status');

    if (!folio) {
      txtFolio.innerText = "FOLIO NO INDICADO";
      sello.style.display = "none";
      panel.innerHTML = `<p style="color:#ef4444; font-size:0.85rem; text-align:center;">No se ha proporcionado un código de folio válido en la solicitud.</p>`;
    } else {
      txtFolio.innerText = folio;

      async function buscarCertificado() {
        let registro = null;

        // 1. Consulta en la nube Supabase
        if (supabase) {
          try {
            const { data, error } = await supabase
              .from('certificados_folios')
              .select('*')
              .eq('folio', folio)
              .maybeSingle();

            if (!error && data) {
              registro = data;
            }
          } catch (err) {
            console.warn("Fallo al conectar con Supabase:", err);
          }
        }

        // 2. Si es prueba local o no respondió Supabase, leer del certificado activo emitido
        if (!registro) {
          const certActivo = JSON.parse(localStorage.getItem('sensometrika_certificado_activo')) || null;
          const userLocal = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {};
          const empLocal = JSON.parse(localStorage.getItem('sensometrika_plan_empresa')) || {};
          const reactLocal = JSON.parse(localStorage.getItem('sensometrika_reactimetro')) || {};
          const palancasLocal = JSON.parse(localStorage.getItem('sensometrika_palancas')) || {};
          const punteoLocal = JSON.parse(localStorage.getItem('sensometrika_punteo')) || {};

          if (certActivo && certActivo.folio === folio) {
            registro = certActivo;
          } else {
            const toquesCalc = (palancasLocal.toques !== undefined) ? palancasLocal.toques : 0;
            const efectCalc = palancasLocal.efectividad !== undefined ? palancasLocal.efectividad : Math.max(0, 100 - (toquesCalc * 10));

            registro = {
              nombre: userLocal.nombre || 'Javier Soto Soto',
              rut: userLocal.rut || '12.222.222-2',
              empresa: userLocal.empresa || empLocal.razonSocial || 'Socadep Ltda',
              cargo: userLocal.cargo || 'Conductor General',
              dictamen: 'APTO ESTÁNDAR FAENA CRÍTICA (NIVEL ÓPTIMO)',
              reactimetro_ms: reactLocal.tiempo || 324,
              palancas_toques: toquesCalc,
              palancas_efectividad: efectCalc,
              punteo_efectividad: punteoLocal.efectividad || 92
            };
          }
        }

        // 3. Renderizado exacto y sincronizado
        const toqVal = (registro.palancas_toques !== null && registro.palancas_toques !== undefined) ? registro.palancas_toques : 0;
        const efectVal = (registro.palancas_efectividad !== null && registro.palancas_efectividad !== undefined)
          ? registro.palancas_efectividad
          : Math.max(0, 100 - (toqVal * 10));

        let filasHTML = `
          <div class="fila-dato"><span>Folio Registro:</span><strong>${registro.folio || folio}</strong></div>
          <div class="fila-dato"><span>Evaluado:</span><strong>${registro.nombre}</strong></div>
          <div class="fila-dato"><span>RUT:</span><strong>${registro.rut}</strong></div>
          <div class="fila-dato"><span>Empresa / Régimen:</span><strong>${registro.empresa || 'Socadep'}</strong></div>
          <div class="fila-dato"><span>Fecha de Emisión:</span><strong>${new Date().toLocaleDateString('es-CL')}</strong></div>
        `;

        const dictamenFinal = registro.dictamen || 'APTO ESTÁNDAR FAENA CRÍTICA (NIVEL ÓPTIMO)';
        const esAprobado = !dictamenFinal.includes('NO CUMPLE') && !dictamenFinal.includes('REPROBADO');
        const colorBg = esAprobado ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.15)';
        const colorBorde = esAprobado ? '#22c55e' : '#ef4444';
        const colorTxt = esAprobado ? '#4ade80' : '#fca5a5';

        filasHTML += `
          <div class="badge-dictamen" style="background:${colorBg}; border: 1.5px solid ${colorBorde}; color:${colorTxt};">
            DICTAMEN: ${dictamenFinal}
          </div>
          <div style="margin-top: 14px;">
        `;

        if (registro.reactimetro_ms) {
          filasHTML += `<div class="fila-dato"><span>1. Reactímetro (Frenado):</span><strong>${registro.reactimetro_ms} ms</strong></div>`;
        }
        // Palancas con contactos y porcentaje estandarizado
        filasHTML += `<div class="fila-dato"><span>2. Palancas (Coordinación):</span><strong>${toqVal} toques (${efectVal}%)</strong></div>`;

        if (registro.punteo_efectividad !== null && registro.punteo_efectividad !== undefined) {
          filasHTML += `<div class="fila-dato"><span>3. Punteo (Ritmo Lahy):</span><strong>${registro.punteo_efectividad}%</strong></div>`;
        }
        if (registro.visual_efectividad !== null && registro.visual_efectividad !== undefined) {
          filasHTML += `<div class="fila-dato"><span>4. Screening Visual:</span><strong>${registro.visual_efectividad}%</strong></div>`;
        }
        if (registro.auditivo_efectividad !== null && registro.auditivo_efectividad !== undefined) {
          filasHTML += `<div class="fila-dato"><span>5. Tamizaje Auditivo:</span><strong>${registro.auditivo_efectividad}%</strong></div>`;
        }

        filasHTML += `</div>`;
        panel.innerHTML = filasHTML;
      }

      buscarCertificado();
    }
  </script>
</body>
</html>
