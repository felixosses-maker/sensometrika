<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Portal de Verificación Oficial</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .contenedor { width: 100%; max-width: 480px; }
    
    .estado-sello {
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 800;
      font-size: 0.90rem;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    .cargando { background-color: rgba(2, 132, 199, 0.15); border: 1.5px solid #0284c7; color: #38bdf8; }
    .valido { background-color: rgba(34, 197, 94, 0.15); border: 1.5px solid #22c55e; color: #4ade80; }
    .observado { background-color: rgba(245, 158, 11, 0.15); border: 1.5px solid #f59e0b; color: #fbbf24; }
    .invalido { background-color: rgba(239, 68, 68, 0.15); border: 1.5px solid #ef4444; color: #f87171; }
    
    .tarjeta-validacion {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fila-dato {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
      font-size: 0.82rem;
    }
    .fila-dato span { color: #94a3b8; }
    .fila-dato strong { color: #f8fafc; text-align: right; }
    
    .tabla-metricas {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.78rem;
    }
    .tabla-metricas th, .tabla-metricas td {
      padding: 7px 8px;
      border: 1px solid #334155;
      text-align: left;
    }
    .tabla-metricas th { background-color: #1e293b; color: #38bdf8; }

    .badge-estado {
      font-size: 0.66rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
      text-align: center;
    }
    .badge-cumple { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-observado { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-falla { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .btn-volver {
      display: block;
      margin-top: 14px;
      text-align: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header style="text-align: center; margin-bottom: 14px;">
      <h1 style="color: #fff; font-size: 1.25rem; margin: 0;">SENSOMETRIKA SpA</h1>
      <p style="color: #94a3b8; font-size: 0.75rem; margin: 2px 0 0 0;">Servicio de Trazabilidad Pública • D.S. N° 170 MTT</p>
    </header>

    <!-- Sello Dinámico Superior -->
    <div id="caja-estado" class="estado-sello cargando">
      VERIFICANDO AUTENTICIDAD EN BASE DE DATOS...
    </div>

    <section class="tarjeta-validacion" id="contenedor-resultado" style="display: none;">
      <div class="fila-dato"><span>Folio Registro:</span><strong id="res-folio">--</strong></div>
      <div class="fila-dato"><span>Evaluado:</span><strong id="res-nombre">--</strong></div>
      <div class="fila-dato"><span>RUT:</span><strong id="res-rut">--</strong></div>
      <div class="fila-dato"><span>Régimen / Empresa:</span><strong id="res-empresa">--</strong></div>
      <div class="fila-dato"><span>Fecha de Emisión:</span><strong id="res-fecha">--</strong></div>
      <div class="fila-dato" style="border-bottom: none;"><span>Dictamen:</span><strong id="res-dictamen">--</strong></div>

      <!-- Tabla con columna de Evaluación adaptativa -->
      <table class="tabla-metricas">
        <thead>
          <tr>
            <th>Prueba Psicomotriz</th>
            <th>Medición Registrada</th>
            <th style="text-align: center;">Evaluación</th>
          </tr>
        </thead>
        <tbody id="cuerpo-metricas-validador">
          <!-- Inyectado dinámicamente -->
        </tbody>
      </table>
    </section>

    <a href="menu.html" class="btn-volver">← Ir al Menú Principal</a>
  </main>

  <script>
    const SUPABASE_URL = 'https://kytuewhkhshrjddzoknv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5dHVld2hraHNocmpkZHpva252Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzc4MzcsImV4cCI6MjEwNDcxMzgzN30.gNWbr8E7oF-56yKnNIDVvGIaGXfHkCCcKonWVDthp2k';

    const clienteSupabase = (window.supabase && typeof window.supabase.createClient === 'function')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const folioBuscado = urlParams.get('folio');
      const boxEstado = document.getElementById('caja-estado');
      const cardInfo = document.getElementById('contenedor-resultado');

      if (!folioBuscado) {
        boxEstado.className = 'estado-sello invalido';
        boxEstado.innerText = 'DOCUMENTO NO VÁLIDO: FOLIO NO ESPECIFICADO';
        return;
      }

      if (!clienteSupabase) {
        boxEstado.className = 'estado-sello invalido';
        boxEstado.innerText = 'ERROR: CLIENTE DE BASE DE DATOS NO DISPONIBLE';
        return;
      }

      let respondio = false;
      const temporizador = setTimeout(() => {
        if (!respondio) {
          boxEstado.className = 'estado-sello invalido';
          boxEstado.innerText = 'TIEMPO DE ESPERA AGOTADO (VERIFIQUE SU CONEXIÓN)';
        }
      }, 4000);

      try {
        const { data, error } = await clienteSupabase
          .from('certificados_folios')
          .select('*')
          .eq('folio', folioBuscado)
          .maybeSingle();

        respondio = true;
        clearTimeout(temporizador);

        if (error || !data) {
          boxEstado.className = 'estado-sello invalido';
          boxEstado.innerText = `DOCUMENTO NO ENCONTRADO (${folioBuscado})`;
          return;
        }

        const dictamen = data.dictamen || '';
        const esIncompleta = dictamen.includes('INCOMPLETA');
        const esReprobado = dictamen.includes('NO APTO') || dictamen.includes('REENTRENAMIENTO');
        const esObservado = dictamen.includes('OBSERVACIÓN') || dictamen.includes('OBS.');

        // 1. Sello Superior Tri-Estado
        if (esReprobado || esIncompleta) {
          boxEstado.className = 'estado-sello invalido';
          boxEstado.innerText = '⚠️ CERTIFICADO OFICIAL: NO APTO / REPROBADO';
        } else if (esObservado) {
          boxEstado.className = 'estado-sello observado';
          boxEstado.innerText = '⚠️ CERTIFICADO: APTO CLASE B (CON OBSERVACIÓN FAENA)';
        } else {
          boxEstado.className = 'estado-sello valido';
          boxEstado.innerText = '✓ CERTIFICADO OFICIAL VERIFICADO (APTO FAENA)';
        }

        // 2. Ficha de filiación
        document.getElementById('res-folio').innerText = data.folio;
        document.getElementById('res-nombre').innerText = data.nombre;
        document.getElementById('res-rut').innerText = data.rut;
        document.getElementById('res-empresa').innerText = data.empresa || 'Particular';
        document.getElementById('res-fecha').innerText = new Date(data.created_at || data.creado_el || Date.now()).toLocaleString('es-CL');
        
        const elDictamen = document.getElementById('res-dictamen');
        elDictamen.innerText = dictamen;
        if (esReprobado || esIncompleta) {
          elDictamen.style.color = '#f87171';
        } else if (esObservado) {
          elDictamen.style.color = '#fbbf24';
        } else {
          elDictamen.style.color = '#4ade80';
        }

        // 3. Tabla de Resultados Detallada
        const tbody = document.getElementById('cuerpo-metricas-validador');
        tbody.innerHTML = '';

        // Módulo 1: Reactímetro
        if (data.reactimetro_ms !== null && data.reactimetro_ms !== undefined) {
          const ms = data.reactimetro_ms;
          let badgeReact = '';
          let colorTxt = '#f8fafc';

          if (ms <= 350) {
            badgeReact = '<span class="badge-estado badge-cumple">CUMPLE FAENA</span>';
          } else if (ms <= 450) {
            colorTxt = '#fbbf24';
            badgeReact = '<span class="badge-estado badge-observado">APTO CLASE B (OBS. FAENA)</span>';
          } else {
            colorTxt = '#f87171';
            badgeReact = '<span class="badge-estado badge-falla">NO CUMPLE NORMATIVA</span>';
          }

          tbody.innerHTML += `
            <tr>
              <td>
                <strong>1. Reactímetro (Frenado)</strong><br>
                <small style="color:#94a3b8;">Faena: &le; 350 ms | Legal: &le; 450 ms</small>
              </td>
              <td style="color: ${colorTxt}; font-weight: bold;">${ms} ms</td>
              <td style="text-align: center;">${badgeReact}</td>
            </tr>
          `;
        } else {
          tbody.innerHTML += `
            <tr>
              <td><strong>1. Reactímetro (Frenado)</strong></td>
              <td>-- ms</td>
              <td style="text-align: center;"><span class="badge-estado badge-falla">PENDIENTE</span></td>
            </tr>
          `;
        }

        // Módulo 2: Palancas con porcentaje
        if (data.palancas_toques !== null && data.palancas_toques !== undefined) {
          const toques = data.palancas_toques;
          const palOk = toques <= 3;
          const porcentajePal = Math.max(0, 100 - (toques * 10));

          tbody.innerHTML += `
            <tr>
              <td>
                <strong>2. Palancas (Coordinación)</strong><br>
                <small style="color:#94a3b8;">Límite normativo: &le; 3 toques</small>
              </td>
              <td style="color: ${palOk ? '#f8fafc' : '#f87171'}; font-weight: bold;">
                ${toques} toques (${porcentajePal}%)
              </td>
              <td style="text-align: center;">
                <span class="badge-estado ${palOk ? 'badge-cumple' : 'badge-falla'}">${palOk ? 'CUMPLE' : 'REPROBADO'}</span>
              </td>
            </tr>
          `;
        } else {
          tbody.innerHTML += `
            <tr>
              <td><strong>2. Palancas (Coordinación)</strong></td>
              <td>-- toques</td>
              <td style="text-align: center;"><span class="badge-estado badge-falla">PENDIENTE</span></td>
            </tr>
          `;
        }

        // Módulo 3: Punteo
        if (data.punteo_efectividad !== null && data.punteo_efectividad !== undefined) {
          const ef = data.punteo_efectividad;
          const puntOk = ef >= 80;

          tbody.innerHTML += `
            <tr>
              <td>
                <strong>3. Punteo (Ritmo)</strong><br>
                <small style="color:#94a3b8;">Límite normativo: &ge; 80%</small>
              </td>
              <td style="color: ${puntOk ? '#f8fafc' : '#f87171'}; font-weight: bold;">${ef}%</td>
              <td style="text-align: center;">
                <span class="badge-estado ${puntOk ? 'badge-cumple' : 'badge-falla'}">${puntOk ? 'CUMPLE' : 'REPROBADO'}</span>
              </td>
            </tr>
          `;
        } else {
          tbody.innerHTML += `
            <tr>
              <td><strong>3. Punteo (Ritmo)</strong></td>
              <td>-- %</td>
              <td style="text-align: center;"><span class="badge-estado badge-falla">PENDIENTE</span></td>
            </tr>
          `;
        }

        cardInfo.style.display = 'flex';

      } catch (err) {
        respondio = true;
        clearTimeout(temporizador);
        boxEstado.className = 'estado-sello invalido';
        boxEstado.innerText = 'ERROR DE COMUNICACIÓN CON EL SERVIDOR';
      }
    });
  </script>
</body>
</html>
