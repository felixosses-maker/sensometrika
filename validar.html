<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensometrika | Portal de Verificación Oficial</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .tarjeta-validador {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .tarjeta-validador h2 {
      margin: 0;
      color: #fff;
      font-size: 1.3rem;
    }
    .tarjeta-validador p.sub {
      margin: 4px 0 16px 0;
      font-size: 0.76rem;
      color: #94a3b8;
    }
    .estado-banner {
      border-radius: 8px;
      padding: 12px;
      font-weight: 800;
      font-size: 0.88rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .estado-valido {
      background: rgba(34, 197, 94, 0.12);
      border: 1.5px solid #22c55e;
      color: #4ade80;
    }
    .estado-no-valido {
      background: rgba(239, 68, 68, 0.12);
      border: 1.5px solid #ef4444;
      color: #f87171;
    }
    .estado-cargando {
      background: rgba(2, 132, 199, 0.12);
      border: 1.5px solid #0284c7;
      color: #38bdf8;
    }
    .caja-datos {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      text-align: left;
      font-size: 0.8rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .caja-datos div span { color: #64748b; }
    .caja-datos div strong { color: #fff; }
    .btn-portal {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="tarjeta-validador">
    <h2>SENSOMETRIKA SpA</h2>
    <p class="sub">Servicio Oficial de Trazabilidad y Verificación Pública</p>

    <div class="estado-banner estado-cargando" id="banner-estado">
      Verificando autenticidad en base de datos...
    </div>

    <div class="caja-datos" id="datos-certificado" style="display: none;">
      <div><span>Folio Registro:</span> <strong id="val-folio">--</strong></div>
      <div><span>Evaluado:</span> <strong id="val-nombre">--</strong></div>
      <div><span>RUT:</span> <strong id="val-rut">--</strong></div>
      <div><span>Empresa / Entidad:</span> <strong id="val-empresa">--</strong></div>
      <div><span>Fecha de Emisión:</span> <strong id="val-fecha">--</strong></div>
      <div><span>Dictamen Técnico:</span> <strong id="val-dictamen" style="color: #4ade80;">--</strong></div>
    </div>

    <a href="index.html" class="btn-portal">← Ir al Portal Principal</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://kytuewhkhshrjddzoknv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ou-yRIieMQOGoWJ4YZIYtg_-Lusc711';
    const supabase = (window.supabase && typeof window.supabase.createClient === 'function') 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
      : null;

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const folioBuscado = params.get('folio');
      const banner = document.getElementById('banner-estado');
      const caja = document.getElementById('datos-certificado');

      if (!folioBuscado) {
        banner.className = 'estado-banner estado-no-valido';
        banner.innerText = 'NO SE ESPECIFICÓ UN FOLIO DE VERIFICACIÓN';
        return;
      }

      if (!supabase) {
        banner.className = 'estado-banner estado-no-valido';
        banner.innerText = 'ERROR DE CONEXIÓN CON EL SERVIDOR DE AUDITORÍA';
        return;
      }

      try {
        const { data, error } = await supabase
          .from('certificados_folios')
          .select('*')
          .eq('folio', folioBuscado)
          .single();

        if (error || !data) {
          banner.className = 'estado-banner estado-no-valido';
          banner.innerText = `DOCUMENTO NO REGISTRADO (${folioBuscado})`;
        } else {
          banner.className = 'estado-banner estado-valido';
          banner.innerText = `✓ CERTIFICADO OFICIAL VERIFICADO (${data.folio})`;

          document.getElementById('val-folio').innerText = data.folio;
          document.getElementById('val-nombre').innerText = data.nombre;
          document.getElementById('val-rut').innerText = data.rut;
          document.getElementById('val-empresa').innerText = data.empresa || 'Particular';
          document.getElementById('val-fecha').innerText = new Date(data.created_at || Date.now()).toLocaleDateString('es-CL');
          document.getElementById('val-dictamen').innerText = data.dictamen;
          
          if (data.dictamen && data.dictamen.includes('NO APTO')) {
            document.getElementById('val-dictamen').style.color = '#f87171';
          }

          caja.style.display = 'block';
        }
      } catch (err) {
        banner.className = 'estado-banner estado-no-valido';
        banner.innerText = 'ERROR AL CONSULTAR LA BASE DE DATOS';
      }
    });
  </script>
</body>
</html>
