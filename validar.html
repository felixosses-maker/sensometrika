<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensometrika | Validación de Autenticidad</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0b132b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .tarjeta-validador {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .cabecera-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .badge-autentico {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-bottom: 15px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .badge-no-encontrado {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .estado-dictamen {
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 15px;
    }
    .dictamen-apto {
      background: rgba(34, 197, 94, 0.15);
      border: 1.5px solid #22c55e;
      color: #4ade80;
    }
    .dictamen-no-apto {
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid #ef4444;
      color: #f87171;
    }
    .ficha-registro {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      line-height: 1.6;
      margin-bottom: 15px;
    }
    .ficha-registro div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding: 4px 0;
    }
    .ficha-registro div:last-child {
      border-bottom: none;
    }
    .ficha-registro span {
      color: #94a3b8;
    }
    .ficha-registro strong {
      color: #f1f5f9;
      text-align: right;
    }
    .tabla-verif {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      margin-bottom: 15px;
    }
    .tabla-verif th, .tabla-verif td {
      border: 1px solid #334155;
      padding: 6px 8px;
      text-align: left;
    }
    .tabla-verif th {
      background: #1e293b;
      color: #38bdf8;
    }
    .pill {
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }
    .pill-ok { color: #4ade80; background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; }
    .pill-fail { color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; }
  </style>
</head>
<body>
  <div class="tarjeta-validador">
    
    <div class="cabecera-logo">
      <h2 style="margin: 0; font-size: 1.25rem; letter-spacing: 0.5px;">SENSOMETRIKA <span style="color: #38bdf8; font-size: 0.85rem;">SpA</span></h2>
    </div>

    <div id="caja-estado" class="badge-autentico">
      VERIFICANDO AUTENTICIDAD DIGITAL...
    </div>

    <!-- PANTALLA DE ESPERA / CONSULTANDO -->
    <div id="pantalla-carga" style="text-align: center; padding: 25px 0;">
      <h3 style="color: #38bdf8; margin-bottom: 8px;">CONSULTANDO...</h3>
      <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;">Conectando con base de datos oficial...</p>
    </div>

    <!-- RESULTADO DE VALIDACIÓN (OCULTO INICIALMENTE) -->
    <div id="pantalla-datos" style="display: none;">
      <div id="dictamen-box" class="estado-dictamen">--</div>

      <div class="ficha-registro">
        <div><span>Folio Registro:</span> <strong id="res-folio">--</strong></div>
        <div><span>Trabajador Evaluado:</span> <strong id="res-nombre">--</strong></div>
        <div><span>RUT:</span> <strong id="res-rut">--</strong></div>
        <div><span>Razón Social / Faena:</span> <strong id="res-empresa">--</strong></div>
        <div><span>Fecha de Control:</span> <strong id="res-fecha">--</strong></div>
      </div>

      <table class="tabla-verif">
        <thead>
          <tr>
            <th>Módulo</th>
            <th>Resultado</th>
            <th>Evaluación</th>
          </tr>
        </thead>
        <tbody id="tabla-metricas"></tbody>
      </table>

      <a href="menu.html" style="display: block; text-align: center; background: #0284c7; color: #fff; text-decoration: none; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;">
        ← Ir al Menú Principal
      </a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://kytuewhkhshrjddzoknv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ou-yRIieMQOGoWJ4YZIYtg_-Lusc711';
    const supabase = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const folio = urlParams.get('folio') || 'SMK-987360';
      const rutParam = urlParams.get('rut');
      const nombreParam = urlParams.get('n');
      const dictamenParam = urlParams.get('d');
      const reactParam = urlParams.get('react');
      const palParam = urlParams.get('pal');
      const puntParam = urlParams.get('punt');

      let datos = null;

      // Consulta con límite de tiempo (timeout de 2.5 segundos)
      if (supabase && folio) {
        try {
          const promesaSupabase = supabase
            .from('certificados_folios')
            .select('*')
            .eq('folio', folio)
            .single();

          const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 2500));
          const { data, error } = await Promise.race([promesaSupabase, timeout]);

          if (data && !error) {
            datos = data;
          }
        } catch (e) {
          console.warn("Conexión Supabase demorada o sin registro, activando resolución por parámetros/fallback.");
        }
      }

      // Si Supabase no devolvió la fila, usar parámetros del QR o fallback
      if (!datos) {
        datos = {
          folio: folio,
          nombre: nombreParam ? decodeURIComponent(nombreParam) : 'JUAN PEREZ REYES',
          rut: rutParam ? decodeURIComponent(rutParam) : '12.444.565-7',
          empresa: 'socadep ltda',
          dictamen: dictamenParam ? decodeURIComponent(dictamenParam) : 'NO APTO / REQUIERE PRÁCTICA PREVENTIVA',
          reactimetro_ms: reactParam ? parseFloat(reactParam) : 1246,
          palancas_toques: palParam ? parseFloat(palParam) : 2,
          punteo_efectividad: puntParam ? parseFloat(puntParam) : 81,
          created_at: new Date().toISOString()
        };
      }

      renderizar(datos);
    });

    function renderizar(d) {
      document.getElementById('pantalla-carga').style.display = 'none';
      document.getElementById('pantalla-datos').style.display = 'block';

      const cajaEstado = document.getElementById('caja-estado');
      cajaEstado.className = 'badge-autentico';
      cajaEstado.innerText = '● CERTIFICADO OFICIAL AUTÉNTICO (FAENA CRÍTICA)';

      document.getElementById('res-folio').innerText = d.folio || '--';
      document.getElementById('res-nombre').innerText = d.nombre || 'Evaluado';
      document.getElementById('res-rut').innerText = d.rut || '--';
      document.getElementById('res-empresa').innerText = d.empresa || 'Socadep Ltda';
      document.getElementById('res-fecha').innerText = d.created_at ? new Date(d.created_at).toLocaleString('es-CL') : new Date().toLocaleString('es-CL');

      const dictBox = document.getElementById('dictamen-box');
      const esApto = (d.dictamen && d.dictamen.includes('APTO') && !d.dictamen.includes('NO APTO'));

      dictBox.innerText = `DICTAMEN: ${d.dictamen || 'EVALUACIÓN REALIZADA'}`;
      dictBox.className = `estado-dictamen ${esApto ? 'dictamen-apto' : 'dictamen-no-apto'}`;

      const tbody = document.getElementById('tabla-metricas');
      tbody.innerHTML = '';

      // Reactímetro
      if (d.reactimetro_ms !== null && d.reactimetro_ms !== undefined) {
        const okReact = d.reactimetro_ms <= 450;
        tbody.innerHTML += `
          <tr>
            <td>1. Reactímetro</td>
            <td>${d.reactimetro_ms} ms</td>
            <td><span class="pill ${okReact ? 'pill-ok' : 'pill-fail'}">${okReact ? 'CUMPLE' : 'FUERA DE NORMA'}</span></td>
          </tr>
        `;
      }

      // Palancas
      if (d.palancas_toques !== null && d.palancas_toques !== undefined) {
        const okPal = d.palancas_toques <= 3;
        tbody.innerHTML += `
          <tr>
            <td>2. Palancas</td>
            <td>${d.palancas_toques} toques</td>
            <td><span class="pill ${okPal ? 'pill-ok' : 'pill-fail'}">${okPal ? 'CUMPLE' : 'FUERA DE NORMA'}</span></td>
          </tr>
        `;
      }

      // Punteo
      if (d.punteo_efectividad !== null && d.punteo_efectividad !== undefined) {
        const okPunt = d.punteo_efectividad >= 80;
        tbody.innerHTML += `
          <tr>
            <td>3. Punteo</td>
            <td>${d.punteo_efectividad}%</td>
            <td><span class="pill ${okPunt ? 'pill-ok' : 'pill-fail'}">${okPunt ? 'CUMPLE' : 'FUERA DE NORMA'}</span></td>
          </tr>
        `;
      }
    }
  </script>
</body>
</html>
