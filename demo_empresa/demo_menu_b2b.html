<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Menú Demo B2B (Elige 5 Módulos)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #040810;
      --card-bg: #091120;
      --card-border: #132238;
      --accent-cyan: #00bfff;
      --accent-cyan-glow: rgba(0, 191, 255, 0.3);
      --accent-green: #10b981;
      --accent-gold: #e5b324;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-bottom: 34px;
    }

    .brand-logo-img {
      width: 160px;
      height: auto;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 10px var(--accent-cyan-glow));
      margin-top: 8px;
    }

    .header-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .user-avatar-small {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      margin: 0 auto;
    }

    .status-bar {
      width: 100%;
      background: #070d18;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
    }

    .tabs-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: 100%;
    }

    .tab-btn {
      background: #0c182e;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 9px 6px;
      border-radius: 10px;
      font-size: 0.64rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }

    .section-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .module-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 13px 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .module-card.selected {
      border-color: var(--accent-cyan);
      background: #0b172c;
    }

    .module-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 66%;
    }

    .module-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .module-desc {
      font-size: 0.62rem;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .module-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .btn-pick {
      background: #0c182e;
      color: var(--accent-cyan);
      border: 1px solid #1e3a6d;
      padding: 6px 10px;
      border-radius: 7px;
      font-weight: 800;
      font-size: 0.65rem;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .btn-pick.picked {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }

    .btn-module {
      background: #10b981;
      color: #000;
      border: none;
      padding: 7px 11px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.66rem;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-module.completed {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
    }

    .btn-action-main {
      background: #10b981;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.78rem;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
      display: block;
      margin-top: 6px;
    }

    .btn-action-main.disabled {
      background: #1e293b;
      color: #94a3b8;
      box-shadow: none;
    }

    #simulador-alertas-container {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div id="simulador-alertas-container"></div>

    <img src="../sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">

    <div class="header-card">
      <img id="imgAvatar" src="../sensometrica.jpg" alt="Evaluado" class="user-avatar-small" onerror="this.src='../sensometrica.jpg'">
      <div>
        <span style="font-size: 0.65rem; color: var(--accent-cyan); font-weight: 800; text-transform: uppercase;">
          DEMO CORPORATIVA B2B • LIBRE ELECCIÓN DE 5 MÓDULOS
        </span>
        <h3 id="lblNombreEvaluado" style="font-size: 0.95rem; font-weight: 900; color: #fff; margin-top: 2px;">CARGANDO TRABAJADOR...</h3>
        <p id="lblRutCargo" style="font-size: 0.7rem; color: var(--text-muted); margin-top: 2px;">RUT: -- | Cargo: -- | Empresa: --</p>
      </div>
    </div>

    <div class="status-bar">
      <div>
        <div id="lblElegidos" style="font-weight: 800; color: var(--accent-cyan);">ELEGIDOS: 0 / 5 MÓDULOS</div>
        <div id="lblSimulados" style="font-size: 0.64rem; color: var(--text-muted); margin-top: 2px;">SIMULADOS: 0 / 5</div>
      </div>
      <button type="button" onclick="limpiarSeleccionDemo()" style="background:#0c182e;border:1px solid #1e3a6d;color:#f8fafc;padding:6px 10px;border-radius:7px;font-size:0.64rem;font-weight:700;cursor:pointer;">
        Reiniciar elección
      </button>
    </div>

    <div class="tabs-container">
      <button type="button" id="tabElegidos" class="tab-btn active" onclick="cambiarVistaDemo('elegidos')">⭐ MIS 5 ELEGIDOS</button>
      <button type="button" id="tabVial" class="tab-btn" onclick="cambiarVistaDemo('vial')">🏎️ VIAL / COGNITIVO</button>
      <button type="button" id="tabFaena" class="tab-btn" onclick="cambiarVistaDemo('faena')">🩺 FAENA / MÉDICO</button>
    </div>

    <div id="grupoElegidos" class="section-group"></div>
    <div id="grupoVial" class="section-group" style="display: none;"></div>
    <div id="grupoFaena" class="section-group" style="display: none;"></div>

    <button type="button" id="btnInformeDemo" class="btn-action-main disabled" onclick="irAlInformeDemo()">
      ELIGE Y SIMULA 5 MÓDULOS PARA VER INFORME DEMO →
    </button>
  </div>

  <script>
    const LIMITE_MODULOS_DEMO = 5;
    const urlParams = new URLSearchParams(window.location.search);
    let datosUsuario = {};
    try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch (e) {}

    const rawNombre = urlParams.get('nombre') || datosUsuario.nombre || localStorage.getItem('sensometrika_nombre') || 'EVALUADO DEMO';
    const rawRut = urlParams.get('rut') || datosUsuario.rut || localStorage.getItem('sensometrika_rut') || '12.345.678-9';
    const rawCargo = urlParams.get('cargo') || datosUsuario.cargo || localStorage.getItem('sensometrika_cargo') || 'Operador Minero';
    const rawEmpresa = urlParams.get('empresa') || datosUsuario.empresa || localStorage.getItem('sensometrika_empresa') || 'Empresa Invitada Demo';
    const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_DEMO_${Date.now()}`;
    const cleanRut = rawRut.replace(/[^0-9Kk]/g, '').toUpperCase();

    const nombreLimpio = decodeURIComponent(rawNombre);
    const cargoLimpio = decodeURIComponent(rawCargo);
    const empresaLimpia = decodeURIComponent(rawEmpresa);

    document.getElementById('lblNombreEvaluado').textContent = nombreLimpio.toUpperCase();
    document.getElementById('lblRutCargo').textContent = `RUT: ${rawRut} | Cargo: ${cargoLimpio} | Empresa: ${empresaLimpia}`;

    const fotoGuardada = localStorage.getItem(`sensometrika_demo_foto_${cleanRut}_${sessionId}`) ||
                         localStorage.getItem(`sensometrika_foto_${cleanRut}_${sessionId}`) ||
                         localStorage.getItem(`sensometrika_foto_${cleanRut}`);
    if (fotoGuardada && fotoGuardada.length > 50) {
      document.getElementById('imgAvatar').src = fotoGuardada;
    }

    const modulosVial = [
      { key: 'anticipacion', title: '1. Anticipación Pro ⏱️', desc: 'Cálculo de velocidad y frenado en móvil virtual.', archivo: '../demo_anticipacion_pro.html' },
      { key: 'reactimetro', title: '2. Reactímetro Simple ⚡', desc: 'Tiempo de respuesta lumínica y acústica.', archivo: '../reactimetro.html' },
      { key: 'punteo', title: '3. Punteo Viso-Motriz 🎯', desc: 'Coordinación óculo-manual en trayectorias.', archivo: '../punteo.html' },
      { key: 'palancas', title: '4. Test de Palancas Bimanual 🕹️', desc: 'Control psicomotor bilateral independiente.', archivo: '../palancas.html' },
      { key: 'visual', title: '5. Tamizaje Visual (Snellen) 👁️', desc: 'Evaluación de agudeza visual lejana/cercana.', archivo: '../visual.html' },
      { key: 'periferico', title: '6. Campo Periférico 👁️‍🗨️', desc: 'Detección de estímulos laterales de alerta.', archivo: '../campo_periferico.html' },
      { key: 'estereopsis', title: '7. Estereopsis (Profundidad) 📐', desc: 'Percepción tridimensional y distancias.', archivo: '../estereopsis.html' },
      { key: 'encandilamiento', title: '8. Encandilamiento & Recuperación 💡', desc: 'Tiempo de adaptación visual post-destello.', archivo: '../demo_encandilamiento_pro.html' },
      { key: 'auditivo', title: '9. Tamizaje Auditivo Ocupacional 🔊', desc: 'Umbrales en frecuencias conversacionales.', archivo: '../audicion.html' },
      { key: 'cargadual', title: '10. Test de Carga Dual 🔀', desc: 'Ejecución simultánea cognitiva y motora.', archivo: '../carga_dual.html' },
      { key: 'memoria', title: '11. Memoria de Trabajo Operativa 🧩', desc: 'Retención y procesamiento de secuencias.', archivo: '../memoria_trabajo.html' },
      { key: 'fatiga', title: '12. Fatiga y Vigilancia (PVT) 😴', desc: 'Detección de microsueños y atención.', archivo: '../fatiga.html' },
      { key: 'visomotriz', title: '13. Visomotriz Avanzada 🚗', desc: 'Precisión de frenado en pista virtual.', archivo: '../demo_visomotriz_pro.html' },
      { key: 'atencion', title: '14. Atención Sostenida (CPT) 🧠', desc: 'Estabilidad de concentración continua.', archivo: '../atencion.html' },
      { key: 'ishihara', title: '15. Discriminación Colores 🎨', desc: 'Test Ishihara para señales viales.', archivo: '../visual_transporte.html' },
      { key: 'reaccion_compleja', title: '16. Reacción Compleja Múltiple ⚡', desc: 'Toma de decisiones bajo estímulo cruzado.', archivo: '../reactimetro.html' },
      { key: 'emocional', title: '17. Estabilidad Emocional 🧠', desc: 'Tamizaje conductual ante presión.', archivo: '../latencia.html' }
    ];

    const modulosFaena = [
      { key: 'romberg', title: 'M1. Estabilidad Vestibular (Romberg Pro) ⚖️', desc: 'Prueba estática vestibular con acelerómetro.', archivo: '../medico_pro/01_romberg.html' },
      { key: 'temblores', title: 'M2. Estabilidad Motora (Temblores Pro) ✋', desc: 'Control de micro-oscilaciones y pulso estacionario.', archivo: '../medico_pro/02_temblores.html' },
      { key: 'grip', title: 'M3. Dinamometría y Fuerza (Grip Pro) ✊', desc: 'Fuerza isométrica y prehensión sostenida.', archivo: '../medico_pro/03_grip.html' },
      { key: 'ppg', title: 'M4. Frecuencia Cardíaca Basal (PPG Pro) 💓', desc: 'Pletismografía óptica y análisis de flujo pulsátil.', archivo: '../medico_pro/04_ppg.html' },
      { key: 'pupilar', title: 'M5. Reflejo Fotomotor Pupilar Pro 👁️', desc: 'Seguimiento facial fino con MediaPipe.', archivo: '../medico_pro/05_pupilar.html' },
      { key: 'espirometria', title: 'M6. Espirometría Ocupacional Pro 🫁', desc: 'Screening de flujo respiratorio por micrófono.', archivo: '../medico_pro/06_espirometria.html' },
      { key: 'tapping', title: 'M7. Agilidad y Praxias Digitales (Tapping) ⚡', desc: 'Velocidad de ejecución rítmica continua.', archivo: '../medico_pro/07_tapping.html' },
      { key: 'auditivo_faena', title: 'M8. Reacción a Alarma de Faena 🚨', desc: 'Tamizaje auditivo de emergencia y respuesta.', archivo: '../medico_pro/08_auditivo.html' },
      { key: 'nistagmo', title: 'M9. Estabilidad Oculomotriz (Nistagmo) 🔄', desc: 'Seguimiento ocular del punto móvil y sacadas.', archivo: '../medico_pro/09_nistagmo.html' },
      { key: 'somnolencia', title: 'M10. Tamizaje de Somnolencia Pro 😴', desc: 'Detección de fatiga y vigilancia prolongada.', archivo: '../medico_pro/10_somnolencia.html' }
    ];

    const todosLosModulos = [...modulosVial, ...modulosFaena];

    let seleccionados = [];
    try {
      seleccionados = JSON.parse(localStorage.getItem('sensometrika_demo_5_modulos')) || [];
    } catch (e) {}
    if (!Array.isArray(seleccionados)) seleccionados = [];
    seleccionados = seleccionados.filter(k => todosLosModulos.some(m => m.key === k)).slice(0, LIMITE_MODULOS_DEMO);

    let resultadosDemo = [];
    try {
      resultadosDemo = JSON.parse(localStorage.getItem('sensometrika_demo_resultados')) || [];
    } catch (e) {}
    if (!Array.isArray(resultadosDemo)) resultadosDemo = [];

    function registrarCompletadoAutomatico(key) {
      const mod = todosLosModulos.find(m => m.key === key);
      if (!mod) return;
      if (!resultadosDemo.some(r => r.key === key)) {
        const ms = Math.floor(210 + Math.random() * 140);
        resultadosDemo.push({
          key: mod.key,
          title: mod.title,
          estado: 'APROBADO',
          latencia: `${ms} ms`,
          timestamp: new Date().toISOString()
        });
      }
    }

    const moduloRetorno = urlParams.get('modulo') || urlParams.get('completado');
    if (moduloRetorno && seleccionados.includes(moduloRetorno)) {
      registrarCompletadoAutomatico(moduloRetorno);
    }

    seleccionados.forEach(k => {
      const marcadoLocal =
        localStorage.getItem(`medico_${k}_${cleanRut}_${sessionId}`) === 'true' ||
        localStorage.getItem(`sensometrika_${k}_${cleanRut}_${sessionId}`) === 'true' ||
        localStorage.getItem(`sensometrika_demo_completado_${k}_${cleanRut}_${sessionId}`) === 'true';
      if (marcadoLocal) {
        registrarCompletadoAutomatico(k);
      }
    });

    function mostrarAlerta(msg, tipo = 'info') {
      const cont = document.getElementById('simulador-alertas-container');
      const color = tipo === 'exito' ? '#10b981' : (tipo === 'alerta' ? '#ef4444' : '#00bfff');
      cont.innerHTML = `
        <div style="background:#091120;border:1px solid ${color};color:${color};padding:10px 12px;border-radius:10px;font-size:0.72rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;">
          <span>[SENSOMETRIKA SpA]: ${msg}</span>
          <button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;color:${color};font-weight:bold;cursor:pointer;">✕</button>
        </div>
      `;
    }

    function guardarEstadoDemo() {
      localStorage.setItem('sensometrika_demo_5_modulos', JSON.stringify(seleccionados));
      localStorage.setItem('sensometrika_demo_resultados', JSON.stringify(resultadosDemo));
    }

    function alternarSeleccionModulo(key) {
      const idx = seleccionados.indexOf(key);
      if (idx >= 0) {
        seleccionados.splice(idx, 1);
      } else {
        if (seleccionados.length >= LIMITE_MODULOS_DEMO) {
          mostrarAlerta(`Solo puedes elegir ${LIMITE_MODULOS_DEMO} módulos en la demostración. Quita uno para elegir otro.`, 'alerta');
          return;
        }
        seleccionados.push(key);
      }
      guardarEstadoDemo();
      renderizarTodo();
    }

    function limpiarSeleccionDemo() {
      seleccionados = [];
      resultadosDemo = [];
      guardarEstadoDemo();
      mostrarAlerta('Selección y simulaciones de la demo reiniciadas.', 'info');
      renderizarTodo();
    }

    function marcarSimuladoDemo(key) {
      const mod = todosLosModulos.find(m => m.key === key);
      if (!mod) return;
      const ms = Math.floor(210 + Math.random() * 140);
      resultadosDemo = resultadosDemo.filter(r => r.key !== key);
      resultadosDemo.push({
        key: mod.key,
        title: mod.title,
        estado: 'APROBADO',
        latencia: `${ms} ms`,
        timestamp: new Date().toISOString()
      });
      guardarEstadoDemo();
      mostrarAlerta(`Simulación registrada en ${mod.title} (${ms} ms).`, 'exito');
      renderizarTodo();
    }

    function construirUrlModulo(archivo, key) {
      const p = new URLSearchParams({
        mode: 'demo',
        flujo: 'demo',
        modulo: key,
        nombre: nombreLimpio,
        rut: rawRut,
        cargo: cargoLimpio,
        empresa: empresaLimpia,
        session: sessionId
      });
      return `${archivo}?${p.toString()}`;
    }

    function estaSimulado(key) {
      return resultadosDemo.some(r => r.key === key) ||
             localStorage.getItem(`medico_${key}_${cleanRut}_${sessionId}`) === 'true' ||
             localStorage.getItem(`sensometrika_${key}_${cleanRut}_${sessionId}`) === 'true' ||
             localStorage.getItem(`sensometrika_demo_completado_${key}_${cleanRut}_${sessionId}`) === 'true';
    }

    function renderizarLista(contenedorId, lista, modoCatalogo) {
      const cont = document.getElementById(contenedorId);
      cont.innerHTML = '';

      if (lista.length === 0) {
        cont.innerHTML = `
          <div class="module-card" style="justify-content:center;text-align:center;">
            <span class="module-desc">Aún no has elegido módulos. Ve a las pestañas <strong>VIAL / COGNITIVO</strong> o <strong>FAENA / MÉDICO</strong> y selecciona hasta 5 módulos.</span>
          </div>
        `;
        return;
      }

      lista.forEach(m => {
        const elegido = seleccionados.includes(m.key);
        const simulado = estaSimulado(m.key);
        const card = document.createElement('div');
        card.className = `module-card ${elegido ? 'selected' : ''}`;

        if (modoCatalogo) {
          card.innerHTML = `
            <div class="module-info">
              <span class="module-title">${m.title}</span>
              <span class="module-desc">${m.desc}</span>
            </div>
            <div class="module-actions">
              <button type="button" class="btn-pick ${elegido ? 'picked' : ''}" onclick="alternarSeleccionModulo('${m.key}')">
                ${elegido ? '✓ ELEGIDO' : '+ ELEGIR'}
              </button>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="module-info">
              <span class="module-title">${m.title}</span>
              <span class="module-desc">${m.desc}</span>
            </div>
            <div class="module-actions">
              <a href="${construirUrlModulo(m.archivo, m.key)}" class="btn-module ${simulado ? 'completed' : ''}">
                ${simulado ? '✓ SIMULADO' : 'INICIAR →'}
              </a>
              <button type="button" class="btn-pick" onclick="marcarSimuladoDemo('${m.key}')">
                Marcar listo
              </button>
            </div>
          `;
        }
        cont.appendChild(card);
      });
    }

    function renderizarTodo() {
      const modulosElegidosObjs = seleccionados
        .map(k => todosLosModulos.find(m => m.key === k))
        .filter(Boolean);

      const simuladosDeElegidos = modulosElegidosObjs.filter(m => estaSimulado(m.key)).length;

      document.getElementById('lblElegidos').textContent = `ELEGIDOS: ${modulosElegidosObjs.length} / ${LIMITE_MODULOS_DEMO} MÓDULOS`;
      document.getElementById('lblSimulados').textContent = `SIMULADOS: ${simuladosDeElegidos} / ${LIMITE_MODULOS_DEMO}`;

      renderizarLista('grupoElegidos', modulosElegidosObjs, false);
      renderizarLista('grupoVial', modulosVial, true);
      renderizarLista('grupoFaena', modulosFaena, true);

      const btnInforme = document.getElementById('btnInformeDemo');
      if (modulosElegidosObjs.length === LIMITE_MODULOS_DEMO && simuladosDeElegidos >= LIMITE_MODULOS_DEMO) {
        btnInforme.className = 'btn-action-main';
        btnInforme.textContent = 'VER INFORME DEMO CONSOLIDADO →';
      } else {
        btnInforme.className = 'btn-action-main disabled';
        btnInforme.textContent = `ELEGIDOS ${modulosElegidosObjs.length}/5 • SIMULADOS ${simuladosDeElegidos}/5 PARA INFORME DEMO`;
      }
    }

    function cambiarVistaDemo(vista) {
      ['elegidos', 'vial', 'faena'].forEach(v => {
        document.getElementById(`tab${v.charAt(0).toUpperCase() + v.slice(1)}`).classList.toggle('active', v === vista);
        document.getElementById(`grupo${v.charAt(0).toUpperCase() + v.slice(1)}`).style.display = (v === vista) ? 'flex' : 'none';
      });
    }

    function irAlInformeDemo() {
      const modulosElegidosObjs = seleccionados.map(k => todosLosModulos.find(m => m.key === k)).filter(Boolean);
      const simuladosDeElegidos = modulosElegidosObjs.filter(m => estaSimulado(m.key)).length;

      if (modulosElegidosObjs.length < LIMITE_MODULOS_DEMO || simuladosDeElegidos < LIMITE_MODULOS_DEMO) {
        mostrarAlerta(`Debes elegir ${LIMITE_MODULOS_DEMO} módulos y completar sus ${LIMITE_MODULOS_DEMO} simulaciones antes de ver el informe demo.`, 'alerta');
        return;
      }

      guardarEstadoDemo();
      const p = new URLSearchParams({
        flujo: 'demo',
        nombre: nombreLimpio,
        rut: rawRut,
        cargo: cargoLimpio,
        empresa: empresaLimpia,
        session: sessionId
      });
      window.location.href = `demo_informe.html?${p.toString()}`;
    }

    guardarEstadoDemo();
    renderizarTodo();
  </script>
</body>
</html>
