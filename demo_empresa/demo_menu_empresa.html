<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Menú Demo Empresa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #040810;
      --card-bg: #091120;
      --card-border: #132238;
      --accent-cyan: #00bfff;
      --accent-cyan-glow: rgba(0, 191, 255, 0.3);
      --accent-green: #10b981;
      --accent-gold: #e5b324;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-bottom: 36px;
    }

    .brand-logo-img {
      width: 160px;
      height: auto;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 10px var(--accent-cyan-glow));
      margin-top: 8px;
    }

    .header-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .user-avatar-small {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      margin: 0 auto;
    }

    .section-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .module-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .module-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 66%;
    }

    .module-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .module-desc {
      font-size: 0.64rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .module-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    .btn-module {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.7rem;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 2px 10px var(--accent-cyan-glow);
    }

    .btn-module.completed {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
      box-shadow: none;
    }

    .btn-secondary-link {
      background: #030712;
      color: var(--accent-cyan);
      border: 1px solid var(--card-border);
      padding: 5px 9px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.62rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .simulador-box {
      background-color: var(--card-bg);
      border: 1.5px solid var(--accent-cyan);
      border-radius: 14px;
      padding: 18px;
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 191, 255, 0.15);
    }

    .btn-action-main {
      background: #10b981;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
      display: block;
      margin-top: 6px;
    }

    .btn-action-main.locked {
      background: #1e293b;
      color: #94a3b8;
      box-shadow: none;
    }

    #simulador-alertas-container {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div id="simulador-alertas-container"></div>

    <img src="../sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">

    <div class="header-card">
      <img id="imgAvatar" src="../sensometrica.jpg" alt="Evaluado" class="user-avatar-small" onerror="this.style.display='none'">
      <div>
        <span style="font-size: 0.65rem; color: var(--accent-cyan); font-weight: 800; text-transform: uppercase;">
          CONSOLA DEMO EMPRESA • BATERÍA DE 5 MÓDULOS
        </span>
        <h3 id="lblNombreEvaluado" style="font-size: 0.95rem; font-weight: 900; color: #fff; margin-top: 2px;">CARGANDO TRABAJADOR...</h3>
        <p id="lblRutCargo" style="font-size: 0.7rem; color: var(--text-muted); margin-top: 2px;">RUT: -- | Cargo: -- | Empresa: --</p>
        <p id="lblProgreso" style="font-size: 0.72rem; color: var(--accent-gold); font-weight: 800; margin-top: 4px;">0 / 5 MÓDULOS SIMULADOS</p>
      </div>
    </div>

    <div id="panelSimulacion" class="simulador-box">
      <span id="simBadge" style="font-size: 0.65rem; color: var(--accent-gold); font-weight: 800; text-transform: uppercase;">SIMULACIÓN RÁPIDA EN PANTALLA</span>
      <h4 id="simTitulo" style="font-size: 1rem; font-weight: 900; color: #fff;">Módulo</h4>
      <p id="simInstruccion" style="font-size: 0.75rem; color: var(--text-muted);"></p>
      <div id="simAreaEstimulo" style="background: #030712; border: 1px dashed var(--accent-cyan); border-radius: 10px; padding: 18px; min-height: 105px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;"></div>
      <button type="button" id="btnRegistrarSimulacion" class="btn-module" style="width: 100%; padding: 11px;">
        ✓ REGISTRAR RESULTADO DEL MÓDULO
      </button>
    </div>

    <div id="grupoModulos" class="section-group"></div>

    <button type="button" id="btnIrInformeDemo" class="btn-action-main locked">
      COMPLETE LOS 5 MÓDULOS PARA IR AL INFORME DEMO
    </button>

    <div style="width: 100%; display: flex; justify-content: space-between; gap: 8px; margin-top: 4px;">
      <a href="../demo_empresa.html" class="btn-secondary-link" style="flex: 1; text-align: center; padding: 9px;">
        ← Cambiar 5 Módulos
      </a>
      <a href="../verificacion_trabajador.html" class="btn-secondary-link" style="flex: 1; text-align: center; padding: 9px;">
        👤 Datos Trabajador
      </a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let datosUsuario = {};
    try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch (e) {}

    const nombre = decodeURIComponent(urlParams.get('nombre') || datosUsuario.nombre || localStorage.getItem('sensometrika_nombre') || 'Usuario Invitado / Demo');
    const rut = decodeURIComponent(urlParams.get('rut') || datosUsuario.rut || localStorage.getItem('sensometrika_rut') || '12.345.678-9');
    const cargo = decodeURIComponent(urlParams.get('cargo') || datosUsuario.cargo || localStorage.getItem('sensometrika_cargo') || 'Operador de Maquinaria');
    const empresa = decodeURIComponent(urlParams.get('empresa') || datosUsuario.empresa || localStorage.getItem('sensometrika_empresa') || 'Empresa Mandante Demo');
    const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_DEMO_${Date.now()}`;

    localStorage.setItem('sensometrika_datos_usuario', JSON.stringify({ nombre, rut, cargo, empresa, session: sessionId }));
    localStorage.setItem('sensometrika_nombre', nombre);
    localStorage.setItem('sensometrika_rut', rut);
    localStorage.setItem('sensometrika_cargo', cargo);
    localStorage.setItem('sensometrika_empresa', empresa);
    localStorage.setItem('sensometrika_session_activa', sessionId);

    document.getElementById('lblNombreEvaluado').textContent = nombre.toUpperCase();
    document.getElementById('lblRutCargo').textContent = `RUT: ${rut} | Cargo: ${cargo} | Empresa: ${empresa}`;

    const catalogoCompleto = [
      { key: 'visual', title: 'Tamizaje Visual (Snellen)', desc: 'Agudeza visual lejana binocular para visibilidad en ruta.', ruta: '../visual.html' },
      { key: 'auditivo', title: 'Tamizaje Auditivo Ocupacional', desc: 'Umbrales auditivos preventivos ante frecuencias de alerta.', ruta: '../audicion.html' },
      { key: 'ishihara', title: 'Discriminación Colores (Ishihara)', desc: 'Discromatopsias para lectura de señalética vial.', ruta: '../ishihara.html' },
      { key: 'anticipacion', title: 'Anticipación Pro', desc: 'Cálculo perceptivo ante trayectorias y velocidades variables.', ruta: '../anticipacion.html' },
      { key: 'reactimetro', title: 'Reactímetro Simple', desc: 'Latencia de frenado y reflejos ante estímulos imprevistos.', ruta: '../reactimetro.html' },
      { key: 'punteo', title: 'Punteo Viso-Motriz', desc: 'Pulso sostenido y precisión visomotriz en trayectorias.', ruta: '../punteo.html' },
      { key: 'palancas', title: 'Test de Palancas Bimanual', desc: 'Control motor disociado para maquinaria pesada.', ruta: '../palancas.html' },
      { key: 'periferico', title: 'Campo Periférico', desc: 'Ángulo de visión lateral para obstáculos.', ruta: '../periferico.html' },
      { key: 'estereopsis', title: 'Estereopsis (Profundidad)', desc: 'Percepción tridimensional y distancias en ruta.', ruta: '../estereopsis.html' },
      { key: 'encandilamiento', title: 'Encandilamiento & Recuperación', desc: 'Re-adaptación visual tras destellos lumínicos.', ruta: '../encandilamiento.html' },
      { key: 'cargadual', title: 'Test de Carga Dual', desc: 'Rendimiento multitarea ante estímulos simultáneos.', ruta: '../cargadual.html' },
      { key: 'memoria', title: 'Memoria de Trabajo Operativa', desc: 'Retención a corto plazo bajo presión de tiempo.', ruta: '../memoria.html' },
      { key: 'fatiga', title: 'Fatiga y Vigilancia (PVT)', desc: 'Atención sostenida y detección temprana de somnolencia.', ruta: '../fatiga.html' },
      { key: 'visomotriz', title: 'Visomotriz Avanzada', desc: 'Coordinación compleja para flotas de alto riesgo.', ruta: '../visomotriz.html' },
      { key: 'atencion', title: 'Atención Sostenida (CPT)', desc: 'Concentración prolongada y resistencia a distracción.', ruta: '../atencion.html' },
      { key: 'reaccion_compleja', title: 'Reacción Compleja Múltiple', desc: 'Decisiones rápidas ante estímulos cruzados.', ruta: '../reaccion_compleja.html' },
      { key: 'emocional', title: 'Estabilidad Emocional (Go/No-Go)', desc: 'Control de impulsos e inhibición de respuestas erróneas.', ruta: '../emocional.html' },
      { key: 'dinamica', title: 'Coordinación Dinámica', desc: 'Sincronización motriz bajo velocidad simulada.', ruta: '../dinamica.html' },
      { key: 'tapping', title: 'Agilidad Digital (Tapping)', desc: 'Velocidad de repetición motriz y destreza fina.', ruta: '../tapping.html' },
      { key: 'monotonia', title: 'Tolerancia a la Monotonía', desc: 'Rendimiento cognitivo en tareas repetitivas.', ruta: '../monotonia.html' },
      { key: 'romberg', title: 'M1. Estabilidad Vestibular (Romberg)', desc: 'Equilibrio estático y control postural.', ruta: '../medico_pro/01_romberg.html' },
      { key: 'temblores', title: 'M2. Estabilidad Motora (Temblores)', desc: 'Firmeza psicomotriz y control de temblores.', ruta: '../medico_pro/02_temblores.html' },
      { key: 'grip', title: 'M3. Dinamometría y Fuerza (Grip)', desc: 'Fuerza de prensión manual y vigor físico.', ruta: '../medico_pro/03_grip.html' },
      { key: 'ppg', title: 'M4. Frecuencia Cardíaca Basal (PPG)', desc: 'Signos vitales basales previos a faena.', ruta: '../medico_pro/04_ppg.html' },
      { key: 'pupilar', title: 'M5. Reflejo Fotomotor Pupilar', desc: 'Reactividad pupilar ante estímulos de luz.', ruta: '../medico_pro/05_pupilar.html' },
      { key: 'espirometria', title: 'M6. Espirometría Ocupacional Pro', desc: 'Capacidad respiratoria en altura geográfica.', ruta: '../medico_pro/06_espirometria.html' },
      { key: 'tapping_faena', title: 'M7. Agilidad y Praxias Digitales', desc: 'Respuesta psicomotriz rápida industrial.', ruta: '../medico_pro/07_tapping.html' },
      { key: 'auditivo_faena', title: 'M8. Reacción a Alarma de Faena', desc: 'Latencia de respuesta ante sirenas de emergencia.', ruta: '../medico_pro/08_auditivo.html' },
      { key: 'nistagmo', title: 'M9. Estabilidad Oculomotriz', desc: 'Control del movimiento ocular coordinado.', ruta: '../medico_pro/09_nistagmo.html' },
      { key: 'somnolencia', title: 'M10. Tamizaje de Somnolencia Pro', desc: 'Evaluación orientada a fatiga crítica operativa.', ruta: '../medico_pro/10_somnolencia.html' }
    ];

    let keysSeleccionadas = [];
    try {
      keysSeleccionadas = JSON.parse(localStorage.getItem('sensometrika_demo_5_modulos')) || [];
    } catch (e) {}

    if (!Array.isArray(keysSeleccionadas) || keysSeleccionadas.length !== 5) {
      keysSeleccionadas = ['reactimetro', 'punteo', 'palancas', 'visual', 'auditivo'];
      localStorage.setItem('sensometrika_demo_5_modulos', JSON.stringify(keysSeleccionadas));
    }

    let resultadosDemo = [];
    try {
      resultadosDemo = JSON.parse(localStorage.getItem('sensometrika_demo_resultados')) || [];
    } catch (e) {}

    let moduloEnSimulacion = null;
    let inicioSimulacionMs = 0;

    function mostrarAlerta(mensaje, tipo = 'info') {
      const contenedor = document.getElementById('simulador-alertas-container');
      if (!contenedor) return;
      const color = tipo === 'exito' ? '#10b981' : (tipo === 'alerta' ? '#ef4444' : '#00bfff');
      contenedor.innerHTML = `
        <div style="background: rgba(9,17,32,0.95); border: 1px solid ${color}; color: ${color}; padding: 10px 14px; border-radius: 10px; font-size: 0.74rem; font-weight: 700; display:flex; justify-content:space-between; align-items:center;">
          <span>[SENSOMETRIKA SpA]: ${mensaje}</span>
          <button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;color:${color};font-weight:bold;cursor:pointer;">✕</button>
        </div>
      `;
    }

    function abrirSimulacionRapida(key) {
      const mod = catalogoCompleto.find(m => m.key === key) || { key, title: key, desc: 'Simulación pericial B2B' };
      moduloEnSimulacion = mod;
      inicioSimulacionMs = Date.now();

      const panel = document.getElementById('panelSimulacion');
      const area = document.getElementById('simAreaEstimulo');
      document.getElementById('simTitulo').textContent = mod.title;
      document.getElementById('simInstruccion').textContent = mod.desc;

      area.innerHTML = `
        <div id="indicadorEstimulo" style="width: 46px; height: 46px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 14px #ef4444;"></div>
        <span style="font-size: 0.72rem; color: var(--accent-cyan); font-weight: 700;">Preparando estímulo de demostración...</span>
      `;
      panel.style.display = 'flex';
      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });

      setTimeout(() => {
        const ind = document.getElementById('indicadorEstimulo');
        if (ind) {
          ind.style.background = '#10b981';
          ind.style.boxShadow = '0 0 16px #10b981';
          inicioSimulacionMs = Date.now();
        }
      }, 600);
    }

    function registrarSimulacionActual() {
      if (!moduloEnSimulacion) return;
      const elapsed = Date.now() - inicioSimulacionMs;
      const latencia = Math.max(190, Math.min(395, elapsed + 185));

      const registro = {
        key: moduloEnSimulacion.key,
        title: moduloEnSimulacion.title,
        estado: 'APROBADO',
        latencia: `${latencia} ms`,
        timestamp: new Date().toISOString()
      };

      resultadosDemo = resultadosDemo.filter(r => r.key !== moduloEnSimulacion.key);
      resultadosDemo.push(registro);
      localStorage.setItem('sensometrika_demo_resultados', JSON.stringify(resultadosDemo));

      document.getElementById('panelSimulacion').style.display = 'none';
      mostrarAlerta(`Módulo "${moduloEnSimulacion.title}" registrado (${latencia} ms).`, 'exito');
      moduloEnSimulacion = null;
      renderizarModulos();
    }

    function irADemoInforme() {
      const completadosCount = keysSeleccionadas.filter(k => resultadosDemo.some(r => r.key === k)).length;
      if (completadosCount < keysSeleccionadas.length) {
        mostrarAlerta(`Debe simular los ${keysSeleccionadas.length} módulos antes de pasar al informe demo (${completadosCount}/${keysSeleccionadas.length}).`, 'alerta');
        return;
      }

      const params = new URLSearchParams({
        flujo: 'demo',
        nombre: nombre,
        rut: rut,
        cargo: cargo,
        empresa: empresa,
        session: sessionId
      });

      window.location.assign(`../demo_informe.html?${params.toString()}`);
    }

    function renderizarModulos() {
      const cont = document.getElementById('grupoModulos');
      cont.innerHTML = '';

      let completados = 0;

      keysSeleccionadas.forEach((key, idx) => {
        const mod = catalogoCompleto.find(m => m.key === key) || { key, title: key, desc: 'Módulo pericial B2B', ruta: '../index.html' };
        const res = resultadosDemo.find(r => r.key === key);
        const estaListo = Boolean(res);
        if (estaListo) completados++;

        const card = document.createElement('div');
        card.className = 'module-card';
        card.innerHTML = `
          <div class="module-info">
            <span class="module-title">${idx + 1}. ${mod.title}</span>
            <span class="module-desc">${mod.desc}${estaListo ? ` • <strong style="color:#34d399;">${res.latencia}</strong>` : ''}</span>
          </div>
          <div class="module-actions">
            <button type="button" class="btn-module ${estaListo ? 'completed' : ''}" onclick="abrirSimulacionRapida('${mod.key}')">
              ${estaListo ? '✓ SIMULADO' : 'SIMULAR'}
            </button>
            <a href="${mod.ruta}?mode=demo&session=${encodeURIComponent(sessionId)}" class="btn-secondary-link">
              Abrir módulo ↗
            </a>
          </div>
        `;
        cont.appendChild(card);
      });

      document.getElementById('lblProgreso').textContent = `${completados} / ${keysSeleccionadas.length} MÓDULOS SIMULADOS`;

      const btnInforme = document.getElementById('btnIrInformeDemo');
      if (completados >= keysSeleccionadas.length) {
        btnInforme.className = 'btn-action-main';
        btnInforme.textContent = 'VER INFORME DEMO CONSOLIDADO →';
      } else {
        btnInforme.className = 'btn-action-main locked';
        btnInforme.textContent = `SIMULE LOS 5 MÓDULOS (${completados}/${keysSeleccionadas.length}) PARA IR AL INFORME`;
      }
    }

    document.getElementById('btnRegistrarSimulacion').addEventListener('click', registrarSimulacionActual);
    document.getElementById('btnIrInformeDemo').addEventListener('click', irADemoInforme);

    renderizarModulos();
  </script>
</body>
</html>
