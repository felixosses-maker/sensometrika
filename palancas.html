<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Test de Palancas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .barra-superior {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .barra-superior a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .barra-calibracion {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #94a3b8;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .canvas-contenedor {
      position: relative;
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
      margin: 6px 0;
    }
    #lienzo-palancas {
      background-color: #020617;
      border: 3px solid #334155;
      border-radius: 12px;
      touch-action: none;
    }
    .zona-mandos {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .mando-caja {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .mando-caja span { font-size: 0.72rem; color: #94a3b8; font-weight: 600; }
    .btn-control {
      width: 100%;
      height: 44px;
      background-color: #1e293b;
      border: 1px solid #475569;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-control:active { background-color: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="barra-superior">
      <a href="menu.html">← Menú Principal</a>
      <span style="font-size: 0.8rem; color: #38bdf8; font-weight: 700;">MÓDULO 2: PALANCAS</span>
    </header>

    <div class="barra-calibracion">
      <span id="txt-modo-palancas">🟢 Demo Calibración (Ensayo Libre)</span>
      <span id="txt-tiempo-cabecera">Tiempo: <strong>20 s</strong></span>
    </div>

    <section class="panel-resultados" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:6px 0; width:100%;">
      <div class="tarjeta-metrica" style="background:#0f172a; border:1px solid #334155; padding:8px 4px; border-radius:8px; text-align:center;">
        <span style="font-size:0.68rem; color:#94a3b8;">Tiempo Restante</span>
        <strong id="cronometro" style="color:#38bdf8;">20 s</strong>
      </div>
      <div class="tarjeta-metrica" style="background:#0f172a; border:1px solid #334155; padding:8px 4px; border-radius:8px; text-align:center;">
        <span style="font-size:0.68rem; color:#94a3b8;">Contactos</span>
        <strong id="contador-toques" style="color: #ef4444;">0</strong>
      </div>
      <div class="tarjeta-metrica" style="background:#0f172a; border:1px solid #334155; padding:8px 4px; border-radius:8px; text-align:center;">
        <span style="font-size:0.68rem; color:#94a3b8;">Estado</span>
        <strong id="estado-evaluacion" style="color:#4ade80;">Listo</strong>
      </div>
    </section>

    <div class="canvas-contenedor">
      <canvas id="lienzo-palancas" width="330" height="240"></canvas>
    </div>

    <div id="panel-estado" class="estado">Izq: Subir/Bajar | Der: Izq/Der</div>

    <section class="zona-mandos" id="seccion-mandos">
      <div class="mando-caja">
        <span>MANO IZQ (EJE Y)</span>
        <button id="btn-arriba" class="btn-control">▲</button>
        <button id="btn-abajo" class="btn-control">▼</button>
      </div>

      <div class="mando-caja">
        <span>MANO DER (EJE X)</span>
        <div style="display: flex; width: 100%; gap: 4px;">
          <button id="btn-izq" class="btn-control">◀</button>
          <button id="btn-der" class="btn-control">▶</button>
        </div>
        <button id="btn-iniciar" class="btn-control" style="background-color: #0284c7; border-color: #38bdf8;">Iniciar Demo</button>
      </div>
    </section>

    <div id="zona-coordinacion-palancas" style="width: 100%;"></div>
  </main>

  <script src="palancas.js"></script>
</body>
</html>
