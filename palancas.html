<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Test de Palancas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .barra-superior {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .barra-superior a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-ayuda {
      background: transparent;
      border: 1px solid #0284c7;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 600;
    }
    .barra-calibracion {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #94a3b8;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .panel-resultados {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .tarjeta-metrica {
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
    }
    .tarjeta-metrica span { display: block; font-size: 0.68rem; color: #94a3b8; }
    .tarjeta-metrica strong { font-size: 0.95rem; color: #38bdf8; }

    .canvas-palancas-caja {
      position: relative;
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
      margin: 4px 0;
    }
    #lienzo-palancas {
      background-color: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      touch-action: none;
    }
    .instruccion-caja {
      font-size: 0.78rem;
      color: #94a3b8;
      text-align: center;
      margin: 6px 0;
    }
    .panel-mandos {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .caja-mando {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .caja-mando span {
      font-size: 0.68rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .fila-botones {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .btn-control {
      flex: 1;
      height: 42px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #ffffff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-control:active {
      background: #0284c7;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="barra-superior">
      <a href="menu.html">← Menú Principal</a>
      <button class="btn-ayuda" onclick="alert('Usa los mandos inferiores para guiar el puntero amarillo hasta el punto verde de llegada sin tocar las paredes azules.')">❓ ¿Cómo funciona?</button>
    </header>

    <div class="barra-calibracion">
      <span id="badge-modo">🟢 Demo Calibración (20 s)</span>
      <span id="txt-tiempo">Tiempo: <strong id="lbl-reloj">20 s</strong></span>
    </div>

    <section class="panel-resultados">
      <div class="tarjeta-metrica">
        <span>Contactos</span>
        <strong id="metrica-toques" style="color: #ef4444;">0</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>T. Contacto</span>
        <strong id="metrica-tiempo-contacto">0.0 s</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Circuito</span>
        <strong id="metrica-circuito" style="color: #38bdf8;">Demo P-1</strong>
      </div>
    </section>

    <div class="canvas-palancas-caja">
      <canvas id="lienzo-palancas" width="330" height="230"></canvas>
    </div>

    <div class="instruccion-caja" id="caja-instrucciones">
      Usa los mandos inferiores para guiar el puntero
    </div>

    <button id="btn-accion-palancas" class="btn-principal">Iniciar Calibración (20 s)</button>

    <div class="panel-mandos">
      <div class="caja-mando">
        <span>Mano Izq (Vertical)</span>
        <button class="btn-control" id="btn-arriba">▲ Arriba</button>
        <button class="btn-control" id="btn-abajo">▼ Abajo</button>
      </div>
      <div class="caja-mando">
        <span>Mano Der (Horizontal)</span>
        <div class="fila-botones" style="margin-top: 24px;">
          <button class="btn-control" id="btn-izq">◄</button>
          <button class="btn-control" id="btn-der">►</button>
        </div>
      </div>
    </div>

    <div id="zona-coordinacion-palancas" style="width: 100%; margin-top: 10px;"></div>
  </main>

  <script src="palancas.js"></script>
</body>
</html>
