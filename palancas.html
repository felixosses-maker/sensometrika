<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Coordinación Bimanual (Palancas)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-green: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
            --accent-cyan: #38bdf8;
            --accent-gold: #e5b324;
            --accent-red: #ef4444;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-logo-img {
            width: 185px;
            height: auto;
            display: block;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .eval-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .nav-btn-blue {
            color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.12) !important;
            padding: 6px 14px !important;
            border-radius: 8px !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            font-weight: 700 !important;
        }

        .status-badge-container { display: flex; justify-content: center; }

        .status-badge {
            background-color: #0f233d;
            border: 1px solid #1d4ed8;
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot-status { width: 8px; height: 8px; border-radius: 50%; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #050a12;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            touch-action: none;
        }

        canvas { width: 100%; height: 100%; display: block; touch-action: none; }

        .instruction-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .control-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: #070d17;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .control-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-ctrl-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .btn-ctrl {
            background-color: #1a2638;
            color: #ffffff;
            border: 1px solid #2d3f59;
            border-radius: 8px;
            padding: 12px 0;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.15s;
        }

        .btn-ctrl:active {
            background-color: #0284c7;
            border-color: #38bdf8;
        }

        .btn-start {
            background-color: var(--blue-btn);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-next {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            display: none;
        }

        /* GRID DE MÉTRICAS AMPLIADO A 4 COLUMNAS PARA INCLUIR T. ERROR Y PRECISIÓN */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            text-align: center;
            background-color: #070d17;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 6px;
        }

        .metric-item { display: flex; flex-direction: column; gap: 2px; }
        .metric-label { font-size: 0.60rem; color: var(--text-muted); font-weight: 700; }
        .metric-value { font-size: 0.95rem; font-weight: 800; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(6, 11, 19, 0.88);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid #1e3a5f;
            border-radius: 14px;
            padding: 22px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .modal-title { color: #38bdf8; font-size: 1.1rem; font-weight: 800; }
        .modal-body { font-size: 0.9rem; color: var(--text-main); line-height: 1.5; }
        .modal-btn {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span class="brand-subtitle">MÓDULO COORDINACIÓN BIMANUAL • PALANCAS</span>
        </header>

        <div class="eval-card">
            <div class="top-nav">
                <button class="nav-btn" onclick="ejecutarRetornoMenu()">← Menú Pruebas</button>
                <button id="btnInfo" class="nav-btn nav-btn-blue">? ¿Cómo funciona?</button>
            </div>

            <div class="status-badge-container">
                <div class="status-badge">
                    <span id="badgeDot" class="dot-status"></span>
                    <span id="badgeText">Cargando estado...</span>
                </div>
            </div>

            <div class="canvas-wrapper" id="canvasContainer">
                <canvas id="palancasCanvas" width="400" height="300"></canvas>
            </div>

            <div class="instruction-text" id="instructionText">
                Evaluación Oficial: Recorre la pista con ambos pulgares hasta la meta.
            </div>

            <div class="metrics-grid">
                <div class="metric-item">
                    <span class="metric-label">TIEMPO</span>
                    <span id="metricTiempo" class="metric-value" style="color:#38bdf8;">0 s</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">TOQUES</span>
                    <span id="metricContactos" class="metric-value" style="color:#ef4444;">0</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">T. ERROR</span>
                    <span id="metricTiempoError" class="metric-value" style="color:#e5b324;">0.0 s</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">PRECISIÓN</span>
                    <span id="metricPrecision" class="metric-value" style="color:#10b981;">100%</span>
                </div>
            </div>

            <!-- MANDOS DE CONTROL BIMANUAL -->
            <div class="controls-grid" id="controlsGrid">
                <div class="control-pad">
                    <span class="control-label">MANO IZQUIERDA (EJE X)</span>
                    <div class="btn-ctrl-group">
                        <button class="btn-ctrl" id="btnLeft">◄</button>
                        <button class="btn-ctrl" id="btnRight">►</button>
                    </div>
                </div>
                <div class="control-pad">
                    <span class="control-label">MANO DERECHA (EJE Y)</span>
                    <div class="btn-ctrl-group">
                        <button class="btn-ctrl" id="btnUp">▲</button>
                        <button class="btn-ctrl" id="btnDown">▼</button>
                    </div>
                </div>
            </div>

            <div id="actionContainer" style="width: 100%;">
                <button id="btnStart" class="btn-start">INICIAR SIMULACIÓN OFICIAL</button>
                <button id="btnNext" class="btn-next" onclick="ejecutarRetornoMenu()">VOLVER AL MENÚ DE PRUEBAS →</button>
            </div>
        </div>

        <div id="modalSistema" class="modal-overlay">
            <div class="modal-content">
                <div id="modalTitle" class="modal-title">PRUEBA FINALIZADA</div>
                <div id="modalBody" class="modal-body">Resultados registrados.</div>
                <button id="modalBtnClose" class="modal-btn">Continuar</button>
            </div>
        </div>
    </div>

    <script src="palancas.js"></script>
    <script>
        const canvas = document.getElementById('palancasCanvas');
        const ctx = canvas.getContext('2d');
        const btnStart = document.getElementById('btnStart');
        const btnNext = document.getElementById('btnNext');
        const badgeDot = document.getElementById('badgeDot');
        const badgeText = document.getElementById('badgeText');
        const instructionText = document.getElementById('instructionText');

        const metricTiempo = document.getElementById('metricTiempo');
        const metricContactos = document.getElementById('metricContactos');
        const metricTiempoError = document.getElementById('metricTiempoError');
        const metricPrecision = document.getElementById('metricPrecision');

        const modal = document.getElementById('modalSistema');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalBtnClose = document.getElementById('modalBtnClose');

        const urlParams = new URLSearchParams(window.location.search);
        const modeParam = urlParams.get('mode') || (localStorage.getItem('sensometrika_b2c_mode') === 'true' ? 'b2c' : 'b2b');
        const esB2B = (modeParam === 'b2b');

        let isDemoURL = urlParams.get('demo') === 'true' || urlParams.get('fase') === 'demo';
        let modoActual = isDemoURL ? 'DEMO' : 'OFICIAL';

        let evaluacionActiva = false;
        let contactosCount = 0;
        let estaEnBorde = false;
        let tiempoErrorMs = 0; // ACUMULADOR DE TIEMPO EN ERROR (MS)
        let inicioBordeMs = null;

        let tiempoTranscurrido = 0;
        let timerInterval = null;
        let animFrameId = null;

        let pua = { x: 60, y: 220, r: 8, speed: 1.8 };
        let posicionInicio = { x: 60, y: 220 };
        let posicionMeta = { x: 340, y: 80 };
        let trackPoints = [];
        let keys = { left: false, right: false, up: false, down: false };

        // GENERADOR ANTI-MEMORIZACIÓN DE CIRCUITO BAYONETA
        function generarCircuitoAntiMemorizacion(numSimu) {
            const variante = numSimu % 4;
            const altPuente = 95 + ((numSimu * 13) % 30);
            const anchoPuente = 165 + ((numSimu * 11) % 25);

            if (variante === 1) {
                return {
                    pista: [
                        {x: 50, y: 220},
                        {x: anchoPuente, y: 220},
                        {x: anchoPuente, y: altPuente},
                        {x: anchoPuente + 65, y: altPuente},
                        {x: anchoPuente + 65, y: 220},
                        {x: 350, y: 220},
                        {x: 350, y: 75}
                    ],
                    inicio: {x: 50, y: 220},
                    meta: {x: 350, y: 75}
                };
            } else if (variante === 2) {
                // Sentido Espejo / Invertido
                return {
                    pista: [
                        {x: 350, y: 220},
                        {x: 400 - anchoPuente, y: 220},
                        {x: 400 - anchoPuente, y: altPuente},
                        {x: 335 - anchoPuente, y: altPuente},
                        {x: 335 - anchoPuente, y: 220},
                        {x: 50, y: 220},
                        {x: 50, y: 75}
                    ],
                    inicio: {x: 350, y: 220},
                    meta: {x: 50, y: 75}
                };
            } else if (variante === 3) {
                // Inversión Vertical
                return {
                    pista: [
                        {x: 50, y: 80},
                        {x: 165, y: 80},
                        {x: 165, y: 220},
                        {x: 230, y: 220},
                        {x: 230, y: 80},
                        {x: 350, y: 80},
                        {x: 350, y: 225}
                    ],
                    inicio: {x: 50, y: 80},
                    meta: {x: 350, y: 225}
                };
            } else {
                // Trazado Bayoneta Clásico
                return {
                    pista: [
                        {x: 60, y: 220},
                        {x: 175, y: 220},
                        {x: 175, y: 110},
                        {x: 235, y: 110},
                        {x: 235, y: 220},
                        {x: 340, y: 220},
                        {x: 340, y: 80}
                    ],
                    inicio: {x: 60, y: 220},
                    meta: {x: 340, y: 80}
                };
            }
        }

        function ejecutarRetornoMenu() {
            window.location.href = `menu_B2C.html?${urlParams.toString()}`;
        }

        function actualizarEstadoUI() {
            const historial = JSON.parse(localStorage.getItem('sensometrika_historial_palancas')) || [];
            const numEnsayosRealizados = historial.length;

            const planStorage = (localStorage.getItem('sensometrika_plan_contratado') || urlParams.get('plan') || 'BASICO').toUpperCase();
            let maxIntentosPlan = 3;
            if (planStorage.includes('PLUS')) maxIntentosPlan = 5;
            if (planStorage.includes('FULL') || planStorage.includes('ALTO')) maxIntentosPlan = 8;

            if (isDemoURL) {
                modoActual = 'DEMO';
            } else if (numEnsayosRealizados >= maxIntentosPlan) {
                modoActual = 'BLOQUEADO';
            } else {
                modoActual = 'OFICIAL';
            }

            // Cargar trazado correspondiente
            const simuActual = numEnsayosRealizados + 1;
            const circuito = generarCircuitoAntiMemorizacion(simuActual);
            trackPoints = circuito.pista;
            posicionInicio = circuito.inicio;
            posicionMeta = circuito.meta;
            pua.x = posicionInicio.x;
            pua.y = posicionInicio.y;

            if (modoActual === 'BLOQUEADO') {
                badgeText.textContent = `PLAN ${planStorage} COMPLETADO (${numEnsayosRealizados}/${maxIntentosPlan})`;
                badgeDot.style.backgroundColor = "#10b981"; 
                btnStart.style.display = 'none';
                btnNext.style.display = 'block';
                instructionText.textContent = `Has alcanzado el límite de ${maxIntentosPlan} simulaciones de tu Plan ${planStorage}. Retorna al menú.`;
            } else if (modoActual === 'DEMO') {
                badgeText.textContent = "Paso 1: Calibración Demo (1/1)";
                badgeDot.style.backgroundColor = "#e5b324"; 
                btnStart.textContent = "INICIAR CALIBRACIÓN DEMO";
                btnStart.style.backgroundColor = "#e5b324";
                btnStart.style.display = 'block';
                btnNext.style.display = 'none';
                instructionText.textContent = "Modo Demo: Guía la púa con ambos pulgares hasta la meta verde.";
            } else {
                badgeText.textContent = esB2B ? `Simulación Oficial B2B (S${simuActual})` : `Simulación Oficial S${simuActual} de ${maxIntentosPlan}`;
                badgeDot.style.backgroundColor = "#ef4444"; 
                btnStart.textContent = `INICIAR SIMULACIÓN OFICIAL (S${simuActual} DE ${maxIntentosPlan})`;
                btnStart.style.backgroundColor = "#0284c7";
                btnStart.style.display = 'block';
                btnNext.style.display = 'none';
                instructionText.textContent = `Evaluación Oficial (Variante S${simuActual}): Recorre la pista con ambos pulgares hasta la meta.`;
            }
        }

        function renderLoop() {
            ctx.fillStyle = '#050a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (trackPoints.length > 0) {
                // Dibujar Canal Pista
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 28;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
                for(let i = 1; i < trackPoints.length; i++) {
                    ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
                }
                ctx.stroke();

                // Línea Central Discontinua
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);

                // Punto de Inicio (Amarillo)
                ctx.fillStyle = '#e5b324';
                ctx.beginPath();
                ctx.arc(posicionInicio.x, posicionInicio.y, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Punto de Meta (Verde)
                ctx.fillStyle = '#10b981';
                ctx.beginPath();
                ctx.arc(posicionMeta.x, posicionMeta.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Movimiento Bimanual
            if (evaluacionActiva) {
                if (keys.left) pua.x = Math.max(12, pua.x - pua.speed);
                if (keys.right) pua.x = Math.min(canvas.width - 12, pua.x + pua.speed);
                if (keys.up) pua.y = Math.max(12, pua.y - pua.speed);
                if (keys.down) pua.y = Math.min(canvas.height - 12, pua.y + pua.speed);

                // Detección de contacto con flag de borde (+1 por incursión)
                let enPista = false;
                for(let i = 0; i < trackPoints.length - 1; i++) {
                    if (distToSegment(pua, trackPoints[i], trackPoints[i+1]) <= 12) {
                        enPista = true; break;
                    }
                }

                const ahora = Date.now();
                if (!enPista) {
                    if (!estaEnBorde) {
                        contactosCount++;
                        metricContactos.textContent = contactosCount;
                        estaEnBorde = true;
                        inicioBordeMs = ahora;
                    } else {
                        // MEDIR TIEMPO EN ERROR ACUMULADO
                        tiempoErrorMs += (ahora - inicioBordeMs);
                        inicioBordeMs = ahora;
                        metricTiempoError.textContent = `${(tiempoErrorMs / 1000).toFixed(1)} s`;
                    }
                } else {
                    estaEnBorde = false;
                    inicioBordeMs = null;
                }

                // CÁLCULO DE PRECISIÓN PONDERADA (%)
                const precPonderada = Math.max(0, Math.round(100 - (contactosCount * 4) - ((tiempoErrorMs / 1000) * 6)));
                metricPrecision.textContent = `${precPonderada}%`;

                // Detección de Meta
                if (Math.hypot(pua.x - posicionMeta.x, pua.y - posicionMeta.y) <= 14) {
                    finalizarPrueba();
                }
            }

            // Dibujar Púa
            ctx.fillStyle = estaEnBorde ? '#ef4444' : '#ffffff';
            ctx.beginPath();
            ctx.arc(pua.x, pua.y, pua.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = estaEnBorde ? '#ffffff' : '#38bdf8';
            ctx.stroke();

            animFrameId = requestAnimationFrame(renderLoop);
        }

        function distToSegment(p, v, w) {
            const l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        // Asignación de Mandos Bimanuales
        const setupBtn = (id, key) => {
            const el = document.getElementById(id);
            const on = (e) => { e.preventDefault(); keys[key] = true; };
            const off = (e) => { e.preventDefault(); keys[key] = false; };
            el.addEventListener('mousedown', on);
            el.addEventListener('mouseup', off);
            el.addEventListener('mouseleave', off);
            el.addEventListener('touchstart', on, {passive: false});
            el.addEventListener('touchend', off, {passive: false});
        };

        setupBtn('btnLeft', 'left');
        setupBtn('btnRight', 'right');
        setupBtn('btnUp', 'up');
        setupBtn('btnDown', 'down');

        function iniciarPrueba() {
            if (modoActual === 'BLOQUEADO') return;

            contactosCount = 0;
            tiempoErrorMs = 0;
            estaEnBorde = false;
            tiempoTranscurrido = 0;
            evaluacionActiva = true;

            pua.x = posicionInicio.x;
            pua.y = posicionInicio.y;

            metricContactos.textContent = '0';
            metricTiempoError.textContent = '0.0 s';
            metricTiempo.textContent = '0 s';
            metricPrecision.textContent = '100%';
            btnStart.style.display = 'none';

            timerInterval = setInterval(() => {
                tiempoTranscurrido++;
                metricTiempo.textContent = `${tiempoTranscurrido} s`;
            }, 1000);
        }

        function finalizarPrueba() {
            evaluacionActiva = false;
            clearInterval(timerInterval);

            const tErrorSeg = (tiempoErrorMs / 1000).toFixed(1);
            const precisionFinal = Math.max(0, Math.round(100 - (contactosCount * 4) - ((tiempoErrorMs / 1000) * 6)));

            if (modoActual === 'DEMO') {
                localStorage.setItem('palancas_demo_completada', 'true');

                isDemoURL = false;
                modoActual = 'OFICIAL';

                urlParams.set('demo', 'false');
                urlParams.set('fase', 'oficial');
                window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);

                mostrarModal(
                    "CALIBRACIÓN DEMO COMPLETADA",
                    `Tiempo Recorrido: <b>${tiempoTranscurrido} s</b><br>Toques en Borde: <b>${contactosCount}</b><br>Tiempo en Error: <b>${tErrorSeg} s</b><br>Precisión Bimanual: <b>${precisionFinal}%</b><br><br>Has finalizado el ensayo. Ya puedes rendir tu Simulación Oficial.`,
                    () => {
                        actualizarEstadoUI();
                    }
                );
            } else if (modoActual === 'OFICIAL') {
                let historial = JSON.parse(localStorage.getItem('sensometrika_historial_palancas')) || [];
                historial.push({
                    tiempo: tiempoTranscurrido,
                    contactos: contactosCount,
                    tiempoError: parseFloat(tErrorSeg),
                    precision: precisionFinal,
                    fecha: new Date().toISOString()
                });
                localStorage.setItem('sensometrika_historial_palancas', JSON.stringify(historial));

                const planStorage = (localStorage.getItem('sensometrika_plan_contratado') || 'BASICO').toUpperCase();
                let maxIntentosPlan = 3;
                if (planStorage.includes('PLUS')) maxIntentosPlan = 5;
                if (planStorage.includes('FULL') || planStorage.includes('ALTO')) maxIntentosPlan = 8;

                if (historial.length >= maxIntentosPlan) {
                    let rendidos = JSON.parse(localStorage.getItem('sensometrika_modulos_rendidos')) || {};
                    rendidos.palancas = true;
                    localStorage.setItem('sensometrika_modulos_rendidos', JSON.stringify(rendidos));
                }

                const numSimu = historial.length;

                mostrarModal(
                    `SIMULACIÓN S${numSimu} REGISTRADA`,
                    `Tiempo Recorrido: <b>${tiempoTranscurrido} s</b><br>Toques en Borde: <b>${contactosCount}</b><br>Tiempo en Error: <b>${tErrorSeg} s</b><br>Precisión Bimanual: <b>${precisionFinal}%</b><br><br><b>Simulación S${numSimu} de ${maxIntentosPlan} guardada con éxito.</b>`,
                    () => { ejecutarRetornoMenu(); }
                );
            }
        }

        function mostrarModal(titulo, cuerpo, callback) {
            modalTitle.textContent = titulo;
            modalBody.innerHTML = cuerpo;
            modal.style.display = 'flex';
            modalBtnClose.onclick = () => {
                modal.style.display = 'none';
                if (callback) callback();
            };
        }

        btnStart.addEventListener('click', iniciarPrueba);

        document.getElementById('btnInfo').addEventListener('click', () => {
            mostrarModal("¿CÓMO FUNCIONA?", "Usa los botones bimanuales para desplazar la púa desde el punto amarillo inicial hasta la meta verde evitando rozar los bordes.");
        });

        actualizarEstadoUI();
        renderLoop();
    </script>
</body>
</html>
