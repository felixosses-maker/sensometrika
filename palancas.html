<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Test de Palancas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .canvas-contenedor {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: center;
    }
    #lienzo-palancas {
      background-color: #020617;
      border: 3px solid #334155;
      border-radius: 12px;
      touch-action: none;
    }
    .zona-mandos {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .mando-caja {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .mando-caja span { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
    .btn-control {
      width: 100%;
      height: 48px;
      background-color: #1e293b;
      border: 1px solid #475569;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-control:active { background-color: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Sensometrika</h1>
      <p>Coordinación Bimanual (Test de Palancas)</p>
    </header>

    <section class="panel-resultados">
      <div class="tarjeta-metrica">
        <span>Tiempo</span>
        <strong id="cronometro">60 s</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Contactos</span>
        <strong id="contador-toques" style="color: #ef4444;">0</strong>
      </div>
      <div class="tarjeta-metrica">
        <span>Estado</span>
        <strong id="estado-evaluacion">Esperando</strong>
      </div>
    </section>

    <div class="canvas-contenedor">
      <canvas id="lienzo-palancas" width="340" height="260"></canvas>
    </div>

    <div id="panel-estado" class="estado">Mano Izquierda: Vertical | Mano Derecha: Horizontal</div>

    <section class="zona-mandos">
      <div class="mando-caja">
        <span>MANO IZQ (EJE Y)</span>
        <button id="btn-arriba" class="btn-control">▲ Subir</button>
        <button id="btn-abajo" class="btn-control">▼ Bajar</button>
      </div>
      <div class="mando-caja">
        <span>MANO DER (EJE X)</span>
        <div style="display: flex; width: 100%; gap: 6px;">
          <button id="btn-izq" class="btn-control">◀</button>
          <button id="btn-der" class="btn-control">▶</button>
        </div>
        <button id="btn-iniciar" class="btn-control" style="background-color: #0284c7; border-color: #38bdf8;">Comenzar</button>
      </div>
    </section>

    <a href="menu.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem;">← Volver al Menú Principal</a>
  </main>

  <script src="palancas.js"></script>
</body>
</html>
