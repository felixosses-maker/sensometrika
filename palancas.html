<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensometrika | Test de Palancas</title>
  <script src="credit-manager.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .tarjeta-palancas {
      width: 100%;
      max-width: 440px;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 16px;
      padding: 14px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header-modulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }
    .header-modulo a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
    }
    .badge-top {
      color: #38bdf8;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .pila-estado {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
    }
    .panel-metricas {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px;
      text-align: center;
    }
    .caja-metrica {
      background: #182235;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px;
    }
    .caja-metrica span {
      display: block;
      font-size: 0.62rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }
    .caja-metrica strong {
      font-size: 0.88rem;
      color: #38bdf8;
    }
    .canvas-contenedor {
      width: 100%;
      background: #090d16;
      border: 1.5px solid #1e293b;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
      box-sizing: border-box;
    }
    canvas {
      width: 100%;
      height: 200px;
      background: transparent;
      display: block;
      touch-action: none;
    }
    .btn-iniciar-test {
      width: 100%;
      height: 46px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }
    .controles-palancas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
    }
    .bloque-mando {
      background: #182235;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .bloque-mando span {
      display: block;
      font-size: 0.65rem;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .btn-mando {
      width: 100%;
      height: 46px;
      background: #1e293b;
      border: 1.5px solid #334155;
      color: #ffffff;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      touch-action: manipulation;
      cursor: pointer;
      margin-bottom: 4px;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-mando:active, .btn-mando.activo {
      background: #0284c7 !important;
      border-color: #38bdf8 !important;
      color: #ffffff !important;
    }
    .fila-doble-mando {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="tarjeta-palancas">
    <div class="header-modulo">
      <a href="menu.html">← Menú Principal</a>
      <span class="badge-top">MÓDULO 2: PALANCAS</span>
    </div>

    <div class="pila-estado">
      <span id="badge-modo-palancas" style="color: #38bdf8; font-weight: 700;">🟡 Calibración Técnica (Demo 20 s)</span>
      <span id="txt-tiempo-palancas" style="color: #94a3b8;">Fase de Inducción</span>
    </div>

    <div class="panel-metricas">
      <div class="caja-metrica">
        <span>Contactos</span>
        <strong id="metrica-contactos" style="color: #ef4444;">0</strong>
      </div>
      <div class="caja-metrica">
        <span>T. Contacto</span>
        <strong id="metrica-tiempo-contacto">0.0 s</strong>
      </div>
      <div class="caja-metrica">
        <span>Circuito</span>
        <strong id="metrica-circuito" style="font-size: 0.72rem;">Calibración</strong>
      </div>
    </div>

    <div class="canvas-contenedor">
      <canvas id="lienzo-palancas" width="320" height="200"></canvas>
    </div>

    <p id="panel-estado" style="margin: 0; font-size: 0.75rem; color: #94a3b8; text-align: center; min-height: 18px;">
      Usa los botones inferiores para mover el puntero.
    </p>

    <div id="zona-coordinacion-palancas">
      <button type="button" class="btn-iniciar-test" id="btn-iniciar-palancas">
        Iniciar Calibración Guiada (Demo)
      </button>
    </div>

    <div class="controles-palancas">
      <!-- Mano Izquierda: Eje Y -->
      <div class="bloque-mando">
        <span>Mano Izq (Vertical)</span>
        <button type="button" class="btn-mando" id="btn-izq-arriba">▲ Arriba</button>
        <button type="button" class="btn-mando" id="btn-izq-abajo">▼ Abajo</button>
      </div>

      <!-- Mano Derecha: Eje X -->
      <div class="bloque-mando">
        <span>Mano Der (Horizontal)</span>
        <div class="fila-doble-mando">
          <button type="button" class="btn-mando" id="btn-der-izq">◄</button>
          <button type="button" class="btn-mando" id="btn-der-der">►</button>
        </div>
      </div>
    </div>
  </main>

  <script src="palancas.js"></script>
</body>
</html>
