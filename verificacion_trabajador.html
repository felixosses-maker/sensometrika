<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Acreditación de Identidad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #060b13;
      --card-bg: #0b1320;
      --card-border: #1a2638;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    .brand-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .brand-logo-img { width: 190px; height: auto; mix-blend-mode: lighten; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45)); }

    .card-box {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-title {
      font-size: 0.80rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 6px;
    }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.78rem; }
    .info-label { color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; font-weight: 700; display: block; }
    .info-val { color: #fff; font-weight: 800; font-size: 0.85rem; }

    .signature-container {
      width: 100%;
      background: #040810;
      border: 1px dashed var(--accent-cyan);
      border-radius: 10px;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 180px;
      display: block;
      touch-action: none;
      border-radius: 10px;
    }

    .btn-action {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <header class="brand-header">
      <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
      <span style="color: var(--accent-cyan); font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;">
        VERIFICACIÓN Y ACREDITACIÓN DEL EVALUADO
      </span>
    </header>

    <!-- Datos Evaluado -->
    <div class="card-box">
      <div class="card-title" id="lblHeaderCard">👤 DATOS PERSONALES</div>
      <div id="gridDatos" class="info-grid">
        <div>
          <span class="info-label">Nombre Completo</span>
          <span id="lblNombre" class="info-val">-</span>
        </div>
        <div id="colRut">
          <span class="info-label">RUT / Cédula</span>
          <span id="lblRut" class="info-val">-</span>
        </div>
      </div>
    </div>

    <!-- SECCIÓN FOTO (Oculta en B2C) -->
    <div class="card-box" id="boxFotoBiometrica">
      <div class="card-title">📷 REGISTRO FOTOGRÁFICO DE IDENTIDAD</div>
      <div style="width:100%; height:180px; background:#040810; border-radius:10px; display:flex; justify-content:center; align-items:center; border:1px solid var(--card-border);">
        <span style="color:var(--text-muted); font-size:0.75rem;">Cámara Biométrica Activada</span>
      </div>
    </div>

    <!-- SECCIÓN FIRMA DIGITAL -->
    <div class="card-box">
      <div class="card-title">✍️ FIRMA DIGITAL DEL EVALUADO</div>
      <div class="signature-container">
        <canvas id="canvasFirma"></canvas>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:0.68rem; color:var(--text-muted);">Estampe su firma manuscrita dentro del cuadro</span>
        <button onclick="limpiarFirma()" style="background:none; border:none; color:#ef4444; font-size:0.72rem; font-weight:800; cursor:pointer;">Limpiar Firma</button>
      </div>
    </div>

    <button onclick="confirmarYPasarAlMenu()" class="btn-action">
      INICIAR BATERÍA DE EVALUACIONES →
    </button>
  </div>

  <script>
    let isB2C = false;
    let canvas, ctx, dibujando = false;

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rut = urlParams.get('rut') || '15.344.221-K';
      const nombre = urlParams.get('nombre') || 'Félix Osses';
      const mode = urlParams.get('mode') || localStorage.getItem('sensometrika_b2c_mode');

      document.getElementById('lblRut').textContent = rut;
      document.getElementById('lblNombre').textContent = decodeURIComponent(nombre);

      if (mode === 'b2c' || localStorage.getItem('sensometrika_b2c_mode') === 'true') {
        isB2C = true;
        
        // Encabezado B2C
        document.getElementById('lblHeaderCard').textContent = '👤 DATOS PERSONALES';
        
        // Ocultar foto
        document.getElementById('boxFotoBiometrica').style.display = 'none';
      } else {
        // Encabezado B2B
        document.getElementById('lblHeaderCard').textContent = '👤 DATOS DEL POSTULANTE / TRABAJADOR';
      }

      initCanvasFirma();
    });

    function initCanvasFirma() {
      canvas = document.getElementById('canvasFirma');
      ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 180;

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function empezar(e) { dibujando = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
      function mover(e) { if (!dibujando) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
      function parar() { dibujando = false; }

      canvas.addEventListener('mousedown', empezar);
      canvas.addEventListener('mousemove', mover);
      window.addEventListener('mouseup', parar);

      canvas.addEventListener('touchstart', empezar);
      canvas.addEventListener('touchmove', mover);
      window.addEventListener('touchend', parar);
    }

    function limpiarFirma() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function confirmarYPasarAlMenu() {
      const urlParams = new URLSearchParams(window.location.search);
      const rut = urlParams.get('rut') || '';
      const plan = urlParams.get('plan') || 'BASICO';

      localStorage.setItem('sensometrika_firma_trabajador', canvas.toDataURL());
      window.location.href = `menu_B2C.html?rut=${encodeURIComponent(rut)}&plan=${plan}&mode=${isB2C ? 'b2c' : 'b2b'}`;
    }
  </script>
</body>
</html>
