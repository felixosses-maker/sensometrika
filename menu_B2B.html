<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Acreditación y Menú B2B Corporativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-green: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
            --blue-btn-border: #0369a1;
            --accent-cyan: #38bdf8;
            --accent-gold: #e5b324;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 4px 0 8px 0;
            width: 100%;
        }

        .brand-logo-img {
            width: 185px;
            height: auto;
            display: block;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .eval-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Pantalla de Acreditación */
        #vistaAcreditacion {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .acreditacion-title {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-transform: uppercase;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .acreditacion-desc {
            font-size: 0.74rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
        }

        .camera-box {
            width: 100%;
            height: 180px;
            background: #04070d;
            border: 2px dashed var(--accent-cyan);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .camera-box video, .camera-box canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .form-group-cred {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group-cred label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .form-group-cred input {
            background: #070d17;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            outline: none;
        }

        .btn-acreditar {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            transition: opacity 0.2s;
            margin-top: 4px;
        }

        .btn-acreditar:hover { opacity: 0.9; }

        /* Vista de Módulos (Oculta hasta acreditarse) */
        #vistaModulos {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .user-header-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-cyan);
        }

        .user-plan-title {
            color: #38bdf8;
            font-size: 0.82rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .user-info-text {
            color: #cbd5e1;
            font-size: 0.72rem;
            font-weight: 700;
            text-align: left;
        }

        .modules-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .mod-item {
            background-color: #070d17;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .mod-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .mod-title { font-size: 0.82rem; font-weight: 800; color: #f8fafc; }
        .mod-desc { font-size: 0.65rem; color: #64748b; line-height: 1.2; }

        .btn-mod-start {
            background-color: var(--blue-btn);
            border: 1px solid var(--blue-btn-border);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }

        .badge-mod-ok {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .badge-mod-nosol {
            background: rgba(100, 116, 139, 0.12);
            border: 1px solid rgba(100, 116, 139, 0.3);
            color: #94a3b8;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-informe {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 900;
            font-size: 0.90rem;
            text-align: center;
            text-decoration: none;
            width: 100%;
            display: block;
            margin-top: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="../sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">
            <span class="brand-subtitle">EVALUACIÓN B2B • ACCESO CORPORATIVO</span>
        </header>

        <div class="eval-card">
            
            <!-- VISTA 1: ACREDITACIÓN Y VALIDACIÓN DE IDENTIDAD -->
            <div id="vistaAcreditacion">
                <div class="acreditacion-title">🔐 Acreditación Biométrica & Validación de Identidad</div>
                <div class="acreditacion-desc">Por favor, verifique sus datos, active su cámara y capture su fotografía frontal para habilitar la sesión pericial oficial.</div>

                <div class="camera-box" id="cameraContainer">
                    <video id="videoPreview" autoplay playsinline muted style="display:none;"></video>
                    <canvas id="canvasPreview" style="display:none;"></canvas>
                    <div id="cameraPlaceholder" style="text-align: center; color: var(--text-muted); font-size: 0.75rem; padding: 10px;">
                        📷 Cámara desactivada<br>
                        <button type="button" onclick="iniciarCamara()" style="margin-top: 8px; background: var(--blue-btn); color:#fff; border:none; padding: 6px 12px; border-radius: 6px; font-weight:700; cursor:pointer; font-size:0.7rem;">ACTIVAR CÁMARA</button>
                    </div>
                </div>

                <div class="form-group-cred">
                    <label>RUT del Evaluado *</label>
                    <input type="text" id="inputRut" placeholder="Ej: 12.345.678-9" required>
                </div>
                <div class="form-group-cred">
                    <label>Nombre Completo *</label>
                    <input type="text" id="inputNombre" placeholder="Ej: Juan Pérez Santana" required>
                </div>
                <div class="form-group-cred">
                    <label>Cargo / Función en Faena *</label>
                    <input type="text" id="inputCargo" placeholder="Ej: Operador de Camión Tolva" required>
                </div>

                <button type="button" class="btn-acreditar" onclick="completarAcreditacion()">
                    ✓ CONFIRMAR IDENTIDAD Y ACCEDER A MÓDULOS →
                </button>
            </div>

            <!-- VISTA 2: MENÚ DE MÓDULOS B2B (Se muestra tras acreditarse) -->
            <div id="vistaModulos">
                <div class="user-header-box">
                    <img id="userAvatarImg" src="" alt="Avatar" class="user-avatar-img" style="display:none;">
                    <div style="flex:1;">
                        <div class="user-plan-title" id="lblPlanHeader">EVALUACIÓN B2B • PLAN PERSONALIZADO</div>
                        <div class="user-info-text" id="lblUserData">EVALUADO: -- | RUT: --</div>
                    </div>
                </div>

                <div class="modules-list" id="contenedorModulosB2B">
                    <!-- Se inyectan los módulos dinámicamente -->
                </div>

                <button type="button" id="btnVerInforme" class="btn-informe" onclick="abrirInformePericial()">VER INFORME PERICIAL B2B →</button>
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let datosUsuario = {};
        try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch(e){}

        const planContratado = (urlParams.get('plan') || localStorage.getItem('sensometrika_plan_contratado') || 'B2B_PERSONALIZADO').toUpperCase().trim();
        const modulosUrl = urlParams.get('modulos');
        if (modulosUrl) { localStorage.setItem('sensometrika_modulos_b2b_activos', modulosUrl); }

        const rawRut = urlParams.get('rut') || datosUsuario.rut || '';
        const nombreUsuario = urlParams.get('nombre') || datosUsuario.nombre || '';
        const cargoUsuario = urlParams.get('cargo') || datosUsuario.cargo || '';

        // Prellenar inputs de acreditación con parámetros de URL si existen
        if (rawRut) document.getElementById('inputRut').value = decodeURIComponent(rawRut);
        if (nombreUsuario) document.getElementById('inputNombre').value = decodeURIComponent(nombreUsuario);
        if (cargoUsuario) document.getElementById('inputCargo').value = decodeURIComponent(cargoUsuario);

        let streamCamara = null;
        let fotoCapturadaBase64 = '';

        async function iniciarCamara() {
            try {
                streamCamara = await navigator.mediaDevices.getUserMedia({ video: { width: 400, height: 400, facingMode: 'user' } });
                const video = document.getElementById('videoPreview');
                video.srcObject = streamCamara;
                video.style.display = 'block';
                document.getElementById('cameraPlaceholder').style.display = 'none';
            } catch (err) {
                alert("⚠️ No se pudo acceder a la cámara. Puede continuar con la acreditación de identidad ingresando sus datos.");
            }
        }

        function completarAcreditacion() {
            const rutVal = document.getElementById('inputRut').value.trim();
            const nombreVal = document.getElementById('inputNombre').value.trim();
            const cargoVal = document.getElementById('inputCargo').value.trim();

            if (!rutVal || !nombreVal) {
                alert("⚠️ Por favor ingrese su RUT y Nombre Completo para continuar.");
                return;
            }

            // Capturar foto si la cámara está activa
            const video = document.getElementById('videoPreview');
            const canvas = document.getElementById('canvasPreview');
            if (streamCamara && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth || 300;
                canvas.height = video.videoHeight || 300;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                fotoCapturadaBase64 = canvas.toDataURL('image/jpeg', 0.85);
                localStorage.setItem('sensometrika_foto_evaluado', fotoCapturadaBase64);
                
                // Apagar cámara
                streamCamara.getTracks().forEach(track => track.stop());
            }

            // Guardar datos acreditados
            localStorage.setItem('sensometrika_b2b_rut_activo', rutVal);
            localStorage.setItem('sensometrika_b2b_nombre_activo', nombreVal);
            localStorage.setItem('sensometrika_b2b_cargo_activo', cargoVal);

            const cleanRut = rutVal.replace(/[^0-9Kk]/g, '');
            const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_${cleanRut}_${Date.now()}`;
            localStorage.setItem('sensometrika_session_activa', sessionId);

            // Cambiar a vista de módulos
            document.getElementById('vistaAcreditacion').style.display = 'none';
            document.getElementById('vistaModulos').style.display = 'flex';

            if (fotoCapturadaBase64) {
                const avatar = document.getElementById('userAvatarImg');
                avatar.src = fotoCapturadaBase64;
                avatar.style.display = 'block';
            }

            document.getElementById('lblUserData').innerHTML = `EVALUADO: <strong>${nombreVal.toUpperCase()}</strong><br>RUT: ${rutVal} | CARGO: ${cargoVal || 'Operador'}`;

            renderizarMenuB2B(cleanRut, nombreVal, sessionId);
        }

        const catModulos17 = [
            { id: 'mod1', nombre: '1. Punteo y Coordinación Visomotora 🎯', desc: 'Ritmo motor, velocidad máxima y resistencia a fatiga (1A a 1D).', archivo: 'demo_punteo_pro.html' },
            { id: 'mod2', nombre: '2. Reactímetro B2B ⚡', desc: 'Tiempos de respuesta y frenado en ms con compensación de hardware.', archivo: 'demo_reactimetro_pro.html' },
            { id: 'mod3', nombre: '3. Coordinación Visomotriz y Tracking 🚗', desc: 'Seguimiento continuo de trayectoria sobre circuitos variables.', archivo: 'demo_visomotriz_pro.html' },
            { id: 'mod4', nombre: '4. Anticipación de Tiempo y Velocidad ⏱️', desc: 'Cálculo espaciotemporal ante puntos ciegos y velocidad variable.', archivo: 'demo_anticipacion_pro.html' },
            { id: 'mod5', nombre: '5. Resistencia al Encandilamiento 💡', desc: 'Velocidad de recuperación visual ante destellos frontales (D.S. N° 170).', archivo: 'demo_encandilamiento_pro.html' },
            { id: 'mod6', nombre: '6. Tamizaje Visual (Agudeza Snellen) 👁️', desc: 'Evaluación de agudeza visual lejana y cercana con auditoría telemétrica.', archivo: 'visual.html' },
            { id: 'mod7', nombre: '7. Test de Ishihara (Daltonismo) 🎨', desc: 'Detección digital de discromatopsias para lectura de semáforos.', archivo: 'visual_transporte.html' },
            { id: 'mod8', nombre: '8. Visión de Profundidad (Estereopsis) 📐', desc: 'Percepción tridimensional y cálculo preciso de distancias en faena.', archivo: 'estereopsis.html' },
            { id: 'mod9', nombre: '9. Campo Visual Periférico 👁️‍🗨️', desc: 'Amplitud de cono visual lateral para prevención de ángulos muertos.', archivo: 'campo_periferico.html' },
            { id: 'mod10', nombre: '10. Tamizaje Auditivo Binaural 🎧', desc: 'Audiometría tonal orientada a frecuencias críticas y umbrales.', archivo: 'audicion.html' },
            { id: 'mod11', nombre: '11. Atención Sostenida (CPT) 🧠', desc: 'Test de vigilancia y estabilidad atencional para prevención de micro-sueños.', archivo: 'fatiga.html' },
            { id: 'mod12', nombre: '12. Test de Fatiga (Karolinska) 😴', desc: 'Nivel de alerta y somnolencia en ruta para operadores de turno.', archivo: 'carga_dual.html' },
            { id: 'mod13', nombre: '13. Palancas Bimanual 🎮', desc: 'Coordinación motriz fina bilateral y disociación de mandos independientes.', archivo: 'punteo_transporte.html' },
            { id: 'mod14', nombre: '14. Memoria de Trabajo Operativa 🧩', desc: 'Retención de secuencias lógicas e instrucciones operativas complejas.', archivo: 'memoria_trabajo.html' },
            { id: 'mod15', nombre: '15. Frenado Selectivo 🛑', desc: 'Precisión de frenado bajo presión de tiempo y control inhibitorio.', archivo: 'reactimetro.html' },
            { id: 'mod16', nombre: '16. Control de Impulsos Viales ⚖️', desc: 'Detección conductual de perfiles de riesgo y temperamento al volante.', archivo: 'micro-fit.html' },
            { id: 'mod17', nombre: '17. Declaración Médica 📋', desc: 'Declaración jurada digital de aptitud física (Art. 36 D.S. N° 170).', archivo: 'declaracion_medica.html' },
            { id: 'mod18', nombre: 'M1. Estabilidad Vestibular (Romberg Pro) ⚖️', desc: 'Prueba estática vestibular de 20s con acelerómetro y aviso sonoro.', archivo: 'medico_pro/01_romberg.html' },
            { id: 'mod19', nombre: 'M2. Estabilidad Motora (Temblores Pro) ✋', desc: 'Control de micro-oscilaciones y pulso estacionario durante 20s.', archivo: 'medico_pro/02_temblores.html' },
            { id: 'mod20', nombre: 'M3. Dinamometría y Fuerza (Grip Pro) ✊', desc: 'Fuerza isométrica y prehensión sostenida por 20s en pantalla táctil.', archivo: 'medico_pro/03_grip.html' },
            { id: 'mod21', nombre: 'M4. Frecuencia Cardíaca Basal (PPG Pro) 💓', desc: 'Pletismografía óptica y análisis de flujo pulsátil durante 20s.', archivo: 'medico_pro/04_ppg.html' },
            { id: 'mod22', nombre: 'M5. Reflejo Fotomotor Pupilar Pro 👁️', desc: 'Seguimiento facial fino con MediaPipe y alerta por inatención.', archivo: 'medico_pro/05_pupilar.html' },
            { id: 'mod23', nombre: 'M6. Espirometría Ocupacional Pro 🫁', desc: 'Screening de flujo respiratorio por micrófono integrado durante 20s.', archivo: 'medico_pro/06_espirometria.html' },
            { id: 'mod24', nombre: 'M7. Agilidad y Praxias Digitales (Tapping) ⚡', desc: 'Velocidad de ejecución rítmica continua por 20s.', archivo: 'medico_pro/07_tapping.html' },
            { id: 'mod25', nombre: 'M8. Reacción a Alarma de Faena 🚨', desc: 'Tamizaje auditivo de emergencia y tiempo de respuesta acústica.', archivo: 'medico_pro/08_auditivo.html' },
            { id: 'mod26', nombre: 'M9. Estabilidad Oculomotriz (Nistagmo) 🔄', desc: 'Seguimiento ocular de punto móvil y control de sacadas.', archivo: 'medico_pro/09_nistagmo.html' },
            { id: 'mod27', nombre: 'M10. Tamizaje de Somnolencia Pro 😴', desc: 'Detección de fatiga, vigilancia y apertura ocular prolongada.', archivo: 'medico_pro/10_somnolencia.html' }
        ];

        function verifRendidoRut(modKey, cleanRut, sessionId) {
            if (!cleanRut) return false;
            let nombreModuloTest = '';
            switch(modKey) {
                case 'mod1': nombreModuloTest = 'punteo'; break;
                case 'mod2': nombreModuloTest = 'reactimetro_simple'; break;
                case 'mod3': nombreModuloTest = 'visomotriz'; break;
                case 'mod4': nombreModuloTest = 'anticipacion'; break;
                case 'mod5': nombreModuloTest = 'encandilamiento'; break;
                case 'mod6': nombreModuloTest = 'visual_snellen'; break;
                case 'mod7': nombreModuloTest = 'ishihara'; break;
                case 'mod8': nombreModuloTest = 'estereopsis'; break;
                case 'mod9': nombreModuloTest = 'campo_periferico'; break;
                case 'mod10': nombreModuloTest = 'auditivo'; break;
                case 'mod11': nombreModuloTest = 'atencion_cpt'; break;
                case 'mod12': nombreModuloTest = 'fatiga_karolinska'; break;
                case 'mod13': nombreModuloTest = 'palancas'; break;
                case 'mod14': nombreModuloTest = 'memoria_trabajo'; break;
                case 'mod15': nombreModuloTest = 'frenado_selectivo'; break;
                case 'mod16': nombreModuloTest = 'control_impulsos'; break;
                case 'mod17': nombreModuloTest = 'declaracion_medica'; break;
                case 'mod18': nombreModuloTest = 'romberg'; break;
                case 'mod19': nombreModuloTest = 'temblores'; break;
                case 'mod20': nombreModuloTest = 'grip'; break;
                case 'mod21': nombreModuloTest = 'ppg'; break;
                case 'mod22': nombreModuloTest = 'pupilar'; break;
                case 'mod23': nombreModuloTest = 'espirometria'; break;
                case 'mod24': nombreModuloTest = 'tapping'; break;
                case 'mod25': nombreModuloTest = 'auditivo'; break;
                case 'mod26': nombreModuloTest = 'nistagmo'; break;
                case 'mod27': nombreModuloTest = 'somnolencia'; break;
                default: nombreModuloTest = modKey;
            }

            const hSesion = localStorage.getItem(`sensometrika_historial_${nombreModuloTest}_${cleanRut}_${sessionId}`);
            const lSesion = localStorage.getItem(`sensometrika_last_${nombreModuloTest}_${cleanRut}_${sessionId}`);
            return (hSesion || lSesion || localStorage.getItem(`medico_${nombreModuloTest}_${cleanRut}_${sessionId}`) === 'true');
        }

        function renderizarMenuB2B(cleanRut, nombreVal, sessionId) {
            const bolsaActivaStr = localStorage.getItem('sensometrika_modulos_b2b_activos') || 'mod1,mod2,mod3,mod6,mod10,mod18,mod19,mod20,mod21,mod22,mod23,mod24,mod25,mod26,mod27';
            const bolsaActivaArray = bolsaActivaStr.split(',').map(m => m.trim().toLowerCase());

            const paramsObj = { rut: cleanRut, nombre: nombreVal, plan: planContratado, session: sessionId, mode: 'b2b' };
            if (modulosUrl) paramsObj.modulos = modulosUrl;
            const queryParamsString = new URLSearchParams(paramsObj).toString();

            const contenedor = document.getElementById('contenedorModulosB2B');
            contenedor.innerHTML = '';

            catModulos17.forEach(mod => {
                const estaSolicitado = bolsaActivaArray.includes(mod.id.toLowerCase());
                const rendido = verifRendidoRut(mod.id, cleanRut, sessionId);

                let accionHtml = '';
                if (!estaSolicitado) {
                    accionHtml = `<span class="badge-mod-nosol">NO SOLICITADO</span>`;
                } else if (rendido) {
                    accionHtml = `<span class="badge-mod-ok">✓ COMPLETADO</span>`;
                } else {
                    accionHtml = `<a href="${mod.archivo}?${queryParamsString}" class="btn-mod-start">INICIAR →</a>`;
                }

                const card = document.createElement('div');
                card.className = 'mod-item';
                card.innerHTML = `
                    <div class="mod-info">
                        <span class="mod-title" style="color: ${estaSolicitado ? '#f8fafc' : '#64748b'};">${mod.nombre}</span>
                        <span class="mod-desc">${mod.desc}</span>
                    </div>
                    <div>${accionHtml}</div>
                `;
                contenedor.appendChild(card);
            });
        }

        function abrirInformePericial() {
            const rutVal = localStorage.getItem('sensometrika_b2b_rut_activo') || rawRut;
            const nombreVal = localStorage.getItem('sensometrika_b2b_nombre_activo') || nombreUsuario;
            const sessionId = localStorage.getItem('sensometrika_session_activa');

            const params = new URLSearchParams({ rut: rutVal, nombre: nombreVal, plan: planContratado, session: sessionId, mode: 'b2b' });
            if (modulosUrl) params.set('modulos', modulosUrl);
            window.location.href = `informe_b2b.html?${params.toString()}`;
        }
    </script>
