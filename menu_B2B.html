<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Menú B2B Corporativo - Módulos Evaluados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-green: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
            --blue-btn-border: #0369a1;
            --accent-cyan: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 4px 0 8px 0;
            width: 100%;
        }

        .brand-logo-img {
            width: 185px;
            height: auto;
            display: block;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .eval-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .user-header-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-cyan);
        }

        .user-plan-title {
            color: #38bdf8;
            font-size: 0.82rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .user-info-text {
            color: #cbd5e1;
            font-size: 0.72rem;
            font-weight: 700;
            text-align: left;
        }

        .modules-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .mod-item {
            background-color: #070d17;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .mod-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .mod-title { font-size: 0.82rem; font-weight: 800; color: #f8fafc; }
        .mod-desc { font-size: 0.65rem; color: #64748b; line-height: 1.2; }

        .btn-mod-start {
            background-color: var(--blue-btn);
            border: 1px solid var(--blue-btn-border);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }

        .badge-mod-ok {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .badge-mod-nosol {
            background: rgba(100, 116, 139, 0.12);
            border: 1px solid rgba(100, 116, 139, 0.3);
            color: #94a3b8;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-informe {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 900;
            font-size: 0.90rem;
            text-align: center;
            text-decoration: none;
            width: 100%;
            display: block;
            margin-top: 6px;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">
            <span class="brand-subtitle">EVALUACIÓN B2B • MENÚ OFICIAL CORPORATIVO</span>
        </header>

        <div class="eval-card">
            <div class="user-header-box">
                <img id="userAvatarImg" src="" alt="Avatar" class="user-avatar-img" style="display:none;">
                <div style="flex:1;">
                    <div class="user-plan-title" id="lblPlanHeader">EVALUACIÓN B2B • PLAN PERSONALIZADO</div>
                    <div class="user-info-text" id="lblUserData">EVALUADO: CARGANDO... | RUT: --</div>
                </div>
            </div>

            <div class="modules-list" id="contenedorModulosB2B">
                <!-- Se inyectan los módulos dinámicamente -->
            </div>

            <button type="button" id="btnVerInforme" class="btn-informe" onclick="abrirInformePericial()">VER INFORME PERICIAL B2B →</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let datosUsuario = {};
        try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch(e){}

        const planContratado = (urlParams.get('plan') || localStorage.getItem('sensometrika_plan_contratado') || 'B2B_PERSONALIZADO').toUpperCase().trim();
        const modulosUrl = urlParams.get('modulos');
        if (modulosUrl) { localStorage.setItem('sensometrika_modulos_b2b_activos', modulosUrl); }

        const rawRut = urlParams.get('rut') || datosUsuario.rut || '12.345.678-K';
        const cleanRut = rawRut.replace(/[^0-9Kk]/g, '');
        const nombreUsuario = urlParams.get('nombre') || datosUsuario.nombre || 'TRABAJADOR EVALUADO';
        const cargoUsuario = urlParams.get('cargo') || datosUsuario.cargo || 'Operador';
        const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_${cleanRut}_${Date.now()}`;
        
        localStorage.setItem('sensometrika_session_activa', sessionId);
        document.getElementById('lblUserData').innerHTML = `EVALUADO: <strong>${decodeURIComponent(nombreUsuario).toUpperCase()}</strong><br>RUT: ${rawRut} | CARGO: ${cargoUsuario}`;

        // Mostrar foto capturada en verificación si existe
        const fotoGuardada = localStorage.getItem('sensometrika_foto_trabajador') || localStorage.getItem(`sensometrika_foto_${cleanRut}`);
        if (fotoGuardada) {
            const avatar = document.getElementById('userAvatarImg');
            avatar.src = fotoGuardada;
            avatar.style.display = 'block';
        }

        function verifRendidoRut(modKey) {
            if (!cleanRut) return false;
            let nombreModuloTest = '';
            switch(modKey) {
                case 'mod1': nombreModuloTest = 'punteo'; break;
                case 'mod2': nombreModuloTest = 'reactimetro_simple'; break;
                case 'mod3': nombreModuloTest = 'visomotriz'; break;
                case 'mod4': nombreModuloTest = 'anticipacion'; break;
                case 'mod5': nombreModuloTest = 'encandilamiento'; break;
                case 'mod6': nombreModuloTest = 'visual_snellen'; break;
                case 'mod7': nombreModuloTest = 'ishihara'; break;
                case 'mod8': nombreModuloTest = 'estereopsis'; break;
                case 'mod9': nombreModuloTest = 'campo_periferico'; break;
                case 'mod10': nombreModuloTest = 'auditivo'; break;
                case 'mod11': nombreModuloTest = 'atencion_cpt'; break;
                case 'mod12': nombreModuloTest = 'fatiga_karolinska'; break;
                case 'mod13': nombreModuloTest = 'palancas'; break;
                case 'mod14': nombreModuloTest = 'memoria_trabajo'; break;
                case 'mod15': nombreModuloTest = 'frenado_selectivo'; break;
                case 'mod16': nombreModuloTest = 'control_impulsos'; break;
                case 'mod17': nombreModuloTest = 'declaracion_medica'; break;
                case 'mod18': nombreModuloTest = 'romberg'; break;
                case 'mod19': nombreModuloTest = 'temblores'; break;
                case 'mod20': nombreModuloTest = 'grip'; break;
                case 'mod21': nombreModuloTest = 'ppg'; break;
                case 'mod22': nombreModuloTest = 'pupilar'; break;
                case 'mod23': nombreModuloTest = 'espirometria'; break;
                case 'mod24': nombreModuloTest = 'tapping'; break;
                case 'mod25': nombreModuloTest = 'auditivo'; break;
                case 'mod26': nombreModuloTest = 'nistagmo'; break;
                case 'mod27': nombreModuloTest = 'somnolencia'; break;
                default: nombreModuloTest = modKey;
            }

            const hSesion = localStorage.getItem(`sensometrika_historial_${nombreModuloTest}_${cleanRut}_${sessionId}`);
            const lSesion = localStorage.getItem(`sensometrika_last_${nombreModuloTest}_${cleanRut}_${sessionId}`);
            return (hSesion || lSesion || localStorage.getItem(`medico_${nombreModuloTest}_${cleanRut}_${sessionId}`) === 'true');
        }

        const catModulos17 = [
            { id: 'mod1', nombre: '1. Punteo y Coordinación Visomotora 🎯', desc: 'Ritmo motor, velocidad máxima y resistencia a fatiga (1A a 1D).', archivo: 'demo_punteo_pro.html' },
            { id: 'mod2', nombre: '2. Reactímetro B2B ⚡', desc: 'Tiempos de respuesta y frenado en ms con compensación de hardware.', archivo: 'demo_reactimetro_pro.html' },
            { id: 'mod3', nombre: '3. Coordinación Visomotriz y Tracking 🚗', desc: 'Seguimiento continuo de trayectoria sobre circuitos variables.', archivo: 'demo_visomotriz_pro.html' },
            { id: 'mod4', nombre: '4. Anticipación de Tiempo y Velocidad ⏱️', desc: 'Cálculo espaciotemporal ante puntos ciegos y velocidad variable.', archivo: 'demo_anticipacion_pro.html' },
            { id: 'mod5', nombre: '5. Resistencia al Encandilamiento 💡', desc: 'Velocidad de recuperación visual ante destellos frontales (D.S. N° 170).', archivo: 'demo_encandilamiento_pro.html' },
            { id: 'mod6', nombre: '6. Tamizaje Visual (Agudeza Snellen) 👁️', desc: 'Evaluación de agudeza visual lejana y cercana con auditoría telemétrica.', archivo: 'visual.html' },
            { id: 'mod7', nombre: '7. Test de Ishihara (Daltonismo) 🎨', desc: 'Detección digital de discromatopsias para lectura de semáforos.', archivo: 'visual_transporte.html' },
            { id: 'mod8', nombre: '8. Visión de Profundidad (Estereopsis) 📐', desc: 'Percepción tridimensional y cálculo preciso de distancias en faena.', archivo: 'estereopsis.html' },
            { id: 'mod9', nombre: '9. Campo Visual Periférico 👁️‍🗨️', desc: 'Amplitud de cono visual lateral para prevención de ángulos muertos.', archivo: 'campo_periferico.html' },
            { id: 'mod10', nombre: '10. Tamizaje Auditivo Binaural 🎧', desc: 'Audiometría tonal orientada a frecuencias críticas y umbrales.', archivo: 'audicion.html' },
            { id: 'mod11', nombre: '11. Atención Sostenida (CPT) 🧠', desc: 'Test de vigilancia y estabilidad atencional para prevención de micro-sueños.', archivo: 'fatiga.html' },
            { id: 'mod12', nombre: '12. Test de Fatiga (Karolinska) 😴', desc: 'Nivel de alerta y somnolencia en ruta para operadores de turno.', archivo: 'carga_dual.html' },
            { id: 'mod13', nombre: '13. Palancas Bimanual 🎮', desc: 'Coordinación motriz fina bilateral y disociación de mandos independientes.', archivo: 'punteo_transporte.html' },
            { id: 'mod14', nombre: '14. Memoria de Trabajo Operativa 🧩', desc: 'Retención de secuencias lógicas e instrucciones operativas complejas.', archivo: 'memoria_trabajo.html' },
            { id: 'mod15', nombre: '15. Frenado Selectivo 🛑', desc: 'Precisión de frenado bajo presión de tiempo y control inhibitorio.', archivo: 'reactimetro.html' },
            { id: 'mod16', nombre: '16. Control de Impulsos Viales ⚖️', desc: 'Detección conductual de perfiles de riesgo y temperamento al volante.', archivo: 'micro-fit.html' },
            { id: 'mod17', nombre: '17. Declaración Médica 📋', desc: 'Declaración jurada digital de aptitud física (Art. 36 D.S. N° 170).', archivo: 'declaracion_medica.html' },
            { id: 'mod18', nombre: 'M1. Estabilidad Vestibular (Romberg Pro) ⚖️', desc: 'Prueba estática vestibular de 20s con acelerómetro y aviso sonoro.', archivo: 'medico_pro/01_romberg.html' },
            { id: 'mod19', nombre: 'M2. Estabilidad Motora (Temblores Pro) ✋', desc: 'Control de micro-oscilaciones y pulso estacionario durante 20s.', archivo: 'medico_pro/02_temblores.html' },
            { id: 'mod20', nombre: 'M3. Dinamometría y Fuerza (Grip Pro) ✊', desc: 'Fuerza isométrica y prehensión sostenida por 20s en pantalla táctil.', archivo: 'medico_pro/03_grip.html' },
            { id: 'mod21', nombre: 'M4. Frecuencia Cardíaca Basal (PPG Pro) 💓', desc: 'Pletismografía óptica y análisis de flujo pulsátil durante 20s.', archivo: 'medico_pro/04_ppg.html' },
            { id: 'mod22', nombre: 'M5. Reflejo Fotomotor Pupilar Pro 👁️', desc: 'Seguimiento facial fino con MediaPipe y alerta por inatención.', archivo: 'medico_pro/05_pupilar.html' },
            { id: 'mod23', nombre: 'M6. Espirometría Ocupacional Pro 🫁', desc: 'Screening de flujo respiratorio por micrófono integrado durante 20s.', archivo: 'medico_pro/06_espirometria.html' },
            { id: 'mod24', nombre: 'M7. Agilidad y Praxias Digitales (Tapping) ⚡', desc: 'Velocidad de ejecución rítmica continua por 20s.', archivo: 'medico_pro/07_tapping.html' },
            { id: 'mod25', nombre: 'M8. Reacción a Alarma de Faena 🚨', desc: 'Tamizaje auditivo de emergencia y tiempo de respuesta acústica.', archivo: 'medico_pro/08_auditivo.html' },
            { id: 'mod26', nombre: 'M9. Estabilidad Oculomotriz (Nistagmo) 🔄', desc: 'Seguimiento ocular de punto móvil y control de sacadas.', archivo: 'medico_pro/09_nistagmo.html' },
            { id: 'mod27', nombre: 'M10. Tamizaje de Somnolencia Pro 😴', desc: 'Detección de fatiga, vigilancia y apertura ocular prolongada.', archivo: 'medico_pro/10_somnolencia.html' }
        ];

        function renderizarMenuB2B() {
            const bolsaActivaStr = localStorage.getItem('sensometrika_modulos_b2b_activos') || 'mod1,mod2,mod3,mod6,mod10,mod18,mod19,mod20,mod21,mod22,mod23,mod24,mod25,mod26,mod27';
            const bolsaActivaArray = bolsaActivaStr.split(',').map(m => m.trim().toLowerCase());

            const paramsObj = { rut: rawRut, nombre: nombreUsuario, cargo: cargoUsuario, plan: planContratado, session: sessionId, mode: 'b2b' };
            const queryParamsString = new URLSearchParams(paramsObj).toString();

            const contenedor = document.getElementById('contenedorModulosB2B');
            contenedor.innerHTML = '';

            catModulos17.forEach(mod => {
                const estaSolicitado = bolsaActivaArray.includes(mod.id.toLowerCase());
                const rendido = verifRendidoRut(mod.id);

                let accionHtml = '';
                if (!estaSolicitado) {
                    accionHtml = `<span class="badge-mod-nosol">NO SOLICITADO</span>`;
                } else if (rendido) {
                    accionHtml = `<span class="badge-mod-ok">✓ COMPLETADO</span>`;
                } else {
                    accionHtml = `<a href="${mod.archivo}?${queryParamsString}" class="btn-mod-start">INICIAR →</a>`;
                }

                const card = document.createElement('div');
                card.className = 'mod-item';
                card.innerHTML = `
                    <div class="mod-info">
                        <span class="mod-title" style="color: ${estaSolicitado ? '#f8fafc' : '#64748b'};">${mod.nombre}</span>
                        <span class="mod-desc">${mod.desc}</span>
                    </div>
                    <div>${accionHtml}</div>
                `;
                contenedor.appendChild(card);
            });
        }

        function abrirInformePericial() {
            const params = new URLSearchParams({ rut: rawRut, nombre: nombreUsuario, cargo: cargoUsuario, plan: planContratado, session: sessionId, mode: 'b2b' });
            window.location.href = `informe_b2b.html?${params.toString()}`;
        }

        document.addEventListener('DOMContentLoaded', renderizarMenuB2B);
    </script>
</body>
</html>
