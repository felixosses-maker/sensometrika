<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Menú Oficial Corporativo B2B</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #040810;
      --card-bg: #091120;
      --card-border: #132238;
      --accent-cyan: #00bfff;
      --accent-cyan-glow: rgba(0, 191, 255, 0.3);
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-bottom: 30px;
    }

    .brand-logo-img {
      width: 160px;
      height: auto;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 10px var(--accent-cyan-glow));
      margin-top: 10px;
    }

    .header-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .user-avatar-small {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      margin: 0 auto;
    }

    /* PESTAÑAS DE NAVEGACIÓN B2B */
    .tabs-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .tab-btn {
      background: #0c182e;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }

    .section-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .module-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .module-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 70%;
    }

    .module-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .module-desc {
      font-size: 0.65rem;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .btn-module {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.7rem;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 2px 10px var(--accent-cyan-glow);
    }

    .btn-module.completed {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
      box-shadow: none;
    }

    .btn-action-main {
      background: #d97706;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.82rem;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
      display: block;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <img src="../sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">

    <!-- ENCABEZADO DE USUARIO -->
    <div class="header-card">
      <img id="imgAvatar" src="../sensometrica.jpg" alt="Evaluado" class="user-avatar-small" onerror="this.src='../sensometrica.jpg'">
      <div>
        <span style="font-size: 0.65rem; color: var(--accent-cyan); font-weight: 800; text-transform: uppercase;">EVALUACIÓN B2B • PANEL CORPORATIVO</span>
        <h3 id="lblNombreEvaluado" style="font-size: 0.95rem; font-weight: 900; color: #fff; margin-top: 2px;">CARGANDO TRABAJADOR...</h3>
        <p id="lblRutCargo" style="font-size: 0.7rem; color: var(--text-muted); margin-top: 2px;">RUT: -- | Cargo: --</p>
      </div>
    </div>

    <!-- PESTAÑAS DE CAMBIO DE VISTA B2B -->
    <div class="tabs-container">
      <button id="tabVial" class="tab-btn active" onclick="cambiarVistaB2B('vial')">🏎️ Psicosensométricos (Vial)</button>
      <button id="tabFaena" class="tab-btn" onclick="cambiarVistaB2B('faena')">🩺 Check Médico Faena</button>
    </div>

    <!-- CONTENEDOR GRUPO VIAL -->
    <div id="grupoVial" class="section-group">
      <!-- Se inyectan módulos viales -->
    </div>

    <!-- CONTENEDOR GRUPO FAENA (M1 a M10) -->
    <div id="grupoFaena" class="section-group" style="display: none;">
      <!-- Se inyectan módulos médicos M1 a M10 -->
    </div>

    <!-- BOTÓN INFORME FINAL -->
    <a href="informe_faena.html" id="btnInformeFaena" class="btn-action-main">
      VER CHECK-IN CLÍNICO DE FAENA →
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let datosUsuario = {};
    try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch(e){}

    const rawNombre = urlParams.get('nombre') || datosUsuario.nombre || localStorage.getItem('sensometrika_nombre') || 'YONY ME LAS LAVO';
    const rawRut = urlParams.get('rut') || datosUsuario.rut || localStorage.getItem('sensometrika_rut') || '60003211';
    const rawCargo = urlParams.get('cargo') || datosUsuario.cargo || localStorage.getItem('sensometrika_cargo') || 'Operador Harvester';
    const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_B2B_MF_${rawRut}_${Date.now()}`;
    const cleanRut = rawRut.replace(/[^0-9Kk]/g, '');

    document.getElementById('lblNombreEvaluado').textContent = decodeURIComponent(rawNombre).toUpperCase();
    document.getElementById('lblRutCargo').textContent = `RUT: ${rawRut} | Cargo: ${decodeURIComponent(rawCargo)}`;

    const fotoGuardada = localStorage.getItem(`sensometrika_foto_${cleanRut}_${sessionId}`) || localStorage.getItem(`sensometrika_foto_${cleanRut}`);
    if (fotoGuardada && fotoGuardada.length > 50) {
      document.getElementById('imgAvatar').src = fotoGuardada;
    }

    // MÓDULOS PSICOSENSOMÉTRICOS (VIAL)
    const modulosVial = [
      { id: 'v1', key: 'reactimetro', title: 'Reactímetro de Freno 🎯', desc: 'Medición de tiempo de reacción ante estímulo visual.', archivo: 'reactimetro.html' },
      { id: 'v2', key: 'palancas', title: 'Coordinación Bimanual (Palancas) 🕹️', desc: 'Control de trayectoria en pista sinuosa.', archivo: 'palancas.html' },
      { id: 'v3', key: 'punteo', title: 'Test de Punteo (Lahy) ⚡', desc: 'Sincronización rítmica y precisión de impactos.', archivo: 'punteo.html' }
    ];

    // MÓDULOS CHECK-IN FAENA (M1 a M10)
    const modulosFaena = [
      { id: 'mod18', key: 'romberg', title: 'M1. Estabilidad Vestibular (Romberg) ⚖️', desc: 'Control postural con telemetría de distancia.', archivo: '01_romberg.html' },
      { id: 'mod19', key: 'temblores', title: 'M2. Estabilidad Motora (Temblores) ✋', desc: 'Micro-oscilación y control motor fino.', archivo: '02_temblores.html' },
      { id: 'mod20', key: 'grip', title: 'M3. Dinamometría y Fuerza (Grip) ✊', desc: 'Fuerza de prensión y simetría bilateral.', archivo: '03_grip.html' },
      { id: 'mod21', key: 'ppg', title: 'M4. Frecuencia Cardíaca Basal (PPG) 💓', desc: 'Pletismografía óptica y flujo pulsátil.', archivo: '04_ppg.html' },
      { id: 'mod22', key: 'pupilar', title: 'M5. Reflejo Fotomotor Pupilar 👁️', desc: 'Auditoría biométrica visual y parpadeos.', archivo: '05_pupilar.html' },
      { id: 'mod23', key: 'espirometria', title: 'M6. Espirometría Ocupacional Pro 🫁', desc: 'Screening de flujo respiratorio por micrófono.', archivo: '06_espirometria.html' },
      { id: 'mod24', key: 'tapping', title: 'M7. Agilidad y Praxias (Tapping) ⚡', desc: 'Velocidad de ejecución rítmica continua.', archivo: '07_tapping.html' },
      { id: 'mod25', key: 'auditivo', title: 'M8. Reacción a Alarma de Faena 🚨', desc: 'Tamizaje auditivo y respuesta acústica.', archivo: '08_auditivo.html' },
      { id: 'mod26', key: 'nistagmo', title: 'M9. Estabilidad Oculomotriz (Nistagmo) 🔄', desc: 'Seguimiento ocular y control de giros.', archivo: '09_nistagmo.html' },
      { id: 'mod27', key: 'somnolencia', title: 'M10. Tamizaje de Somnolencia Pro 😴', desc: 'Detección de fatiga y vigilancia prolongada.', archivo: '10_somnolencia.html' }
    ];

    function renderizarModulos() {
      // 1. Renderizar Vial
      const contVial = document.getElementById('grupoVial');
      contVial.innerHTML = '';
      modulosVial.forEach(m => {
        const rendido = localStorage.getItem(`medico_${m.key}_${cleanRut}_${sessionId}`) === 'true';
        const card = document.createElement('div');
        card.className = 'module-card';
        card.innerHTML = `
          <div class="module-info">
            <span class="module-title">${m.title}</span>
            <span class="module-desc">${m.desc}</span>
          </div>
          <a href="${m.archivo}?${urlParams.toString()}" class="btn-module ${rendido ? 'completed' : ''}">
            ${rendido ? '✓ COMPLETADO' : 'INICIAR →'}
          </a>
        `;
        contVial.appendChild(card);
      });

      // 2. Renderizar Faena (Forzando carga completa M1 a M10)
      const contFaena = document.getElementById('grupoFaena');
      contFaena.innerHTML = '';
      
      modulosFaena.forEach(m => {
        const rendido = (localStorage.getItem(`medico_${m.key}_${cleanRut}_${sessionId}`) === 'true') ||
                        (localStorage.getItem(`sensometrika_espirometria_${cleanRut}_${sessionId}`) === 'true' && m.key === 'espirometria') ||
                        (localStorage.getItem(`sensometrika_${m.key}_${cleanRut}_${sessionId}`) === 'true');

        const card = document.createElement('div');
        card.className = 'module-card';
        card.innerHTML = `
          <div class="module-info">
            <span class="module-title">${m.title}</span>
            <span class="module-desc">${m.desc}</span>
          </div>
          <a href="${m.archivo}?${urlParams.toString()}" class="btn-module ${rendido ? 'completed' : ''}">
            ${rendido ? '✓ COMPLETADO' : 'INICIAR →'}
          </a>
        `;
        contFaena.appendChild(card);
      });
    }

    function cambiarVistaB2B(vista) {
      const tabVial = document.getElementById('tabVial');
      const tabFaena = document.getElementById('tabFaena');
      const grupoVial = document.getElementById('grupoVial');
      const grupoFaena = document.getElementById('grupoFaena');

      if (vista === 'vial') {
        tabVial.classList.add('active');
        tabFaena.classList.remove('active');
        grupoVial.style.display = 'flex';
        grupoFaena.style.display = 'none';
      } else {
        tabFaena.classList.add('active');
        tabVial.classList.remove('active');
        grupoFaena.style.display = 'flex';
        grupoVial.style.display = 'none';
      }
    }

    document.getElementById('btnInformeFaena').href = `informe_faena.html?${urlParams.toString()}`;
    renderizarModulos();
  </script>
</body>
</html>
