<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Menú Oficial Corporativo B2B</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #040810;
      --card-bg: #091120;
      --card-border: #132238;
      --accent-cyan: #00bfff;
      --accent-cyan-glow: rgba(0, 191, 255, 0.3);
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-bottom: 30px;
    }

    .brand-logo-img {
      width: 160px;
      height: auto;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 10px var(--accent-cyan-glow));
      margin-top: 10px;
    }

    .header-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .user-avatar-small {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      margin: 0 auto;
    }

    /* PESTAÑAS B2B */
    .tabs-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .tab-btn {
      background: #0c182e;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }

    .section-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .module-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .module-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 70%;
    }

    .module-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .module-desc {
      font-size: 0.62rem;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .btn-module {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.7rem;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 2px 10px var(--accent-cyan-glow);
    }

    .btn-module.completed {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
      box-shadow: none;
    }

    .btn-action-main {
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.78rem;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      display: block;
      margin-top: 6px;
    }

    .btn-action-faena {
      background: #d97706;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <img src="../sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img" onerror="this.style.display='none'">

    <!-- ENCABEZADO DE USUARIO -->
    <div class="header-card">
      <img id="imgAvatar" src="../sensometrica.jpg" alt="Evaluado" class="user-avatar-small" onerror="this.src='../sensometrica.jpg'">
      <div>
        <span style="font-size: 0.65rem; color: var(--accent-cyan); font-weight: 800; text-transform: uppercase;">EVALUACIÓN B2B • PLAN PERSONALIZADO</span>
        <h3 id="lblNombreEvaluado" style="font-size: 0.95rem; font-weight: 900; color: #fff; margin-top: 2px;">CARGANDO TRABAJADOR...</h3>
        <p id="lblRutCargo" style="font-size: 0.7rem; color: var(--text-muted); margin-top: 2px;">RUT: -- | Cargo: --</p>
      </div>
    </div>

    <!-- PESTAÑAS DE NAVEGACIÓN -->
    <div class="tabs-container">
      <button id="tabVial" class="tab-btn active" onclick="cambiarVistaB2B('vial')">🏎️ PSICOSENSOMÉTRICOS (VIAL)</button>
      <button id="tabFaena" class="tab-btn" onclick="cambiarVistaB2B('faena')">🩺 CHECK MÉDICO FAENA</button>
    </div>

    <!-- CONTENEDOR GRUPO VIAL (20 MÓDULOS) -->
    <div id="grupoVial" class="section-group">
      <!-- Se inyectan dinámicamente -->
    </div>

    <!-- CONTENEDOR GRUPO FAENA (M1 A M10) -->
    <div id="grupoFaena" class="section-group" style="display: none;">
      <!-- Se inyectan dinámicamente -->
    </div>

    <!-- BOTÓN INFORME DINÁMICO -->
    <a href="informe_b2b.html" id="btnInformeFinal" class="btn-action-main">
      VER INFORME PERICIAL B2B (VIAL) →
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let datosUsuario = {};
    try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch(e){}

    const rawNombre = urlParams.get('nombre') || datosUsuario.nombre || localStorage.getItem('sensometrika_nombre') || 'YONY ME LAS LAVO';
    const rawRut = urlParams.get('rut') || datosUsuario.rut || localStorage.getItem('sensometrika_rut') || '60003211';
    const rawCargo = urlParams.get('cargo') || datosUsuario.cargo || localStorage.getItem('sensometrika_cargo') || 'Operador Harvester';
    const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_B2B_MF_${rawRut}_${Date.now()}`;
    const cleanRut = rawRut.replace(/[^0-9Kk]/g, '');

    document.getElementById('lblNombreEvaluado').textContent = decodeURIComponent(rawNombre).toUpperCase();
    document.getElementById('lblRutCargo').textContent = `RUT: ${rawRut} | Cargo: ${decodeURIComponent(rawCargo)}`;

    const fotoGuardada = localStorage.getItem(`sensometrika_foto_${cleanRut}_${sessionId}`) || localStorage.getItem(`sensometrika_foto_${cleanRut}`);
    if (fotoGuardada && fotoGuardada.length > 50) {
      document.getElementById('imgAvatar').src = fotoGuardada;
    }

    // 1. LOS 20 MÓDULOS PSICOSENSOMÉTRICOS (VIAL) OFICIALES
    const modulosVial = [
      { key: 'anticipacion', title: '1. Anticipación Pro ⏱️', desc: 'Cálculo de velocidad y frenado en móvil virtual.', archivo: '../anticipacion.html' },
      { key: 'reactimetro', title: '2. Reactímetro Simple ⚡', desc: 'Tiempo de respuesta lumínica y acústica.', archivo: '../reactimetro.html' },
      { key: 'punteo', title: '3. Punteo Viso-Motriz 🎯', desc: 'Coordinación óculo-manual en trayectorias.', archivo: '../punteo.html' },
      { key: 'palancas', title: '4. Test de Palancas Bimanual 🕹️', desc: 'Control psicomotor bilateral independiente.', archivo: '../palancas.html' },
      { key: 'visual', title: '5. Tamizaje Visual (Snellen) 👁️', desc: 'Evaluación de agudeza visual lejana/cercana.', archivo: '../visual.html' },
      { key: 'periferico', title: '6. Campo Periférico 👁️‍🗨️', desc: 'Detección de estímulos laterales de alerta.', archivo: '../campo_periferico.html' },
      { key: 'estereopsis', title: '7. Estereopsis (Profundidad) 📐', desc: 'Percepción tridimensional y distancias.', archivo: '../estereopsis.html' },
      { key: 'encandilamiento', title: '8. Encandilamiento & Recuperación 💡', desc: 'Tiempo de adaptación visual post-destello.', archivo: '../demo_encandilamiento_pro.html' },
      { key: 'auditivo', title: '9. Tamizaje Auditivo Ocupacional 🔊', desc: 'Umbrales en frecuencias conversacionales.', archivo: '../audicion.html' },
      { key: 'cargadual', title: '10. Test de Carga Dual 🔀', desc: 'Ejecución simultánea cognitiva y motora.', archivo: '../carga_dual.html' },
      { key: 'memoria', title: '11. Memoria de Trabajo Operativa 🧩', desc: 'Retención y procesamiento de secuencias.', archivo: '../memoria_trabajo.html' },
      { key: 'fatiga', title: '12. Fatiga y Vigilancia (PVT) 😴', desc: 'Detección de microsueños y atención.', archivo: '../fatiga.html' },
      { key: 'visomotriz', title: '13. Visomotriz Avanzada 🚗', desc: 'Precisión de frenado en pista virtual.', archivo: '../demo_visomotriz_pro.html' },
      { key: 'atencion', title: '14. Atención Sostenida (CPT) 🧠', desc: 'Estabilidad de concentración continua.', archivo: '../atencion.html' },
      { key: 'ishihara', title: '15. Discriminación Colores 🎨', desc: 'Test Ishihara para señales viales.', archivo: '../ishihara.html' },
      { key: 'reaccion_compleja', title: '16. Reacción Compleja Múltiple ⚡', desc: 'Toma de decisiones bajo estímulo cruzado.', archivo: '../reaccion_compleja.html' },
      { key: 'emocional', title: '17. Estabilidad Emocional (Foz) 🧠', desc: 'Tamizaje conductual ante presión.', archivo: '../emocional.html' },
      { key: 'dinamica', title: '18. Coordinación Dinámica 🔄', desc: 'Ritmo y agilidad psicomotriz global.', archivo: '../dinamica.html' },
      { key: 'tapping', title: '19. Agilidad Digital (Tapping) ⚡', desc: 'Velocidad motora fina en milisegundos.', archivo: '../tapping.html' },
      { key: 'monotonia', title: '20. Tolerancia a la Monotonía 🛑', desc: 'Resistencia al letargo operativo.', archivo: '../monotonia.html' }
    ];

    // 2. LOS 10 MÓDULOS DE CHECK-IN FAENA (M1 A M10)
    const modulosFaena = [
      { key: 'romberg', title: 'M1. Estabilidad Vestibular (Romberg Pro) ⚖️', desc: 'Prueba estática vestibular de 20s con acelerómetro.', archivo: '01_romberg.html' },
      { key: 'temblores', title: 'M2. Estabilidad Motora (Temblores Pro) ✋', desc: 'Control de micro-oscilaciones y pulso estacionario.', archivo: '02_temblores.html' },
      { key: 'grip', title: 'M3. Dinamometría y Fuerza (Grip Pro) ✊', desc: 'Fuerza isométrica y prehensión sostenida por 20s.', archivo: '03_grip.html' },
      { key: 'ppg', title: 'M4. Frecuencia Cardíaca Basal (PPG Pro) 💓', desc: 'Pletismografía óptica y análisis de flujo pulsátil.', archivo: '04_ppg.html' },
      { key: 'pupilar', title: 'M5. Reflejo Fotomotor Pupilar Pro 👁️', desc: 'Seguimiento facial fino con MediaPipe.', archivo: '05_pupilar.html' },
      { key: 'espirometria', title: 'M6. Espirometría Ocupacional Pro 🫁', desc: 'Screening de flujo respiratorio por micrófono.', archivo: '06_espirometria.html' },
      { key: 'tapping', title: 'M7. Agilidad y Praxias Digitales (Tapping) ⚡', desc: 'Velocidad de ejecución rítmica continua por 20s.', archivo: '07_tapping.html' },
      { key: 'auditivo_faena', title: 'M8. Reacción a Alarma de Faena 🚨', desc: 'Tamizaje auditivo de emergencia y respuesta.', archivo: '08_auditivo.html' },
      { key: 'nistagmo', title: 'M9. Estabilidad Oculomotriz (Nistagmo) 🔄', desc: 'Seguimiento ocular del punto móvil y sacadas.', archivo: '09_nistagmo.html' },
      { key: 'somnolencia', title: 'M10. Tamizaje de Somnolencia Pro 😴', desc: 'Detección de fatiga y vigilancia prolongada.', archivo: '10_somnolencia.html' }
    ];

    function renderizarModulos() {
      // Renderizar Vial
      const contVial = document.getElementById('grupoVial');
      contVial.innerHTML = '';
      modulosVial.forEach(m => {
        const rendido = localStorage.getItem(`medico_${m.key}_${cleanRut}_${sessionId}`) === 'true' ||
                        localStorage.getItem(`sensometrika_${m.key}_${cleanRut}_${sessionId}`) === 'true';
        const card = document.createElement('div');
        card.className = 'module-card';
        card.innerHTML = `
          <div class="module-info">
            <span class="module-title">${m.title}</span>
            <span class="module-desc">${m.desc}</span>
          </div>
          <a href="${m.archivo}?${urlParams.toString()}" class="btn-module ${rendido ? 'completed' : ''}">
            ${rendido ? '✓ COMPLETADO' : 'INICIAR →'}
          </a>
        `;
        contVial.appendChild(card);
      });

      // Renderizar Faena
      const contFaena = document.getElementById('grupoFaena');
      contFaena.innerHTML = '';
      modulosFaena.forEach(m => {
        const rendido = localStorage.getItem(`medico_${m.key}_${cleanRut}_${sessionId}`) === 'true' ||
                        localStorage.getItem(`sensometrika_${m.key}_${sessionId}`) === 'true' ||
                        (localStorage.getItem(`sensometrika_espirometria_${cleanRut}_${sessionId}`) === 'true' && m.key === 'espirometria');
        const card = document.createElement('div');
        card.className = 'module-card';
        card.innerHTML = `
          <div class="module-info">
            <span class="module-title">${m.title}</span>
            <span class="module-desc">${m.desc}</span>
          </div>
          <a href="${m.archivo}?${urlParams.toString()}" class="btn-module ${rendido ? 'completed' : ''}">
            ${rendido ? '✓ COMPLETADO' : 'INICIAR →'}
          </a>
        `;
        contFaena.appendChild(card);
      });
    }

    function cambiarVistaB2B(vista) {
      const tabVial = document.getElementById('tabVial');
      const tabFaena = document.getElementById('tabFaena');
      const grupoVial = document.getElementById('grupoVial');
      const grupoFaena = document.getElementById('grupoFaena');
      const btnInforme = document.getElementById('btnInformeFinal');

      if (vista === 'vial') {
        tabVial.classList.add('active');
        tabFaena.classList.remove('active');
        grupoVial.style.display = 'flex';
        grupoFaena.style.display = 'none';
        btnInforme.className = 'btn-action-main';
        btnInforme.textContent = "VER INFORME PERICIAL B2B (VIAL) →";
        btnInforme.href = `informe_b2b.html?${urlParams.toString()}`;
      } else {
        tabFaena.classList.add('active');
        tabVial.classList.remove('active');
        grupoFaena.style.display = 'flex';
        grupoVial.style.display = 'none';
        btnInforme.className = 'btn-action-main btn-action-faena';
        btnInforme.textContent = "VER CHECK-IN CLÍNICO DE FAENA →";
        btnInforme.href = `informe_faena.html?${urlParams.toString()}`;
      }
    }

    renderizarModulos();
    cambiarVistaB2B('vial');
  </script>
</body>
</html>
