<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Menú B2B Corporativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-btn: #0284c7;
            --blue-btn-border: #0369a1;
            --accent-cyan: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 4px 0 8px 0;
            width: 100%;
        }

        .brand-logo-img {
            width: 185px;
            height: auto;
            display: block;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .brand-subtitle {
            color: var(--accent-cyan);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .eval-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .user-header-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-plan-title {
            color: #38bdf8;
            font-size: 0.82rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .user-info-text {
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .modules-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .mod-item {
            background-color: #070d17;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .mod-info { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .mod-title { font-size: 0.85rem; font-weight: 800; color: #f8fafc; }
        .mod-desc { font-size: 0.68rem; color: #64748b; line-height: 1.3; }

        .btn-mod-start {
            background-color: var(--blue-btn);
            border: 1px solid var(--blue-btn-border);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-mod-ok {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .badge-mod-nosol {
            background: rgba(100, 116, 139, 0.12);
            border: 1px solid rgba(100, 116, 139, 0.3);
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.70rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-informe {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 900;
            font-size: 0.90rem;
            text-align: center;
            text-decoration: none;
            width: 100%;
            display: block;
            margin-top: 6px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span class="brand-subtitle">EVALUACIÓN B2B • ACCESO CORPORATIVO</span>
        </header>

        <div class="eval-card">
            <div class="user-header-box">
                <div class="user-plan-title" id="lblPlanHeader">EVALUACIÓN B2B • PLAN PERSONALIZADO</div>
                <div class="user-info-text" id="lblUserData">EVALUADO: CARGANDO... | RUT: --</div>
            </div>

            <div class="modules-list" id="contenedorModulosB2B">
                <!-- Se inyecta dinámicamente según la selección de la consola -->
            </div>

            <button type="button" id="btnVerInforme" class="btn-informe" onclick="abrirInformePericial()">VER INFORME PERICIAL B2B →</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let datosUsuario = {};
        try { datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {}; } catch(e){}

        const planContratado = (urlParams.get('plan') || localStorage.getItem('sensometrika_plan_contratado') || 'B2B_PERSONALIZADO').toUpperCase().trim();
        const modulosUrl = urlParams.get('modulos');
        if (modulosUrl) { localStorage.setItem('sensometrika_modulos_b2b_activos', modulosUrl); }

        const rawRut = urlParams.get('rut') || datosUsuario.rut || '12.345.678-K';
        const cleanRut = rawRut.replace(/[^0-9Kk]/g, '');
        const nombreUsuario = urlParams.get('nombre') || datosUsuario.nombre || 'TRABAJADOR EVALUADO';
        const sessionId = urlParams.get('session') || localStorage.getItem('sensometrika_session_activa') || `SESION_${cleanRut}_${Date.now()}`;
        
        localStorage.setItem('sensometrika_session_activa', sessionId);
        document.getElementById('lblUserData').textContent = `EVALUADO: ${decodeURIComponent(nombreUsuario).toUpperCase()} | RUT: ${rawRut}`;
        document.getElementById('lblPlanHeader').textContent = `EVALUACIÓN B2B • PLAN ${planContratado.replace(/_/g, ' ')}`;

        function verifRendidoRut(moduloKey) {
            if (!cleanRut) return false;
            const claveSesion = `sensometrika_historial_${moduloKey}_${cleanRut}_${sessionId}`;
            if (localStorage.getItem(claveSesion)) return true;
            if (localStorage.getItem(`${moduloKey}_demo_completada_${cleanRut}_${sessionId}`) === 'true') return true;
            return false;
        }

        const catModulos = [
            { id: 'reactimetro', nombre: '1. Reactímetro (Tiempo Frenado) ⚡', desc: 'Medición de velocidad de respuesta en frenado.', archivo: 'reactimetro.html' },
            { id: 'palancas', nombre: '2. Palancas (Coordinación Bimanual) 🎮', desc: 'Coordinación motriz fina con ambas manos en ruta.', archivo: 'palancas.html' },
            { id: 'punteo', nombre: '3. Punteo (Ritmo Viso-Motriz) 🎯', desc: 'Estabilidad de ritmo y precisión de impacto.', archivo: 'punteo.html' },
            { id: 'auditivo', nombre: '4. Tamizaje Auditivo Ocupacional 🎧', desc: 'Audiometría tonal en frecuencias críticas para faena.', archivo: 'audicion.html' },
            { id: 'visual', nombre: '5. Tamizaje Visual Integral 👁️', desc: 'Agudeza visual y discriminación de color.', archivo: 'visual.html' },
            { id: 'anticipacion', nombre: '6. Velocidad de Anticipación 🚗', desc: 'Estimación de velocidad y trayectoria ciega.', archivo: 'anticipacion.html' },
            { id: 'estereopsis', nombre: '7. Estereopsis y Profundidad 3D 📐', desc: 'Percepción espacial binocular.', archivo: 'demo_estereopsis_pro.html' },
            { id: 'fatiga', nombre: '8. Test de Fatiga (PVT) ⏱️', desc: 'Medición de somnolencia y micro-sueños.', archivo: 'demo_fatiga_pro.html' }
        ];

        function renderizarMenuB2B() {
            const bolsaActivaStr = localStorage.getItem('sensometrika_modulos_b2b_activos') || 'reactimetro,palancas,punteo,auditivo,visual,anticipacion';
            const bolsaActivaArray = bolsaActivaStr.split(',').map(m => m.trim().toLowerCase());

            const paramsObj = { rut: rawRut, nombre: nombreUsuario, plan: planContratado, session: sessionId, mode: 'b2b' };
            if (modulosUrl) paramsObj.modulos = modulosUrl;
            const queryParamsString = new URLSearchParams(paramsObj).toString();

            const contenedor = document.getElementById('contenedorModulosB2B');
            contenedor.innerHTML = '';

            catModulos.forEach(mod => {
                const estaSolicitado = bolsaActivaArray.includes(mod.id) || bolsaActivaArray.includes('todos');
                const rendido = verifRendidoRut(mod.id);

                let accionHtml = '';
                if (!estaSolicitado) {
                    accionHtml = `<span class="badge-mod-nosol">NO SOLICITADO</span>`;
                } else if (rendido) {
                    accionHtml = `<span class="badge-mod-ok">✓ REGISTRADO</span>`;
                } else {
                    accionHtml = `<a href="${mod.archivo}?${queryParamsString}" class="btn-mod-start">INICIAR →</a>`;
                }

                const card = document.createElement('div');
                card.className = 'mod-item';
                card.innerHTML = `
                    <div class="mod-info">
                        <span class="mod-title" style="color: ${estaSolicitado ? '#f8fafc' : '#64748b'};">${mod.nombre}</span>
                        <span class="mod-desc">${mod.desc}</span>
                    </div>
                    <div>${accionHtml}</div>
                `;
                contenedor.appendChild(card);
            });
        }

        function abrirInformePericial() {
            const params = new URLSearchParams({ rut: rawRut, nombre: nombreUsuario, plan: planContratado, session: sessionId, mode: 'b2b' });
            if (modulosUrl) params.set('modulos', modulosUrl);
            window.location.href = `informe_b2b.html?${params.toString()}`;
        }

        document.addEventListener('DOMContentLoaded', renderizarMenuB2B);
    </script>
</body>
</html>
