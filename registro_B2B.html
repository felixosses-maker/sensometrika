<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSOMETRIKA | Registro Corporativo B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --card-bg: #0b1320;
            --card-border: #1a2638;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-logo-img {
            width: 190px;
            height: auto;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .form-group input {
            background: #080d17;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.90rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="brand-header">
            <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
            <span style="color: var(--accent-cyan); font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;">
                REGISTRO CORPORATIVO B2B
            </span>
        </header>

        <div class="card-box">
            <div class="card-title">📊 Plan Corporativo Seleccionado</div>
            <div style="font-size: 0.85rem; line-height: 1.4;">
                <strong style="color: #fff; display: block;">Plan Básico Laboral</strong>
                <span style="color: var(--text-muted); font-size: 0.75rem;">Bolsa de 10 Evaluaciones Unidades • D.S. N° 170</span>
            </div>
        </div>

        <div class="card-box">
            <div class="card-title">📝 Datos de Facturación y Administración APR</div>
            <form id="formB2B" onsubmit="confirmarYIrADashboard(event)">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="form-group">
                        <label>RUT Empresa / Razón Social *</label>
                        <input type="text" id="inputRutEmpresa" value="76.123.435-1" required>
                    </div>

                    <div class="form-group">
                        <label>Nombre Fantasía / Empresa *</label>
                        <input type="text" id="inputRazonSocial" value="Minerales" required>
                    </div>

                    <div class="form-group">
                        <label>Nombre del Encargado / Prevencionista (APR) *</label>
                        <input type="text" id="inputEncargado" value="Raul Hernandez" required>
                    </div>

                    <div class="form-group">
                        <label>Correo para Despacho de Informes *</label>
                        <input type="email" id="inputCorreo" value="felix.osses@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label>Teléfono de Contacto</label>
                        <input type="text" id="inputTelefono" value="+56998846813">
                    </div>

                    <button type="submit" class="btn-submit">
                        IR AL DASHBOARD APR Y GENERAR LINKS →
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function confirmarYIrADashboard(e) {
            e.preventDefault();

            // Limpiar datos previos de trabajador
            localStorage.removeItem('sensometrika_modulos_rendidos');
            localStorage.removeItem('sensometrika_session_burned');
            localStorage.removeItem('sensometrika_datos_usuario');

            const rutEmpresa = document.getElementById('inputRutEmpresa').value.trim();
            const razonSocial = document.getElementById('inputRazonSocial').value.trim();
            const encargado = document.getElementById('inputEncargado').value.trim();
            const correo = document.getElementById('inputCorreo').value.trim();

            const tokenB2B = 'B2B-SMK-' + Math.floor(1000 + Math.random() * 9000);

            const contratacion = {
                rutEmpresa: rutEmpresa,
                razonSocial: razonSocial,
                encargado: encargado,
                correo: correo,
                token: tokenB2B
            };

            localStorage.setItem('sensometrika_b2b_contratacion', JSON.stringify(contratacion));
            localStorage.setItem('sensometrika_b2b_token', tokenB2B);

            // REDIRECCIÓN A DASHBOARD-APR.HTML (CON GUION MEDIO)
            window.location.href = `dashboard-apr.html?token=${tokenB2B}`;
        }
    </script>
</body>
</html>
