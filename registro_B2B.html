<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensometrika B2B | Registro de Empresa</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111625;
      --card-border: #1e2638;
      --accent-cyan: #38bdf8;
      --accent-blue: #0284c7;
      --accent-green: #10b981;
      --text-white: #ffffff;
      --text-muted: #9aa0a6;
      --input-bg: #080d17;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 520px; margin: 0 auto; }

    .brand-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .brand-logo-img {
      width: 210px;
      max-width: 80%;
      height: auto;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
    }

    .brand-subtitle {
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .card-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .plan-summary-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .plan-title { font-size: 0.85rem; font-weight: 800; color: var(--accent-cyan); text-transform: uppercase; }
    .btn-change { color: var(--accent-cyan); background: none; border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-decoration: underline; }

    .plan-details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .plan-detail-item { display: flex; flex-direction: column; }
    .plan-detail-item span { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
    .plan-detail-item strong { font-size: 0.9rem; color: #fff; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--accent-cyan); }

    .btn-submit {
      width: 100%;
      background: var(--accent-cyan);
      color: #0b0f19;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      margin-top: 10px;
    }

    .btn-back-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="brand-header">
      <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
      <span class="brand-subtitle">REGISTRO CORPORATIVO B2B</span>
    </header>

    <!-- Resumen del Plan Seleccionado -->
    <div class="card-block">
      <div class="plan-summary-head">
        <span class="plan-title">📊 Plan Corporativo Seleccionado</span>
        <button class="btn-change" onclick="window.location.href='index.html'">CAMBIAR</button>
      </div>
      <div class="plan-details-grid">
        <div class="plan-detail-item">
          <span>Plan Contratado</span>
          <strong id="lblPlanNombre">Plan Básico Laboral</strong>
        </div>
        <div class="plan-detail-item">
          <span>Inversión Total</span>
          <strong id="lblInversion">$59.000 + IVA</strong>
        </div>
        <div class="plan-detail-item" style="grid-column: span 2; margin-top: 6px;">
          <span>Bolsa de Evaluaciones</span>
          <strong id="lblCantEval">10 Evaluaciones Unidades</strong>
        </div>
      </div>
    </div>

    <!-- Formulario de Facturación -->
    <form id="formRegistroB2B" onsubmit="guardarYActivarB2B(event)">
      <div class="card-block">
        <div style="font-size:0.8rem; font-weight:800; color:var(--accent-cyan); text-transform:uppercase; margin-bottom:14px; border-bottom:1px solid var(--card-border); padding-bottom:6px;">
          Datos de Facturación y Administración
        </div>

        <div class="form-group">
          <label>RUT Empresa / Razón Social *</label>
          <input type="text" id="rutEmpresa" class="form-control" placeholder="76.123.456-K" required>
        </div>

        <div class="form-group">
          <label>Nombre Fantasía / Empresa *</label>
          <input type="text" id="nombreEmpresa" class="form-control" placeholder="Ej. Minera o Constructora SpA" required>
        </div>

        <div class="form-group">
          <label>Nombre del Encargado / Prevencionista *</label>
          <input type="text" id="nombreEncargado" class="form-control" placeholder="Nombre y Apellido" required>
        </div>

        <div class="form-group">
          <label>Correo para Despacho de Informes *</label>
          <input type="email" id="correoDespacho" class="form-control" placeholder="supervisor@empresa.cl" required>
        </div>

        <div class="form-group">
          <label>Teléfono de Contacto</label>
          <input type="tel" id="telefonoContacto" class="form-control" placeholder="+56 9 1234 5678">
        </div>
      </div>

      <button type="submit" class="btn-submit">
        CONFIRMAR Y ACTIVAR BOLSA B2B →
      </button>
    </form>

    <a href="index.html" class="btn-back-link">← Volver al Menú de Planes B2B</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const plan = urlParams.get('plan') || 'basico';
      const cant = urlParams.get('cant') || '10';

      let planNombre = 'Plan Básico Laboral';
      let precioUnitario = 5900;

      if (plan === 'plus') { planNombre = 'Plan Plus B2B'; precioUnitario = 8900; }
      if (plan === 'full') { planNombre = 'Plan Full B2B'; precioUnitario = 12900; }

      const totalNeto = parseInt(cant) * precioUnitario;
      const totalTexto = `$${totalNeto.toLocaleString('es-CL')} + IVA`;

      document.getElementById('lblPlanNombre').innerText = planNombre;
      document.getElementById('lblCantEval').innerText = `${cant} Evaluaciones Unidades`;
      document.getElementById('lblInversion').innerText = totalTexto;

      // Guardar objeto de contratación en memoria
      const contratacionObj = {
        plan: planNombre,
        evaluacionesTotales: parseInt(cant),
        inversion: totalTexto
      };
      localStorage.setItem('sensometrika_b2b_contratacion', JSON.stringify(contratacionObj));
    });

    function guardarYActivarB2B(e) {
      e.preventDefault();

      const rutEmp = document.getElementById('rutEmpresa').value.trim();
      const nomEmp = document.getElementById('nombreEmpresa').value.trim();
      const tokenB2B = 'B2B-' + Math.random().toString(36).substring(2, 9).toUpperCase();

      localStorage.setItem('sensometrika_b2b_mode', 'true');
      localStorage.setItem('sensometrika_b2b_token', tokenB2B);
      localStorage.setItem('sensometrika_b2b_rut', rutEmp);
      localStorage.setItem('sensometrika_b2b_empresa', nomEmp);

      // Redirigir directamente al flujo de verificación del trabajador acreditado
      window.location.href = `verificacion_trabajador.html?token=${tokenB2B}&rut=${encodeURIComponent(rutEmp)}`;
    }
  </script>
</body>
</html>
