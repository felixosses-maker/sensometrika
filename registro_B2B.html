<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensometrika B2B | Registro de Empresa</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111625;
      --card-border: #1e2638;
      --accent-blue: #00a8e8;
      --accent-blue-hover: #0077b6;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --text-white: #ffffff;
      --text-muted: #9aa0a6;
      --input-bg: #080d17;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .brand-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 0;
      margin-bottom: 12px;
    }

    .brand-logo-img {
      width: 220px;
      max-width: 80%;
      height: auto;
      display: block;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
    }

    .brand-subtitle {
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Tarjeta de Resumen de Contratación B2B */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--accent-cyan);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 20px rgba(0, 168, 232, 0.15);
    }

    .summary-header {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .summary-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.8rem;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
    }

    .summary-item span {
      color: var(--text-muted);
      font-size: 0.68rem;
      text-transform: uppercase;
    }

    .summary-item strong {
      color: #ffffff;
      font-size: 0.9rem;
    }

    /* Formulario de Registro B2B */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .form-title {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: #ffffff;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent-blue);
    }

    .btn-submit-b2b {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
      box-shadow: 0 4px 15px rgba(0, 168, 232, 0.3);
      transition: background 0.2s;
    }

    .btn-submit-b2b:hover {
      background: var(--accent-blue-hover);
    }

    .btn-cancel {
      display: block;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-decoration: underline;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Logo -->
    <header class="brand-header">
      <img src="sensometrica.jpg" alt="SENSOMETRIKA" class="brand-logo-img">
      <span class="brand-subtitle">REGISTRO CORPORATIVO B2B</span>
    </header>

    <!-- Resumen de Plan Seleccionado -->
    <div class="summary-card">
      <div class="summary-header">
        <span>📋 Plan Corporativo Seleccionado</span>
        <a href="menu_B2B.html" style="color: var(--accent-cyan); text-decoration: none;">Cambiar</a>
      </div>
      <div class="summary-details">
        <div class="summary-item" style="grid-column: span 2;">
          <span>Plan Contratado</span>
          <strong id="dispPlan">Plan Básico Laboral (B2B)</strong>
        </div>
        <div class="summary-item">
          <span>Evaluaciones</span>
          <strong id="dispQty">10 Unidades</strong>
        </div>
        <div class="summary-item">
          <span>Inversión Total</span>
          <strong id="dispTotal" style="color: var(--accent-green);">$59.000 + IVA</strong>
        </div>
      </div>
    </div>

    <!-- Formulario de Acreditación de Empresa -->
    <form class="form-card" onsubmit="procesarRegistroB2B(event)">
      <h3 class="form-title">Datos de Facturación y Administración</h3>

      <div class="form-group">
        <label class="form-label">RUT Empresa / Razón Social *</label>
        <input type="text" id="rutEmpresa" class="form-input" placeholder="76.123.456-K" required>
      </div>

      <div class="form-group">
        <label class="form-label">Nombre Fantasía / Empresa *</label>
        <input type="text" id="nombreEmpresa" class="form-input" placeholder="Ej. Minera o Constructora SpA" required>
      </div>

      <div class="form-group">
        <label class="form-label">Nombre del Encargado / Prevencionista *</label>
        <input type="text" id="nombreContacto" class="form-input" placeholder="Nombre Apellido" required>
      </div>

      <div class="form-group">
        <label class="form-label">Correo para Despacho de Informes *</label>
        <input type="email" id="emailCorporativo" class="form-input" placeholder="supervisor@empresa.cl" required>
      </div>

      <div class="form-group">
        <label class="form-label">Teléfono de Contacto</label>
        <input type="tel" id="telefonoContacto" class="form-input" placeholder="+56 9 1234 5678">
      </div>

      <button type="submit" class="btn-submit-b2b">CONFIRMAR Y ACTIVAR BOLSA B2B →</button>
      <a href="menu_B2B.html" class="btn-cancel">← Volver al Menú de Planes B2B</a>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Cargar datos guardados desde menu_B2B.html
      const dataB2B = JSON.parse(localStorage.getItem('sensometrika_b2b_contratacion')) || {
        plan: 'Plan Básico Laboral (B2B)',
        cantidad: 10,
        precioUnitario: 5900,
        total: 59000
      };

      document.getElementById('dispPlan').textContent = dataB2B.plan;
      document.getElementById('dispQty').textContent = `${dataB2B.cantidad} Evaluaciones`;
      document.getElementById('dispTotal').textContent = `$${dataB2B.total.toLocaleString('es-CL')} + IVA`;
    });

    function procesarRegistroB2B(e) {
      e.preventDefault();

      const empresa = {
        rut: document.getElementById('rutEmpresa').value,
        nombre: document.getElementById('nombreEmpresa').value,
        contacto: document.getElementById('nombreContacto').value,
        email: document.getElementById('emailCorporativo').value,
        telefono: document.getElementById('telefonoContacto').value,
        fechaRegistro: new Date().toISOString()
      };

      localStorage.setItem('sensometrika_empresa_b2b', JSON.stringify(empresa));

      alert(`✅ Cuenta Corporativa Registrada para ${empresa.nombre}.\nSe enviarán las credenciales y accesos al correo: ${empresa.email}`);
      
      // Redirección al panel o flujo B2B correspondiente
      window.location.href = 'menu_B2B.html';
    }
  </script>
</body>
</html>
