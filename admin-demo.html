<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Emisor de Demos y Tokens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #070d18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card-admin {
      background-color: #0b1324;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="selection:bg-sky-500 selection:text-white">

  <main class="w-full max-w-md mx-auto">
    <div class="card-admin rounded-2xl p-6 text-center">
      
      <!-- Insignia y Cabecera -->
      <div class="inline-block px-3 py-1 rounded-full text-[10px] font-bold bg-sky-950 border border-sky-500/40 text-sky-300 uppercase tracking-widest mb-3">
        🔐 Consola de Emisión Técnica & Tokens
      </div>
      
      <h1 class="text-xl font-extrabold tracking-wider uppercase mb-1 text-white">GENERADOR DE DEMOS</h1>
      <p class="text-xs text-slate-400 mb-6">Genera enlaces con tokens internos y despacha accesos para prospección B2B y pruebas.</p>

      <!-- Formulario de Prospección -->
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase">Nombre / Empresa Destinataria</label>
          <input type="text" id="inputDestinatario" placeholder="Ej: Minera San Esteban / Juan Pérez" class="w-full bg-[#060a14] border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase">Correo Electrónico</label>
          <input type="email" id="inputCorreo" placeholder="contacto@empresa.cl" class="w-full bg-[#060a14] border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase">Duración Sesión</label>
            <select id="selectDuracion" class="w-full bg-[#060a14] border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500">
              <option value="24">24 Horas</option>
              <option value="48" selected>48 Horas</option>
              <option value="72">72 Horas</option>
            </select>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase">Tipo de Demo</label>
            <select id="selectDemoTipo" class="w-full bg-[#060a14] border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500">
              <option value="index.html">Demo 1 • Estándar Básico</option>
              <option value="demo-operativo.html?mode=demo-operativo">Demo 2 • Operativo & Flotas</option>
              <option value="demo-corporativo.html?mode=demo-corporativo">Demo 3 • Corporativo (Faena)</option>
            </select>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="pt-2 space-y-2.5">
          <button type="button" onclick="despacharCorreo()" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-extrabold text-xs rounded-xl transition shadow-lg uppercase tracking-wider flex items-center justify-center gap-2">
            ✉️ Despachar Acceso al Correo
          </button>

          <button type="button" onclick="generarYCopiarWhatsApp()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 font-extrabold text-xs rounded-xl transition uppercase tracking-wider flex items-center justify-center gap-2">
            🔗 Generar y Copiar Enlace Directo (WhatsApp)
          </button>
        </div>
      </div>

      <!-- Cuadro de Resultado de Enlace Generado -->
      <div id="resultadoBox" class="hidden mt-5 p-3.5 bg-[#060a14] border border-sky-500/40 rounded-xl text-left space-y-2">
        <span class="text-[10px] font-bold text-sky-400 uppercase tracking-wide block">Enlace Seguro con Token Interno:</span>
        <input type="text" id="inputEnlaceGenerado" readonly class="w-full bg-transparent text-[11px] text-slate-300 focus:outline-none font-mono select-all">
        <button type="button" onclick="copiarEnlaceDirecto()" class="w-full py-2 bg-sky-950 hover:bg-sky-900 text-sky-300 border border-sky-500/30 rounded-lg font-bold text-xs transition">
          📋 Copiar al Portapapeles
        </button>
      </div>

    </div>
  </main>

  <script>
    function construirEnlaceConToken() {
      const destinatario = document.getElementById('inputDestinatario').value.trim() || 'cliente';
      const archivoDemo = document.getElementById('selectDemoTipo').value;
      const horas = parseInt(document.getElementById('selectDuracion').value);

      // Generación interna de token único seguro
      const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
      const tokenUnico = `SMK-DEMO-${destinatario.replace(/\s+/g, '').toUpperCase()}-${randomStr}`;

      // Registrar vigencia y estado en el almacenamiento local de forma interna
      const expiracionMs = new Date().getTime() + (horas * 60 * 60 * 1000);
      localStorage.setItem(`sensometrika_token_exp_${tokenUnico}`, expiracionMs);
      localStorage.setItem(`sensometrika_token_estado_${tokenUnico}`, 'activo');

      // Construir URL absoluta o relativa combinando el demo elegido y el parámetro token
      const urlBase = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      
      // Si el archivo ya trae parámetros (como ?mode=...), se concatena con ampersand (&), de lo contrario con ?
      const separador = archivoDemo.includes('?') ? '&' : '?';
      return `${urlBase}${archivoDemo}${separador}token=${tokenUnico}`;
    }

    function generarYCopiarWhatsApp() {
      const enlace = construirEnlaceConToken();
      document.getElementById('inputEnlaceGenerado').value = enlace;
      document.getElementById('resultadoBox').style.display = 'block';

      const input = document.getElementById('inputEnlaceGenerado');
      input.select();
      document.execCommand('copy');
      alert('¡Enlace con token interno generado y copiado al portapapeles para WhatsApp!');
    }

    function despacharCorreo() {
      const correo = document.getElementById('inputCorreo').value.trim();
      if (!correo) {
        alert('⚠️ Por favor ingresa un correo electrónico válido para despachar el acceso.');
        return;
      }
      const enlace = construirEnlaceConToken();
      document.getElementById('inputEnlaceGenerado').value = enlace;
      document.getElementById('resultadoBox').style.display = 'block';

      alert(`✅ Acceso con token interno despachado exitosamente a ${correo}.`);
    }

    function copiarEnlaceDirecto() {
      const input = document.getElementById('inputEnlaceGenerado');
      input.select();
      document.execCommand('copy');
      alert('¡Enlace copiado al portapapeles!');
    }
  </script>
</body>
</html>
