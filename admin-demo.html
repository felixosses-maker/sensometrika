<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensometrika | Emisor de Demos y Pruebas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070d18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen text-white flex flex-col justify-center items-center p-4">

  <main class="max-w-md w-full bg-[#0b1324] border border-slate-800 rounded-2xl p-6 shadow-2xl">
    
    <!-- Encabezado Privado -->
    <div class="text-center mb-6 border-b border-slate-800 pb-4">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-extrabold bg-sky-950/60 border border-sky-500/40 text-sky-400 uppercase tracking-widest mb-2">
        🔒 Consola de Emisión Técnica
      </div>
      <h1 class="text-xl font-black tracking-wider text-white">GENERADOR DE DEMOS</h1>
      <p class="text-xs text-slate-400 mt-1">Genera enlaces y despacha accesos de 6 minutos para prospección B2B y pruebas</p>
    </div>

    <!-- Formulario de Emisión -->
    <form id="formEmisorDemo" onsubmit="procesarEmision(event)" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Nombre / Empresa Destinataria</label>
        <input type="text" id="destNombre" placeholder="Ej: Minera Las Tórtolas / Juan Pérez" required
               class="w-full bg-[#070d18] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Correo Electrónico</label>
        <input type="email" id="destEmail" placeholder="contacto@empresa.cl" required
               class="w-full bg-[#070d18] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 transition">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Duración Sesión</label>
          <input type="number" id="destMinutos" value="6" min="3" max="30" required
                 class="w-full bg-[#070d18] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 transition font-mono font-bold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Tipo de Cuenta</label>
          <select id="destTipo" class="w-full bg-[#070d18] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 transition">
            <option value="demo">Demo Técnica (6m)</option>
            <option value="b2b">Piloto Empresa (72h)</option>
          </select>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="pt-2 space-y-2.5">
        <button type="submit" id="btnEnviarCorreo"
                class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-extrabold text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2">
          <span>📬 Despachar Acceso al Correo</span>
        </button>

        <button type="button" onclick="generarSoloEnlace()" id="btnGenerarLink"
                class="w-full py-2.5 rounded-xl bg-[#1e293b] hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold text-xs uppercase tracking-wider transition flex items-center justify-center gap-2">
          <span>🔗 Generar y Copiar Enlace Directo (WhatsApp)</span>
        </button>
      </div>

    </form>

    <!-- Caja de Resultado / Enlace Generado -->
    <div id="cajaResultado" class="hidden mt-5 p-3.5 bg-[#070d18] border border-emerald-500/50 rounded-xl text-left">
      <span class="block text-[11px] font-bold text-emerald-400 uppercase tracking-wider mb-1">✓ Enlace Generado con Éxito</span>
      <input type="text" id="inputEnlaceGenerado" readonly
             class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300 font-mono select-all">
      <button onclick="copiarAlPortapapeles()" class="mt-2 text-xs font-bold text-sky-400 hover:underline">
        📋 Copiar enlace al portapapeles
      </button>
    </div>

  </main>

  <script>
    async function procesarEmision(e) {
      e.preventDefault();
      const btn = document.getElementById('btnEnviarCorreo');
      btn.disabled = true;
      btn.innerText = 'Despachando correo...';

      const nombre = document.getElementById('destNombre').value.trim();
      const email = document.getElementById('destEmail').value.trim();
      const minutos = Number(document.getElementById('destMinutos').value) || 6;
      const tipo = document.getElementById('destTipo').value;

      try {
        const res = await fetch('/api/enviar-correo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tipo: tipo,
            email: email,
            nombre: nombre,
            duracion_minutos: minutos,
            detalles: {
              nombrePlan: tipo === 'demo' ? `Sesión Demo (${minutos} min)` : 'Piloto Corporativo B2B',
              vigencia: `${minutos} minutos`
            }
          })
        });

        const data = await res.json();
        if (data.success) {
          alert(`¡Acceso despachado con éxito a ${email}!`);
          if (data.enlaceGenerado) {
            mostrarCajaEnlace(data.enlaceGenerado);
          }
        } else {
          alert('Error al enviar correo: ' + (data.error || 'Fallo desconocido'));
        }
      } catch (err) {
        console.error(err);
        alert('Error de conectividad con el servidor.');
      } finally {
        btn.disabled = false;
        btn.innerText = '📬 Despachar Acceso al Correo';
      }
    }

    async function generarSoloEnlace() {
      const btn = document.getElementById('btnGenerarLink');
      btn.disabled = true;
      btn.innerText = 'Creando token seguro...';

      const email = document.getElementById('destEmail').value.trim() || 'demo@sensometrika.cl';
      const minutos = Number(document.getElementById('destMinutos').value) || 6;
      const tipo = document.getElementById('destTipo').value;

      try {
        const res = await fetch('/api/access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'create',
            type: tipo,
            email: email,
            duration_minutes: minutos
          })
        });

        const data = await res.json();
        if (data.success && data.link) {
          mostrarCajaEnlace(data.link);
          navigator.clipboard.writeText(data.link);
          alert('¡Enlace demo de 6 minutos generado y copiado al portapapeles!');
        } else {
          alert('No se pudo generar el enlace: ' + (data.error || 'Error desconocido'));
        }
      } catch (err) {
        console.error(err);
        alert('Error al contactar el servidor de tokens.');
      } finally {
        btn.disabled = false;
        btn.innerText = '🔗 Generar y Copiar Enlace Directo (WhatsApp)';
      }
    }

    function mostrarCajaEnlace(url) {
      const caja = document.getElementById('cajaResultado');
      const input = document.getElementById('inputEnlaceGenerado');
      input.value = url;
      caja.classList.remove('hidden');
    }

    function copiarAlPortapapeles() {
      const input = document.getElementById('inputEnlaceGenerado');
      input.select();
      navigator.clipboard.writeText(input.value);
      alert('Copiado al portapapeles.');
    }
  </script>
</body>
</html>
