<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENSOMETRIKA | Módulo: Estereopsis 3D (Profundidad y Latencia)</title>
  <style>
    :root {
      --bg-principal: #050b14;
      --bg-card: #0b1324;
      --border-color: #1e293b;
      --verde-destacado: #10b981;
      --azul-destacado: #38bdf8;
      --azul-btn: #0284c7;
      --azul-btn-hover: #0369a1;
      --texto-blanco: #ffffff;
      --texto-gris: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
    body { background-color: var(--bg-principal); color: var(--texto-blanco); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px 12px 28px; -webkit-tap-highlight-color: transparent; }
    .app-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }

    /* ENCABEZADO Y LOGO */
    .brand-header { text-align: center; }
    .brand-subtitle { margin-top: 4px; color: var(--texto-gris); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    /* TARJETA PRINCIPAL */
    .modulo-card-container { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 35px rgba(0, 0, 0, 0.7); }
    .nav-top-row { display: flex; justify-content: space-between; align-items: center; }
    .link-volver { color: var(--texto-gris); text-decoration: none; font-size: 0.82rem; font-weight: 500; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .link-volver:hover { color: var(--azul-destacado); }

    .btn-como-funciona { background: #0c182e; border: 1px solid #1e3a6d; color: var(--azul-destacado); font-size: 0.75rem; font-weight: 700; padding: 5px 11px; border-radius: 6px; cursor: pointer; }
    .btn-como-funciona:hover { background: #132342; }

    .badge-fase { display: inline-block; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35); color: var(--azul-destacado); font-size: 0.75rem; font-weight: 700; padding: 5px 14px; border-radius: 20px; margin: 0 auto; text-align: center; }

    /* BARRA DE TIEMPO / LATENCIA */
    .barra-tiempo-container { width: 100%; height: 6px; background: #030712; border-radius: 3px; overflow: hidden; border: 1px solid #1e293b; }
    .barra-tiempo-fill { height: 100%; width: 100%; background: var(--verde-destacado); transition: width 0.1s linear, background-color 0.3s; }

    /* MATRIZ DINÁMICA 4x4 */
    .estereo-matriz { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 2px 0; background: #030712; border: 2px solid #1e293b; border-radius: 14px; padding: 12px; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
    
    .nodo-estereo { 
      background: linear-gradient(145deg, #111a2e, #090e1a); 
      border: 2px solid #1e3a6d; 
      border-radius: 10px; 
      height: 60px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      transition: all 0.15s ease; 
      position: relative; 
    }
    .nodo-estereo:hover { border-color: var(--azul-destacado); background: #172540; }
    
    /* EFECTO DE DISPARIDAD 3D */
    .nodo-estereo.flotante { 
      background: radial-gradient(circle, #0284c7 0%, #0c2340 70%); 
      border-color: #38bdf8; 
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.7), inset 0 0 12px rgba(255, 255, 255, 0.4); 
      transform: scale(1.06); 
      z-index: 2;
    }
    .nodo-estereo.flotante::after { 
      content: '◉'; 
      position: absolute; 
      font-size: 0.65rem; 
      color: #ffffff; 
      text-shadow: 0 0 6px #38bdf8;
      animation: pulsoRelieve 1s infinite alternate;
    }

    @keyframes pulsoRelieve {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    .instruccion-sub { text-align: center; font-size: 0.78rem; color: var(--texto-gris); line-height: 1.4; min-height: 2.2rem; display: flex; align-items: center; justify-content: center; }

    /* BOTÓN DE ACCIÓN */
    .btn-calibrar { width: 100%; background-color: var(--azul-btn); color: var(--texto-blanco); border: none; border-radius: 10px; padding: 13px; font-size: 0.92rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4); text-transform: uppercase; }
    .btn-calibrar:hover { background-color: var(--azul-btn-hover); }

    /* TABLERO DE MÉTRICAS */
    .metricas-inferiores-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background-color: #050b14; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 8px; text-align: center; }
    .col-metrica span { display: block; font-size: 0.60rem; color: var(--texto-gris); text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
    .col-metrica strong { display: block; font-size: 0.95rem; color: var(--texto-blanco); font-weight: 800; }
    .col-metrica .badge-verde { display: inline-block; background-color: var(--verde-destacado); color: #000000 !important; padding: 3px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 900; }
  </style>
</head>
<body>
  <main class="app-container">
    
    <!-- ENCABEZADO DE MARCA -->
    <header class="brand-header" style="text-align: center; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="background: rgba(11, 19, 36, 0.9); border: 1px solid #1e293b; padding: 8px 16px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6);">
        <img src="sensometrica.jpg" alt="SENSOMETRIKA Calibration Technology" style="width: 170px; height: auto; display: block; border-radius: 4px; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));">
      </div>
      <span class="brand-subtitle">MÓDULO ESTEREOPSIS 3D</span>
    </header>

    <section class="modulo-card-container">
      <div class="nav-top-row">
        <a onclick="volverAlMenu()" class="link-volver">← Volver al Menú</a>
        <button type="button" class="btn-como-funciona" onclick="mostrarModalAyudaEstereo()">? ¿Cómo funciona?</button>
      </div>

      <div style="text-align: center;">
        <span class="badge-fase" id="badgeFase">🎯 Profundidad + Tiempo (5 Rondas)</span>
      </div>

      <!-- BARRA DE TIEMPO / LATENCIA -->
      <div class="barra-tiempo-container">
        <div class="barra-tiempo-fill" id="barraFill"></div>
      </div>

      <p class="instruccion-sub" id="statusText">Identifique y pulse rápidamente el nodo con relieve óptico 3D flotante.</p>

      <div class="estereo-matriz" id="matrizGrid">
        <!-- Generado dinámicamente -->
      </div>

      <button type="button" class="btn-calibrar" id="btnIniciarEstereo" onclick="iniciarPruebaEstereo()">
        ▶ Iniciar Simulación Oficial (5 Rondas)
      </button>

      <div class="metricas-inferiores-grid">
        <div class="col-metrica"><span>Ronda</span><strong id="lblRonda">0 / 5</strong></div>
        <div class="col-metrica"><span>Aciertos</span><strong id="lblAciertos" class="badge-verde">0</strong></div>
        <div class="col-metrica"><span>Latencia Prom.</span><strong id="lblLatencia" style="color: var(--azul-destacado);">0 ms</strong></div>
      </div>
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const modeParam = urlParams.get('mode') || (localStorage.getItem('sensometrika_b2c_mode') === 'true' ? 'b2c' : 'b2b');
    const esB2B = (modeParam === 'b2b');

    let datosUsuario = {};
    try {
      datosUsuario = JSON.parse(localStorage.getItem('sensometrika_datos_usuario')) || {};
    } catch(e){}

    const rut = urlParams.get('rut') || datosUsuario.rut || 'GENERICO';
    const cleanRut = rut.replace(/[^0-9Kk]/g, '');

    const btnIniciar = document.getElementById('btnIniciarEstereo');
    const statusText = document.getElementById('statusText');
    const badgeFase = document.getElementById('badgeFase');
    const lblRonda = document.getElementById('lblRonda');
    const lblAciertos = document.getElementById('lblAciertos');
    const lblLatencia = document.getElementById('lblLatencia');
    const matrizGrid = document.getElementById('matrizGrid');
    const barraFill = document.getElementById('barraFill');

    let rondaActual = 0;
    let totalRondas = 5;
    let aciertos = 0;
    let indiceCorrecto = 0;
    let juegoActivo = false;
    
    let tiempoInicioRonda = 0;
    let latenciasTiempos = [];
    let tiempoLimiteRonda = 7000;
    let timerRonda = null;
    let timerBarra = null;

    document.addEventListener('DOMContentLoaded', () => {
      actualizarEstadoUI();
      construirMatrizVisual();
    });

    function volverAlMenu() {
      const menuDestino = esB2B ? 'menu_B2B.html' : 'menu_B2C.html';
      window.location.href = `${menuDestino}?${urlParams.toString()}`;
    }

    function actualizarEstadoUI() {
      const historial = JSON.parse(localStorage.getItem(`sensometrika_historial_estereopsis_${cleanRut}`)) || [];
      const numEnsayosRealizados = historial.length;

      const planStorage = (localStorage.getItem('sensometrika_plan_contratado') || urlParams.get('plan') || 'FULL').toUpperCase();
      let maxIntentosPlan = esB2B ? (planStorage.includes('ALTO') ? 3 : 1) : 5;

      if (numEnsayosRealizados >= maxIntentosPlan) {
        badgeFase.innerText = esB2B ? `✓ Evaluación Registrada (${numEnsayosRealizados}/${maxIntentosPlan})` : `✓ Plan Completado (${numEnsayosRealizados}/${maxIntentosPlan})`;
        badgeFase.style.color = '#10b981';
        badgeFase.style.borderColor = '#10b981';
        btnIniciar.innerText = '← RETORNAR AL MENÚ DE EVALUACIONES';
        btnIniciar.onclick = volverAlMenu;
        statusText.innerText = esB2B ? 'Evaluación B2B registrada exitosamente. Retorna al menú.' : 'Has completado las simulaciones de tu plan. Retorna al menú.';
      } else {
        const siguienteSimu = numEnsayosRealizados + 1;
        badgeFase.innerText = esB2B ? `🎯 Simulación Oficial Estereopsis B2B` : `🎯 Simulación S${siguienteSimu} de ${maxIntentosPlan}`;
        btnIniciar.innerText = esB2B ? '▶ INICIAR SIMULACIÓN OFICIAL B2B' : `▶ INICIAR SIMULACIÓN S${siguienteSimu} (5 RONDAS)`;
      }
    }

    function construirMatrizVisual() {
      matrizGrid.innerHTML = '';
      for (let i = 0; i < 16; i++) {
        const nodo = document.createElement('div');
        nodo.className = 'nodo-estereo';
        nodo.dataset.index = i;
        nodo.innerHTML = `<span style="font-size: 0.7rem; color: #475569; font-weight:700;">${i+1}</span>`;
        nodo.addEventListener('click', () => seleccionarNodo(i));
        matrizGrid.appendChild(nodo);
      }
    }

    function mostrarModalAyudaEstereo() {
      const modalExistente = document.getElementById('modalAyudaEstereo');
      if (modalExistente) modalExistente.remove();

      const modalHtml = `
        <div id="modalAyudaEstereo" style="position: fixed; inset: 0; background: rgba(5, 8, 18, 0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 16px;">
          <div style="background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; width: 100%; max-width: 380px; padding: 24px 20px; text-align: left; box-shadow: 0 20px 30px rgba(0,0,0,0.7); color: #f8fafc;">
            <h3 style="color: #ffffff; margin: 0 0 6px 0; font-size: 1.15rem; font-weight: 800; text-align: center;">Estereopsis y Latencia 3D</h3>
            <p style="color: #38bdf8; margin: 0 0 16px 0; font-size: 0.8rem; font-weight: 600; text-align: center;">Profundidad y Tiempo de Respuesta (5 Rondas)</p>
            <div style="font-size: 0.82rem; color: #94a3b8; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
              <p>1. <strong>Rangos Industriales:</strong> Óptimo (&le; 2.0s), Normal (2.0s - 3.5s) y Lento/Observado (3.5s - 5.0s).</p>
              <p>2. <strong>Tolerancia:</strong> Superar los 7 segundos genera un <em>fallo por lentitud en procesamiento espacial</em>.</p>
            </div>
            <button onclick="document.getElementById('modalAyudaEstereo').remove()" style="width: 100%; background: #0284c7; color: #ffffff; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer;">
              Entendido · Volver al Test
            </button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function iniciarPruebaEstereo() {
      const historial = JSON.parse(localStorage.getItem(`sensometrika_historial_estereopsis_${cleanRut}`)) || [];
      const planStorage = (localStorage.getItem('sensometrika_plan_contratado') || urlParams.get('plan') || 'FULL').toUpperCase();
      let maxIntentosPlan = esB2B ? (planStorage.includes('ALTO') ? 3 : 1) : 5;

      if (historial.length >= maxIntentosPlan) {
        volverAlMenu();
        return;
      }

      juegoActivo = true;
      rondaActual = 0;
      aciertos = 0;
      latenciasTiempos = [];
      lblAciertos.innerText = '0';
      lblLatencia.innerText = '0 ms';
      btnIniciar.style.display = 'none';
      construirMatrizVisual();
      siguienteRonda();
    }

    function siguienteRonda() {
      if (rondaActual >= totalRondas) { finalizarPruebaEstereo(); return; }
      rondaActual++;
      lblRonda.innerText = `${rondaActual} / ${totalRondas}`;
      indiceCorrecto = Math.floor(Math.random() * 16);

      const nodos = matrizGrid.children;
      for (let i = 0; i < nodos.length; i++) {
        nodos[i].className = 'nodo-estereo';
        nodos[i].innerHTML = `<span style="font-size: 0.7rem; color: #475569; font-weight:700;">${i+1}</span>`;
        if (i === indiceCorrecto) {
          nodos[i].classList.add('flotante');
        }
      }
      statusText.innerText = `Ronda ${rondaActual}: Localice el nodo 3D antes que expire el tiempo.`;

      tiempoInicioRonda = Date.now();
      barraFill.style.width = '100%';
      barraFill.style.backgroundColor = 'var(--verde-destacado)';

      let inicioAnim = Date.now();
      clearInterval(timerBarra);
      timerBarra = setInterval(() => {
        let transcurrido = Date.now() - inicioAnim;
        let porcentaje = Math.max(0, 100 - (transcurrido / tiempoLimiteRonda) * 100);
        barraFill.style.width = `${porcentaje}%`;
        if (porcentaje < 30) barraFill.style.backgroundColor = '#ef4444';
      }, 50);

      clearTimeout(timerRonda);
      timerRonda = setTimeout(() => {
        if (juegoActivo) {
          latenciasTiempos.push(tiempoLimiteRonda);
          statusText.innerText = `⚠️ Ronda ${rondaActual}: Fallo por lentitud en procesamiento espacial.`;
          if ('vibrate' in navigator) navigator.vibrate(100);
          setTimeout(() => { siguienteRonda(); }, 1000);
        }
      }, tiempoLimiteRonda);
    }

    function seleccionarNodo(index) {
      if (!juegoActivo) return;
      clearTimeout(timerRonda);
      clearInterval(timerBarra);

      const tiempoReaccion = Date.now() - tiempoInicioRonda;
      latenciasTiempos.push(tiempoReaccion);

      if (index === indiceCorrecto) {
        aciertos++;
        lblAciertos.innerText = aciertos;
        if ('vibrate' in navigator) navigator.vibrate(35);
      }

      const sumaLatencia = latenciasTiempos.reduce((a, b) => a + b, 0);
      const promedioLatencia = Math.round(sumaLatencia / latenciasTiempos.length);
      lblLatencia.innerText = `${promedioLatencia} ms`;

      setTimeout(() => { siguienteRonda(); }, 350);
    }

    function finalizarPruebaEstereo() {
      juegoActivo = false;
      clearTimeout(timerRonda);
      clearInterval(timerBarra);

      const precisionFinal = Math.round((aciertos / totalRondas) * 100);
      const sumaLatencia = latenciasTiempos.reduce((a, b) => a + b, 0);
      const latenciaFinal = Math.round(sumaLatencia / latenciasTiempos.length);
      
      let categoriaLatencia = '';
      let aprobadoLatencia = false;

      if (latenciaFinal <= 2000) {
        categoriaLatencia = 'Óptimo (Alta Velocidad ≤ 2.0s)';
        aprobadoLatencia = true;
      } else if (latenciaFinal <= 3500) {
        categoriaLatencia = 'Normal (Aceptable 2.0s - 3.5s)';
        aprobadoLatencia = true;
      } else if (latenciaFinal <= 5000) {
        categoriaLatencia = 'Lento (Margen de Atención 3.5s - 5.0s)';
        aprobadoLatencia = true;
      } else {
        categoriaLatencia = 'Observado - Fallo por lentitud en procesamiento espacial';
        aprobadoLatencia = false;
      }

      const aprobado = precisionFinal >= 80 && aprobadoLatencia;

      // GUARDADO ISOLADO Y ESTRICTO POR RUT DE TRABAJADOR
      let historial = JSON.parse(localStorage.getItem(`sensometrika_historial_estereopsis_${cleanRut}`)) || [];
      historial.push({
        precision: precisionFinal,
        aciertos: aciertos,
        total: totalRondas,
        latenciaPromedio: latenciaFinal,
        categoriaLatencia: categoriaLatencia,
        aprobado: aprobado,
        dictamen: aprobado ? 'APROBADO' : 'OBSERVADO',
        fecha: new Date().toISOString()
      });

      localStorage.setItem(`sensometrika_historial_estereopsis_${cleanRut}`, JSON.stringify(historial));

      actualizarEstadoUI();
      mostrarModalResultadoEstereopsis(precisionFinal, latenciaFinal, categoriaLatencia, aprobado);
    }

    function mostrarModalResultadoEstereopsis(precisionFinal, latenciaFinal, categoriaLatencia, aprobado) {
      const modalHtml = `
        <div id="modalResultadoEstereopsis" style="position: fixed; inset: 0; background: rgba(5, 8, 18, 0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 16px;">
          <div style="background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; width: 100%; max-width: 380px; padding: 24px 20px; text-align: center; box-shadow: 0 20px 30px rgba(0,0,0,0.7); color: #f8fafc;">
            <h3 style="color: #ffffff; margin: 0 0 4px 0; font-size: 1.25rem; font-weight: 800;">Simulación Registrada</h3>
            <p style="color: #38bdf8; margin: 0 0 16px 0; font-size: 0.85rem; font-weight: 600;">Estereopsis Industrial 3D + Rangos de Latencia</p>

            <div style="margin-bottom: 18px;">
              <span style="display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.03em; background: ${aprobado ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)'}; border: 1px solid ${aprobado ? '#10b981' : '#ef4444'}; color: ${aprobado ? '#34d399' : '#f87171'};">
                ${aprobado ? 'APROBADO - APTO FAENA CRÍTICA' : 'OBSERVADO - FALLO POR LENTITUD ESPACIAL'}
              </span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #070b14; border: 1px solid #1e293b; border-radius: 12px; padding: 14px 10px; margin-bottom: 14px; text-align: left;">
              <div>
                <span style="display: block; font-size: 0.65rem; color: #94a3b8; font-weight: 600;">Precisión Lograda</span>
                <strong style="color: #ffffff; font-size: 1rem; font-weight: 800;">${precisionFinal}%</strong>
              </div>
              <div>
                <span style="display: block; font-size: 0.65rem; color: #94a3b8; font-weight: 600;">Latencia Promedio</span>
                <strong style="color: #38bdf8; font-size: 0.95rem; font-weight: 800;">${latenciaFinal} ms</strong>
              </div>
            </div>

            <div style="background: #070b14; border: 1px solid #1e293b; border-radius: 10px; padding: 8px 10px; margin-bottom: 20px; text-align: center;">
              <span style="display: block; font-size: 0.62rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Evaluación de Desempeño</span>
              <span style="font-size: 0.78rem; font-weight: 800; color: #f8fafc;">${categoriaLatencia}</span>
            </div>

            <button onclick="volverAlMenu()" style="width: 100%; background: #0284c7; color: #ffffff; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);">
              ← Volver al Menú de Evaluaciones
            </button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }
  </script>
</body>
</html>
